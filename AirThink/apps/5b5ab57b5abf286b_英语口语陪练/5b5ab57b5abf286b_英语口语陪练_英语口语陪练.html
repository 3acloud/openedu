<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,
          "CapturePhoto": capturePhotoA,
          "FinishRecordVoice": FinishRecordVoiceA
        };

        // 检查请求类型是否在支持的映射中
        if (request['type'] in HANDLERS) {
          try {
            // 1. 根据类型选择相应的处理函数获取文件
            const file = await HANDLERS[request['type']]();
    
            // 2. 上传文件到Flask服务端
            const guidFileName = await uploadToFlaskA(file);
    
            // 3. 返回GUID文件名
            return guidFileName;
          } catch (error) {
            // 可以在这里添加错误处理逻辑，如日志记录
            console.error(`处理${request['type']}时出错:`, error);
          }
  
          // 所有失败情况返回空字符串
          return "";
        }



        url = 'http://' + window.location.hostname + ':3130/request';
        const response = await fetch(url, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'SessionID': localStorage.getItem('airthink_session_id'),
            'BaseName': encodeURIComponent("5b5ab57b5abf286b_英语口语陪练")
        },
        body: JSON.stringify(request)
        });
  
        if (!response.ok) {
            throw new Error(`请求失败: ${response.status}`);
        }
  
        return await response.text();
    }

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');

/**

const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**

function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function capturePhotoA() {
  return new Promise((resolve, reject) => {
    // 检查浏览器是否支持媒体设备API
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      reject(new Error('您的浏览器不支持拍照功能'));

    canvas.style.display = 'none';
    const ctx = canvas.getContext('2d');
    
    // 创建拍照按钮和取消按钮的容器
    const container = document.createElement('div');
    container.style.cssText = `
      position: fixed;

      flex-direction: column;
      justify-content: center;
      align-items: center;
    `;
    
    // 创建视频预览容器
    const videoContainer = document.createElement('div');
    videoContainer.style.cssText = `
      width: 100%;
      max-width: 640px;
      max-height: 70vh;
      overflow: hidden;
      border-radius: 8px;
      margin-bottom: 20px;
    `;
    
    // 将视频放入容器中
    video.style.cssText = `
      width: 100%;
      height: auto;
      transform: scaleX(-1); /* 镜像翻转，让预览更自然 */
    `;
    
    // 创建按钮容器
    const buttonContainer = document.createElement('div');
    buttonContainer.style.cssText = `
      display: flex;
      gap: 20px;
    `;
    
    // 创建拍照按钮
    const captureBtn = document.createElement('button');
    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

function card(r,compact=false){const div=document.createElement('article');div.className='panel record lift record-click';div.style.setProperty('--scene',sceneColor(r.scene));div.innerHTML=`<div class="record-head"><span class="badge">${safe(val(r.grade))}</span><strong>${safe(val(r.scene))}</strong><span>· ${safe(val(r.mode))}</span></div><p>${safe(r.content.slice(0,compact?40:80))}${r.content.length>(compact?40:80)?'…':''}</p><div class="actions"></div>`;div.onclick=()=>openDetail(r.row,compact?rows.slice(0,5).map(x=>x.row):filtered.map(x=>x.row));const actions=div.querySelector('.actions');if(compact){if(r.file)actions.appendChild(actionButton('play',()=>playAudio(r.file)))}else{for(const [label,fn,disabled] of [['details',()=>openDetail(r.row,filtered.map(x=>x.row)),false],['edit',()=>openEdit(r.row),false],['delete',()=>deleteRow(r.row),false],['repeat',()=>repeatRow(r),false],['play',()=>playAudio(r.file),!r.file],['download',()=>download(r.file),!r.file]])actions.appendChild(actionButton(label,fn,disabled))}actions.onclick=e=>e.stopPropagation();return div}

function recorderButtons(prefix,f){const state=f.rec;return [['startRecord',state==='空闲'],['pauseRecord',state==='录音中'],['resumeRecord',state==='已暂停'],['finishRecord',state==='录音中'||state==='已暂停'],['cancelRecord',state==='录音中'||state==='已暂停'],['upload',state==='空闲'],['removeAudio',state==='已完成'],['rerecord',state==='已完成']].map(([key,enabled])=>`<button type="button" class="btn small ${key==='startRecord'?'':'alt'}" data-rec="${key}" ${enabled?'':'disabled'}>${tr(key)}</button>`).join('')}
function renderRecorder(prefix,f){const e=$(prefix+'Recorder');if(!e)return;const mm=String(Math.floor(f.seconds/60)).padStart(2,'0'),ss=String(f.seconds%60).padStart(2,'0');e.innerHTML=`<div class="recorder-top"><b>${tr(f.rec==='空闲'?'idle':f.rec==='录音中'?'recordingState':f.rec==='已暂停'?'paused':'completed')}</b><strong>${mm}:${ss}</strong></div><div class="actions">${recorderButtons(prefix,f)}</div>${f.file?`<div class="audio-box"><audio controls src="${audioUrl(f.file)}"></audio><button type="button" class="btn small alt" data-rec="download">${tr('download')}</button></div>`:''}`;e.querySelectorAll('[data-rec]').forEach(b=>b.onclick=()=>recordAction(prefix,f,b.dataset.rec))}

async function recordAction(prefix,f,action){if(busy)return;busy=true;try{if(action==='startRecord'||action==='rerecord'){f.file='';f.seconds=0;await bridge({type:'StartRecordVoice'});f.rec='录音中';recordOwner=prefix;startClock(prefix,f)}else if(action==='pauseRecord'){await bridge({type:'PauseRecordVoice'});f.rec='已暂停';stopClock()}else if(action==='resumeRecord'){await bridge({type:'ContinueRecordVoice'});f.rec='录音中';startClock(prefix,f)}else if(action==='finishRecord'){const file=await bridge({type:'FinishRecordVoice'});if(!file)throw Error('未取得录音文件');f.file=file;f.rec='已完成';stopClock()}else if(action==='cancelRecord'){await bridge({type:'CancelRecordVoice'});f.file='';f.seconds=0;f.rec='空闲';stopClock()}else if(action==='upload'){const file=await bridge({type:'SelectFile'});if(file){f.file=file;f.rec='已完成';f.seconds=0}}else if(action==='removeAudio'){f.file='';f.rec='空闲';f.seconds=0}else if(action==='download')download(f.file);if($(prefix+'File'))$(prefix+'File').value=f.file;renderRecorder(prefix,f)}catch(e){toast(e.message||String(e))}finally{busy=false}}

function renderDetail(row,d){const file=d['录音文件'];$('detailBody').innerHTML=`<div class="record-head"><span class="badge">${safe(val(d['学段']))}</span><strong>${safe(val(d['练习场景']))}</strong><span>${safe(val(d['语言模式']))}</span></div><h3>${tr('content')}</h3><p style="white-space:pre-wrap;overflow-wrap:anywhere">${safe(d['练习内容'])}</p><h3>${tr('recording')}</h3>${file?`<audio controls src="${audioUrl(file)}" style="width:100%"></audio><button class="btn small alt" id="detailDownload">${tr('download')}</button>`:`<p>${tr('noAudio')}</p>`}<h3>${tr('feedback')}</h3><div class="markdown" id="detailMarkdown"></div>${d['陪练反馈']?'':`<button class="btn small alt" id="refreshDetailFeedback">${tr('refreshFeedback')}</button>`}`;const markdown=$('detailMarkdown');if(d['陪练反馈'])setMarkdown(markdown,d['陪练反馈']);else markdown.textContent=tr('missingFeedback');if(file)$('detailDownload').onclick=()=>download(file);if(!d['陪练反馈'])$('refreshDetailFeedback').onclick=async()=>{try{d['陪练反馈']=await cell('陪练反馈',row);renderDetail(row,d)}catch(e){toast(e.message)}};$('detailFoot').innerHTML=`<button class="btn alt" id="detailClose">${tr('close')}</button><button class="btn alt" id="detailEdit">${tr('edit')}</button><button class="btn alt" id="detailDelete">${tr('delete')}</button><button class="btn" id="detailRepeat">${tr('repeat')}</button>`;$('detailClose').onclick=closeModal;$('detailEdit').onclick=()=>openEdit(row);$('detailDelete').onclick=()=>deleteRow(row);$('detailRepeat').onclick=()=>repeatRow({grade:d['学段'],scene:d['练习场景'],mode:d['语言模式'],content:d['练习内容']})}
async function openEdit(row){closeModal();navigate('archive');currentRow=row;formMode='edit';modalKind='edit';editForm=formBlank();$('modalHost').innerHTML=`<div class="modal-back" id="modalBack"><div class="modal" id="editModal"><div class="modal-head"><h2>${tr('edit')}</h2><button class="btn small alt" id="editCancelTop">${tr('close')}</button></div><form id="editForm"><div id="editFields"></div><h3>${tr('feedback')}</h3><div class="markdown" id="editFeedback"></div><div class="modal-foot"><button type="submit" class="btn" id="saveEdit">${tr('save')}</button><button type="button" class="btn alt" id="editCancel">${tr('cancel')}</button></div></form></div></div>`;$('modalBack').onclick=e=>{if(e.target===$('modalBack'))cancelEdit()};$('editCancelTop').onclick=cancelEdit;$('editCancel').onclick=cancelEdit;$('editForm').onsubmit=saveEdit;try{for(const [key,field] of [['grade','学段'],['scene','练习场景'],['mode','语言模式'],['content','练习内容'],['file','录音文件']])editForm[key]=await cell(field,row);const feedback=await cell('陪练反馈',row);if(modalKind!=='edit'||currentRow!==row)return;editForm.rec=editForm.file?'已完成':'空闲';renderForm('edit',editForm);if(feedback)setMarkdown($('editFeedback'),feedback);else $('editFeedback').textContent=tr('missingFeedback')}catch(e){errorBox('editFields',e.message,()=>openEdit(row))}}
async function saveEdit(e){e.preventDefault();if(busy||!validate(editForm,false))return;busy=true;$('saveEdit').disabled=true;try{const vals=[editForm.grade,editForm.scene,editForm.mode,editForm.content.trim(),editForm.file||''];for(let i=0;i<FIELDS.length;i++)await mutate({type:'SetCellValue',data:SOURCE,payload:`${FIELDS[i]}/${currentRow}/${vals[i]}`});const row=currentRow;toast(tr('updated'));closeModal();await loadArchive();if(rows.some(r=>r.row===row))openDetail(row,filtered.map(x=>x.row).includes(row)?filtered.map(x=>x.row):[row])}catch(err){toast(err.message)}finally{busy=false;if($('saveEdit'))$('saveEdit').disabled=false}}
async function cancelEdit(){try{await cancelActive(editForm);closeModal()}catch(e){toast(e.message)}}
async function deleteRow(row){if(!window.confirm(tr('confirmDelete')))return;try{await mutate({type:'DeleteRecord',data:SOURCE,payload:row.toString()});if(currentRow===row)currentRow=0;closeModal();await loadArchive();if(page==='home')await loadHome()}catch(e){toast(e.message)}}
function repeatRow(r){closeModal();newStudio({grade:r.grade,scene:r.scene,mode:r.mode,content:r.content,file:''})}
function closeModal(){if(modalKind==='edit'&&editForm&&(editForm.rec==='录音中'||editForm.rec==='已暂停')){cancelActive(editForm).catch(e=>toast(e.message))}modalKind='';$('modalHost').replaceChildren()}
async function navigate(target,back=false){if(target===page&&!back){if(target==='home')loadHome();if(target==='archive')loadArchive();return}if(!back)historyStack.push({page,scroll:window.scrollY});page=target;document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===target+'Page'));document.querySelectorAll('.navlink').forEach(x=>x.classList.toggle('active',x.dataset.page===target));$('mobileMenu').classList.remove('open');window.scrollTo(0,0);if(target==='home')loadHome();if(target==='archive')loadArchive();if(target==='studio'&&feedbackPending){currentRow=submittedRow;if(!pollTimer)startPolling()}}
function airBack(){if(modalKind){if(modalKind==='edit')cancelEdit();else closeModal();return 'false'}if(historyStack.length){const h=historyStack.pop();navigate(h.page,true).then(()=>window.scrollTo(0,h.scroll));return 'false'}return 'true'}window.airBack=airBack;
function chooseLanguage(){let stored=localStorage.getItem('iThinkAir_UiLanguage');if(stored!==null&&stored!=='')return stored==='en'?'en':'cn';let q=new URLSearchParams(location.search).get('lang');if(q==='cn'||q==='en')return q;let ls=navigator.languages;return !ls||!ls.length||ls.some(x=>/^zh(?:-|$)/i.test(x))?'cn':'en'}
function fitNav(){const nav=$('nav'),inner=nav.querySelector('.nav-inner');nav.classList.remove('compact');if(inner.scrollWidth>inner.clientWidth)nav.classList.add('compact')}
function setLanguage(next){lang=next;localStorage.setItem('iThinkAir_UiLanguage',next);document.documentElement.lang=next==='en'?'en':'zh-CN';document.querySelectorAll('[data-i]').forEach(e=>e.textContent=tr(e.dataset.i));$('languageButton').textContent=next==='en'?'中文':'EN';$('searchInput').placeholder=tr('search');renderFilterOptions();renderQuick();renderForm('studio',studio);renderFeedback();if(page==='home')renderRecent();if(page==='archive')renderArchive();$('mobileMenu').classList.remove('open');fitNav()}
async function initialize(){try{const mode=await callAppBridge({type:'模式'});document.body.classList.toggle('dark',String(mode).trim()==='暗色')}catch(e){}lang=chooseLanguage();$('studioForm').onsubmit=submitPractice;$('studioConsent').onchange=e=>studio.consent=e.target.checked;$('startToday').onclick=()=>newStudio();$('viewArchive').onclick=()=>navigate('archive');$('clearStudio').onclick=()=>newStudio();$('newFromArchive').onclick=()=>newStudio();$('refreshArchive').onclick=loadArchive;for(const id of ['searchInput','gradeFilter','sceneFilter','modeFilter'])$(id).addEventListener(id==='searchInput'?'input':'change',renderArchive);document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));$('brand').onclick=()=>{if(parent&&typeof parent.closeFullHtml==='function')parent.closeFullHtml(false)};$('menuButton').onclick=e=>{e.stopPropagation();$('mobileMenu').classList.toggle('open')};document.addEventListener('click',e=>{if(!e.target.closest('#nav'))$('mobileMenu').classList.remove('open')});$('languageButton').onclick=()=>setLanguage(lang==='cn'?'en':'cn');$('mobileLanguage').onclick=()=>setLanguage(lang==='cn'?'en':'cn');document.addEventListener('focusin',e=>{if(e.target.matches('input,textarea,select'))setTimeout(()=>e.target.scrollIntoView({block:'center',behavior:'smooth'}),300)});if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>{const el=document.activeElement;if(el&&el.matches('input,textarea,select'))setTimeout(()=>el.scrollIntoView({block:'center',behavior:'smooth'}),100)});setLanguage(lang);window.addEventListener('resize',fitNav);await loadHome()}
document.addEventListener('DOMContentLoaded',async()=>{await initialize()});
</script>
</body></html>
