<body>
<aside class="sidebar" id="sidebar">
 <button class="brand" id="brand" type="button"><i class="fa-solid fa-dna"></i><span data-i="app">学习DNA档案</span></button>
 <div class="side-note" data-i="tagline">只记录学习所需信息，档案文本待学生确认</div>
 <button class="menu-toggle" id="menuToggle" type="button" aria-label="Menu" aria-expanded="false"><i class="fa-solid fa-bars"></i></button>
 <nav class="nav" id="nav">
  <button type="button" data-page="home"><i class="fa-solid fa-house"></i><span data-i="home">首页</span></button>
  <button type="button" data-page="create"><i class="fa-solid fa-file-circle-plus"></i><span data-i="create">建立档案</span></button>
  <button type="button" data-page="library"><i class="fa-solid fa-box-archive"></i><span data-i="library">档案库</span></button>
  <div class="language"><button type="button" data-lang="cn">中文</button><button type="button" data-lang="en">English</button></div>
 </nav>
 <div class="side-bottom"><i class="fa-solid fa-shield-heart"></i> <span data-i="consentHint">身份未确认、未同意建档，或小学学段及约14周岁以下未获监护人同意时，不建立长期档案</span></div>
 <div class="language"><button type="button" data-lang="cn">中文</button><button type="button" data-lang="en">English</button></div>
</aside>
<main class="main">
 <section class="page active" id="page-home">
  <div class="hero"><h1 data-i="app">学习DNA档案</h1><p data-i="heroText">把年级、卡点、讲解偏好和有证据的学习进展，整理成一份可更新、待确认的成长档案</p><div class="btns"><button class="btn secondary" type="button" id="heroCreate" data-i="createNew">建立新档案</button><button class="btn" type="button" id="heroLibrary" data-i="viewLibrary">查看档案库</button></div></div>
  <div class="stats"><div class="stat"><label data-i="total">档案总数</label><strong id="statTotal">—</strong></div><div class="stat"><label data-i="consented">已同意建档</label><strong id="statConsented">—</strong></div><div class="stat"><label data-i="needsConsent">待补授权</label><strong id="statNeeds">—</strong></div></div>
  <h2 class="section-title" data-i="subjectFocus">学科焦点</h2><div class="card focus"><i class="fa-solid fa-star"></i><div><small data-i="mostStuck">当前最常被卡住的学科</small><strong id="focusSubject">—</strong></div></div>
  <h2 class="section-title" data-i="recent">最近档案</h2><div class="record-grid" id="recentRecords"></div>
 </section>
 <section class="page" id="page-create">
  <div class="page-head"><div><h1 data-i="create">建立档案</h1><p data-i="createIntro">先完成身份与授权确认，再提交学习资料，由后台生成待确认的学习DNA</p></div><button class="btn ghost" id="createToLibrary" type="button" data-i="backLibrary">返回档案库</button></div>
  <div class="card pad"><h2 id="formTitle" data-i="studentArchive">学生学习档案</h2><form id="archiveForm" novalidate><div class="form-grid">
   <div class="field"><label for="archiveForm_studentCode" data-i="studentCode">学生代号</label><input id="archiveForm_studentCode" name="学生代号" autocomplete="off"></div>
   <div class="field"><label for="archiveForm_identity" data-i="identity">本人身份已确认</label><select id="archiveForm_identity" name="本人身份已确认"><option value="否" data-i="no">否</option><option value="是" data-i="yes">是</option></select></div>
   <div class="field"><label for="archiveForm_grade" data-i="grade">年级</label><input id="archiveForm_grade" name="年级" data-placeholder="gradeExample" placeholder="例如：三年级、七年级、高一"></div>
   <div class="field"><label for="archiveForm_age" data-i="age">年龄</label><input id="archiveForm_age" name="年龄" type="number" min="0" max="120" inputmode="numeric"></div>
   <div class="field"><label for="archiveForm_consent" data-i="consent">同意建档</label><select id="archiveForm_consent" name="同意建档"><option value="否" data-i="no">否</option><option value="是" data-i="yes">是</option></select></div>
   <div class="field"><label for="archiveForm_guardian" data-i="guardian">监护人同意</label><select id="archiveForm_guardian" name="监护人同意"><option value="否" data-i="no">否</option><option value="是" data-i="yes">是</option></select></div>
   <div class="field"><label for="archiveForm_subject" data-i="subject">最困扰的学科</label><input id="archiveForm_subject" name="最困扰的学科"></div>
   <div class="field"><label for="archiveForm_style" data-i="style">解释方式</label><select id="archiveForm_style" name="解释方式"><option value="">—</option><option value="类比举例" data-i="style1">类比举例</option><option value="分步拆解" data-i="style2">分步拆解</option><option value="先讲结论" data-i="style3">先讲结论</option><option value="图示辅助" data-i="style4">图示辅助</option></select></div>
   <div class="field wide"><label for="archiveForm_difficulty" data-i="difficulty">具体卡点</label><textarea id="archiveForm_difficulty" name="具体卡点"></textarea></div>
   <div class="field wide"><label for="archiveForm_goal" data-i="goal">本学期目标</label><textarea id="archiveForm_goal" name="本学期目标"></textarea></div>
   <div class="field wide"><label data-i="records">学习记录</label><div class="file-area"><input id="archiveForm_file" name="学习记录文件" type="hidden"><div class="btns"><button class="btn secondary" type="button" id="selectFile" data-i="selectFile">选择学习记录</button><button class="btn ghost" type="button" id="clearFile" data-i="clearFile">清除文件</button></div><div id="selectedFile"></div></div></div>
  </div><div id="validation" role="alert"></div><div class="btns"><button class="btn" id="submitArchive" type="submit" data-i="generate">生成学习档案</button><button class="btn secondary" id="rebuildArchive" type="button" hidden data-i="rebuild">重建并生成</button></div></form></div>
  <div class="card pad" id="pendingCard" hidden style="margin-top:20px"><h2 data-i="pendingTitle">待学生确认</h2><p class="notice" data-i="pendingNote">以下内容来自学习记录中的有证据进展，未确认前不是既定事实；不写入与学习无关的敏感隐私</p><div class="markdown-body" id="pendingMarkdown"></div><button class="btn secondary" id="pendingLibrary" type="button" data-i="goLibrary">去档案库查看</button></div>
 </section>
 <section class="page" id="page-library">
  <div class="page-head"><div><h1 data-i="library">档案库</h1><p data-i="libraryIntro">查看、确认、修正或删除已建立的学习档案</p></div><button class="btn" id="libraryCreate" type="button" data-i="createPlus">+ 建立档案</button></div>
  <div class="filters"><input id="searchInput" data-placeholder="search" placeholder="搜索学生代号、年级、学科、目标"><select id="filterStyle"><option value="" data-i="allStyles">全部解释方式</option><option value="类比举例" data-i="style1">类比举例</option><option value="分步拆解" data-i="style2">分步拆解</option><option value="先讲结论" data-i="style3">先讲结论</option><option value="图示辅助" data-i="style4">图示辅助</option></select><select id="filterConsent"><option value="" data-i="allConsent">全部同意状态</option><option value="是" data-i="yes">是</option><option value="否" data-i="no">否</option></select><select id="filterIdentity"><option value="" data-i="allIdentity">全部身份状态</option><option value="是" data-i="yes">是</option><option value="否" data-i="no">否</option></select></div>
  <div class="record-grid" id="libraryRecords"></div>
 </section>
</main>
<div class="modal-shell" id="detailShell"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="detailTitle"><div class="modal-head"><h2 id="detailTitle" data-i="detail">档案详情</h2><button type="button" class="icon-btn" id="detailClose" aria-label="Close"><i class="fa-solid fa-xmark"></i></button></div><div id="detailBody"></div><div class="btns" style="margin-top:22px"><button class="btn ghost" type="button" id="detailCloseBottom" data-i="close">关闭</button><button class="btn secondary" type="button" id="detailEdit" data-i="editThis">编辑此档案</button><button class="btn danger" type="button" id="detailDelete" data-i="deleteThis">删除此档案</button></div></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

    fileInput.addEventListener('change', (event) => {

      document.body.removeChild(fileInput);

      document.body.removeChild(fileInput);
    });

    document.body.appendChild(fileInput);

    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }
