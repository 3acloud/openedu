<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.5/dist/purify.min.js"></script><script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,
          "CapturePhoto": capturePhotoA,
          "FinishRecordVoice": FinishRecordVoiceA
        };

        // 检查请求类型是否在支持的映射中
        if (request['type'] in HANDLERS) {
          try {
            // 1. 根据类型选择相应的处理函数获取文件
            const file = await HANDLERS[request['type']]();
    
            // 2. 上传文件到Flask服务端
            const guidFileName = await uploadToFlaskA(file);
    
            // 3. 返回GUID文件名
            return guidFileName;
          } catch (error) {
            // 可以在这里添加错误处理逻辑，如日志记录
            console.error(`处理${request['type']}时出错:`, error);
          }
  
          // 所有失败情况返回空字符串
          return "";
        }



        url = 'http://' + window.location.hostname + ':3130/request';
        const response = await fetch(url, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'SessionID': localStorage.getItem('airthink_session_id'),
            'BaseName': encodeURIComponent("ca6c57126a3b6cb9_康奈尔笔记")
        },
        body: JSON.stringify(request)
        });
  
        if (!response.ok) {
            throw new Error(`请求失败: ${response.status}`);
        }
  
        return await response.text();
    }

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function selectImageA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*'; // 限制只选择图片文件
    fileInput.style.display = 'none';

    fileInput.addEventListener('change', (event) => {

        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }

      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择（注意：cancel事件在某些浏览器中可能不支持）
    fileInput.addEventListener('cancel', () => {

      document.body.removeChild(fileInput);
    });

    fileInput.click();
  });
}

function capturePhotoA() {
  return new Promise((resolve, reject) => {
    // 检查浏览器是否支持媒体设备API
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      reject(new Error('您的浏览器不支持拍照功能'));
      return;
    }
    
    // 创建一个隐藏的视频元素用于预览
    const video = document.createElement('video');
    video.style.display = 'none';
    video.setAttribute('autoplay', '');
    video.setAttribute('playsinline', '');
    
    // 创建一个canvas元素用于捕获照片
    const canvas = document.createElement('canvas');
    canvas.style.display = 'none';
    const ctx = canvas.getContext('2d');
    
    // 创建拍照按钮和取消按钮的容器
    const container = document.createElement('div');
    container.style.cssText = `
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    `;
    
    // 创建视频预览容器
    const videoContainer = document.createElement('div');
    videoContainer.style.cssText = `
      width: 100%;
      max-width: 640px;
      max-height: 70vh;
      overflow: hidden;
      border-radius: 8px;
      margin-bottom: 20px;
    `;
    
    // 将视频放入容器中
    video.style.cssText = `
      width: 100%;
      height: auto;
      transform: scaleX(-1); /* 镜像翻转，让预览更自然 */
    `;
    
    // 创建按钮容器
    const buttonContainer = document.createElement('div');
    buttonContainer.style.cssText = `
      display: flex;
      gap: 20px;
    `;
    
    // 创建拍照按钮
    const captureBtn = document.createElement('button');
    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {

                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

function t(k){return I[lang][k]||k} function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))} function textValue(v){return String(v??'').trim()}
function getLang(){try{const stored=localStorage.getItem('iThinkAir_UiLanguage');if(stored) return stored==='en'?'en':'cn'}catch{} const p=new URLSearchParams(location.search).get('lang');if(p==='en'||p==='cn')return p;const a=navigator.languages;if(!a||!a.length)return 'cn';return a.some(x=>/^zh(?:-|$)/i.test(x))?'cn':'en'}
function setLang(v){lang=v;document.documentElement.lang=v==='cn'?'zh-CN':'en';document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));document.querySelectorAll('[data-placeholder]').forEach(e=>e.placeholder=t(e.dataset.placeholder));$('languageButton').textContent=v==='cn'?'EN':'中文';$('mobileLanguage').textContent=v==='cn'?'English':'中文';try{localStorage.setItem('iThinkAir_UiLanguage',v)}catch{}$('archiveValue').textContent=t($('noteForm_archive').checked?'yes':'no');renderAll();renderPlaceholderIfEmpty();updateSubmit()}
function showToast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),3600)}
function closeMenu(){$('mobileMenu').classList.remove('open');$('menuToggle').setAttribute('aria-expanded','false')}
function navigate(next,push=true){if(next===page)return;if(push)historyStack.push({page,scrollY:window.scrollY});page=next;for(const name of ['home','editor','library'])$(name+'Page').hidden=name!==next;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===next));closeMenu();window.scrollTo(0,0)}
function closeDrawer(){$('drawerBackdrop').classList.remove('open');drawerRow=0;document.body.style.overflow=''}
function airBack(){if($('drawerBackdrop').classList.contains('open')){closeDrawer();return 'false'}if($('mobileMenu').classList.contains('open')){closeMenu();return 'false'}if(historyStack.length){const h=historyStack.pop();navigate(h.page,false);requestAnimationFrame(()=>window.scrollTo(0,h.scrollY));return 'false'}return 'true'}window.airBack=airBack;
function record(r,i){return {row:i+1,stage:r[0]||'',subject:r[1]||'',topic:r[2]||'',content:r[3]||'',archive:r[4]||''}}
async function refreshData(){try{const [csv,count]=await Promise.all([callAppBridge({type:'GetTableCSV',data:TABLE,payload:FIELDS.join(',')}),callAppBridge({type:'GetRecordCount',data:TABLE})]);rows=parseCSV(String(csv||'').replace(/^\uFEFF/,'')).filter(r=>r.some(x=>x!=='')).map(record);$('totalCount').textContent=/^\d+$/.test(String(count).trim())?String(count).trim():rows.length;renderAll()}catch(e){showToast(t('error')+': '+e.message)}}
function renderAll(){if(!$('recentList'))return;$('archivedCount').textContent=rows.filter(r=>r.archive==='是').length;$('unarchivedCount').textContent=rows.filter(r=>r.archive==='否').length;const stages=['小学高段','初中','高中'],colors=['#718d76','#c3984f','#203449'];$('stageDistribution').innerHTML=stages.map((s,i)=>{const n=rows.filter(r=>r.stage===s).length;return '<div class="progress-row"><span>'+esc(t(['primary','middle','high'][i]))+'</span><div class="track"><span class="fill" style="width:'+(rows.length?100*n/rows.length:0)+'%;background:'+colors[i]+'"></span></div><strong>'+n+'</strong></div>'}).join('');const counts={};rows.forEach(r=>{if(r.subject)counts[r.subject]=(counts[r.subject]||0)+1});const subjects=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,4);$('subjectFocus').innerHTML=subjects.length?subjects.map(([s,n])=>'<button class="chip" data-subject="'+esc(s)+'">'+esc(s)+' · '+n+'</button>').join(''):'<span>'+esc(t('empty'))+'</span>';$('recentList').innerHTML=rows.length?rows.slice(0,5).map(r=>cardHTML(r,false)).join(''):emptyHTML();renderLibrary()}
function emptyHTML(){return '<div class="paper-card empty"><i class="fa-solid fa-book-closed"></i><p>'+esc(t('empty'))+'</p><button class="btn" data-action="new">'+esc(t('first'))+'</button></div>'}
function cardHTML(r,actions){return '<article class="paper-card note-card clickable" data-row="'+r.row+'"><div class="note-meta"><span class="badge">'+esc(stageLabel(r.stage))+'</span><span>'+esc(r.subject)+'</span><span>·</span><span>'+esc(r.archive==='是'?t('archived'):t('unarchived'))+'</span></div><h3>'+esc(r.topic)+'</h3><p>'+esc(r.content.slice(0,actions?60:40))+(r.content.length>(actions?60:40)?'…':'')+'</p><div class="card-actions"><button class="btn ghost small" data-action="detail" data-row="'+r.row+'">'+esc(t('viewDetail'))+'</button>'+(actions?'<button class="btn ghost small" data-action="edit" data-row="'+r.row+'">'+esc(t('edit'))+'</button><button class="btn ghost small" data-action="delete" data-row="'+r.row+'">'+esc(t('delete'))+'</button>':'')+'</div></article>'}
function stageLabel(s){return ({'小学高段':t('primary'),'初中':t('middle'),'高中':t('high')})[s]||s}
function renderLibrary(){const q=$('searchInput').value.trim().toLocaleLowerCase(),s=$('stageFilter').value,a=$('archiveFilter').value;const found=rows.filter(r=>(!q||(r.subject+' '+r.topic).toLocaleLowerCase().includes(q))&&(!s||r.stage===s)&&(!a||r.archive===a));$('libraryList').innerHTML=found.length?found.map(r=>cardHTML(r,true)).join(''):rows.length?'<div class="paper-card empty"><i class="fa-solid fa-book-closed"></i>'+esc(t('noMatch'))+'</div>':emptyHTML()}
function selectStage(v){$('noteForm_stage').value=v;document.querySelectorAll('[data-stage]').forEach(b=>b.classList.toggle('selected',b.dataset.stage===v));updateSubmit()}
function updateSubmit(){$('archiveValue').textContent=t($('noteForm_archive').checked?'yes':'no');const valid=!!($('noteForm_stage').value&&$('noteForm_subject').value.trim()&&$('noteForm_topic').value.trim()&&$('noteForm_content').value.trim());$('submitButton').disabled=busy||!valid;$('saveNewButton').disabled=busy||!valid;$('submitButton').textContent=t(editing?'save':'generate');$('saveNewButton').hidden=!editing;$('rereadButton').disabled=busy||currentRow<1}
function dataFromForm(){return {'学段':$('noteForm_stage').value,'学科':$('noteForm_subject').value.trim(),'课题':$('noteForm_topic').value.trim(),'笔记内容':$('noteForm_content').value.trim(),'同意归档':$('noteForm_archive').checked?'是':'否'}}
function setBusy(v){busy=v;updateSubmit()}
function renderPlaceholderIfEmpty(){if($('previewContent').dataset.state==='result'||$('previewContent').dataset.state==='waiting')return;$('previewContent').innerHTML='<div class="placeholder"><div>'+t('cue')+'</div><div>'+t('notes')+'</div><div>'+t('summary')+' · '+t('previewHint')+'</div></div>'}
function renderMarkdown(raw){const box=$('previewContent');box.dataset.state='result';box.innerHTML=(raw.includes('待确认')?'<div class="notice">'+esc(t('confirm'))+'</div>':'')+'<div class="markdown-body">'+safeMarkdown(raw)+'</div>';makeImagesDownload(box)}
function safeMarkdown(raw){if(!window.marked||!window.DOMPurify)return '<pre>'+esc(raw)+'</pre>';return DOMPurify.sanitize(marked.parse(raw,{gfm:true,breaks:true}),{USE_PROFILES:{html:true}})}
function makeImagesDownload(root){root.querySelectorAll('.markdown-body img').forEach(img=>{const src=img.getAttribute('src')||'';let name='';try{const u=new URL(src,location.href);if(u.origin==='https://www.ithinkair.com:3031'&&u.pathname.startsWith('/download/'))name=decodeURIComponent(u.pathname.slice('/download/'.length))}catch{}if(!name&&!/^(https?:|data:|\/)/i.test(src))name=src;if(name){const a=document.createElement('a');a.href='http://' + window.location.hostname + ':3130/download/'+encodeURIComponent(name);a.download=name;img.parentNode.insertBefore(a,img);a.appendChild(img)}})}
async function readResult(row,target='preview'){const raw=await callAppBridge({type:'GetCellValue',data:TABLE,payload:'康奈尔笔记/'+row});if(target==='preview'){if(textValue(raw))renderMarkdown(String(raw));else{$('previewContent').dataset.state='empty';$('previewContent').innerHTML='<div class="notice">'+esc(t('notGenerated'))+'</div>'}}return String(raw||'')}
async function pollResult(row,token){$('previewContent').dataset.state='waiting';$('previewContent').innerHTML='<div class="notice"><i class="fa-solid fa-spinner fa-spin"></i> '+esc(t('pending'))+'</div>';const end=Date.now()+1800000;while(Date.now()<end&&token===pollToken){await new Promise(r=>setTimeout(r,2000));if(token!==pollToken)break;try{const raw=await callAppBridge({type:'GetCellValue',data:TABLE,payload:'康奈尔笔记/'+row});if(textValue(raw)){renderMarkdown(String(raw));if($('noteForm_archive').checked)showToast(t('archivedToast'));break}}catch(e){showToast(t('error')+': '+e.message);break}}if(token===pollToken){if($('previewContent').dataset.state==='waiting'){$('previewContent').dataset.state='empty';$('previewContent').innerHTML='<div class="notice">'+esc(t('timeout'))+'</div>'}setBusy(false)}}
async function submitNew(){if(busy)return;const data=dataFromForm();if(!Object.values(data).slice(0,4).every(Boolean))return;setBusy(true);try{await callAppBridge({type:'SubmitRecord',data:'笔记',payload:JSON.stringify(data)});currentRow=1;editing=false;updateSubmit();await refreshData();const token=++pollToken;await pollResult(1,token)}catch(e){showToast(t('error')+': '+e.message);setBusy(false)}}
async function saveCurrent(){if(busy||!editing||currentRow<1)return;const data=dataFromForm();if(!Object.values(data).slice(0,4).every(Boolean))return;setBusy(true);try{for(const field of FIELDS)await callAppBridge({type:'SetCellValue',data:TABLE,payload:field+'/'+currentRow+'/'+data[field]});await refreshData();showToast(t('saved'))}catch(e){showToast(t('error')+': '+e.message)}finally{setBusy(false)}}
function clearForm(){++pollToken;editing=false;currentRow=0;$('noteForm').reset();selectStage('');$('previewContent').dataset.state='empty';renderPlaceholderIfEmpty();setBusy(false)}
async function editRow(row){closeDrawer();++pollToken;setBusy(true);try{const vals={};for(const field of FIELDS)vals[field]=await callAppBridge({type:'GetCellValue',data:TABLE,payload:field+'/'+row});currentRow=row;editing=true;selectStage(String(vals['学段']||''));$('noteForm_subject').value=vals['学科']||'';$('noteForm_topic').value=vals['课题']||'';$('noteForm_content').value=vals['笔记内容']||'';$('noteForm_archive').checked=vals['同意归档']==='是';navigate('editor');await readResult(row)}catch(e){showToast(t('error')+': '+e.message)}finally{setBusy(false)}}
async function openDetail(row){drawerRow=row;$('drawerBackdrop').classList.add('open');document.body.style.overflow='hidden';$('drawerBody').innerHTML='<div class="notice"><i class="fa-solid fa-spinner fa-spin"></i> '+esc(t('pending'))+'</div>';try{const vals={};for(const field of [...FIELDS,'康奈尔笔记'])vals[field]=await callAppBridge({type:'GetCellValue',data:TABLE,payload:field+'/'+row});if(drawerRow!==row)return;const body=$('drawerBody');body.innerHTML='<div class="note-meta"><span class="badge">'+esc(stageLabel(vals['学段']))+'</span><span>'+esc(vals['学科'])+'</span><span>'+esc(vals['同意归档']==='是'?t('archived'):t('unarchived'))+'</span></div><h2>'+esc(vals['课题'])+'</h2><div class="detail-label">'+esc(t('rawNotes'))+'</div><div class="detail-raw">'+esc(vals['笔记内容'])+'</div><div class="detail-label">'+esc(t('preview'))+'</div>'+(textValue(vals['康奈尔笔记'])?((String(vals['康奈尔笔记']).includes('待确认')?'<div class="notice">'+esc(t('confirm'))+'</div>':'')+'<div class="markdown-body">'+safeMarkdown(String(vals['康奈尔笔记']))+'</div>'):'<div class="notice">'+esc(t('notGenerated'))+'</div>');makeImagesDownload(body)}catch(e){$('drawerBody').textContent=t('error')+': '+e.message}}
async function deleteRow(row){if(!row||!confirm(t('confirmDelete')))return;try{await callAppBridge({type:'DeleteRecord',data:TABLE,payload:row.toString()});closeDrawer();if(currentRow===row)clearForm();else if(currentRow>row)currentRow--;await refreshData();showToast(t('deleted'))}catch(e){showToast(t('error')+': '+e.message)}}
function handleCardClick(e){const a=e.target.closest('[data-action]');if(a){const row=Number(a.dataset.row);if(a.dataset.action==='new'){clearForm();navigate('editor')}else if(a.dataset.action==='edit')editRow(row);else if(a.dataset.action==='delete')deleteRow(row);else if(a.dataset.action==='detail')openDetail(row);return}const card=e.target.closest('.note-card');if(card)openDetail(Number(card.dataset.row))}
async function initialize(){lang=getLang();try{const mode=await callAppBridge({type:'模式'});document.body.classList.toggle('dark',String(mode).trim()==='暗色')}catch{}setLang(lang);renderPlaceholderIfEmpty();document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.page)));$('brand').addEventListener('click',()=>{if(parent&&typeof parent.closeFullHtml==='function')parent.closeFullHtml(false)});$('menuToggle').addEventListener('click',()=>{const m=$('mobileMenu');m.classList.toggle('open');$('menuToggle').setAttribute('aria-expanded',String(m.classList.contains('open')))});document.addEventListener('click',e=>{if(!e.target.closest('#topbar'))closeMenu()});$('languageButton').addEventListener('click',()=>setLang(lang==='cn'?'en':'cn'));$('mobileLanguage').addEventListener('click',()=>{setLang(lang==='cn'?'en':'cn');closeMenu()});$('startButton').addEventListener('click',()=>navigate('editor'));$('openLibraryButton').addEventListener('click',()=>navigate('library'));$('editorLibraryButton').addEventListener('click',()=>navigate('library'));$('newNoteButton').addEventListener('click',()=>{clearForm();navigate('editor')});document.querySelectorAll('[data-stat]').forEach(b=>b.addEventListener('click',()=>{$('archiveFilter').value=b.dataset.stat==='all'?'':b.dataset.stat==='yes'?'是':'否';renderLibrary();navigate('library')}));$('subjectFocus').addEventListener('click',e=>{const b=e.target.closest('[data-subject]');if(b){$('searchInput').value=b.dataset.subject;$('stageFilter').value='';$('archiveFilter').value='';renderLibrary();navigate('library')}});$('recentList').addEventListener('click',handleCardClick);$('libraryList').addEventListener('click',handleCardClick);$('searchInput').addEventListener('input',renderLibrary);$('stageFilter').addEventListener('change',renderLibrary);$('archiveFilter').addEventListener('change',renderLibrary);$('stageButtons').addEventListener('click',e=>{const b=e.target.closest('[data-stage]');if(b)selectStage(b.dataset.stage)});for(const id of ['noteForm_subject','noteForm_topic','noteForm_content'])$(id).addEventListener('input',updateSubmit);$('noteForm_archive').addEventListener('change',updateSubmit);$('noteForm').addEventListener('submit',e=>{e.preventDefault();editing?saveCurrent():submitNew()});$('saveNewButton').addEventListener('click',submitNew);$('clearButton').addEventListener('click',clearForm);$('rereadButton').addEventListener('click',async()=>{if(currentRow<1||busy)return;try{await readResult(currentRow)}catch(e){showToast(t('error')+': '+e.message)}});$('drawerClose').addEventListener('click',closeDrawer);$('drawerCloseTop').addEventListener('click',closeDrawer);$('drawerBackdrop').addEventListener('click',e=>{if(e.target===$('drawerBackdrop'))closeDrawer()});$('drawerEdit').addEventListener('click',()=>editRow(drawerRow));$('drawerDelete').addEventListener('click',()=>deleteRow(drawerRow));document.addEventListener('keydown',e=>{if(e.key==='Escape')airBack()});document.addEventListener('focusin',e=>{if(e.target.matches('input,textarea,select'))setTimeout(()=>e.target.scrollIntoView({block:'center',behavior:'smooth'}),300)});if(window.visualViewport)visualViewport.addEventListener('resize',()=>{const e=document.activeElement;if(e&&e.matches('input,textarea,select'))setTimeout(()=>e.scrollIntoView({block:'center',behavior:'smooth'}),100)});await refreshData()}
document.addEventListener('DOMContentLoaded', () => { (async () => { await initialize(); })(); });
</script></body></html>
