<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>排课与课时记忆</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<style>
:root{--paper:#F3EEE4;--ink:#1E3A4C;--gold:#C6A15B;--card:#FFFCF7;--line:#E4D9C8;--danger:#A33B3B;--text:#253947;--muted:#6d716f;--shadow:0 10px 30px #1e3a4c12}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--text);font:15px/1.65 system-ui,-apple-system,'Microsoft YaHei',sans-serif}body.dark{--paper:#14252d;--ink:#10232f;--card:#223740;--line:#45535a;--text:#f1eadf;--muted:#c0b9ad;--shadow:0 10px 30px #0004}h1,h2,h3,.brand{font-family:'Noto Serif SC','Songti SC',serif}button,input,select,textarea{font:inherit}input,select,textarea{box-sizing:border-box;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}textarea{min-height:96px;resize:vertical}button{cursor:pointer;border:0}button:disabled{opacity:.45;cursor:not-allowed}.btn{background:var(--ink);color:#fff;border-radius:10px;padding:10px 16px;transition:transform .18s,box-shadow .18s;white-space:nowrap}.btn:hover:not(:disabled),.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}.btn.gold{background:var(--gold);color:#182d38}.btn.danger{background:var(--danger)}.small{font-size:12px;padding:6px 9px}.muted{color:var(--muted)}.danger-text{color:var(--danger);font-weight:700}.topbar{position:relative;z-index:1001;position:sticky;top:0;background:var(--ink);border-bottom:2px solid var(--gold);color:#fff}.nav-inner{max-width:1440px;margin:auto;padding:10px 24px;display:flex;align-items:center;gap:22px}.brand{display:flex;align-items:center;gap:10px;color:#fff;background:none;font-size:19px;font-weight:700;white-space:nowrap}.brand i{color:var(--gold)}.nav-tabs{display:flex;gap:4px;margin-left:auto;white-space:nowrap}.nav-tabs button,.langbtn,.hamb{background:none;color:#fff;padding:9px 11px}.nav-tabs button.active{color:#e6c886;border-bottom:2px solid var(--gold)}.hamb{display:none;margin-left:auto;font-size:20px}.mobile-menu{display:none;position:absolute;right:16px;top:100%;min-width:210px;background:var(--ink);border:1px solid var(--gold);border-radius:0 0 12px 12px;box-shadow:var(--shadow);padding:8px}.mobile-menu.open{display:grid}.mobile-menu button{text-align:left;background:none;color:white;padding:10px}.shell{max-width:1440px;margin:auto;padding:30px 24px 120px}.page{display:none}.page.active{display:block}.hero{background:linear-gradient(110deg,var(--ink),#315568);color:#fff;border-radius:22px;padding:32px;margin-bottom:24px;box-shadow:var(--shadow)}.hero h1{font-size:clamp(28px,4vw,44px);margin:0}.hero p{color:#e0e2dd}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.pagehead{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:22px}.pagehead h1{margin:0}.pagehead p{margin:3px 0;color:var(--muted)}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:28px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 8px #1e3a4c0a}.card{padding:18px;transition:transform .18s,box-shadow .18s}.card h3{margin:0 0 8px}.card .num{font:700 32px Georgia,serif;color:var(--ink)}.section-title{border-bottom:1px solid var(--line);padding-bottom:9px;margin:28px 0 15px}.filters{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:10px;margin:18px 0}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(295px,1fr));gap:14px}.fieldline{display:flex;gap:10px;border-top:1px dashed var(--line);padding:5px 0;overflow-wrap:anywhere}.fieldline b{min-width:94px;color:var(--muted);font-weight:500}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.stamp{display:inline-block;border:1px solid currentColor;border-radius:5px;padding:1px 7px;font-size:12px;font-weight:700}.progress{height:7px;background:var(--line);border-radius:9px;overflow:hidden}.progress span{display:block;height:100%;background:var(--gold)}.empty{padding:28px;text-align:center;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}.week-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:15px 0}.week-grid{display:grid;grid-template-columns:repeat(7,minmax(165px,1fr));gap:8px;overflow-x:auto}.week-day{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:260px}.week-day h3{font-size:14px;margin:0 0 10px}.slot{margin-bottom:8px;padding:9px;border-left:4px solid var(--gold);background:var(--paper);border-radius:7px;cursor:pointer}.slot.conflict{border-color:var(--danger);color:var(--danger)}.workspace{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{padding:20px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{min-width:0}.field.wide{grid-column:1/-1}.field label{display:block;font-weight:650;margin-bottom:4px}.field small{color:var(--muted)}.segments{display:flex;flex-wrap:wrap;gap:6px}.segments button{background:var(--paper);border:1px solid var(--line);color:var(--text);padding:6px 9px;border-radius:8px}.segments button.active{background:var(--ink);color:white}.markdown{line-height:1.75;overflow-wrap:anywhere}.markdown img{max-width:100%;height:auto}.markdown pre{overflow:auto;background:#14252d;color:#f8f4ed;padding:13px;border-radius:8px}.markdown blockquote{border-left:3px solid var(--gold);padding-left:12px}.markdown table{border-collapse:collapse;display:block;overflow:auto}.markdown th,.markdown td{border:1px solid var(--line);padding:6px}.overlay{display:none;position:fixed;inset:0;background:#0c1d27aa;z-index:2000;align-items:center;justify-content:center;padding:22px}.overlay.open{display:flex}.dialog{background:var(--card);color:var(--text);width:min(700px,100%);max-height:calc(100dvh - 44px);overflow:auto;border-radius:18px;padding:24px;box-shadow:0 20px 60px #0005}.dialog.wide{width:min(850px,100%)}.dialog header{display:flex;justify-content:space-between;gap:10px;align-items:center}.dialog h2{margin:0 0 12px}.close{background:none;color:var(--text);font-size:24px}.error{padding:14px;background:#a33b3b15;color:var(--danger);border-radius:10px}.notice{padding:12px;background:#c6a15b24;border-radius:10px;margin:12px 0}#toast{position:fixed;right:18px;bottom:18px;z-index:3000;background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;display:none}body.compact .nav-tabs,body.compact .langbtn{display:none}body.compact .hamb{display:block}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.workspace,.two{grid-template-columns:1fr}}@media(max-width:600px){.shell{padding:18px 14px 150px}.nav-inner{padding:8px 14px}.brand{font-size:16px}.stats{gap:9px}.card{padding:14px}.filters{grid-template-columns:1fr 1fr}.filters input:first-child{grid-column:1/-1}.fields{grid-template-columns:1fr}.hero{padding:24px}.pagehead{display:block}.pagehead .btn{margin-top:12px}.overlay{padding:10px}.dialog{max-height:calc(100dvh - 20px);padding:17px 17px 320px}.dialog.markdown-dialog{width:100%;height:100dvh;max-height:none;border-radius:0}.overlay:has(.markdown-dialog){padding:0}}
</style></head><body>
<nav class="topbar" id="topbar"><div class="nav-inner"><button class="brand" id="brand"><i class="fa-solid fa-book-open"></i><i class="fa-regular fa-clock"></i><span data-i="app">排课与课时记忆</span></button><div class="nav-tabs" id="navTabs"></div><button class="langbtn" id="langButton">EN</button><button class="hamb" id="hamb" aria-label="Menu"><i class="fa-solid fa-bars"></i></button></div><div class="mobile-menu" id="mobileMenu"></div></nav>
<main class="shell"><section class="page active" id="homePage"><div class="hero"><h1 data-i="app">排课与课时记忆</h1><p data-i="hero">把可上课时间、课节和课时包放在同一本书里，确认之后才动课表。</p><div class="row"><button class="btn gold" id="homeStudent" data-i="register">登记学员</button><button class="btn alt" id="homeSchedule" data-i="arrange">安排课程</button><button class="btn alt" id="homeWeek" data-i="openWeek">打开本周课表</button></div></div><div class="grid stats" id="stats"></div><h2 class="section-title" data-i="attention">需要关注的学员</h2><div class="cards" id="attentionCards"></div><h2 class="section-title" data-i="upcoming">即将到来的课节</h2><div class="cards" id="upcomingCards"></div></section>
<section class="page" id="studentsPage"><div class="pagehead"><div><h1 data-i="students">学员档案</h1><p data-i="studentsDesc">登记化名、学段、可上课时间和课时包。</p></div><button class="btn" id="newStudent">+ 登记学员</button></div><div class="filters"><input id="studentSearch" placeholder="搜索学员化名"><select id="studentStage"><option value="">全部学段</option></select><select id="studentStatus"><option value="">全部状态</option></select><select id="studentRisk"><option value="">全部</option><option value="soon">14天内到期</option><option value="expired">已过期</option><option value="low">剩余课时不足</option></select></div><div class="cards" id="studentCards"></div></section>
<section class="page" id="lessonsPage"><div class="pagehead"><div><h1 data-i="lessons">课节台账</h1><p data-i="lessonsDesc">这里只记录已经确认的课节，建议阶段的请求不在这里出现。</p></div><button class="btn" id="newLesson">+ 补记课节</button></div><div class="filters"><input id="lessonSearch" placeholder="搜索学员化名或科目"><select id="lessonStatus"><option value="">全部状态</option></select><select id="lessonStage"><option value="">全部学段</option></select><input type="date" id="lessonFrom"><input type="date" id="lessonTo"></div><div class="cards" id="lessonCards"></div></section>
<section class="page" id="weekPage"><div class="pagehead"><div><h1 data-i="week">周课表</h1><p data-i="weekDesc">一周的课铺在同一张桌面上，冲突直接染红。</p></div><button class="btn" id="weekArrange">为这一周排课</button></div><div class="week-controls"><button class="btn alt" id="prevWeek"></button><strong id="weekTitle"></strong><button class="btn alt" id="nextWeek"></button><button class="btn alt" id="thisWeek">回到本周</button><select id="weekStudent" style="max-width:200px"><option value="">全部学员</option></select><label><input type="checkbox" id="showCancelled" style="width:auto"> 显示已取消</label></div><div class="fields"><div class="field"><label for="weekUnavailable">老师不可用时间段</label><textarea id="weekUnavailable" placeholder="周六 14:00-17:00；周日 09:00-12:00"></textarea></div><div class="panel" id="weekStudentInfo"></div></div><div class="week-grid" id="weekGrid"></div></section>
<section class="page" id="deskPage"><div class="pagehead"><div><h1 data-i="desk">排课工作台</h1><p data-i="deskDesc">先形成处理建议，教师和学员确认前不动课表、不扣课时。</p></div><button class="btn" id="newRequest">+ 新的请求</button></div><div class="workspace"><div class="panel"><h2>排课请求</h2><div class="fields" id="requestFields"></div><div id="requestStudentInfo" class="notice"></div><div class="actions"><button class="btn gold" id="generateAdvice">生成处理建议</button><button class="btn alt" id="saveRequest" style="display:none">保存旧请求输入</button></div></div><div class="panel"><div class="row between"><h2>处理建议</h2><div class="row"><button class="btn alt small" id="olderRequest"></button><span id="requestPosition">—</span><button class="btn alt small" id="newerRequest"></button></div></div><div class="markdown" id="adviceView"><div class="empty">提交请求后，这一页会显示处理建议。</div></div><div class="actions"><button class="btn alt" id="refreshAdvice">刷新建议</button><button class="btn alt" id="continueAdvice" style="display:none">继续等待</button><button class="btn alt" id="openAdviceWeek" style="display:none">在周视图打开</button></div><div id="writeControls" style="display:none"><div class="notice" id="conflictReport"></div><label><input type="checkbox" id="studentConfirmed" style="width:auto"> 学员已确认</label><br><label id="manualWrap" style="display:none"><input type="checkbox" id="manualChecked" style="width:auto"> 我已人工核对可上课时间</label><div class="actions"><button class="btn gold" id="writeSchedule">确认写入课表</button></div></div></div></div><h2 class="section-title">已有请求</h2><div class="cards" id="requestCards"></div></section></main>
<div class="overlay" id="formOverlay"><div class="dialog wide"><header><h2 id="formTitle"></h2><button class="close" data-close="formOverlay">×</button></header><form id="recordForm"><div class="fields" id="recordFields"></div><div class="actions"><button class="btn gold" type="submit">保存</button><button class="btn alt" type="button" data-close="formOverlay">取消</button></div></form></div></div>
<div class="overlay" id="detailOverlay"><div class="dialog" id="detailDialog"><header><h2 id="detailTitle"></h2><button class="close" data-close="detailOverlay">×</button></header><div id="detailBody"></div><div class="actions" id="detailActions"></div></div></div>
<div class="overlay" id="confirmOverlay"><div class="dialog"><header><h2 id="confirmTitle">确认操作</h2><button class="close" data-close="confirmOverlay">×</button></header><div id="confirmBody"></div><div class="actions"><button class="btn danger" id="confirmYes">确认</button><button class="btn alt" data-close="confirmOverlay">取消</button></div></div></div><div id="toast"></div>
<script>
const STUDENTS=['学员化名','学段','可上课时间段','记录状态','课时包总课时','剩余课时','待确认课时','课时包到期日'];
const LESSONS=['开始时间','学员化名','科目','时长分钟','状态'];
const REQUESTS=['操作','学员化名','目标时间','原课时间','时长分钟','科目','老师不可用时间段','处理建议'];
const schema={student:{table:'学员信息',fields:STUDENTS},lesson:{table:'课节记录',fields:LESSONS},request:{table:'排课请求',fields:REQUESTS}};
const stages=['小学中段','小学高段','初中','高中'],statuses=['在读','暂停记录','已结课'],lessonStatuses=['已排课','已完成','已调课','补课','已取消','请假','试听'],operations=['排课','查看周课表','冲突检测','请假','补课','调课','查询课时','查询下一节课'];
const colors={'已排课':'#1E3A4C','已完成':'#2F6B4F','已调课':'#8A8175','补课':'#C6A15B','已取消':'#B9B2A8','请假':'#A33B3B','试听':'#3E7C8A'};
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={data:{student:[],lesson:[],request:[]},count:{student:0,request:0},row:{student:0,lesson:0,request:0},page:'home',history:[],dirty:false,formType:null,weekStart:null,waiting:false,advice:'',studentSort:'',lang:'cn',requestLoaded:null};
const dict={cn:{app:'排课与课时记忆',home:'首页',students:'学员档案',lessons:'课节台账',week:'周课表',desk:'排课工作台',hero:'把可上课时间、课节和课时包放在同一本书里，确认之后才动课表。',register:'登记学员',arrange:'安排课程',openWeek:'打开本周课表',attention:'需要关注的学员',upcoming:'即将到来的课节',studentsDesc:'登记化名、学段、可上课时间和课时包。',lessonsDesc:'这里只记录已经确认的课节，建议阶段的请求不在这里出现。',weekDesc:'一周的课铺在同一张桌面上，冲突直接染红。',deskDesc:'先形成处理建议，教师和学员确认前不动课表、不扣课时。'},en:{app:'Lesson Planner & Credit Ledger',home:'Home',students:'Students',lessons:'Lessons',week:'Weekly timetable',desk:'Scheduling desk',hero:'Keep availability, lessons, and credits together. Change the timetable only after confirmation.',register:'Add student',arrange:'Arrange lesson',openWeek:'Open this week',attention:'Students needing attention',upcoming:'Upcoming lessons',studentsDesc:'Record aliases, stage, availability, and credits.',lessonsDesc:'Only confirmed lessons are recorded here.',weekDesc:'See the week and spot conflicts.',deskDesc:'Get advice first; update the timetable only after both confirmations.'}};
function language(){let q=new URLSearchParams(location.search).get('lang'),saved=localStorage.getItem('iThinkAir_UiLanguage');state.lang=saved?(saved==='en'?'en':'cn'):q==='cn'||q==='en'?q:(!navigator.languages?'cn':navigator.languages.some(x=>/^zh/i.test(x))?'cn':'en');document.documentElement.lang=state.lang==='cn'?'zh-CN':'en';document.querySelectorAll('[data-i]').forEach(el=>el.textContent=dict[state.lang][el.dataset.i]);$('langButton').textContent=state.lang==='cn'?'EN':'中文';renderNav()}
function renderNav(){let names=['home','students','lessons','week','desk'];$('navTabs').innerHTML=names.map(n=>`<button data-page="${n}" class="${state.page===n?'active':''}">${dict[state.lang][n]}</button>`).join('');$('mobileMenu').innerHTML=names.map(n=>`<button data-page="${n}">${dict[state.lang][n]}</button>`).join('')+`<button id="mobileLang">${state.lang==='cn'?'English':'中文'}</button>`;$('mobileLang').onclick=toggleLang;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>showPage(b.dataset.page));fitNav()}
function fitNav(){document.body.classList.toggle('compact',window.innerWidth<940||$('topbar').scrollWidth>window.innerWidth)}
function toggleLang(){localStorage.setItem('iThinkAir_UiLanguage',state.lang==='cn'?'en':'cn');language()}
function showPage(page,push=true){if(state.dirty&&!confirm('表单有未保存改动，确定离开？'))return;let old=state.page;if(push&&old!==page)state.history.push({page:old,y:scrollY});state.page=page;document.querySelectorAll('.page').forEach(e=>e.classList.toggle('active',e.id===page+'Page'));$('mobileMenu').classList.remove('open');renderNav();scrollTo(0,0);if(page==='week')renderWeek();if(page==='desk')renderDesk()}
function toast(msg){let el=$('toast');el.textContent=msg;el.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.style.display='none',4200)}
function dateString(d,withTime=false){let p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`+(withTime?` ${p(d.getHours())}:${p(d.getMinutes())}`:'')}
function parseTime(s){if(!s)return null;let d=new Date(String(s).replace(' ','T'));return isNaN(d)?null:d}
function monday(d){let x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-(x.getDay()+6)%7);return x}
function source(t){return schema[t].table+'/默认表格'}
async function bridge(type,data,payload){let req={type};if(data!==undefined)req.data=data;if(payload!==undefined)req.payload=payload;let r=await callAppBridge(req);if(r===undefined||r===null||String(r).startsWith('Error:'))throw Error('数据暂时没有读取成功');return String(r)}
async function load(t){let s=schema[t],raw=await bridge('GetTableCSV',source(t),s.fields.join(','));state.data[t]=raw?parseCSV(raw).filter(r=>r.length===s.fields.length).map((r,i)=>Object.fromEntries([...s.fields.map((f,j)=>[f,r[j]]),['_row',i+1]])):[]}
async function loadAll(){try{await load('student');await load('lesson');await load('request');state.count.student=Number(await bridge('GetRecordCount',source('student')))||0;state.count.request=Number(await bridge('GetRecordCount',source('request')))||0;renderAll()}catch(e){showFailure(e)}}
function showFailure(e){console.error(e);toast('数据暂时没有读取成功');let active=document.querySelector('.page.active');if(active){let old=active.querySelector('.load-error');if(old)old.remove();let div=document.createElement('div');div.className='error load-error';div.innerHTML='数据暂时没有读取成功 <button class="btn small" id="retryLoad">重试</button>';active.prepend(div);$('retryLoad').onclick=loadAll}}
function renderAll(){document.querySelectorAll('.load-error').forEach(x=>x.remove());fillFilters();renderHome();renderStudents();renderLessons();renderWeek();renderDesk()}
function fillSelect(id,items,first){let el=$(id),val=el.value;el.innerHTML=`<option value="">${first}</option>`+items.map(x=>`<option>${esc(x)}</option>`).join('');el.value=val}
function fillFilters(){fillSelect('studentStage',stages,'全部学段');fillSelect('studentStatus',statuses,'全部状态');fillSelect('lessonStatus',lessonStatuses,'全部状态');fillSelect('lessonStage',stages,'全部学段');fillSelect('weekStudent',state.data.student.map(x=>x['学员化名']),'全部学员')}
function studentFor(alias){return state.data.student.find(x=>x['学员化名']===alias)}
function daysUntil(s){let d=parseTime(s);return d?Math.ceil((d-new Date())/86400000):Infinity}
function risk(s){if(s['记录状态']!=='在读')return '';let days=daysUntil(s['课时包到期日']);return days<0?'已过期':days<14?'临近到期':Number(s['剩余课时'])<=2?'课时不足':''}
function fieldRows(obj,fields){return fields.map(f=>`<div class="fieldline"><b>${esc(f)}</b><span>${esc(obj[f]||'—')}</span></div>`).join('')}

function intervals(raw){if(!raw?.trim())return [];let out=[];let parts=raw.split(/[；;\n]+/).map(x=>x.trim()).filter(Boolean);for(let part of parts){let m=part.match(/(?:周|星期)([一二三四五六日天])\s*(\d{1,2}):(\d{2})\s*[-—–~至]\s*(\d{1,2}):(\d{2})/);if(!m)return null;let day='一二三四五六日'.indexOf(m[1]==='天'?'日':m[1]);let a=+m[2]*60+ +m[3],b=+m[4]*60+ +m[5];if(day<0||a>=b||b>1440)return null;out.push({day,a,b})}return out}

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**

 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function selectImageA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*'; // 限制只选择图片文件
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        // 可选：进一步验证文件确实是图片
        if (!file.type.startsWith('image/')) {
          reject(new Error('选择的文件不是图片'));
          return;
        }
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择（注意：cancel事件在某些浏览器中可能不支持）
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function capturePhotoA() {
  return new Promise((resolve, reject) => {
    // 检查浏览器是否支持媒体设备API
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      reject(new Error('您的浏览器不支持拍照功能'));
      return;
    }
    
    // 创建一个隐藏的视频元素用于预览
    const video = document.createElement('video');
    video.style.display = 'none';
    video.setAttribute('autoplay', '');
    video.setAttribute('playsinline', '');
    
    // 创建一个canvas元素用于捕获照片
    const canvas = document.createElement('canvas');
    canvas.style.display = 'none';
    const ctx = canvas.getContext('2d');
    
    // 创建拍照按钮和取消按钮的容器
    const container = document.createElement('div');
    container.style.cssText = `
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    `;
    
    // 创建视频预览容器
    const videoContainer = document.createElement('div');
    videoContainer.style.cssText = `
      width: 100%;
      max-width: 640px;
      max-height: 70vh;
      overflow: hidden;
      border-radius: 8px;
      margin-bottom: 20px;
    `;
    
    // 将视频放入容器中
    video.style.cssText = `
      width: 100%;
      height: auto;
      transform: scaleX(-1); /* 镜像翻转，让预览更自然 */
    `;
    
    // 创建按钮容器
    const buttonContainer = document.createElement('div');
    buttonContainer.style.cssText = `
      display: flex;
      gap: 20px;
    `;
    
    // 创建拍照按钮
    const captureBtn = document.createElement('button');
    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}



/**
 * 上传文件到Flask服务端
 * @param {File} file - 要上传的文件
 * @returns {Promise<string>} - 返回GUID文件名
 */
async function uploadToFlaskA(file)
{
  // 创建FormData对象
  const formData = new FormData();
  formData.append('file', file);
  
  try {
    // 发送到Flask服务端
    const response = await fetch('http://' + window.location.hostname + ':3130/upload', {
      method: 'POST',
      body: formData,
    });
    
    if (!response.ok) {
      throw new Error(`上传失败: ${response.statusText}`);
    }
    
    const result = await response.text();
    return result;
  }
  catch (error)
  {
  }
  return ""
}    


        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

        function setInnerHTMLWithScripts(element, html) {
             element.innerHTML = html;
             // 执行内联脚本
             const scripts = element.querySelectorAll('script');
             scripts.forEach(oldScript => {
                 const newScript = document.createElement('script');
                 newScript.text = oldScript.text;
                 oldScript.parentNode.replaceChild(newScript, oldScript);
             });
         }

        function base64DecodeUTF8(base64Str) {
            // 使用atob解码Base64得到二进制字符串
            const binaryStr = atob(base64Str);
    
            // 将二进制字符串转换为字节数组
            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) {
                bytes[i] = binaryStr.charCodeAt(i);
            }
    
            // 使用TextDecoder将字节数组解码为UTF-8字符串
            const decoder = new TextDecoder('utf-8');
            return decoder.decode(bytes);
        }
