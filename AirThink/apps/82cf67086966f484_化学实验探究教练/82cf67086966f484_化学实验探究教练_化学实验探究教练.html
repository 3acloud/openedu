<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3a49">
<title>化学实验探究教练</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M19 5h10M21 5v8.5L11.5 34.5A8.2 8.2 0 0 0 19 44h10a8.2 8.2 0 0 0 7.5-9.5L27 13.5V5' fill='none' stroke='%231493a8' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M16 32h16' fill='none' stroke='%23e0b04a' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  :root {
    --bg: #e4eef3;
    --card: rgba(255, 255, 255, 0.78);
    --card-solid: #ffffff;
    --text: #17303a;
    --muted: #5d7582;
    --line: rgba(16, 72, 90, 0.14);
    --field: #f7fbfc;
    --amber: #e0b04a;
    --amber-deep: #b8862a;
    --ink: #102f3a;
    --teal: #0e7490;
    --brick: #9c3b3a;
    --shadow: 0 14px 34px rgba(18, 52, 68, 0.08);
    --glow: 0 10px 24px rgba(20, 168, 186, 0.18);
    --nav-space: 64px;
    --kb: 0px;
    --on: #0e8e9a;
    --off: #e08a3c;
    --high: #3d4eb8;
  }
  [data-theme="dark"] {
    --bg: #0d1921;
    --card: rgba(18, 36, 46, 0.82);
    --card-solid: #152833;
    --text: #e7f2f6;
    --muted: #9bb0bb;
    --line: rgba(186, 220, 230, 0.16);
    --field: #102430;
    --shadow: 0 14px 34px rgba(0, 0, 0, 0.32);
    --glow: 0 10px 24px rgba(40, 180, 196, 0.2);
    --on: #6fd4dc;
    --off: #f0a45a;
    --high: #9aa6f5;
  }
  * , *::before, *::after { box-sizing: border-box; }
  input, select, textarea { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  html { color-scheme: light; }
  [data-theme="dark"] { color-scheme: dark; }
  body {
    font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.55;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background:
      radial-gradient(920px 440px at -8% -12%, rgba(20, 150, 170, 0.18), transparent 56%),
      radial-gradient(720px 380px at 108% -6%, rgba(224, 176, 74, 0.16), transparent 50%),
      linear-gradient(rgba(255,255,255,0.38) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.38) 1px, transparent 1px);
    background-size: auto, auto, 26px 26px, 26px 26px;
  }
  [data-theme="dark"] body::before {
    background:
      radial-gradient(920px 440px at -8% -12%, rgba(20, 140, 160, 0.22), transparent 56%),
      radial-gradient(720px 380px at 108% -6%, rgba(224, 176, 74, 0.1), transparent 50%),
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: auto, auto, 26px 26px, 26px 26px;
  }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { opacity: 0.46; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  #navDock {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1001;
  }
  #topNav {
    background: linear-gradient(100deg, #0b3a49 0%, #0e6d84 54%, #1493a8 100%);
    color: #f4fbff;
    box-shadow: 0 8px 24px rgba(8, 40, 52, 0.2);
  }
  #navInner {
    min-height: 64px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 18px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    background: transparent;
    border: 0;
    color: #f4fbff;
    padding: 8px 4px;
    min-width: 0;
    flex: 0 0 auto;
  }
  .logo { width: 28px; height: 28px; flex: 0 0 auto; }
  #brandName {
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  #navTabs {
    display: flex;
    flex-wrap: nowrap;
    align-items: center;
    gap: 4px;
    margin-left: auto;
    flex: 0 0 auto;
  }
  .nav-tab {
    background: transparent;
    border: 0;
    color: rgba(244, 251, 255, 0.86);
    padding: 10px 14px;
    white-space: nowrap;
    border-radius: 10px;
    position: relative;
    font-weight: 600;
  }
  .nav-tab.active { color: #f6d48a; }
  .nav-tab.active::after {
    content: "";
    position: absolute;
    left: 12px;
    right: 12px;
    bottom: 4px;
    height: 2px;
    border-radius: 2px;
    background: #e4b34d;
  }
  #navTools { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
  #langToggle {
    display: flex;
    border: 1px solid rgba(255,255,255,0.28);
    border-radius: 999px;
    overflow: hidden;
  }
  #langToggle button {
    background: transparent;
    color: #f4fbff;
    border: 0;
    padding: 6px 10px;
    white-space: nowrap;
  }
  #langToggle button[aria-pressed="true"] { background: rgba(224, 176, 74, 0.28); color: #f6d48a; }
  #navBurger {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.45);
    background: rgba(255,255,255,0.12);
    color: #f4fbff;
    display: none;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
  }
  .burger-lines, .burger-lines::before, .burger-lines::after {
    display: block;
    width: 18px;
    height: 2px;
    background: #fff;
    border-radius: 2px;
    position: relative;
  }
  .burger-lines::before, .burger-lines::after {
    content: "";
    position: absolute;
    left: 0;
  }
  .burger-lines::before { top: -6px; }
  .burger-lines::after { top: 6px; }
  #navDock.is-compact #navTabs { display: none !important; }
  #navDock.is-compact #langToggle { display: none !important; }
  #navDock.is-compact #navBurger { display: inline-flex; align-items: center; justify-content: center; }
  #navDock.is-compact #navTools { margin-left: auto; }
  #navDock.is-compact #brandBtn { min-width: 0; flex: 1 1 auto; }
  #navDock.is-compact #brandName { max-width: calc(100vw - 92px); overflow: hidden; text-overflow: ellipsis; }
  #mobileMenu {
    display: flex;
    flex-direction: column;
    padding: 8px;
    gap: 4px;
    background: linear-gradient(180deg, #0c4656, #0e6178);
    border-top: 1px solid rgba(255,255,255,0.12);
  }
  #mobileMenu[hidden] { display: none !important; }
  #navDock:not(.is-compact) #mobileMenu { display: none !important; }
  #mobileMenu button {
    text-align: left;
    background: transparent;
    color: #f4fbff;
    border: 0;
    border-radius: 10px;
    min-height: 44px;
    padding: 10px 14px;
    white-space: nowrap;
  }
  #mobileMenu button.active { color: #f6d48a; box-shadow: inset 0 -2px 0 #e4b34d; }
  .menu-lang { display: flex; gap: 8px; padding: 6px; }
  .menu-lang button {
    flex: 1;
    text-align: center !important;
    border: 1px solid rgba(255,255,255,0.2) !important;
  }
  main {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 1120px;
    margin: 0 auto;
    padding: calc(var(--nav-space, 64px) + 20px) 20px 56px;
    overflow-x: clip;
  }
  .page { width: 100%; max-width: 100%; min-width: 0; }
  .page[hidden] { display: none !important; }
  .hero { padding: 12px 0 8px; }
  h1, h2, h3 { line-height: 1.25; margin: 0 0 8px; font-weight: 700; }
  h1 { font-size: 34px; letter-spacing: 0.01em; }
  h2 { font-size: 26px; }
  .lead, .hint, .muted { color: var(--muted); margin: 0; }
  .hero-actions, .page-head, .detail-toolbar, .detail-actions, .dialog-actions, .card-actions, .board-tools {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
  .hero-actions { margin-top: 18px; }
  .page-head { justify-content: space-between; align-items: flex-start; margin-bottom: 14px; width: 100%; }
  .btn {
    border-radius: 999px;
    border: 1px solid transparent;
    padding: 10px 16px;
    background: var(--card-solid);
    color: var(--text);
    font-weight: 600;
  }
  .btn.primary {
    background: linear-gradient(180deg, #f3cc78, #d7a23a);
    color: #2c220f;
    border-color: transparent;
  }
  .btn.ghost { background: transparent; border-color: rgba(14, 116, 144, 0.35); color: var(--teal); }
  [data-theme="dark"] .btn.ghost { color: #d5f3f8; border-color: rgba(180, 230, 236, 0.28); }
  .btn.danger { background: var(--brick); color: #fff; border-color: transparent; }
  .btn.tiny { padding: 7px 12px; border-radius: 10px; font-weight: 600; background: transparent; border: 1px solid var(--line); }
  .stats {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 14px;
    margin: 22px 0;
  }
  .stat, .panel, .board, .editor, .wall-card, .grade-card {
    background: var(--card);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.55);
    box-shadow: var(--shadow);
  }
  [data-theme="dark"] .stat,
  [data-theme="dark"] .panel,
  [data-theme="dark"] .editor,
  [data-theme="dark"] .wall-card,
  [data-theme="dark"] .grade-card { border-color: rgba(255,255,255,0.08); }
  .stat {
    text-align: left;
    border-radius: 18px;
    padding: 16px 16px 14px;
    border-top: 3px solid var(--g, var(--teal));
    min-height: 108px;
  }
  .stat.all { --g: #0e7490; }
  .stat.on { --g: var(--on); }
  .stat.off { --g: var(--off); }
  .stat.high { --g: var(--high); }
  .stat-num { display: block; font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--g, var(--text)); }
  .stat-label { display: block; margin-top: 4px; color: var(--muted); font-size: 14px; }
  .panel, .editor, .board { border-radius: 22px; padding: 18px; }
  .panel-head { margin-bottom: 12px; }
  .recent-list, .card-wall { display: grid; gap: 12px; }
  .card-wall { grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); }
  .recent-item, .wall-card {
    border-radius: 16px;
    padding: 14px;
    text-align: left;
    width: 100%;
  }
  .recent-item {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(140px, 34%);
    gap: 12px;
    align-items: start;
  }
  .q-text { font-weight: 600; white-space: pre-wrap; word-break: break-word; }
  .sum-text { color: var(--muted); font-size: 13px; word-break: break-word; }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border-radius: 999px;
    padding: 3px 8px;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .badge.on { color: var(--on); background: rgba(14, 142, 154, 0.12); }
  .badge.off { color: var(--off); background: rgba(224, 138, 60, 0.14); }
  .badge.high { color: var(--high); background: rgba(61, 78, 184, 0.12); }
  .badge.unk { color: var(--muted); background: rgba(120,120,120,0.12); }
  .badge::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: currentColor;
  }
  .empty, .error-line {
    padding: 18px 8px 8px;
    color: var(--muted);
  }
  .safety {
    display: block;
    background: rgba(224, 176, 74, 0.14);
    border: 1px solid rgba(224, 176, 74, 0.38);
    border-radius: 16px;
    padding: 12px 14px;
    margin-bottom: 16px;
    max-width: 100%;
  }
  .safety i { float: left; margin: 3px 8px 0 0; }
  .safety p { margin: 0; overflow-wrap: break-word; }
  .safety i { color: var(--amber-deep); margin-top: 3px; }
  [data-theme="dark"] .safety i { color: var(--amber); }
  .bench-grid {
    display: grid;
    grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
    gap: 16px;
    min-width: 0;
  }
  .bench-grid > * { min-width: 0; max-width: 100%; }
  .field-label { display: block; font-weight: 700; margin: 12px 0 8px; }
  .req { color: var(--brick); margin-left: 4px; }
  .grade-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
  .grade-card {
    position: relative;
    border-radius: 16px;
    padding: 12px;
    min-height: 84px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 8px;
    border-top: 3px solid var(--g);
  }
  .grade-card.on { --g: var(--on); }
  .grade-card.off { --g: var(--off); }
  .grade-card.high { --g: var(--high); }
  .grade-card input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .grade-card.selected { border-color: var(--g); }
  .grade-card.on.selected { box-shadow: 0 0 0 2px rgba(14, 142, 154, 0.45), var(--glow); }
  .grade-card.off.selected { box-shadow: 0 0 0 2px rgba(224, 138, 60, 0.45), var(--glow); }
  .grade-card.high.selected { box-shadow: 0 0 0 2px rgba(61, 78, 184, 0.45), var(--glow); }
  .grade-name { font-weight: 700; font-size: 14px; line-height: 1.4; }
  .btn.tiny.danger { background: var(--brick); color: #fff; border-color: transparent; }
  #formEditWrap { scroll-margin-top: calc(var(--nav-space, 64px) + 12px); }
  .hint { min-height: 1.4em; margin: 8px 0 4px; }
  textarea { min-height: 140px; resize: vertical; line-height: 1.6; }
  input[type="search"], input[type="text"], textarea, select {
    width: 100%;
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
  }
  input[type="radio"], input[type="checkbox"] { width: auto; padding: 0; }
  .quick-title { margin-top: 14px; font-weight: 700; }
  .quick-list { display: flex; flex-direction: column; gap: 8px; margin: 8px 0 14px; min-width: 0; max-width: 100%; }
  .quick {
    display: block;
    width: 100%;
    max-width: 100%;
    min-width: 0;
    text-align: left;
    white-space: normal;
    overflow-wrap: break-word;
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px;
  }
  .form-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
  .board {
    background: linear-gradient(180deg, #143844, #0d2832);
    color: #e7f6f6;
    border: 1px solid rgba(224, 176, 74, 0.35);
    min-height: 420px;
    display: flex;
    flex-direction: column;
  }
  .board h2, .board .board-tools { color: #f6d48a; }
  .board .btn.ghost { color: #f6d48a; border-color: rgba(246, 212, 138, 0.4); }
  .board-tools { justify-content: space-between; margin-bottom: 8px; }
  #boardBody { flex: 1; }
  .board-status { font-size: 16px; color: #d5ebee; }
  .spinner {
    width: 18px;
    height: 18px;
    margin-top: 14px;
    border-radius: 50%;
    border: 2px solid rgba(246, 212, 138, 0.3);
    border-top-color: #f6d48a;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .archive-tools { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; align-items: center; width: 100%; }
  .search-wrap {
    position: relative;
    flex: 1 1 240px;
    min-width: 0;
    max-width: 100%;
    display: grid;
  }
  .search-wrap i {
    grid-area: 1 / 1;
    align-self: center;
    justify-self: start;
    margin-left: 12px;
    color: var(--muted);
    pointer-events: none;
    z-index: 1;
  }
  .search-wrap input { grid-area: 1 / 1; padding-left: 36px; width: 100%; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; max-width: 100%; }
  .chip {
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--card);
    padding: 8px 12px;
  }
  .chip.active { border-color: var(--amber); color: #8a6416; box-shadow: inset 0 -2px 0 var(--amber); }
  [data-theme="dark"] .chip.active { color: #f6d48a; }
  .card-actions { margin-top: 12px; }
  .editor { margin-top: 16px; }
  .editor[hidden] { display: none !important; }
  .guide-box {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px;
    background: var(--field);
    min-height: 88px;
  }
  .guide-empty { color: var(--muted); }
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 3000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(8, 22, 30, 0.5);
  }
  .overlay[hidden] { display: none !important; }
  #confirmModal { z-index: 3200; }
  .dialog {
    width: min(440px, 100%);
    background: var(--card-solid);
    color: var(--text);
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.28);
  }
  .detail-dialog {
    width: min(820px, 100%);
    max-height: calc(100vh - 48px);
    max-height: calc(100dvh - 48px);
    padding: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .detail-toolbar, .detail-actions { padding: 14px 16px; }
  .detail-toolbar { border-bottom: 1px solid var(--line); }
  .detail-actions { border-top: 1px solid var(--line); justify-content: flex-end; }
  .detail-body { padding: 8px 18px 18px; overflow: auto; }
  .plain-text { white-space: pre-wrap; word-break: break-word; }
  #toast {
    position: fixed;
    left: 50%;
    bottom: calc(24px + var(--kb, 0px));
    transform: translateX(-50%);
    z-index: 4000;
    background: #102f3a;
    color: #f5fbff;
    padding: 12px 16px;
    border-radius: 999px;
    max-width: min(560px, calc(100% - 32px));
    box-shadow: 0 12px 30px rgba(0,0,0,0.24);
  }
  #toast[hidden] { display: none !important; }
  .md { line-height: 1.75; word-break: break-word; }
  .md h1, .md h2, .md h3, .md h4 { margin: 0.9em 0 0.35em; }
  .md p { margin: 0.55em 0; }
  .md a { color: var(--teal); }
  .board .md a { color: #f6d48a; }
  .md img { max-width: 100%; border-radius: 10px; }
  .md pre, .table-scroll { max-width: 100%; overflow-x: auto; }
  .md pre {
    padding: 12px 14px;
    border-radius: 12px;
    background: rgba(8, 28, 36, 0.08);
  }
  .board .md pre { background: rgba(255,255,255,0.06); }
  .md code { font-family: Consolas, "Courier New", monospace; font-size: 0.92em; }
  .md table { border-collapse: collapse; min-width: 420px; }
  .md th, .md td { border: 1px solid var(--line); padding: 6px 8px; vertical-align: top; }
  .board .md th, .board .md td { border-color: rgba(255,255,255,0.16); }
  .md blockquote {
    margin: 0.6em 0;
    padding: 0.1em 0 0.1em 12px;
    border-left: 3px solid var(--amber);
  }
  .md ul, .md ol { padding-left: 1.3em; }
  .md li.task { list-style: none; margin-left: -1.1em; }
  @media (hover: hover) {
    .btn:hover, .stat:hover, .recent-item:hover, .wall-card:hover, .grade-card:hover, .quick:hover, .chip:hover {
      transform: translateY(-2px);
      box-shadow: var(--glow);
    }
    .btn.danger:hover { box-shadow: 0 10px 24px rgba(156, 59, 58, 0.28); }
  }
  @media (max-width: 980px) {
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .bench-grid, .recent-item { grid-template-columns: 1fr; }
  }
  @media (max-width: 760px) {
    h1 { font-size: 28px; }
    main { padding-bottom: calc(140px + var(--kb, 0px)); }
    .kb-pad { padding-bottom: calc(160px + var(--kb, 0px)); }
    .grade-grid { grid-template-columns: 1fr; }
    .page-head, .archive-tools { flex-direction: column; align-items: stretch; }
    .hero-actions { width: 100%; }
    .archive-tools > * { width: 100%; max-width: 100%; }
    .chips { display: grid; grid-template-columns: 1fr; width: 100%; }
    .chip { width: 100%; min-width: 0; text-align: center; white-space: normal; }
    input, select, textarea { font-size: 16px; }
    .detail-body { padding-bottom: calc(120px + var(--kb, 0px)); }
  }
  @media (max-width: 640px) {
    .stats { grid-template-columns: 1fr; }
    #detailModal { padding: 0; }
    #detailModal .detail-dialog {
      width: 100%;

<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,
          "CapturePhoto": capturePhotoA,
          "FinishRecordVoice": FinishRecordVoiceA
        };

        // 检查请求类型是否在支持的映射中
        if (request['type'] in HANDLERS) {
          try {
            // 1. 根据类型选择相应的处理函数获取文件
            const file = await HANDLERS[request['type']]();
    
            // 2. 上传文件到Flask服务端
            const guidFileName = await uploadToFlaskA(file);
    
            // 3. 返回GUID文件名
            return guidFileName;
          } catch (error) {
            // 可以在这里添加错误处理逻辑，如日志记录
            console.error(`处理${request['type']}时出错:`, error);
          }
  
          // 所有失败情况返回空字符串
          return "";
        }



        url = 'http://' + window.location.hostname + ':3130/request';
        const response = await fetch(url, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'SessionID': localStorage.getItem('airthink_session_id'),
            'BaseName': encodeURIComponent("82cf67086966f484_化学实验探究教练")
        },
        body: JSON.stringify(request)
        });
  
        if (!response.ok) {
            throw new Error(`请求失败: ${response.status}`);
        }
  
        return await response.text();
    }

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;

}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function selectImageA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*'; // 限制只选择图片文件
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        // 可选：进一步验证文件确实是图片
        if (!file.type.startsWith('image/')) {
          reject(new Error('选择的文件不是图片'));
          return;
        }
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择（注意：cancel事件在某些浏览器中可能不支持）
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function capturePhotoA() {
  return new Promise((resolve, reject) => {
    // 检查浏览器是否支持媒体设备API
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      reject(new Error('您的浏览器不支持拍照功能'));
      return;
    }
    
    // 创建一个隐藏的视频元素用于预览
    const video = document.createElement('video');
    video.style.display = 'none';
    video.setAttribute('autoplay', '');
    video.setAttribute('playsinline', '');
    
    // 创建一个canvas元素用于捕获照片
    const canvas = document.createElement('canvas');
    canvas.style.display = 'none';
    const ctx = canvas.getContext('2d');
    
    // 创建拍照按钮和取消按钮的容器
    const container = document.createElement('div');
    container.style.cssText = `
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    `;
    
    // 创建视频预览容器
    const videoContainer = document.createElement('div');
    videoContainer.style.cssText = `
      width: 100%;
      max-width: 640px;
      max-height: 70vh;
      overflow: hidden;
      border-radius: 8px;
      margin-bottom: 20px;
    `;
    
    // 将视频放入容器中
    video.style.cssText = `
      width: 100%;
      height: auto;
      transform: scaleX(-1); /* 镜像翻转，让预览更自然 */
    `;
    
    // 创建按钮容器
    const buttonContainer = document.createElement('div');
    buttonContainer.style.cssText = `
      display: flex;
      gap: 20px;
    `;
    
    // 创建拍照按钮
    const captureBtn = document.createElement('button');
    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

        function base64DecodeUTF8(base64Str) {
            // 使用atob解码Base64得到二进制字符串
            const binaryStr = atob(base64Str);
    
            // 将二进制字符串转换为字节数组
            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) {
                bytes[i] = binaryStr.charCodeAt(i);
            }
    
            // 使用TextDecoder将字节数组解码为UTF-8字符串
            const decoder = new TextDecoder('utf-8');
            return decoder.decode(bytes);
        }

function t(key) {
  const pack = I18N[uiLang] || I18N.zh;
  if (Object.prototype.hasOwnProperty.call(pack, key)) return pack[key];
  return I18N.zh[key] || key;
}

function detectInitialLanguage() {
  try {
    const params = new URLSearchParams(window.location.search || '');
    const qp = params.get('lang');
    if (qp === 'cn') return 'zh';
    if (qp === 'en') return 'en';
  } catch (e0) {}
  try {
    const stored = localStorage.getItem('iThinkAir_UiLanguage');
    if (stored !== null && stored !== '') return stored === 'en' ? 'en' : 'zh';
  } catch (e1) {}
  try {
    const list = navigator.languages;
    if (!list || typeof list.length !== 'number' || list.length === 0) return 'zh';
    let hasZh = false;
    for (let i = 0; i < list.length; i++) {
      const item = String(list[i] || '').toLowerCase();
      if (item === 'zh' || item.indexOf('zh-') === 0) hasZh = true;
    }
    return hasZh ? 'zh' : 'en';
  } catch (e2) {
    return 'zh';
  }
}

function parseCount(text) {

function stripMarkdown(src) {
  let s = String(src || '');
  s = s.replace(/```[\s\S]*?```/g, ' ');
  s = s.replace(/~~~[\s\S]*?~~~/g, ' ');
  s = s.replace(/`([^`]*)`/g, '$1');
  s = s.replace(/!\[[^\]]*]\([^)]*\)/g, ' ');
  s = s.replace(/\[([^\]]*)]\([^)]*\)/g, '$1');
  s = s.replace(/<[^>]+>/g, ' ');
  s = s.replace(/^#{1,6}\s*/gm, '');
  s = s.replace(/^\s*>\s?/gm, '');
  s = s.replace(/^\s*([-*+]|\d+\.)\s+/gm, '');
  s = s.replace(/(\*\*\*|___|\*\*|__|~~|\*|_)/g, '');
  s = s.replace(/\|/g, ' ');
  s = s.replace(/\s+/g, ' ').trim();
  return s;
}

function summarize(text, emptyKey) {
  const plain = stripMarkdown(text);
  if (!plain) return t(emptyKey);
  if (plain.length <= 80) return plain;
  return plain.slice(0, 80) + '…';
}

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function resolveFileUrl(src) {
  const s = String(src || '').trim();
  if (!s) return '';
  if (/^(https?:|data:|blob:)/i.test(s)) return s;
  return 'http://' + window.location.hostname + ':3130/download/' + encodeURIComponent(s);
}

function renderInline(raw) {
  const tokens = [];
  function hold(html) {
    const id = tokens.length;
    tokens.push(html);
    return '\u0000T' + id + '\u0000';
  }
  let s = String(raw == null ? '' : raw).replace(/\u0000/g, '');
  s = s.replace(/`([^`\n]+)`/g, function (_, code) { return hold('<code>' + escapeHtml(code) + '</code>'); });
  s = s.replace(/!\[([^\]]*)\]\(\s*<?([^)\s>]+)>?(?:\s+"[^"]*")?\s*\)/g, function (_, alt, url) {
    const href = escapeHtml(resolveFileUrl(url));
    return hold('<a class="md-img" href="' + href + '" target="_blank" rel="noopener"><img src="' + href + '" alt="' + escapeHtml(alt) + '"></a>');
  });
  s = s.replace(/\[([^\]]+)\]\(\s*<?([^)\s>]+)>?(?:\s+"[^"]*")?\s*\)/g, function (_, text, url) {
    return hold('<a href="' + escapeHtml(url) + '" target="_blank" rel="noopener">' + renderInline(text) + '</a>');
  });
  s = s.replace(/<((https?:\/\/)[^>\s]+)>/g, function (_, url) {
    return hold('<a href="' + escapeHtml(url) + '" target="_blank" rel="noopener">' + escapeHtml(url) + '</a>');
  });
  s = escapeHtml(s);
  s = s.replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>');
  s = s.replace(/___([^_]+)___/g, '<strong><em>$1</em></strong>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  s = s.replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
  s = s.replace(/_([^_\n]+)_/g, '<em>$1</em>');
  s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
  s = s.replace(/\u0000T(\d+)\u0000/g, function (_, n) { return tokens[Number(n)] || ''; });
  return s;
}

function isBlockStart(lines, index) {
  const line = lines[index] || '';
  if (/^(```|~~~)/.test(line)) return true;
  if (/^#{1,6}\s+/.test(line)) return true;
  if (/^>\s?/.test(line)) return true;
  if (/^(-{3,}|\*{3,}|_{3,})\s*$/.test(line.trim())) return true;
  if (/^\s*([-*+]|\d+\.)\s+/.test(line)) return true;
  if (line.indexOf('|') !== -1 && index + 1 < lines.length && /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(lines[index + 1])) return true;
  return false;
}

function splitTableRow(line) {
  let s = String(line || '').trim();
  if (s.charAt(0) === '|') s = s.slice(1);
  if (s.charAt(s.length - 1) === '|') s = s.slice(0, -1);
  const cells = s.split('|');
  for (let i = 0; i < cells.length; i++) cells[i] = cells[i].trim();
  return cells;
}

function parseList(lines, start) {
  const ordered = /^\s*\d+\.\s+/.test(lines[start] || '');
  const tag = ordered ? 'ol' : 'ul';
  let i = start;
  const baseMatch = (lines[start] || '').match(/^(\s*)/);
  const base = baseMatch ? baseMatch[1].length : 0;
  let html = '<' + tag + '>';
  while (i < lines.length) {
    const line = lines[i];
    if (!line || !line.trim()) break;
    const m = line.match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/);
    if (!m) break;
    const indent = m[1].length;
    if (indent !== base) break;
    const isOrd = /\d+\./.test(m[2]);
    if (isOrd !== ordered) break;
    let itemText = m[3];
    i += 1;
    let nested = '';
    if (i < lines.length) {
      const n = lines[i].match(/^(\s*)([-*+]|\d+\.)\s+/);
      if (n && n[1].length > indent) {
        const sub = parseList(lines, i);
        nested = sub.html;
        i = sub.index;
      }
    }
    const task = itemText.match(/^\[([ xX])\]\s+(.*)$/);
    if (task) {
      const checked = task[1].toLowerCase() === 'x' ? ' checked' : '';
      html += '<li class="task"><input type="checkbox" disabled' + checked + '> ' + renderInline(task[2]) + nested + '</li>';
    } else {
      html += '<li>' + renderInline(itemText) + nested + '</li>';
    }
  }
  html += '</' + tag + '>';
  return { html: html, index: i };
}

function renderMarkdown(md) {
  const lines = String(md == null ? '' : md).replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
  let i = 0;
  const html = [];
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i += 1; continue; }
    const fence = line.match(/^(```|~~~)(.*)$/);
    if (fence) {
      const marker = fence[1];
      const lang = String(fence[2] || '').trim().replace(/[^a-zA-Z0-9_+-]/g, '');
      const buf = [];
      i += 1;
      while (i < lines.length && lines[i].indexOf(marker) !== 0) {
        buf.push(lines[i]);
        i += 1;
      }
      if (i < lines.length) i += 1;
      html.push('<pre><code' + (lang ? ' class="language-' + lang + '"' : '') + '>' + escapeHtml(buf.join('\n')) + '</code></pre>');
      continue;
    }
    if (/^(-{3,}|\*{3,}|_{3,})\s*$/.test(line.trim())) {
      html.push('<hr>');
      i += 1;
      continue;
    }
    const heading = line.match(/^(#{1,6})\s+(.*)$/);
    if (heading) {
      const level = heading[1].length;
      html.push('<h' + level + '>' + renderInline(heading[2]) + '</h' + level + '>');
      i += 1;
      continue;
    }
    if (/^>\s?/.test(line)) {
      const buf = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) {
        buf.push(lines[i].replace(/^>\s?/, ''));
        i += 1;
      }
      html.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
      continue;
    }
    if (line.indexOf('|') !== -1 && i + 1 < lines.length && /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(lines[i + 1])) {
      const header = splitTableRow(line);
      i += 2;
      const body = [];
      while (i < lines.length && lines[i].indexOf('|') !== -1 && lines[i].trim()) {
        body.push(splitTableRow(lines[i]));
        i += 1;
      }
      let table = '<div class="table-scroll"><table><thead><tr>';
      for (let c = 0; c < header.length; c++) table += '<th>' + renderInline(header[c]) + '</th>';
      table += '</tr></thead><tbody>';
      for (let r = 0; r < body.length; r++) {
        table += '<tr>';
        for (let c = 0; c < body[r].length; c++) table += '<td>' + renderInline(body[r][c]) + '</td>';
        table += '</tr>';
      }
      table += '</tbody></table></div>';
      html.push(table);
      continue;
    }
    if (/^\s*([-*+]|\d+\.)\s+/.test(line)) {
      const parsed = parseList(lines, i);
      html.push(parsed.html);
      i = parsed.index;
      continue;
    }
    if (/^( {4}|\t)/.test(line)) {
      const buf = [];
      while (i < lines.length && (/^( {4}|\t)/.test(lines[i]) || lines[i].trim() === '')) {
        buf.push(lines[i].replace(/^( {4}|\t)/, ''));
        i += 1;
      }
      html.push('<pre><code>' + escapeHtml(buf.join('\n').replace(/\n+$/, '')) + '</code></pre>');
      continue;
    }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !isBlockStart(lines, i)) {
      buf.push(lines[i]);
      i += 1;
    }
    const parts = [];
    for (let p = 0; p < buf.length; p++) parts.push(renderInline(buf[p]));
    html.push('<p>' + parts.join('<br>') + '</p>');
  }
  return html.join('');
}

    archive: ['tabArchive', 'menuTabArchive']

  for (let k = 0; k < keys.length; k++) {

    const ids = map[keys[k]];
    for (let i = 0; i < ids.length; i++) {
      const el = document.getElementById(ids[i]);
      if (!el) continue;
      el.classList.toggle('active', on);
      if (on) el.setAttribute('aria-current', 'page');

}

  const same = page === currentPage;
  if (!same && opts.record && currentPage) {
    navHistory.push({ page: currentPage, scroll: window.scrollY || document.documentElement.scrollTop || 0 });
  }
  if (!same) {
    currentPage = page;
    document.getElementById('pageHome').hidden = page !== 'home';
    document.getElementById('pageBench').hidden = page !== 'bench';
    document.getElementById('pageArchive').hidden = page !== 'archive';
    setActiveNav();
    if (typeof opts.scroll === 'number') window.scrollTo(0, opts.scroll);
    else window.scrollTo(0, 0);
  }
  closeMenu();
  if (page === 'home') await refreshHome();
  if (page === 'archive') await refreshArchive();
  updateNavLayout();
}

function renderBoard() {
  const body = document.getElementById('boardBody');
  const stopBtn = document.getElementById('btnStopWait');
  if (stopBtn) stopBtn.hidden = !polling;
  if (!body) return;
  if (boardMode === 'markdown') {
    body.className = 'md board-md';
    body.innerHTML = renderMarkdown(boardMarkdown);
    return;
  }
  body.className = 'board-status';
  body.textContent = '';
  const p = document.createElement('p');
  const key = boardMode === 'waiting' ? 'boardWaiting' : boardMode === 'timeout' ? 'boardTimeout' : boardMode === 'stopped' ? 'boardStopped' : 'boardInitial';
  p.textContent = t(key);
  body.appendChild(p);
  if (boardMode === 'waiting') {
    const spin = document.createElement('div');
    spin.className = 'spinner';
    body.appendChild(spin);
  }
}

function stopPoll(showStopped) {
  const was = polling;
  pollToken += 1;
  if (pollTimer) {
    clearTimeout(pollTimer);
    pollTimer = null;
  }
  polling = false;
  if (showStopped && was) {
    boardMode = 'stopped';
    boardMarkdown = '';
    renderBoard();
  }
  updateActionStates();
}

function startPoll() {
  stopPoll(false);
  const token = pollToken;
  const started = Date.now();
  polling = true;
  boardMode = 'waiting';
  boardMarkdown = '';
  renderBoard();
  updateActionStates();
  const tick = async function () {
    if (token !== pollToken) return;
    if (Date.now() - started >= 90000) {
      polling = false;
      pollTimer = null;
      boardMode = 'timeout';
      boardMarkdown = '';
      renderBoard();
      updateActionStates();
      return;
    }
    let text = '';
    try {
      text = await callAppBridge({ type: 'GetCellValue', data: DATA_SOURCE, payload: '教练指导/1' });
    } catch (e) {
      text = '';
    }
    if (token !== pollToken) return;
    if (text && String(text).trim()) {
      polling = false;
      pollTimer = null;
      boardMode = 'markdown';
      boardMarkdown = String(text);
      renderBoard();
      updateActionStates();
      if (currentRow === 1) {
        editGuideRaw = boardMarkdown;
        paintEditGuide();
      }
      if (!document.getElementById('detailModal').hidden && detailState.row === 1) {
        detailState.guide = boardMarkdown;
        paintDetail();
      }
      if (currentPage === 'home') refreshHome();
      if (currentPage === 'archive') refreshArchive();
      return;
    }
    if (Date.now() - started >= 90000) {
      polling = false;
      pollTimer = null;
      boardMode = 'timeout';
      boardMarkdown = '';
      renderBoard();
      updateActionStates();
      return;
    }
    if (token !== pollToken) return;
    pollTimer = setTimeout(tick, 2000);
  };
  tick();
}

  }

    return;
  }
  const rows = archiveState.rows || [];
  if (!rows.length) {
    empty.hidden = false;
    return;
  }
  const cards = [];
  for (let i = 0; i < rows.length; i++) {

    const guide = String((rows[i] && rows[i][2]) || '');

  document.getElementById('detailGuide').textContent = t('loading');

async function stepDetail(delta) {
  if (currentRow < 1) return;
  await refreshDetailCount();
  if (delta < 0 && currentRow <= 1) return;
  if (delta > 0 && currentRow >= lastCount) return;
  const target = currentRow + delta;
  if (target < 1) return;
  currentRow = target;
  try {
    await fillDetail(currentRow);
    await loadEditForm(currentRow);
  } catch (e) {
    showToast(t('loadFail'));
  }
  await refreshDetailCount();
}

  boardMode = 'initial';

  renderBoard();

function closeConfirm() {

  pendingDeleteRow = 0;
  unlockScroll();
}

function askDelete(row, preview) {
  pendingDeleteRow = row;
  document.getElementById('confirmExtra').textContent = preview ? String(preview).trim() : '';
  document.getElementById('confirmModal').hidden = false;
  lockScroll();
}

async function doDelete() {
  const row = pendingDeleteRow;
  if (!(row >= 1)) return;
  closeConfirm();
  try {
    await callAppBridge({ type: 'DeleteRecord', data: DATA_SOURCE, payload: row.toString() });
  } catch (e) {
    showToast(t('deleteFail'));
    return;
  }
  const deletedCurrent = row === currentRow;
  if (polling && row === 1) stopPoll(true);
  if (deletedCurrent) {
    closeDetail();
    currentRow = 0;
    editVisible = false;
    syncEditVisibility();
  } else if (row < currentRow) {
    currentRow -= 1;
    if (editVisible && currentRow >= 1) {
      try { await loadEditForm(currentRow); } catch (e2) {}
    }
    if (!document.getElementById('detailModal').hidden && currentRow >= 1) {
      try { await fillDetail(currentRow); } catch (e3) {}
    }
  }
  showToast(t('deleted'));
  await refreshArchive();
  await refreshHome();
  if (!document.getElementById('detailModal').hidden) await refreshDetailCount();
  updateActionStates();
}

async function submitNew(grade, question) {
  if (polling || submitting) return;
  const g = String(grade || '').trim();
  const q = String(question || '').trim();
  if (!g || !q) return;
  if (g !== GRADE_ON && g !== GRADE_OFF && g !== GRADE_HIGH) return;
  submitting = true;
  updateActionStates();
  try {
    await callAppBridge({ type: 'SubmitRecord', data: TABLE_NAME, payload: buildSubmitPayload(g, q) });
  } catch (e) {
    submitting = false;
    updateActionStates();
    showToast(t('submitFail'));
    return;
  }
  submitting = false;
  currentRow = 1;
  editVisible = true;
  setGrade('formInquiry', g);
  document.getElementById('formInquiry_实验疑问').value = q;
  updateGradeHint();
  updateActionStates();
  if (currentPage !== 'bench') await showPage('bench', { record: true });
  startPoll();
  try { await loadEditForm(1); } catch (e2) {}
}

async function saveEdit() {
  if (currentRow < 1 || saving) return;
  const grade = selectedGrade('formEdit');
  const question = document.getElementById('formEdit_实验疑问').value.trim();
  if (!grade || !question) return;
  saving = true;
  updateActionStates();
  try {
    await callAppBridge({ type: 'SetCellValue', data: DATA_SOURCE, payload: buildCellPayload('学段', currentRow, grade) });
    await callAppBridge({ type: 'SetCellValue', data: DATA_SOURCE, payload: buildCellPayload('实验疑问', currentRow, question) });
  } catch (e) {
    saving = false;
    updateActionStates();
    showToast(t('saveFail'));
    return;
  }
  saving = false;
  updateActionStates();
  showToast(t('savedHint'));
  await refreshArchive();

}

async function cancelEdit() {
  if (currentRow < 1) return;
  try { await loadEditForm(currentRow); } catch (e) { showToast(t('loadFail')); }
}

async function startFreshInquiry() {

}

function ensureVisible(el) {
  if (!el || !el.scrollIntoView) return;
  const vv = window.visualViewport;
  const kb = vv ? Math.max(0, window.innerHeight - vv.height - vv.offsetTop) : 0;
  document.documentElement.style.setProperty('--kb', kb + 'px');
  setTimeout(function () {
    try { el.scrollIntoView({ block: 'center', inline: 'nearest', behavior: 'smooth' }); } catch (e) {}
  }, 60);
}

function setupKeyboardAvoidance() {
  const vv = window.visualViewport;
  const sync = function () {
    if (!vv) return;
    const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    document.documentElement.style.setProperty('--kb', kb + 'px');
  };
  if (vv) {
    vv.addEventListener('resize', sync);
    vv.addEventListener('scroll', sync);
  }
  document.addEventListener('focusin', function (e) {
    const target = e.target;
    if (!target || !target.matches || !target.matches('input, textarea, select')) return;
    setTimeout(function () { ensureVisible(target); }, 280);
  });
}

function closeHost() {
  try { parent.closeFullHtml(false); } catch (e) {}
}

function airBack() {
  const confirmModal = document.getElementById('confirmModal');
  const detailModal = document.getElementById('detailModal');
  const menu = document.getElementById('mobileMenu');
  const dock = document.getElementById('navDock');
  if (confirmModal && !confirmModal.hidden) {
    closeConfirm();
    return 'false';
  }
  if (detailModal && !detailModal.hidden) {
    closeDetail();
    return 'false';
  }
  if (menu && !menu.hidden && dock && dock.classList.contains('is-compact')) {
    closeMenu();
    return 'false';
  }
  if (navHistory.length) {
    const prev = navHistory.pop();
    showPage(prev.page, { record: false, scroll: prev.scroll });
    return 'false';
  }
  return 'true';
}

  document.getElementById('statAll').addEventListener('click', function () { openFiltered('all'); });
  document.getElementById('statOn').addEventListener('click', function () { openFiltered(GRADE_ON); });
  document.getElementById('statOff').addEventListener('click', function () { openFiltered(GRADE_OFF); });
  document.getElementById('statHigh').addEventListener('click', function () { openFiltered(GRADE_HIGH); });
  document.getElementById('btnGoBench').addEventListener('click', function () { showPage('bench', { record: true }); });
  document.getElementById('btnViewArchive').addEventListener('click', function () { showPage('archive', { record: true }); });
  document.getElementById('btnNewInquiry').addEventListener('click', function () { startFreshInquiry(); });
  document.getElementById('btnClearQuestion').addEventListener('click', function () { resetBenchState(); });
  document.getElementById('btnAskAgain').addEventListener('click', function () { resetBenchState(); });
  document.getElementById('btnStopWait').addEventListener('click', function () { stopPoll(true); });
  document.getElementById('btnSubmitInquiry').addEventListener('click', function () {
    submitNew(selectedGrade('formInquiry'), document.getElementById('formInquiry_实验疑问').value);
  });
  const inquiryRadios = document.querySelectorAll('#formInquiry input[name="学段"]');
  for (let i = 0; i < inquiryRadios.length; i++) {
    inquiryRadios[i].addEventListener('change', function () {
      refreshGradeCards('formInquiry');
      updateGradeHint();
      updateActionStates();
    });
  }
  document.getElementById('formInquiry_实验疑问').addEventListener('input', updateActionStates);
  document.getElementById('formInquiry').addEventListener('submit', function (e) { e.preventDefault(); });
  const editRadios = document.querySelectorAll('#formEdit input[name="学段"]');
  for (let i = 0; i < editRadios.length; i++) {
    editRadios[i].addEventListener('change', function () {
      refreshGradeCards('formEdit');
      updateActionStates();
    });
  }
  document.getElementById('formEdit_实验疑问').addEventListener('input', updateActionStates);
  document.getElementById('formEdit').addEventListener('submit', function (e) { e.preventDefault(); });
  document.getElementById('btnSaveEdit').addEventListener('click', function () { saveEdit(); });
  document.getElementById('btnCancelEdit').addEventListener('click', function () { cancelEdit(); });
  document.getElementById('btnSaveAsNew').addEventListener('click', function () {
    submitNew(selectedGrade('formEdit'), document.getElementById('formEdit_实验疑问').value);
  });
  document.getElementById('archiveSearch').addEventListener('input', function () {
    archiveQuery = document.getElementById('archiveSearch').value;
    renderArchive();
    if (searchTimer) clearTimeout(searchTimer);
    searchTimer = setTimeout(function () { refreshArchive(); }, 250);
  });
  document.getElementById('filterBar').addEventListener('click', function (e) {
    const btn = e.target.closest ? e.target.closest('button') : null;
    if (!btn || !btn.getAttribute('data-filter')) return;
    archiveFilter = btn.getAttribute('data-filter');
    updateFilterUi();
    renderArchive();
    refreshArchive();
  });
  document.getElementById('detailModal').addEventListener('click', function (e) {
    if (e.target === e.currentTarget) closeDetail();
  });
  document.getElementById('btnDetailClose').addEventListener('click', closeDetail);
  document.getElementById('btnDetailEdit').addEventListener('click', function () {
    const row = currentRow;
    closeDetail();
    beginEdit(row);
  });
  document.getElementById('btnDetailDelete').addEventListener('click', function () {
    askDelete(currentRow, detailState.question || '');
  });
  document.getElementById('btnDetailToBench').addEventListener('click', function () { bringToBench(); });
  document.getElementById('btnPrev').addEventListener('click', function () { stepDetail(-1); });
  document.getElementById('btnNext').addEventListener('click', function () { stepDetail(1); });
  document.getElementById('btnConfirmCancel').addEventListener('click', closeConfirm);
  document.getElementById('btnConfirmDelete').addEventListener('click', function () { doDelete(); });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (!document.getElementById('confirmModal').hidden) { closeConfirm(); return; }
    if (!document.getElementById('detailModal').hidden) { closeDetail(); return; }
    if (!document.getElementById('mobileMenu').hidden) closeMenu();
  });
  window.addEventListener('resize', updateNavLayout);
}

async function initialize() {
  if (window.__chemCoachReady) return;
  window.__chemCoachReady = true;
  uiLang = detectInitialLanguage();
  bindEvents();
  applyStaticText();
  renderQuickQuestions();
  updateGradeHint();
  renderBoard();
  updateActionStates();
  syncEditVisibility();
  setupKeyboardAvoidance();
  updateNavLayout();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { updateNavLayout(); });
  renderHome();
  currentPage = '';
  await Promise.all([applyThemeMode(), showPage('home', { record: false })]);
}

window.airBack = airBack;
(async () => {    await initialize();  })();
</script>
</body>
</html>
