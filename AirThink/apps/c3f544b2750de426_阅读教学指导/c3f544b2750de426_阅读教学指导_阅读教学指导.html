<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>阅读教学指导</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  :root {
    --paper: #f3ead8;
    --paper-2: #e7dcc6;
    --sheet: #fffaf2;
    --ink: #2a2218;
    --soft: #6d6256;
    --line: #e3d5c2;
    --line-strong: #d2c2ab;
    --field: #fffdf8;
    --nav: #1b3a5a;
    --nav-2: #16324f;
    --cinnabar: #b64032;
    --cinnabar-deep: #8d3126;
    --pine: #2d6a4f;
    --indigo: #2c3d78;
    --purple: #6d2e5c;
    --explain: #1b3a5a;
    --shadow: 0 10px 24px rgba(62, 42, 18, 0.08);
    --nav-h: 64px;
    --kb: 0px;
    --radius: 12px;
    color-scheme: light;
  }
  [data-theme="dark"] {
    --paper: #14110e;
    --paper-2: #1c1814;
    --sheet: #262119;
    --ink: #f3eadf;
    --soft: #cbbba4;
    --line: rgba(243, 234, 223, 0.14);
    --line-strong: rgba(243, 234, 223, 0.28);
    --field: #1c1814;
    --nav: #0e2438;
    --nav-2: #0b1c2c;
    --cinnabar: #e07a6c;
    --cinnabar-deep: #c45b4e;
    --pine: #7dcea5;
    --indigo: #9aace8;
    --purple: #e0a0cc;
    --explain: #8fb4dc;
    --shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  input, select, textarea { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    min-height: 100vh;
    color: var(--ink);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    font-size: 16px;
    line-height: 1.6;
    background:
      radial-gradient(1100px 420px at 8% -10%, rgba(255, 255, 255, 0.55), transparent 55%),
      linear-gradient(180deg, var(--paper) 0%, var(--paper-2) 100%);
    padding-top: calc(var(--nav-h) + env(safe-area-inset-top));
  }
  [data-theme="dark"] body {
    background:
      radial-gradient(900px 380px at 0% 0%, rgba(143, 180, 220, 0.08), transparent 46%),
      linear-gradient(180deg, #1a1612 0%, #100e0c 100%);
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: 0.48; }
  h1, h2, h3, .serif { font-family: "Songti SC", "STSong", "SimSun", "Noto Serif SC", serif; font-weight: 600; }
  h1 { font-size: 34px; line-height: 1.25; margin: 0; letter-spacing: 0.04em; }
  h2 { font-size: 22px; margin: 0; }
  p { margin: 0; }
  [hidden] { display: none !important; }
  #appHeader {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 1001;
    padding-top: env(safe-area-inset-top);
    background: var(--nav);
    color: #f6f1e6;
  }
  #topNav {
    height: var(--nav-h);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 12px 0 14px;
    background: var(--nav);
    color: #f6f1e6;
  }
  #navBrand {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    flex: 1 1 auto;
    border: 0;
    background: transparent;
    color: #f6f1e6;
    padding: 6px 4px;
    text-align: left;
  }
  .logo-mark {
    position: relative;
    width: 34px;
    height: 34px;
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(246, 241, 230, 0.35);
    border-radius: 8px;
    background: rgba(255, 250, 242, 0.08);
  }
  .logo-mark .fa-book-open { font-size: 16px; }
  .logo-mark .fa-leaf {
    position: absolute;
    right: -3px;
    top: -4px;
    font-size: 11px;
    color: #d5e7cf;
  }
  #navAppName {
    font-family: "Songti SC", "STSong", "SimSun", serif;
    font-size: 18px;
    letter-spacing: 0.06em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #navTabs {
    display: flex;
    flex-wrap: nowrap;
    gap: 4px;
    flex: 0 0 auto;
    align-items: center;
  }
  #navTabs button, #mobileMenu button.menu-tab {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    border: 0;
    background: transparent;
    color: #f6f1e6;
    border-radius: 999px;
    padding: 8px 12px;
  }
  #navTabs button.is-active {
    background: rgba(255, 250, 242, 0.14);
    box-shadow: inset 0 -2px 0 #e7b2a8;
  }
  .nav-tools {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-left: auto;
    flex: 0 0 auto;
  }
  #langToggle {
    border: 1px solid rgba(246, 241, 230, 0.35);
    background: transparent;
    color: #f6f1e6;
    border-radius: 999px;
    padding: 6px 10px;
    letter-spacing: 0.04em;
  }
  #langToggle .is-on { color: #fff; font-weight: 700; }
  #langToggle .is-off { opacity: 0.55; }
  #hamburgerBtn {
    display: none;
    width: 40px;
    height: 40px;
    border: 0;
    border-radius: 10px;
    background: rgba(255, 250, 242, 0.1);
    color: #f6f1e6;
    align-items: center;
    justify-content: center;
  }
  #hamburgerBtn.is-shown { display: inline-flex; }
  #navTabs.nav-tabs-hidden { display: none !important; }
  #langToggle.is-hidden { display: none !important; }
  #mobileMenu {
    display: none;
    position: absolute;
    left: 0; right: 0; top: 100%;
    background: var(--nav-2);
    color: #f6f1e6;
    padding: 8px;
    box-shadow: 0 16px 28px rgba(0, 0, 0, 0.22);
  }
  #mobileMenu.is-open { display: block; }
  #mobileMenu .menu-tab {
    display: flex;
    width: 100%;
    border-radius: 10px;
    text-align: left;
    padding: 12px;
  }
  #mobileMenu .menu-tab.is-active { background: rgba(255, 250, 242, 0.12); }
  .mobile-lang {
    display: flex;
    gap: 8px;
    padding: 8px 4px 4px;
  }
  .mobile-lang button {
    flex: 1;
    border-radius: 10px;
    border: 1px solid rgba(246, 241, 230, 0.3);
    background: transparent;
    color: #f6f1e6;
    padding: 10px;
  }
  .mobile-lang button.is-on { background: rgba(255, 250, 242, 0.16); }
  .count-pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 22px;
    height: 20px;
    padding: 0 6px;
    border-radius: 999px;
    background: #f6f1e6;
    color: var(--nav);
    font-style: normal;
    font-size: 12px;
    font-weight: 700;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  main {
    width: min(1120px, calc(100% - 28px));
    margin: 18px auto 0;
  }
  .page-head {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: flex-end;
    margin-bottom: 16px;
  }
  .page-head p, .lede { color: var(--soft); margin-top: 8px; max-width: 68ch; }
  .head-actions, .btn-row, .dialog-actions, .card-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .sheet, .stat-card, .scene-card, .lib-card, .recent-card, .empty-state {
    background: var(--sheet);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .hero {
    padding: 28px 26px 24px;
    position: relative;
    overflow: hidden;
  }
  .hero::before, .panel::before {
    content: "";
    position: absolute;
    left: 22px;
    top: 0;
    width: 42px;
    height: 7px;
    border-radius: 0 0 5px 5px;
    background: var(--cinnabar);
  }
  .hero h1 { margin-top: 8px; }
  .btn {
    border-radius: 999px;
    border: 1px solid var(--line-strong);
    background: var(--sheet);
    color: var(--ink);
    padding: 9px 16px;
    line-height: 1.3;
  }
  .btn-primary {
    background: var(--cinnabar);
    border-color: var(--cinnabar-deep);
    color: #fffaf6;
    font-weight: 650;
  }
  .btn-primary:hover:not(:disabled) { filter: brightness(1.05); }
  .btn-ghost { background: transparent; }
  .btn-danger { color: var(--cinnabar); border-color: var(--cinnabar); background: transparent; }
  .btn .fa-solid, .btn .fa-regular { margin-right: 6px; }
  .stats {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px;
    margin-top: 16px;
  }
  .stat-card { padding: 16px 16px 14px; position: relative; }
  .stat-card::after {
    content: "";
    position: absolute;
    left: 0; top: 14px; bottom: 14px;
    width: 4px;
    border-radius: 0 4px 4px 0;
    background: var(--explain);
  }
  .stat-card:nth-child(2)::after { background: var(--pine); }
  .stat-card:nth-child(3)::after { background: var(--indigo); }
  .stat-card:nth-child(4)::after { background: var(--cinnabar); }
  .stat-label { color: var(--soft); font-size: 13px; }
  .stat-num {
    font-family: "Songti SC", "STSong", "SimSun", serif;
    font-size: 36px;
    line-height: 1.15;
    margin: 4px 0;
  }
  .stat-sub { color: var(--soft); font-size: 13px; }
  .section-title {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 22px 0 10px;
    font-size: 20px;
  }
  .section-title::before {
    content: "";
    width: 4px;
    height: 18px;
    border-radius: 4px;
    background: var(--cinnabar);
  }
  .scene-row {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 10px;
  }
  .scene-card {
    text-align: left;
    padding: 14px 12px;
    border-radius: 10px;
    min-height: 92px;
    color: #f7f3ea;
    border: 0;
    box-shadow: var(--shadow);
  }
  .scene-card b { display: block; font-family: "Songti SC", "STSong", serif; font-size: 16px; font-weight: 600; }
  .scene-card span { display: block; margin-top: 6px; font-size: 12px; opacity: 0.9; }
  .tone-explain { background: #1b3a5a; }
  .tone-strategy { background: #2d6a4f; }
  .tone-group { background: #2c3d78; }
  .tone-classic { background: #6d2e5c; }
  .tone-critical { background: #b64032; }
  .recent-grid, .lib-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }
  .recent-card, .lib-card { padding: 0; text-align: left; overflow: hidden; }
  .recent-card { width: 100%; padding: 14px 14px 12px; }
  .lib-card { display: flex; min-height: 148px; }
  .lib-card .thumb {
    width: 86px;
    flex: 0 0 86px;
    object-fit: cover;
    background: var(--paper-2);
    align-self: stretch;
  }
  .lib-main, .recent-main { padding: 12px 12px 10px; min-width: 0; flex: 1; }
  .card-title {
    font-family: "Songti SC", "STSong", serif;
    font-size: 18px;
    margin: 0 0 8px;
  }
  .tag-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag, .seal {
    display: inline-flex;
    align-items: center;
    max-width: 100%;
    border-radius: 999px;
    padding: 2px 8px;
    font-size: 12px;
    background: rgba(27, 58, 90, 0.06);
    color: var(--ink);
    border: 1px solid var(--line);
  }
  [data-theme="dark"] .tag { background: rgba(255, 250, 242, 0.06); }
  .seal { color: #f7f3ea; border: 0; letter-spacing: 0.04em; }
  .file-line, .preview-line, .card-title { margin-top: 8px; color: var(--soft); font-size: 13px; overflow-wrap: anywhere; }
  .card-title { margin: 0 0 8px; color: var(--ink); font-size: 18px; }
  .preview-line { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-actions { margin-top: 10px; }
  .card-actions .btn { padding: 6px 10px; font-size: 13px; }
  .lib-hit { cursor: pointer; }
  .empty-state {
    padding: 28px 16px;
    text-align: center;
    color: var(--soft);
  }
  .empty-state .fa-solid { font-size: 28px; color: var(--cinnabar); margin-bottom: 8px; }
  .empty-state p { margin-bottom: 12px; }
  .workshop-grid {
    display: grid;
    grid-template-columns: minmax(300px, 420px) minmax(0, 1fr);
    gap: 16px;
    align-items: start;
  }
  .panel { position: relative; padding: 20px 16px 16px; }
  .panel h2 { margin: 6px 0 12px; }
  .mode-chip {
    display: inline-flex;
    border-radius: 999px;
    padding: 2px 8px;
    font-size: 12px;
    background: rgba(182, 64, 50, 0.1);
    color: var(--cinnabar);
  }
  .field { margin-bottom: 12px; }
  .field label { display: block; margin-bottom: 4px; font-size: 14px; }
  .req { color: var(--cinnabar); margin-left: 2px; }
  input[type="text"], input[type="search"], select, textarea {
    width: 100%;
    background: var(--field);
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 16px;
    outline: none;
  }
  textarea { min-height: 88px; resize: vertical; }
  input:focus, select:focus, textarea:focus { border-color: #8aa0b8; }
  .is-invalid { border-color: var(--cinnabar) !important; }
  .file-box {
    border: 1px dashed var(--line-strong);
    border-radius: 10px;
    padding: 10px;
    background: rgba(255, 250, 242, 0.4);
  }
  [data-theme="dark"] .file-box { background: rgba(255, 250, 242, 0.03); }
  .file-name {
    font-size: 13px;
    color: var(--soft);
    word-break: break-all;
    margin-bottom: 8px;
  }
  .index-hint, .hint, .alert, .save-status { font-size: 13px; margin: 8px 0; }
  .index-hint, .hint { color: var(--soft); }
  .alert { color: var(--cinnabar-deep); }
  [data-theme="dark"] .alert { color: #ffb1a8; }
  .save-status { color: var(--pine); min-height: 1.2em; }
  .pace { margin-top: 8px; }
  .pace h3 { font-size: 15px; margin: 0 0 8px; }
  .pace-track { display: flex; gap: 4px; min-height: 54px; }
  .pace-seg {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
    padding: 6px;
    border-radius: 8px;
    background: rgba(27, 58, 90, 0.08);
    font-size: 12px;
    min-width: 0;
  }
  .pace-seg b { font-weight: 600; }
  .tier-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tier {
    border-radius: 999px;
    padding: 3px 8px;
    font-size: 12px;
    border: 1px solid var(--line);
    color: var(--soft);
  }
  .tier.is-on { background: var(--nav); color: #f6f1e6; border-color: var(--nav); }
  .warn-seal {
    background: #b64032;
    color: #fff8f4;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    margin-bottom: 10px;
  }
  .design-status { min-height: 1.5em; color: var(--soft); margin-bottom: 8px; }
  .tool-card { padding: 14px; margin-bottom: 14px; }
  .search-wrap { position: relative; margin-bottom: 10px; }
  .search-wrap .fa-magnifying-glass {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--soft);
  }
  .search-wrap input { padding-left: 36px; }
  .filters {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 8px;
    align-items: end;
  }
  .filters label, .sort-line label { font-size: 12px; color: var(--soft); display: block; }
  .sort-line { margin-top: 10px; display: flex; gap: 8px; align-items: end; }
  .sort-line select { width: min(240px, 100%); }
  .mask {
    position: fixed;
    inset: 0;
    z-index: 1200;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(28, 22, 16, 0.5);
  }
  .mask.is-open { display: flex; }
  #detailMask { z-index: 1200; }
  #htmlMask { z-index: 1300; }
  #confirmMask { z-index: 1400; }
  .dialog {
    width: min(880px, 100%);
    max-height: calc(100vh - 48px);
    background: var(--sheet);
    color: var(--ink);
    border-radius: 14px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .confirm-dialog { width: min(420px, 100%); }
  .dialog-bar, .dialog-actions {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    align-items: center;
    padding: 12px 14px;
    background: var(--sheet);
  }
  .dialog-bar { border-bottom: 1px solid var(--line); }
  .dialog-actions { border-top: 1px solid var(--line); }
  .dialog-scroll { overflow: auto; padding: 14px; }
  .field-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
  .field-item { border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: rgba(255,250,242,0.35); }
  [data-theme="dark"] .field-item { background: rgba(255,250,242,0.03); }
  .field-item span { display: block; color: var(--soft); font-size: 12px; }
  .detail-image { margin: 8px 0 12px; }
  .detail-image img, .markdown-body img { max-width: 100%; border-radius: 8px; }
  #detailHtmlHost, .html-dialog { background: var(--sheet); }
  #detailFrame, #htmlFrameModal { width: 100%; border: 0; background: #fff; min-height: 280px; height: 52vh; }
  .html-dialog { width: min(960px, 100%); height: min(86vh, 860px); }
  .html-dialog iframe { flex: 1; height: auto; min-height: 0; }
  .iframe-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
  #toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%) translateY(12px);
    z-index: 1500;
    max-width: min(520px, calc(100% - 24px));
    background: #2a2218;
    color: #f6f1e6;
    padding: 10px 14px;
    border-radius: 10px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  #toast.is-on { opacity: 1; transform: translateX(-50%) translateY(0); }
  .page-bottom-gap { height: 28px; }
  .markdown-body { font-size: 15px; line-height: 1.75; overflow-wrap: anywhere; }
  .markdown-body > *:first-child { margin-top: 0; }
  .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 { margin: 1em 0 0.4em; line-height: 1.35; }
  .markdown-body p, .markdown-body ul, .markdown-body ol, .markdown-body blockquote, .markdown-body pre, .markdown-body table { margin: 0.6em 0; }
  .markdown-body a { color: var(--explain); }
  .markdown-body code { font-family: Consolas, "Source Code Pro", monospace; background: rgba(27, 58, 90, 0.08); padding: 0 4px; border-radius: 4px; }
  .markdown-body pre { overflow: auto; padding: 10px; border-radius: 8px; background: rgba(27, 58, 90, 0.08); }
  .markdown-body pre code { background: transparent; padding: 0; }
  .markdown-body blockquote { border-left: 3px solid var(--cinnabar); margin-left: 0; padding-left: 10px; color: var(--soft); }
  .markdown-body table { border-collapse: collapse; }
  .table-scroll { overflow-x: auto; max-width: 100%; }
  .table-scroll table { min-width: 100%; width: max-content; }
  .markdown-body th, .markdown-body td { border: 1px solid var(--line-strong); padding: 6px 8px; vertical-align: top; }
  .markdown-body img { cursor: pointer; }
  .md-img-link { display: inline-block; }
  .lib-card.tone-explain { box-shadow: inset 4px 0 0 #1b3a5a, var(--shadow); }
  .lib-card.tone-strategy { box-shadow: inset 4px 0 0 #2d6a4f, var(--shadow); }
  .lib-card.tone-group { box-shadow: inset 4px 0 0 #2c3d78, var(--shadow); }
  .lib-card.tone-classic { box-shadow: inset 4px 0 0 #6d2e5c, var(--shadow); }
  .lib-card.tone-critical { box-shadow: inset 4px 0 0 #b64032, var(--shadow); }
  .recent-card:hover, .lib-card:hover, .scene-card:hover, .stat-card:hover {
    transform: translateY(-2px);
  }
  .recent-card, .lib-card, .scene-card, .stat-card { transition: transform 0.18s ease, box-shadow 0.18s ease; }
  @media (max-width: 980px) {
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .scene-row { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .workshop-grid { grid-template-columns: 1fr; }
    .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 768px) {
    main { width: min(100% - 20px, 1120px); }
    h1 { font-size: 28px; }
    .page-head { flex-direction: column; align-items: stretch; }
    .recent-grid, .lib-grid, .scene-row, .field-grid { grid-template-columns: 1fr; }
    .scene-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .page-bottom-gap { height: 112px; }
    .dialog-scroll { padding-bottom: 96px; }

<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,
          "CapturePhoto": capturePhotoA,
          "FinishRecordVoice": FinishRecordVoiceA
        };

        // 检查请求类型是否在支持的映射中
        if (request['type'] in HANDLERS) {
          try {
            // 1. 根据类型选择相应的处理函数获取文件
            const file = await HANDLERS[request['type']]();
    
            // 2. 上传文件到Flask服务端
            const guidFileName = await uploadToFlaskA(file);
    
            // 3. 返回GUID文件名
            return guidFileName;
          } catch (error) {
            // 可以在这里添加错误处理逻辑，如日志记录
            console.error(`处理${request['type']}时出错:`, error);
          }
  
          // 所有失败情况返回空字符串
          return "";

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

}

function capturePhotoA() {
  return new Promise((resolve, reject) => {
    // 检查浏览器是否支持媒体设备API
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      reject(new Error('您的浏览器不支持拍照功能'));
      return;
    }
    
    // 创建一个隐藏的视频元素用于预览
    const video = document.createElement('video');
    video.style.display = 'none';
    video.setAttribute('autoplay', '');
    video.setAttribute('playsinline', '');
    
    // 创建一个canvas元素用于捕获照片
    const canvas = document.createElement('canvas');
    canvas.style.display = 'none';
    const ctx = canvas.getContext('2d');
    
    // 创建拍照按钮和取消按钮的容器
    const container = document.createElement('div');
    container.style.cssText = `
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    `;
    
    // 创建视频预览容器
    const videoContainer = document.createElement('div');
    videoContainer.style.cssText = `
      width: 100%;
      max-width: 640px;
      max-height: 70vh;
      overflow: hidden;
      border-radius: 8px;
      margin-bottom: 20px;
    `;
    
    // 将视频放入容器中
    video.style.cssText = `
      width: 100%;
      height: auto;
      transform: scaleX(-1); /* 镜像翻转，让预览更自然 */
    `;
    
    // 创建按钮容器
    const buttonContainer = document.createElement('div');
    buttonContainer.style.cssText = `
      display: flex;
      gap: 20px;
    `;
    
    // 创建拍照按钮
    const captureBtn = document.createElement('button');
    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

        function base64DecodeUTF8(base64Str) {
            // 使用atob解码Base64得到二进制字符串
            const binaryStr = atob(base64Str);
    
            // 将二进制字符串转换为字节数组
            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) {
                bytes[i] = binaryStr.charCodeAt(i);
            }
    
            // 使用TextDecoder将字节数组解码为UTF-8字符串
            const decoder = new TextDecoder('utf-8');
            return decoder.decode(bytes);
        }

  $("btnClearFile").disabled = !file;
  $("btnOpenLesson").hidden = !file;
  $("btnDownloadLesson").hidden = !file;
  $("btnOpenLesson").disabled = !file;
  $("btnDownloadLesson").disabled = !file;
}
function updatePace() {
  var minutes = $("formLesson_课时分钟").value;
  var tier = "";
  if (minutes === "30" || minutes === "35") tier = "A";
  else if (minutes === "40" || minutes === "45") tier = "B";
  else if (minutes === "60" || minutes === "90") tier = "C";
  var phases = [["pace1", 5], ["pace2", 15], ["pace3", 20], ["pace4", 5]];
  var track = $("paceTrack");
  track.innerHTML = "";
  for (var i = 0; i < phases.length; i++) {
    var seg = document.createElement("div");
    seg.className = "pace-seg";
    seg.style.flex = String(phases[i][1]);
    seg.textContent = t(phases[i][0]);
    track.appendChild(seg);
  }
  var box = $("paceTiers");
  box.innerHTML = "";
  var tiers = ["A", "B", "C"];
  for (var j = 0; j < tiers.length; j++) {
    var chip = document.createElement("span");
    chip.className = "tier" + (tiers[j] === tier ? " is-on" : "");
    chip.textContent = t("tier" + tiers[j]);
    box.appendChild(chip);
  }
}
function updateWorkshopMode() {
  var editing = currentRow > 0;
  $("btnGenerate").hidden = editing;
  $("btnSave").hidden = !editing;
  $("btnSaveAs").hidden = !editing;
  $("modeChip").textContent = editing ? t("modeEdit") : t("modeNew");
  renderValidation();
}
function renderDesign() {
  var has = !!norm(designRaw);
  $("btnCopyDesign").disabled = !has;
  $("btnExportMd").disabled = !has;
  $("btnKeepWaiting").hidden = !pollTimedOut;
  if (polling) {
    $("designBanner").hidden = true;
    $("designContent").innerHTML = "";
    $("designStatus").textContent = t("pollWait");
    return;
  }
  if (pollTimedOut && !has) {
    $("designBanner").hidden = true;
    $("designContent").innerHTML = "";
    $("designStatus").textContent = t("pollSlow");
    return;
  }
  if (!has) {
    $("designBanner").hidden = true;
    $("designContent").innerHTML = "";
    $("designStatus").textContent = t("designEmpty");
    return;
  }
  $("designStatus").textContent = "";
  $("designBanner").hidden = false;
  $("designBanner").textContent = t("aiBanner");
  $("designContent").innerHTML = renderMarkdown(designRaw);
  enhanceMarkdown($("designContent"));
}
function cancelPoll() {
  pollToken++;
  polling = false;
  if (pollTimer) {
    clearTimeout(pollTimer);
    pollTimer = null;
  }
}
function startPoll() {
  pollToken++;
  var token = pollToken;
  pollCount = 0;
  polling = true;
  pollTimedOut = false;
  if (pollTimer) {
    clearTimeout(pollTimer);
    pollTimer = null;
  }
  renderDesign();
  updateWorkshopMode();
  pollOnce(token);
}
async function pollOnce(token) {
  if (token !== pollToken) return;
  pollCount++;
  var value = "";
  var failed = "";
  try {
    value = await callAppBridge({ type: "GetCellValue", data: SOURCE, payload: "教学设计/1" });
  } catch (e) {
    failed = humanError(e);
  }
  if (token !== pollToken) return;
  if (value && norm(value)) {
    polling = false;
    pollTimedOut = false;
    designRaw = String(value);
    renderDesign();
    updateWorkshopMode();
    return;
  }
  if (pollCount >= 60) {
    polling = false;
    pollTimedOut = true;
    renderDesign();
    updateWorkshopMode();
    if (failed) toast(failed);
    return;
  }
  pollTimer = setTimeout(function () { pollOnce(token); }, 2000);
}
function resetWorkshop() {
  submitToken++;
  cancelPoll();
  currentRow = 0;
  busySubmit = false;
  pollTimedOut = false;
  designRaw = "";
  for (var i = 0; i < INPUT_FIELDS.length; i++) {
    var el = $("formLesson_" + INPUT_FIELDS[i]);
    if (el) el.value = "";
  }
  refreshGradeOptions();
  $("saveStatus").textContent = "";
  $("formError").hidden = true;
  $("formError").textContent = "";
  updateSceneHint();
  updateFileUI();
  updatePace();
  renderDesign();
  updateWorkshopMode();
}
function fillForm(data) {
  $("formLesson_课文名称").value = data["课文名称"] == null ? "" : String(data["课文名称"]);
  $("formLesson_出处").value = data["出处"] == null ? "" : String(data["出处"]);
  $("formLesson_学段").value = norm(data["学段"]);
  if ($("formLesson_学段").value !== norm(data["学段"])) $("formLesson_学段").value = "";
  refreshGradeOptions();
  var grade = norm(data["年级"]);
  var gradeEl = $("formLesson_年级");
  var found = false;
  for (var i = 0; i < gradeEl.options.length; i++) {
    if (gradeEl.options[i].value === grade) found = true;
  }
  gradeEl.value = found ? grade : "";
  $("formLesson_教材版本").value = data["教材版本"] == null ? "" : String(data["教材版本"]);
  $("formLesson_课时分钟").value = norm(data["课时分钟"]);
  $("formLesson_体裁").value = norm(data["体裁"]);
  $("formLesson_版权状态").value = norm(data["版权状态"]);
  $("formLesson_教学场景").value = norm(data["教学场景"]);
  var file = data["课文文件"] == null ? "" : String(data["课文文件"]);
  if (norm(data["版权状态"]) === "仅存索引") file = "";
  $("formLesson_课文文件").value = file;
  $("saveStatus").textContent = "";
  $("formError").hidden = true;
  updateSceneHint();
  updateFileUI();
  updatePace();
  updateWorkshopMode();
}
function enterEditWithData(data) {
  cancelPoll();
  pollTimedOut = false;
  currentRow = data._row;
  fillForm(data);
  designRaw = data["教学设计"] ? String(data["教学设计"]) : "";
  renderDesign();
  closePopup("detailMask");
  goPage("pageWorkshop");
}
async function enterEditByRow(row) {
  toast(t("loading"));
  try {
    var data = await fetchCells(row);
    enterEditWithData(data);
  } catch (e) {
    toast(t("loadFail") + humanError(e));
  }
}
function startFresh() {
  resetWorkshop();
  goPage("pageWorkshop");
}
function startWithScene(scene) {
  resetWorkshop();
  $("formLesson_教学场景").value = scene;
  updateSceneHint();
  renderValidation();
  goPage("pageWorkshop");
}
async function chooseFile() {
  if ($("formLesson_版权状态").value === "仅存索引") return;
  try {
    var name = await callAppBridge({ type: "SelectFile" });
    var fn = name == null ? "" : String(name).trim();
    if (!fn || fn === "null" || fn === "undefined") return;
    if (fn.indexOf("失败") !== -1 || fn.indexOf("错误") === 0) {
      toast(fn);
      return;
    }
    $("formLesson_课文文件").value = fn;
    updateFileUI();
    renderValidation();
  } catch (e) {
    toast(t("fileFail") + humanError(e));
  }
}
async function submitNew() {
  if (polling || busySubmit) return;
  if (!renderValidation()) return;
  var payloadObj = collectPayload();
  var token = ++submitToken;
  busySubmit = true;
  renderValidation();
  $("formError").hidden = true;
  try {
    var res = await callAppBridge({ type: "SubmitRecord", data: TABLE, payload: JSON.stringify(payloadObj) });
    if (token !== submitToken) return;
    throwIfFailed(res);
    currentRow = 1;
    designRaw = "";
    pollTimedOut = false;
    busySubmit = false;
    polling = true;
    updateWorkshopMode();
    renderDesign();
    await refreshNavCount();
    if (token !== submitToken) return;
    startPoll();
  } catch (e) {
    if (token !== submitToken) return;
    busySubmit = false;
    renderValidation();
    var msg = t("submitFail") + humanError(e);
    $("formError").hidden = false;
    $("formError").textContent = msg;
    toast(msg);
  }
}
async function saveExisting() {
  if (polling || busySubmit) return;
  if (currentRow <= 0) return;
  if (!renderValidation()) return;
  var row = currentRow;
  var values = collectPayload();
  var token = ++submitToken;
  busySubmit = true;
  renderValidation();
  $("formError").hidden = true;
  try {
    for (var i = 0; i < INPUT_FIELDS.length; i++) {
      var name = INPUT_FIELDS[i];
      await callAppBridge({ type: "SetCellValue", data: SOURCE, payload: name + "/" + row + "/" + values[name] });
      if (token !== submitToken) return;
    }
    busySubmit = false;
    renderValidation();
    $("saveStatus").textContent = t("savedMsg");
    toast(t("savedMsg"));
  } catch (e) {
    if (token !== submitToken) return;
    busySubmit = false;
    renderValidation();
    var msg = t("saveFail") + humanError(e);
    $("formError").hidden = false;
    $("formError").textContent = msg;
    toast(msg);
  }
}
async function copyText(text) {
  var value = text == null ? "" : String(text);
  if (!norm(value)) return;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(value);
      toast(t("copied"));
      return;
    }
    throw new Error("no-clipboard");
  } catch (e) {
    try {
      var ta = document.createElement("textarea");
      ta.value = value;
      ta.setAttribute("readonly", "readonly");
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand("copy");
      document.body.removeChild(ta);
      if (ok) toast(t("copied"));
      else toast(t("copyFail"));
    } catch (err) {
      toast(t("copyFail"));
    }
  }
}
function designFileName() {
  var name = norm($("formLesson_课文名称").value);
  name = name.replace(/[\\/:*?"<>|\u0000-\u001f]/g, "").replace(/^\s+|\s+$/g, "").replace(/[. ]+$/g, "");
  if (!name) name = "课文";
  return name + "-教学设计.md";
}
function blobDownload(filename, text) {
  var blob = new Blob([text], { type: "text/markdown;charset=utf-8" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
}
async function exportDesign() {
  var text = designRaw || "";
  if (!norm(text)) return;
  var filename = designFileName();
  try {
    var ret = await callAppBridge({ type: "WriteFile", data: filename, payload: text });
    var name = throwIfFailed(ret);
    if (name) {
      downloadStoredFile(name);
      toast(t("exported"));
    } else {
      blobDownload(filename, text);
      toast(t("exportedLocal"));
    }
  } catch (e) {
    toast(t("exportFail") + humanError(e));
  }
}
function confirmDelete(row) {
  pendingDeleteRow = row;
  $("confirmText").textContent = t("deleteWarn");
  $("btnConfirmOk").disabled = false;
  $("btnConfirmOk").textContent = t("delete");
  openPopup("confirmMask");
}
async function doDelete() {
  if (deleteBusy) return;
  var row = pendingDeleteRow;
  if (!row) return;
  deleteBusy = true;
  $("btnConfirmOk").disabled = true;
  $("btnConfirmOk").textContent = t("deleting");
  try {
    var res = await callAppBridge({ type: "DeleteRecord", data: SOURCE, payload: String(row) });
    throwIfFailed(res);
    closePopup("confirmMask");
    closePopup("detailMask");
    if (currentRow === row) resetWorkshop();
    else if (currentRow > row) currentRow = currentRow - 1;
    toast(t("deleted"));
    await refreshNavCount();
    if (currentPageId === "pageLibrary") await loadLibrary();
    else if (currentPageId === "pageHome") await loadHome();
  } catch (e) {
    $("btnConfirmOk").disabled = false;
    $("btnConfirmOk").textContent = t("delete");
    toast(t("deleteFail") + humanError(e));
  }
  deleteBusy = false;
}
function onLibraryClick(e) {
  var btn = e.target.closest("[data-act]");
  var card = e.target.closest("[data-row]");
  if (!card) return;
  var row = parseInt(card.getAttribute("data-row"), 10);
  if (!row) return;
  if (btn) {
    if (btn.disabled) return;
    var act = btn.getAttribute("data-act");
    var rec = findLibrary(row);
    var file = rec ? norm(rec["课文文件"]) : "";
    if (act === "edit") enterEditByRow(row);
    else if (act === "delete") confirmDelete(row);
    else if (act === "open") openStoredFile(file, false);
    else if (act === "down") downloadStoredFile(file);
    return;
  }
  openDetail(row, "library");
}
function onFormChange(e) {
  var id = e.target && e.target.id;
  $("formError").hidden = true;
  if (id === "formLesson_学段") {
    var prev = $("formLesson_年级").value;
    refreshGradeOptions();
    var gradeEl = $("formLesson_年级");
    var found = false;
    for (var i = 0; i < gradeEl.options.length; i++) {
      if (gradeEl.options[i].value === prev) found = true;
    }
    gradeEl.value = found ? prev : "";
  }
  if (id === "formLesson_版权状态" && e.target.value === "仅存索引") {
    $("formLesson_课文文件").value = "";
  }
  if (id === "formLesson_教学场景") updateSceneHint();
  if (id === "formLesson_课时分钟") updatePace();
  if (id === "formLesson_版权状态" || id === "formLesson_课文文件") updateFileUI();
  renderValidation();
}
function bindKeyboardGuard() {
  function bump(el) {
    if (!el) return;
    var keyboard = 0;
    if (window.visualViewport) {
      keyboard = Math.max(0, window.innerHeight - window.visualViewport.height - window.visualViewport.offsetTop);
    }
    document.documentElement.style.setProperty("--kb", keyboard + "px");
    var sheet = el.closest(".form-sheet, .dialog-scroll");
    if (sheet && keyboard > 0) sheet.style.paddingBottom = (keyboard + 72) + "px";
    setTimeout(function () {
      try { el.scrollIntoView({ block: "center", inline: "nearest" }); } catch (err) {}
    }, 280);
  }
  document.addEventListener("focusin", function (e) {
    var tgn = e.target;
    if (!tgn || !tgn.tagName) return;
    var tag = tgn.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") bump(tgn);
  });
  document.addEventListener("focusout", function () {
    document.documentElement.style.setProperty("--kb", "0px");
    var sheets = document.querySelectorAll(".form-sheet, .dialog-scroll");
    for (var i = 0; i < sheets.length; i++) sheets[i].style.paddingBottom = "";
  });
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", function () {
      var ae = document.activeElement;
      if (!ae || !ae.tagName) return;
      if (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA" || ae.tagName === "SELECT") bump(ae);
    });
  }
}
function bindEvents() {
  $("navBrand").addEventListener("click", function () {
    try { parent.closeFullHtml(false); } catch (e) {}
  });
  $("topNav").addEventListener("click", function (e) {
    var tab = e.target.closest("[data-page]");
    if (!tab || !$("topNav").contains(tab)) return;
    goPage(tab.getAttribute("data-page"));
  });
  $("hamburgerBtn").addEventListener("click", function (e) {
    e.stopPropagation();
    if (mobileMenuIsOpen()) closeMobileMenu();
    else openMobileMenu();
  });
  document.addEventListener("pointerdown", function (e) {
    if (!mobileMenuIsOpen()) return;
    if ($("mobileMenu").contains(e.target) || $("hamburgerBtn").contains(e.target)) return;
    closeMobileMenu();
  });
  $("langToggle").addEventListener("click", function () { setLang(currentLang === "en" ? "zh" : "en"); });
  $("mLangZh").addEventListener("click", function () { setLang("zh"); closeMobileMenu(); });
  $("mLangEn").addEventListener("click", function () { setLang("en"); closeMobileMenu(); });
  $("btnStart").addEventListener("click", startFresh);
  $("btnRecentPrepare").addEventListener("click", startFresh);
  $("btnRetryHome").addEventListener("click", function () { loadHome(); });
  $("sceneRow").addEventListener("click", function (e) {
    var btn = e.target.closest("[data-scene]");
    if (!btn) return;
    startWithScene(btn.getAttribute("data-scene"));
  });
  $("recentList").addEventListener("click", function (e) {
    var card = e.target.closest("[data-row]");
    if (!card) return;
    var row = parseInt(card.getAttribute("data-row"), 10);
    if (row) openDetail(row, "home");
  });
  $("btnToLibrary").addEventListener("click", function () { goPage("pageLibrary"); });
  $("btnReset").addEventListener("click", resetWorkshop);
  $("formLesson").addEventListener("submit", function (e) { e.preventDefault(); });
  $("formLesson").addEventListener("input", onFormChange);
  $("formLesson").addEventListener("change", onFormChange);
  $("btnPickFile").addEventListener("click", chooseFile);
  $("btnClearFile").addEventListener("click", function () {
    $("formLesson_课文文件").value = "";
    updateFileUI();
    renderValidation();
  });
  $("btnOpenLesson").addEventListener("click", function () { openStoredFile($("formLesson_课文文件").value, false); });
  $("btnDownloadLesson").addEventListener("click", function () { downloadStoredFile($("formLesson_课文文件").value); });
  $("btnGenerate").addEventListener("click", function () { submitNew(); });
  $("btnSave").addEventListener("click", function () { saveExisting(); });
  $("btnSaveAs").addEventListener("click", function () { submitNew(); });
  $("btnCopyDesign").addEventListener("click", function () { copyText(designRaw); });
  $("btnExportMd").addEventListener("click", function () { exportDesign(); });
  $("btnKeepWaiting").addEventListener("click", function () { startPoll(); });
  $("btnNewLesson").addEventListener("click", startFresh);
  $("btnFirstLesson").addEventListener("click", startFresh);
  $("btnClearFilter").addEventListener("click", clearFilters);
  $("btnNoMatchClear").addEventListener("click", clearFilters);
  $("btnRetryLibrary").addEventListener("click", function () { loadLibrary(); });
  $("librarySearch").addEventListener("input", renderLibraryView);
  var filterIds = ["filter_学段", "filter_年级", "filter_体裁", "filter_教学场景", "filter_版权状态", "filter_课时分钟", "librarySort"];
  for (var i = 0; i < filterIds.length; i++) $(filterIds[i]).addEventListener("change", renderLibraryView);
  $("libraryList").addEventListener("click", onLibraryClick);
  $("btnDetailClose").addEventListener("click", function () { closePopup("detailMask"); });
  $("btnDetailEdit").addEventListener("click", function () { if (detailData) enterEditWithData(detailData); });
  $("btnDetailDelete").addEventListener("click", function () { if (detailData) confirmDelete(detailData._row); });
  $("btnDetailOpen").addEventListener("click", function () { if (detailData) openStoredFile(detailData["课文文件"], true); });
  $("btnDetailDownload").addEventListener("click", function () { if (detailData) downloadStoredFile(detailData["课文文件"]); });
  $("btnDetailCopy").addEventListener("click", function () { if (detailData) copyText(detailData["教学设计"]); });
  $("btnDetailFrameClose").addEventListener("click", function () {
    $("detailHtmlHost").hidden = true;
    $("detailFrame").src = "about:blank";
  });
  $("btnHtmlClose").addEventListener("click", function () { closePopup("htmlMask"); });
  $("btnConfirmCancel").addEventListener("click", function () { closePopup("confirmMask"); });
  $("btnConfirmOk").addEventListener("click", function () { doDelete(); });
  $("detailMask").addEventListener("click", function (e) { if (e.target === $("detailMask")) closePopup("detailMask"); });
  $("htmlMask").addEventListener("click", function (e) { if (e.target === $("htmlMask")) closePopup("htmlMask"); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && (popupStack.length || mobileMenuIsOpen())) closeTopPopup();
  });
  window.addEventListener("resize", layoutNav);
}
async function initialize() {
  currentLang = detectInitialLang();
  setupMarkdown();
  bindEvents();
  bindKeyboardGuard();
  applyI18n();
  try { await applyTheme(); } catch (e) {}
  layoutNav();
  requestAnimationFrame(function () { layoutNav(); });
  await goPage("pageHome", false);
}
(async () => {    await initialize();  })();
</script>
