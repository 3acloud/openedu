<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,
          "CapturePhoto": capturePhotoA,
          "FinishRecordVoice": FinishRecordVoiceA
        };

        // 检查请求类型是否在支持的映射中
        if (request['type'] in HANDLERS) {
          try {

async function exportFileA(title, url) {

    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

function t(k){return I[lang][k]||k}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function textOnly(v){return String(v||'').replace(/<[^>]*>/g,'').replace(/[#*_`>\[\]()!~]/g,'').replace(/\s+/g,' ').trim()}function safeName(v){return String(v||'').split(/[\\/]/).pop()}function fileUrl(kind,v){return 'https://www.ithinkair.com:3031/'+kind+'/'+encodeURIComponent(v)}function sleep(ms){return new Promise(r=>setTimeout(r,ms))}function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),3500)}function notice(msg,error=false){$('workNotice').textContent=msg;$('workNotice').classList.toggle('error',error)}

function formatRow(r,i){return {row:i+1,grade:r[0]||'',topic:r[1]||'',weakness:r[2]||'',reference:r[3]||'',body:r[4]||''}}async function refresh(){const [csv,count]=await Promise.all([callAppBridge({type:'GetTableCSV',data:TABLE,payload:FIELDS.join(',')}),callAppBridge({type:'GetRecordCount',data:TABLE})]);rows=parseCSV(String(csv||'')).map(formatRow);recordCount=Number.parseInt(count,10)||rows.length;renderHome();renderFilters();renderLibrary();updateButtons()}

function option(value,label){return `<option value="${esc(value)}">${esc(label)}</option>`}function renderFilters(){const keep=$('gradeFilter').value;$('gradeFilter').innerHTML=option('',t('all'))+(rows.some(x=>!x.grade.trim())?option('__EMPTY__',t('noGrade')):'')+[...new Set(rows.map(x=>x.grade.trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b)).map(x=>option(x,x)).join('');$('gradeFilter').value=[...$('gradeFilter').options].some(o=>o.value===keep)?keep:'';const lists=[['statusFilter',[['',t('all')],['generated',t('generated')],['pending',t('notGenerated')]]],['fileFilter',[['',t('all')],['attached',t('attached')],['none',t('unattached')]]],['sortFilter',[['newest',t('newest')],['grade',t('sortGrade')],['topic',t('sortTopic')]]]];for(const [id,opts] of lists){const old=$(id).value;$(id).innerHTML=opts.map(x=>option(...x)).join('');$(id).value=opts.some(x=>x[0]===old)?old:opts[0][0]}}
function renderLibrary(){const q=$('searchInput').value.toLocaleLowerCase().trim(),grade=$('gradeFilter').value,status=$('statusFilter').value,file=$('fileFilter').value,sort=$('sortFilter').value;let result=rows.filter(x=>(!q||[x.grade,x.topic,x.weakness].some(y=>y.toLocaleLowerCase().includes(q)))&&(!grade||(grade==='__EMPTY__'?!x.grade.trim():x.grade===grade))&&(!status||(status==='generated'?!!x.body.trim():!x.body.trim()))&&(!file||(file==='attached'?!!x.reference.trim():!x.reference.trim())));if(sort==='grade')result.sort((a,b)=>a.grade.localeCompare(b.grade)||a.row-b.row);else if(sort==='topic')result.sort((a,b)=>a.topic.localeCompare(b.topic)||a.row-b.row);else result.sort((a,b)=>a.row-b.row);$('libraryGrid').innerHTML=result.length?result.map(x=>`<article class="card lessonCard" data-edit-row="${x.row}" tabindex="0"><div class="pills"><span class="pill">${esc(x.grade||t('noGrade'))}</span><span class="pill ${x.body?'':'amber'}">${x.body?t('generated'):t('waiting')}</span></div><h3>${esc(x.topic||'—')}</h3><div class="excerpt">${esc(textOnly(x.weakness))}</div><p class="meta">${x.reference?' '+esc(safeName(x.reference)):t('noReference')}</p><p class="excerpt">${esc(textOnly(x.body).slice(0,60))}</p><div class="actions"><button class="btn" type="button" data-action="view" data-row="${x.row}">${t('view')}</button><button class="btn" type="button" data-action="edit" data-row="${x.row}">${t('edit')}</button><button class="btn danger" type="button" data-action="delete" data-row="${x.row}">${t('delete')}</button></div></article>`).join(''):`<div class="card empty"><i class="fa-solid fa-folder-open"></i><p>${t(rows.length?'noMatch':'noData')}</p><button class="btn" id="resetFilters" type="button">${t('reset')}</button></div>`}
function applyFilters(v){$('searchInput').value=v.search||'';$('gradeFilter').value=v.grade||'';$('statusFilter').value=v.status||'';$('fileFilter').value=v.file||'';$('sortFilter').value='newest';renderLibrary()}
function closeMenu(){$('mobileMenu').classList.remove('open');$('menuBtn').setAttribute('aria-expanded','false')}function confirmDirty(){return !dirty||confirm(t('confirmLeave'))}function switchPage(next,force=false,restore=false){if(page===next)return true;if(!force&&!confirmDirty())return false;if(!restore)historyStack.push({page,scroll:window.scrollY});document.querySelectorAll('.page').forEach(el=>el.classList.toggle('active',el.id==='page-'+next));page=next;document.querySelectorAll('[data-page]').forEach(el=>el.classList.toggle('active',el.dataset.page===next));closeMenu();window.scrollTo(0,0);return true}function newDesign(){if(!confirmDirty())return;clearWorkshop(true);switchPage('workshop',true)}
function formValues(){return {'授课年级':fields.grade.value.trim(),'教学内容':fields.topic.value.trim(),'学情弱项':fields.weakness.value.trim(),'参考文件':reference}}function setFields(v){fields.grade.value=v['授课年级']||'';fields.topic.value=v['教学内容']||'';fields.weakness.value=v['学情弱项']||'';reference=v['参考文件']||'';updateFile();updateButtons();updateLabel()}function clearWorkshop(force=false){if(!force&&!confirmDirty())return false;pollToken++;polling=false;currentRow=0;setFields({});bodyText='';originalBody='';editingBody=false;dirty=false;notice('');renderPreview();updateButtons();return true}function updateFile(){$('fileName').textContent=reference?safeName(reference):t('fileEmpty');$('fileLinks').hidden=!reference;$('clearFile').disabled=!reference;if(reference){$('openFile').href=fileUrl('private',reference);$('downloadFile').href=fileUrl('download',reference)}}function updateLabel(){$('paperLabel').textContent=[fields.grade.value.trim(),fields.topic.value.trim()].filter(Boolean).join(' · ')||'—'}function renderPreview(){updateLabel();$('previewMarkdown').innerHTML=bodyText?md(bodyText):`<p class="meta">${t('emptyPreview')}</p>`;$('previewMarkdown').hidden=editingBody;$('previewEditor').hidden=!editingBody;if(!editingBody)$('previewEditor').value=bodyText;$('cancelBody').hidden=!editingBody;$('editBody').hidden=editingBody}function updateButtons(){$('rowInfo').textContent=currentRow?`${t('record')}: ${currentRow}`:'';$('generateBtn').disabled=polling||busy||currentRow>0||!fields.grade.value.trim()||!fields.topic.value.trim();$('saveWork').disabled=polling||busy||currentRow<1;$('copyBody').disabled=!bodyText&&!$('previewEditor').value;$('editBody').disabled=polling||currentRow<1||!bodyText;$('draftBtn').disabled=currentRow<1||polling;$('prevRow').disabled=polling||currentRow<=1;$('nextRow').disabled=polling||currentRow===0||currentRow>=recordCount;$('clearWork').disabled=polling}
async function readRow(row){const values=[];for(const field of FIELDS)values.push(await callAppBridge({type:'GetCellValue',data:TABLE,payload:field+'/'+row}));return Object.fromEntries(FIELDS.map((f,i)=>[f,String(values[i]??'')]))}async function loadRow(row,skipConfirm=false){if(!skipConfirm&&!confirmDirty())return false;busy=true;updateButtons();try{const v=await readRow(row);pollToken++;polling=false;currentRow=row;setFields(v);bodyText=v['教案框架'];originalBody=bodyText;editingBody=false;dirty=false;notice('');renderPreview();switchPage('workshop',true);return true}catch(e){toast(t('error')+': '+e);return false}finally{busy=false;updateButtons()}}
async function pollBody(row,token){const start=Date.now();while(token===pollToken&&Date.now()-start<120000){try{const value=String(await callAppBridge({type:'GetCellValue',data:TABLE,payload:'教案框架/'+row})||'');if(value.trim()){bodyText=value;originalBody=value;polling=false;notice('');renderPreview();updateButtons();await refresh();return}}catch(e){notice(String(e),true)}await sleep(2000)}if(token===pollToken){polling=false;notice(t('timeout'),true);renderPreview();updateButtons();await refresh()}}

async function saveWork(){if(currentRow<1){notice(t('needGenerated'),true);return}if(polling||busy)return;busy=true;updateButtons();try{const values=formValues();for(const f of FIELDS.slice(0,4))await callAppBridge({type:'SetCellValue',data:TABLE,payload:f+'/'+currentRow+'/'+values[f]});const revised=editingBody?$('previewEditor').value:bodyText;if(revised!==originalBody)await callAppBridge({type:'SetCellValue',data:TABLE,payload:'教案框架/'+currentRow+'/'+revised});bodyText=revised;originalBody=revised;editingBody=false;dirty=false;renderPreview();notice(t('saved'));await refresh()}catch(e){notice(t('error')+': '+e,true)}finally{busy=false;updateButtons()}}
async function openDetail(row){detailRow=row;$('detailTitle').textContent=t('preview');$('detailMeta').textContent='';$('detailBody').textContent=t('loading');$('detailLayer').classList.add('open');try{const v=await readRow(row);if(detailRow!==row)return;$('detailTitle').textContent=v['教学内容']||'—';$('detailMeta').textContent=[v['授课年级'],v['学情弱项']].filter(Boolean).join(' · ');const ref=v['参考文件'];$('detailBody').innerHTML=`<div class="markdown">${v['教案框架']?md(v['教案框架']):`<p>${t('waiting')}</p>`}</div>${ref?`<div class="buttonRow"><a class="btn" href="${esc(fileUrl('private',ref))}" target="_blank" rel="noopener noreferrer">${t('openFile')}</a><a class="btn" href="${esc(fileUrl('download',ref))}" target="_blank" rel="noopener noreferrer">${t('downloadFile')}</a></div>${/\.html?$/i.test(ref)?`<iframe class="fileFrame" sandbox="" src="${esc(fileUrl('private',ref))}" title="${esc(safeName(ref))}"></iframe>`:''}`:''}`}catch(e){$('detailBody').textContent=t('error')+': '+e}}
function closeDetail(){$('detailLayer').classList.remove('open');detailRow=0}async function deleteRow(row){if(!confirm(t('confirmDelete')))return;try{await callAppBridge({type:'DeleteRecord',data:TABLE,payload:row.toString()});if(currentRow===row)clearWorkshop(true);else if(currentRow>row){currentRow--;await loadRow(currentRow,true)}await refresh()}catch(e){toast(t('error')+': '+e)}}
function airBack(){if($('detailLayer').classList.contains('open')){closeDetail();return 'false'}if($('mobileMenu').classList.contains('open')){closeMenu();return 'false'}if(historyStack.length){if(!confirmDirty())return 'false';const item=historyStack.pop();switchPage(item.page,true,true);window.scrollTo(0,item.scroll);return 'false'}return 'true'}window.airBack=airBack;
function bind(){document.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',()=>switchPage(el.dataset.page)));$('brand').onclick=()=>{if(parent&&typeof parent.closeFullHtml==='function')parent.closeFullHtml(false)};$('menuBtn').onclick=()=>{const open=$('mobileMenu').classList.toggle('open');$('menuBtn').setAttribute('aria-expanded',String(open))};document.addEventListener('click',e=>{if(!e.target.closest('#topbar'))closeMenu()});const toggleLang=()=>{const next=lang==='cn'?'en':'cn';try{localStorage.setItem('iThinkAir_UiLanguage',next)}catch(e){}setLanguage(next);closeMenu()};$('langbtn').onclick=toggleLang;$('menuLang').onclick=toggleLang;$('homeNew').onclick=newDesign;$('libraryNew').onclick=newDesign;$('clearWork').onclick=()=>clearWorkshop();$('stats').onclick=e=>{const x=e.target.closest('[data-stat]');if(!x)return;applyFilters(x.dataset.stat==='generated'?{status:'generated'}:x.dataset.stat==='attached'?{file:'attached'}:{});switchPage('library')};$('gradeBars').onclick=e=>{const x=e.target.closest('[data-grade]');if(!x)return;applyFilters({grade:x.dataset.grade===t('noGrade')?'__EMPTY__':x.dataset.grade});switchPage('library')};$('focusTags').onclick=e=>{const x=e.target.closest('[data-focus]');if(!x)return;applyFilters({search:x.dataset.focus});switchPage('library')};$('recentGrid').onclick=e=>{if(e.target.id==='firstLesson'){newDesign();return}const x=e.target.closest('[data-detail]');if(x)openDetail(Number(x.dataset.detail))};$('recentGrid').onkeydown=e=>{if(e.key==='Enter'){const x=e.target.closest('[data-detail]');if(x)openDetail(Number(x.dataset.detail))}};$('gradeChips').onclick=e=>{const x=e.target.closest('[data-grade]');if(x){fields.grade.value=x.dataset.grade;dirty=true;updateButtons();updateLabel()}};for(const input of Object.values(fields))input.addEventListener('input',()=>{dirty=true;updateButtons();updateLabel()});$('chooseFile').onclick=async()=>{try{const v=await callAppBridge({type:'SelectFile'});if(v){reference=String(v);dirty=true;updateFile()}}catch(e){toast(t('error')+': '+e)}};$('clearFile').onclick=()=>{reference='';dirty=true;updateFile()};$('lessonForm').onsubmit=e=>{e.preventDefault();generate()};$('clearWork').addEventListener('click',()=>updateButtons());$('draftBtn').onclick=()=>{if(currentRow<1||!confirmDirty())return;currentRow=0;bodyText='';originalBody='';editingBody=false;dirty=true;renderPreview();updateButtons()};$('editBody').onclick=()=>{editingBody=true;$('previewEditor').value=bodyText;renderPreview();$('previewEditor').value=bodyText;$('previewEditor').focus()};$('previewEditor').oninput=()=>{dirty=true;updateButtons()};$('cancelBody').onclick=()=>{editingBody=false;bodyText=originalBody;renderPreview();updateButtons()};$('copyBody').onclick=async()=>{try{await navigator.clipboard.writeText(editingBody?$('previewEditor').value:bodyText);toast(t('copied'))}catch(e){toast(t('error')+': '+e)}};$('saveWork').onclick=saveWork;$('prevRow').onclick=()=>{if(currentRow>1)loadRow(currentRow-1)};$('nextRow').onclick=()=>{if(currentRow>0&&currentRow<recordCount)loadRow(currentRow+1)};for(const id of ['searchInput','gradeFilter','statusFilter','fileFilter','sortFilter'])$(id).addEventListener(id==='searchInput'?'input':'change',renderLibrary);$('libraryGrid').onclick=e=>{if(e.target.id==='resetFilters'){applyFilters({});return}const action=e.target.closest('[data-action]');if(action){const row=Number(action.dataset.row);if(action.dataset.action==='view')openDetail(row);if(action.dataset.action==='edit')loadRow(row);if(action.dataset.action==='delete')deleteRow(row);return}const card=e.target.closest('[data-edit-row]');if(card)loadRow(Number(card.dataset.editRow))};$('libraryGrid').onkeydown=e=>{if(e.key==='Enter'&&e.target.matches('[data-edit-row]'))loadRow(Number(e.target.dataset.editRow))};$('closeDetail').onclick=closeDetail;$('closeDetailTop').onclick=closeDetail;$('detailLayer').onclick=e=>{if(e.target===$('detailLayer'))closeDetail()};$('detailEdit').onclick=()=>{const row=detailRow;closeDetail();loadRow(row)};document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('detailLayer').classList.contains('open'))closeDetail();else closeMenu()}});document.addEventListener('focusin',e=>{if(!/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;setTimeout(()=>e.target.scrollIntoView({block:'center',behavior:'smooth'}),250)});if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>{const active=document.activeElement;if(active&&/^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName))setTimeout(()=>active.scrollIntoView({block:'center',behavior:'smooth'}),100)})}
