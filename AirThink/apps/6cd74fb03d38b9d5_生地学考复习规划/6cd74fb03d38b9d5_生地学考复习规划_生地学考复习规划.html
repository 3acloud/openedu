<section id="page-home" class="page active"><div class="hero"><div class="eyebrow" data-i18n="heroEyebrow">BIOLOGY · GEOGRAPHY</div><h1 data-i18n="appName">生地学考复习规划</h1><p data-i18n="heroText">依据本地当年考试说明、班级掌握情况和教学进度，倒排复习日程，兼顾生物实验操作或地理实践，生成后由教师审定使用</p><button id="heroCreate" class="button primary" type="button"><i class="fa-solid fa-plus"></i><span data-i18n="createOne">制定一份复习规划</span></button></div><div class="stats"><button class="stat total" data-stat="total"><i class="fa-solid fa-layer-group"></i><span id="statTotal" class="num">—</span><span class="label" data-i18n="total">规划总数</span></button><button class="stat bio" data-stat="bio"><i class="fa-solid fa-leaf"></i><span id="statBio" class="num">—</span><span class="label" data-i18n="bioCount">生物规划数</span></button><button class="stat geo" data-stat="geo"><i class="fa-solid fa-earth-asia"></i><span id="statGeo" class="num">—</span><span class="label" data-i18n="geoCount">地理规划数</span></button><button class="stat soon" data-stat="soon"><i class="fa-regular fa-clock"></i><span id="statSoon" class="num">—</span><span class="label" data-i18n="soonCount">十四日内开考</span></button></div><h2 class="section-title" data-i18n="recent">最近制定</h2><div id="recentList" class="recent-grid"></div></section>
<section id="page-create" class="page"><div class="page-head"><div><h1 data-i18n="create">制定规划</h1><p data-i18n="createDesc">只填写班级与考点层面的信息。考试范围、形式、题型和实践项目仅来自所填考试说明；没写清的内容会在计划里标成待教师确认</p></div><button id="goBook" class="button" type="button" data-i18n="viewBook">查看规划册</button></div><div class="card"><h2 data-i18n="formTitle">制定复习规划</h2><div id="createForm"></div><div id="createTimeline"></div><div class="actions"><button id="submitPlan" class="button primary" type="button" data-i18n="generate">生成复习计划</button><button id="clearPlan" class="button" type="button" data-i18n="clear">清空</button><span id="createStatus" class="status" role="status"></span></div></div><div id="createResult" style="display:none;margin-top:20px" class="card"><div class="notice" data-i18n="review">本计划供教师审定后使用；缺失的考试范围、形式、题型或实践项目须待教师确认</div><div id="createPlanBody" class="markdown-body plan-body"></div></div></section>

<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**

function selectFileA() {

    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;

    `;
    
    // 创建取消按钮

    cancelBtn.textContent = '取消';

      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

            // 使用atob解码Base64得到二进制字符串
            const binaryStr = atob(base64Str);
    
            // 将二进制字符串转换为字节数组
            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) {
                bytes[i] = binaryStr.charCodeAt(i);
            }
    
            // 使用TextDecoder将字节数组解码为UTF-8字符串
            const decoder = new TextDecoder('utf-8');
            return decoder.decode(bytes);
        }

function renderDetail(){const d=state.detail;if(!d||!state.selected){$('detailPanel').innerHTML=emptyHTML(t('emptyBook'));$('mobileDetail').innerHTML=emptyHTML(t('emptyBook'));return}const row=state.selected,n=daysUntil(d['考试日期']);let html='<div class="detail-top"><div><div class="meta">'+subjectPill(d['学科'])+' <span>'+esc(d['学段']==='初中'?t('junior'):d['学段']==='高中'?t('senior'):d['学段'])+'</span></div><h2>'+esc(d['班级'])+'</h2><div class="meta">'+esc(formatDays(d['考试日期']))+'</div></div><div><button class="icon-btn" data-action="prev" '+(row<=1?'disabled':'')+' aria-label="Previous">&lt;</button> <button class="icon-btn" data-action="next" '+(row>=(state.stats?.total||state.rows.length)?'disabled':'')+' aria-label="Next">&gt;</button></div></div>';if(n>=0&&n<=14)html+='<div class="notice">'+esc(n===0?t('todayFlow'):t('noNewDetail'))+'</div>';html+='<div class="detail-grid">'+FIELDS.map(f=>'<div class="detail-field '+(['考试说明','本班薄弱考点','当前教学进度'].includes(f)?'wide':'')+'"><small>'+esc(t(fieldKeys[f]))+'</small><div>'+esc(d[f])+'</div></div>').join('')+'</div>'+timelineHTML(d['复习开始日期'],d['考试日期'])+'<h3>'+esc(t('plan'))+'</h3><div class="notice">'+esc(t('review'))+'</div><div class="markdown-body plan-body">'+renderMarkdown(d['复习计划'])+'</div><div class="actions"><button class="button small" data-action="refresh" data-row="'+row+'">'+esc(t('refresh'))+'</button><button class="button small" data-action="edit" data-row="'+row+'">'+esc(t('edit'))+'</button><button class="button small danger" data-action="delete" data-row="'+row+'">'+esc(t('delete'))+'</button></div>';$('detailPanel').innerHTML=html;$('mobileDetail').innerHTML=html}
async function refreshPlan(){if(!state.selected)return;try{const p=await callAppBridge({type:'GetCellValue',data:TABLE,payload:'复习计划/'+state.selected});if(state.detail){state.detail['复习计划']=p||'';renderDetail()}}catch(e){alert(t('loadFail'))}}
async function submitPlan(){if(state.submitting)return;const obj=validate('create');if(!obj)return;state.submitting=true;updateSubmitReady();$('createStatus').textContent=t('waiting');$('createResult').style.display='block';$('createPlanBody').innerHTML='<p>'+esc(t('waiting'))+'</p>';try{await callAppBridge({type:'SubmitRecord',data:SUBMIT_TABLE,payload:JSON.stringify(obj)});state.currentRow=1;await refreshData();const started=Date.now();while(Date.now()-started<1800000){const result=await callAppBridge({type:'GetCellValue',data:TABLE,payload:'复习计划/1'});if(String(result||'').trim()){$('createPlanBody').innerHTML=renderMarkdown(result);$('createStatus').textContent='';return}await new Promise(resolve=>setTimeout(resolve,1000))}$('createPlanBody').innerHTML='<p>'+esc(t('timeout'))+'</p>';$('createStatus').textContent=t('timeout')}catch(e){$('createPlanBody').innerHTML='<p>'+esc(t('submitError'))+'</p>';$('createStatus').textContent=t('submitError')}finally{state.submitting=false;updateSubmitReady();await refreshData()}}
function clearCreate(){if(state.submitting)return;state.currentRow=0;$('createForm').innerHTML=buildForm('create');nameSegments('create');$('createTimeline').innerHTML='';$('createResult').style.display='none';$('createPlanBody').innerHTML='';$('createStatus').textContent='';updateSubmitReady()}
function renderInlineEdit(){if(!state.inlineEdit)return;$('detailPanel').innerHTML='<h2>'+esc(t('edit'))+'</h2><div id="inlineForm">'+buildForm('inline',state.editValues||{})+'</div><div id="inlineTimeline"></div><div class="notice">'+esc(t('editNotice'))+'</div><div class="actions"><button id="saveInline" class="button primary" type="button">'+esc(t('save'))+'</button><button id="cancelInline" class="button" type="button">'+esc(t('cancel'))+'</button><span id="inlineStatus" class="status" role="status"></span></div>';nameSegments('inline');updateTimeline('inline');$('saveInline').onclick=saveEdit;$('cancelInline').onclick=()=>{state.inlineEdit=false;renderDetail()}}
async function loadEdit(row){state.selected=row;try{const values={};for(const f of FIELDS)values[f]=await callAppBridge({type:'GetCellValue',data:TABLE,payload:f+'/'+row});state.editValues=values;if(innerWidth>850){state.inlineEdit=true;renderInlineEdit();$('detailPanel').scrollIntoView({block:'start',behavior:'smooth'})}else{state.inlineEdit=false;$('editForm').innerHTML=buildForm('edit',values);nameSegments('edit');updateTimeline('edit');$('editStatus').textContent='';openModal('editModal')}}catch(e){alert(t('loadFail'))}}
async function saveEdit(){if(state.editing)return;const inline=!!state.inlineEdit,prefix=inline?'inline':'edit',obj=validate(prefix);if(!obj)return;state.editing=true;$(inline?'saveInline':'saveEdit').disabled=true;$(inline?'inlineStatus':'editStatus').textContent=t('loading');try{for(const f of FIELDS)await callAppBridge({type:'SetCellValue',data:TABLE,payload:f+'/'+state.selected+'/'+obj[f]});if(inline)state.inlineEdit=false;else closeModal('editModal');await refreshData();await selectRow(state.selected,false);alert(t('saved'))}catch(e){$(inline?'inlineStatus':'editStatus').textContent=t('saveError')}finally{state.editing=false;const button=$(inline?'saveInline':'saveEdit');if(button)button.disabled=false}}
async function deleteRow(row){if(!confirm(t('confirmDelete')))return;try{await callAppBridge({type:'DeleteRecord',data:TABLE,payload:row.toString()});state.selected=0;state.detail=null;closeModal('detailModal');closeModal('editModal');await refreshData();renderDetail()}catch(e){alert(t('deleteError'))}}
async function readInstructions(prefix){try{const file=await callAppBridge({type:'SelectFile'});if(!file)return;const content=await callAppBridge({type:'ReadFile',data:file});if(!content){alert(t('fileEmpty'));return}$(prefix+'-考试说明').value=content;updateSubmitReady()}catch(e){alert(t('fileFail'))}}
function wire(){document.addEventListener('click',async e=>{const nav=e.target.closest('[data-page]');if(nav){showPage(nav.dataset.page);return}const recent=e.target.closest('[data-recent]');if(recent){showPage('book');await selectRow(Number(recent.dataset.recent));return}const action=e.target.closest('[data-action]');if(action){const a=action.dataset.action,row=Number(action.dataset.row||state.selected);if(a==='go-create')showPage('create');else if(a==='view')await selectRow(row);else if(a==='edit')await loadEdit(row);else if(a==='delete')await deleteRow(row);else if(a==='refresh')await refreshPlan();else if(a==='prev')await selectRow(state.selected-1,false);else if(a==='next')await selectRow(state.selected+1,false);return}const segment=e.target.closest('[data-segment]');if(segment){const group=$(segment.dataset.segment+'-'+segment.dataset.field);group.querySelectorAll('button').forEach(b=>b.classList.toggle('selected',b===segment));return}const file=e.target.closest('[data-file-for]');if(file){await readInstructions(file.dataset.fileFor);return}const card=e.target.closest('.book-list [data-row]');if(card){await selectRow(Number(card.dataset.row));return}if($('mobileMenu').classList.contains('open')&&!e.target.closest('#topbar'))closeMenu()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('editModal').classList.contains('open'))closeModal('editModal');else if($('detailModal').classList.contains('open'))closeModal('detailModal');else closeMenu()}if((e.key==='Enter'||e.key===' ')&&e.target.matches('.book-list [data-row]')){e.preventDefault();selectRow(Number(e.target.dataset.row))}});$('brand').onclick=()=>{try{parent.closeFullHtml(false)}catch(e){}};$('menuButton').onclick=()=>{const open=$('mobileMenu').classList.toggle('open');$('menuButton').setAttribute('aria-expanded',String(open))};$('desktopLang').onclick=$('mobileLang').onclick=()=>{setLanguage(state.lang==='cn'?'en':'cn');closeMenu()};$('heroCreate').onclick=$('bookCreate').onclick=()=>showPage('create');$('goBook').onclick=()=>showPage('book');document.querySelectorAll('[data-stat]').forEach(b=>b.onclick=()=>setBookFilter(b.dataset.stat));$('submitPlan').onclick=submitPlan;$('clearPlan').onclick=clearCreate;$('saveEdit').onclick=saveEdit;$('cancelEdit').onclick=$('closeEdit').onclick=()=>closeModal('editModal');$('closeDetail').onclick=()=>closeModal('detailModal');for(const id of ['detailModal','editModal'])$(id).addEventListener('click',e=>{if(e.target===$(id))closeModal(id)});for(const id of ['searchClass','filterStage','filterSubject','filterRange','sortOrder'])$(id).addEventListener(id==='searchClass'?'input':'change',renderBook);document.addEventListener('input',e=>{if(e.target.id?.startsWith('create-'))updateTimeline('create');if(e.target.id?.startsWith('edit-'))updateTimeline('edit')});document.addEventListener('focusin',e=>{if(e.target.matches('input,textarea,select'))setTimeout(()=>e.target.scrollIntoView({block:'center',behavior:'smooth'}),250)});if(window.visualViewport)visualViewport.addEventListener('resize',()=>{const active=document.activeElement;if(active?.matches('input,textarea,select'))setTimeout(()=>active.scrollIntoView({block:'center',behavior:'smooth'}),100)});window.addEventListener('resize',()=>{if(innerWidth>850)closeMenu()})}
async function initialize(){state.lang=mode();wire();document.addEventListener('click',e=>{if($('mobileMenu').classList.contains('open')&&!e.target.closest('#mobileMenu')&&!e.target.closest('#menuButton'))closeMenu();if(e.target.closest('[data-recent]')){$('filterStage').value='';$('filterSubject').value='';$('filterRange').value='';$('searchClass').value=''}if(e.target.closest('[data-segment]'))queueMicrotask(updateSubmitReady)},true);document.addEventListener('input',e=>{updateSubmitReady();if(e.target.id?.startsWith('inline-'))updateTimeline('inline')});setLanguage(state.lang);await applyMode();await refreshData()}
document.addEventListener('DOMContentLoaded',()=>{(async () => { await initialize(); })();});
</script>
</body>
</html>
