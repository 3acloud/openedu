<section id="page-home" class="page active"><div class="hero"><div class="eyebrow">BIOLOGY <span style="color:var(--geo)">/ GEOGRAPHY</span></div><h1 data-i18n="appTitle">生地学考复习规划</h1><p data-i18n="heroText">依据本地当年考试说明、班级掌握情况和教学进度，倒排复习日程，兼顾生物实验操作或地理实践，生成后由教师审定使用</p><button id="hero-create" class="btn bio" type="button"><i class="fa-solid fa-plus"></i><span data-i18n="createOne">制定一份复习规划</span></button></div><div id="stats" class="stats"></div><div class="section-head"><div><h2 data-i18n="recent">最近制定</h2><p class="muted" data-i18n="recentHint">最新的班级复习规划</p></div></div><div id="recent-list" class="recent-grid"></div></section>
<section id="page-create" class="page"><div class="section-head"><div><h2 data-i18n="create">制定规划</h2><p class="muted" data-i18n="createHint">只填写班级与考点层面的信息。考试范围、形式、题型和实践项目仅来自所填考试说明；没写清的内容会在计划里标成待教师确认</p></div><button id="goto-book" class="btn" type="button" data-i18n="viewBook">查看规划册</button></div><div class="panel"><h3 data-i18n="createForm">制定复习规划</h3><form id="create-form" novalidate><div id="create-fields" class="form-grid"></div><div id="create-ruler"></div><div id="create-status" class="status" role="status"></div><div class="form-actions"><button id="create-submit" class="btn bio" type="submit" data-i18n="generate">生成复习计划</button><button id="create-clear" class="btn" type="button" data-i18n="clear">清空</button></div></form></div><div id="create-plan-panel" class="panel plan-panel hidden"><h3 class="plan-title" data-i18n="planBody">复习计划正文</h3><div class="notice" data-i18n="reviewNotice">本计划供教师审定后使用；缺失的考试范围、形式、题型或实践项目须待教师确认</div><div id="create-plan" class="markdown-body"></div></div></section>

<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

function selectFileA() {

    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {

                            i++;
                        }

                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符

                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

const state={lang:'cn',page:'home',history:[],rows:[],count:0,currentRow:0,detail:null,editing:false,polling:false,modal:null,filters:{stage:'all',subject:'all',range:'all',search:'',sort:'default'},loadVersion:0};
const $=id=>document.getElementById(id), tr=k=>T[state.lang][k]||k;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtValue(v){if(v==='初中')return tr('junior');if(v==='高中')return tr('senior');if(v==='生物')return tr('biology');if(v==='地理')return tr('geography');return String(v??'');}
function todayLocal(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function dayNum(s){const m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/);if(!m)return NaN;return Date.UTC(+m[1],+m[2]-1,+m[3])/86400000;}
function daysUntil(s){return dayNum(s)-dayNum(todayLocal());}
function toast(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.add('hidden'),3600);}
function setStatus(id,msg,kind=''){const e=$(id);e.textContent=msg;e.className='status '+kind;}
function dataRows(csv){return parseCSV(String(csv||'')).filter(r=>r.some(c=>c!==''));}
function recordFromRow(row,index){const o={row:index+1};for(let i=0;i<FIELDS.length;i++)o[FIELDS[i]]=row[i]??'';return o;}
function getCSV(fields){return callAppBridge({type:'GetTableCSV',data:SOURCE,payload:fields.join(',')});}
async function loadBook(){const version=++state.loadVersion;try{const [csv,count]=await Promise.all([getCSV(FIELDS),callAppBridge({type:'GetRecordCount',data:SOURCE})]);if(version!==state.loadVersion)return;state.rows=dataRows(csv).map(recordFromRow);state.count=Number(count)||state.rows.length;renderBookList();updateNavButtons();}catch(e){toast(tr('loadFail')+': '+e.message);}}
async function loadHome(){try{const [count,subjects,dates,recent]=await Promise.all([callAppBridge({type:'GetRecordCount',data:SOURCE}),getCSV(['学科']),getCSV(['考试日期']),getCSV(FIELDS)]);const sb=dataRows(subjects).map(r=>r[0]);const ds=dataRows(dates).map(r=>r[0]);const stats=[['total',Number(count)||0,'fa-layer-group','all'],['bioCount',sb.filter(x=>x==='生物').length,'fa-leaf','bio'],['geoCount',sb.filter(x=>x==='地理').length,'fa-earth-asia','geo'],['d14',ds.filter(x=>daysUntil(x)>=0&&daysUntil(x)<=14).length,'fa-calendar-days','within14']];$('stats').innerHTML=stats.map(([label,num,icon,filter])=>`<button class="card stat" type="button" data-stat="${filter}"><i class="fa-solid ${icon}"></i><strong>${num}</strong><span>${tr(label)}</span></button>`).join('');const rows=dataRows(recent).slice(0,5).map(recordFromRow);$('recent-list').innerHTML=rows.length?rows.map(r=>cardHTML(r,true)).join(''):`<div class="panel empty"><i class="fa-regular fa-folder-open"></i><p>${tr('emptyRecent')}</p><button class="btn bio" type="button" id="empty-create">${tr('goCreate')}</button></div>`;}catch(e){$('stats').innerHTML='';$('recent-list').innerHTML=`<div class="panel empty">${esc(tr('loadFail'))}</div>`;}}
function rangeOf(r){const d=daysUntil(r['考试日期']);return d<0?'passed':d<=14?'within14':'later';}
function filterRows(){let rows=state.rows.filter(r=>{const f=state.filters;return(!f.search||String(r['班级']).toLocaleLowerCase().includes(f.search.toLocaleLowerCase()))&&(f.stage==='all'||r['学段']===f.stage)&&(f.subject==='all'||r['学科']===f.subject)&&(f.range==='all'||rangeOf(r)===f.range)});if(state.filters.sort==='exam')rows=[...rows].sort((a,b)=>dayNum(a['考试日期'])-dayNum(b['考试日期'])||a.row-b.row);return rows;}
function subjectBadge(v){return `<span class="subject ${v==='生物'?'bio':'geo'}"><i class="fa-solid ${v==='生物'?'fa-leaf':'fa-earth-asia'}"></i>${esc(fmtValue(v))}</span>`;}
function cardHTML(r,recent=false){const d=daysUntil(r['考试日期']);const alert=Number.isFinite(d)&&d>=0&&d<=14?`<span class="warning-chip">${tr('noNew')}</span>`:'';return `<article class="card record-card ${state.currentRow===r.row&&!recent?'selected':''}" data-row="${r.row}" tabindex="0" role="button"><div class="record-head"><span class="small muted">${esc(fmtValue(r['学段']))}</span>${subjectBadge(r['学科'])}</div><h3>${esc(r['班级'])}</h3>${recent?'':`<p class="small">${tr('startDate')}: ${esc(r['复习开始日期'])}</p>`}<p class="small">${tr('examDate')}: ${esc(r['考试日期'])}${Number.isFinite(d)&&d>=0?` · ${tr('daysToExam')} ${d} ${tr('days')}`:''}</p><p class="small">${esc(r['每周可用课时'])} ${tr('weeklySuffix')}</p>${recent?'':`<p class="small summary">${tr('examGuide')}: ${esc(r['考试说明'])}</p>`}<p class="small summary">${tr('weak')}: ${esc(r['本班薄弱考点'])}</p>${alert}${recent?'':`<div class="card-actions"><button type="button" class="btn tiny" data-action="view" data-row="${r.row}">${tr('viewPlan')}</button><button type="button" class="btn tiny" data-action="edit" data-row="${r.row}">${tr('edit')}</button><button type="button" class="btn tiny danger" data-action="delete" data-row="${r.row}">${tr('delete')}</button></div>`}</article>`;}
function renderBookList(){$('book-list').innerHTML=filterRows().map(r=>cardHTML(r)).join('')||`<div class="panel empty"><i class="fa-regular fa-folder-open"></i>${tr('emptyBook')}</div>`;if(!state.currentRow)$('book-detail').innerHTML=`<div class="empty"><i class="fa-regular fa-hand-pointer"></i>${tr('emptyDetail')}</div>`;}
async function loadDetail(row){if(row<1||row>state.count)return;state.currentRow=row;state.editing=false;renderBookList();$('book-detail').innerHTML=`<div class="empty loading"><i class="fa-solid fa-spinner fa-spin"></i>${tr('waiting')}</div>`;const token=Symbol();state.detailToken=token;try{const d={row};for(const field of ALL_FIELDS){d[field]=await callAppBridge({type:'GetCellValue',data:SOURCE,payload:`${field}/${row}`});if(state.detailToken!==token)return;}state.detail=d;renderDetail();}catch(e){if(state.detailToken===token)$('book-detail').innerHTML=`<div class="empty">${esc(tr('loadFail'))}: ${esc(e.message)}</div>`;}}
function updateNavButtons(){if(state.page==='book'&&state.detail&&!state.editing)renderDetail();}
function datum(field,value,full=false){return `<div class="datum ${full?'full':''}"><span class="datum-label">${tr(FIELD_KEYS[field])}</span><span class="datum-value">${esc(fmtValue(value))}</span></div>`;}
function renderDetail(){const d=state.detail;if(!d||state.currentRow!==d.row)return;const n=daysUntil(d['考试日期']);const banner=n===0?tr('dayOf'):n>0&&n<=14?tr('noNewDetail'):'';const plan=String(d['复习计划']||'').trim();$('book-detail').innerHTML=`<div class="detail-header"><div><div class="small muted">${tr('pageOf').replace('{row}',d.row).replace('{count}',state.count)}</div><h3>${esc(d['班级'])}</h3>${subjectBadge(d['学科'])}</div><div class="detail-actions"><button class="btn icon" type="button" data-detail-action="prev" ${d.row<=1?'disabled':''} aria-label="previous"><i class="fa-solid fa-chevron-left"></i></button><button class="btn icon" type="button" data-detail-action="next" ${d.row>=state.count?'disabled':''} aria-label="next"><i class="fa-solid fa-chevron-right"></i></button><button class="btn tiny" type="button" data-detail-action="edit">${tr('edit')}</button><button class="btn tiny danger" type="button" data-detail-action="delete">${tr('delete')}</button></div></div><div class="detail-grid">${FIELDS.map(f=>datum(f,d[f],['考试说明','本班薄弱考点','当前教学进度'].includes(f))).join('')}<div class="datum"><span class="datum-label">${tr('daysToExam')}</span>${Number.isFinite(n)?n===0?tr('examToday'):n>0?`${n} ${tr('days')}`:tr('passed'):'—'}</div></div>${banner?`<div class="notice">${banner}</div>`:''}<div id="detail-ruler"></div><div class="detail-plan"><h4 class="plan-title">${tr('planBody')}</h4><div class="notice">${tr('reviewNotice')}</div>${plan?`<div id="detail-markdown" class="markdown-body"></div>`:`<p class="muted">${tr('pending')}</p><button class="btn" type="button" data-detail-action="refresh">${tr('refresh')}</button>`}</div>`;if(plan)renderMarkdown($('detail-markdown'),plan);drawRuler('detail-ruler',d['复习开始日期'],d['考试日期']);}
function renderMarkdown(el,md){if(!el)return;if(window.marked&&window.DOMPurify){const raw=marked.parse(md,{gfm:true,breaks:true});el.innerHTML=DOMPurify.sanitize(raw,{ADD_ATTR:['target']});}else{el.textContent=md;}for(const img of el.querySelectorAll('img')){const raw=img.getAttribute('src')||'';if(!raw)continue;const a=document.createElement('a');a.href=raw.startsWith('http')?raw:'http://' + window.location.hostname + ':3130/download/'+encodeURIComponent(raw);a.download='';img.replaceWith(a);a.appendChild(img);}}
function drawRuler(id,start,end){const el=$(id),a=dayNum(start),b=dayNum(end),t=dayNum(todayLocal());if(!el)return;if(!Number.isFinite(a)||!Number.isFinite(b)||b<=a){el.innerHTML='';return;}const pct=Math.max(0,Math.min(100,((t-a)/(b-a))*100));const alert=Math.min(100,1400/(b-a));el.innerHTML=`<div class="ruler"><div class="ruler-track"><span class="ruler-alert" style="width:${alert}%"></span>${t>=a&&t<=b?`<span class="ruler-today" style="left:${pct}%"></span>`:''}</div><div class="ruler-labels"><span>${esc(start)}</span><span>${esc(end)}</span></div><div class="ruler-key"><span>${tr('today')}</span><span>${tr('within14')}</span></div></div>`;}
function fieldHTML(prefix,field){const id=`${prefix}-${FIELD_KEYS[field]}`,label=tr(FIELD_KEYS[field]);if(field==='学段'||field==='学科'){const opts=field==='学段'?['初中','高中']:['生物','地理'];return `<div class="field"><label>${label}</label><div class="segmented" id="${id}-choices">${opts.map(v=>`<button type="button" data-choice="${esc(v)}" aria-pressed="false">${esc(fmtValue(v))}</button>`).join('')}</div><input type="hidden" id="${id}" name="${esc(field)}"><div id="${id}-error" class="field-error"></div></div>`;}const long=['考试说明','本班薄弱考点','当前教学进度'].includes(field);const type=field.includes('日期')?'date':field==='每周可用课时'?'number':'text';const attrs=type==='number'?'min="1" step="1"':'';return `<div class="field ${long?'full':''}"><label for="${id}">${label}</label>${long?`<textarea id="${id}" name="${esc(field)}" ${field==='本班薄弱考点'?`placeholder="${esc(tr('weakPlaceholder'))}"`:''}></textarea>`:`<input id="${id}" name="${esc(field)}" type="${type}" ${attrs}>`}${field==='考试说明'?`<div class="file-row"><button class="btn tiny" type="button" data-read-file="${prefix}"><i class="fa-solid fa-file-arrow-up"></i>${tr('fromFile')}</button></div>`:''}<div id="${id}-error" class="field-error"></div></div>`;}
function buildFields(prefix,values={}){const el=$(prefix+'-fields');el.innerHTML=FIELDS.map(f=>fieldHTML(prefix,f)).join('');for(const field of FIELDS)setField(prefix,field,values[field]??'');el.oninput=()=>{validate(prefix,false);drawFormRuler(prefix);};el.onchange=()=>{validate(prefix,false);drawFormRuler(prefix);};}
function setField(prefix,field,value){const id=`${prefix}-${FIELD_KEYS[field]}`;$(id).value=value;const group=$(id+'-choices');if(group)for(const b of group.querySelectorAll('button')){const active=b.dataset.choice===value;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active));}}
function formData(prefix){const out={};for(const f of FIELDS)out[f]=$(prefix+'-'+FIELD_KEYS[f]).value.trim();return out;}
function validate(prefix,show){const d=formData(prefix);let valid=true;for(const f of FIELDS){let msg='';if(!d[f])msg=tr('required');if(f==='考试日期'&&d['复习开始日期']&&d[f]&&dayNum(d[f])<=dayNum(d['复习开始日期']))msg=tr('badDates');if(f==='每周可用课时'&&d[f]&&!(Number(d[f])>0))msg=tr('badWeekly');$(prefix+'-'+FIELD_KEYS[f]+'-error').textContent=show?msg:'';if(msg)valid=false;}if(prefix==='create')$('create-submit').disabled=!valid||state.polling;return valid;}
function drawFormRuler(prefix){const d=formData(prefix);drawRuler(prefix+'-ruler',d['复习开始日期'],d['考试日期']);}
function clearCreate(){for(const f of FIELDS)setField('create',f,'');state.currentRow=0;state.detail=null;$('create-plan').innerHTML='';$('create-plan-panel').classList.add('hidden');setStatus('create-status','');drawFormRuler('create');validate('create',false);}
async function readExamFile(prefix){try{const name=await callAppBridge({type:'SelectFile'});if(!name)return;const content=await callAppBridge({type:'ReadFile',data:name});if(content==null||content==='')throw new Error('Empty file');setField(prefix,'考试说明',content);validate(prefix,false);}catch(e){toast(tr('fileFail'));}}
async function submitCreate(event){event.preventDefault();if(state.polling||!validate('create',true))return;const data=formData('create');state.polling=true;validate('create',false);setStatus('create-status',tr('submitted'));$('create-plan-panel').classList.remove('hidden');$('create-plan').textContent=tr('waiting');try{await callAppBridge({type:'SubmitRecord',data:TABLE,payload:JSON.stringify(data)});state.currentRow=1;await Promise.all([loadHome(),loadBook()]);await pollPlan();}catch(e){setStatus('create-status',tr('submitFail')+': '+e.message,'error');$('create-plan-panel').classList.add('hidden');}finally{state.polling=false;validate('create',false);}}
async function pollPlan(){const deadline=Date.now()+1800000;while(Date.now()<deadline){try{const text=await callAppBridge({type:'GetCellValue',data:SOURCE,payload:'复习计划/1'});if(String(text||'').trim()){renderMarkdown($('create-plan'),text);setStatus('create-status','', 'success');return;}}catch(e){setStatus('create-status',String(e.message||e),'error');}await new Promise(resolve=>setTimeout(resolve,1000));}setStatus('create-status',tr('timeout'),'error');$('create-plan').textContent=tr('timeout');}
function renderEdit(values){const d=state.detail;if(!d)return;state.editing=true;$('book-detail').innerHTML=`<div class="detail-header"><h3>${tr('edit')} · ${esc(d['班级'])}</h3></div><div class="notice">${tr('editNote')}</div><form id="edit-form" novalidate><div id="edit-fields" class="form-grid"></div><div id="edit-ruler"></div><div id="edit-status" class="status"></div><div class="form-actions"><button class="btn bio" type="submit" id="edit-save">${tr('save')}</button><button class="btn" type="button" id="edit-cancel">${tr('cancel')}</button></div></form>`;buildFields('edit',values||d);drawFormRuler('edit');$('edit-form').addEventListener('submit',saveEdit);$('edit-cancel').addEventListener('click',()=>{state.editing=false;renderDetail();});}
async function saveEdit(event){event.preventDefault();if(!validate('edit',true))return;const data=formData('edit'),row=state.currentRow;$('edit-save').disabled=true;setStatus('edit-status',tr('waiting'));try{for(const f of FIELDS)await callAppBridge({type:'SetCellValue',data:SOURCE,payload:`${f}/${row}/${data[f]}`});state.editing=false;await Promise.all([loadBook(),loadHome()]);await loadDetail(row);toast(tr('saved'));}catch(e){setStatus('edit-status',tr('saveFail')+': '+e.message,'error');$('edit-save').disabled=false;}}
function openDelete(row){state.modal={row};$('modal-title').textContent=tr('deleteTitle');$('modal-message').textContent=tr('deleteAsk');$('modal-cancel').textContent=tr('cancel');$('modal-confirm').textContent=tr('confirm');$('modal-backdrop').classList.remove('hidden');}

function setPage(page,push=true){if(!['home','create','book'].includes(page))return Promise.resolve();if(push&&page!==state.page)state.history.push({page:state.page,scroll:window.scrollY});state.page=page;for(const p of document.querySelectorAll('.page'))p.classList.toggle('active',p.id==='page-'+page);for(const b of document.querySelectorAll('[data-page]'))b.classList.toggle('active',b.dataset.page===page);closeMenu();window.scrollTo(0,0);if(page==='home')return loadHome();if(page==='book')return loadBook();return Promise.resolve();}
async function openBook(filter='all',row=0){state.filters={stage:'all',subject:filter==='bio'?'生物':filter==='geo'?'地理':'all',range:filter==='within14'?'within14':'all',search:'',sort:'default'};fillFilters();state.currentRow=0;state.detail=null;await setPage('book');if(row){await loadDetail(row);}else renderBookList();}
function toggleMenu(force){const show=force??$('mobile-menu').classList.contains('hidden');$('mobile-menu').classList.toggle('hidden',!show);$('menu-shield').classList.toggle('hidden',!show);$('menu-button').setAttribute('aria-expanded',String(show));}
function closeMenu(){toggleMenu(false);}
function fitNav(){const nav=$('nav-links'),menu=$('menu-button'),lang=$('lang-button');nav.classList.remove('hidden');lang.classList.remove('hidden');menu.style.setProperty('display','none','important');const inner=document.querySelector('.nav-inner');const needed=$('brand').scrollWidth+nav.scrollWidth+lang.scrollWidth+95;const compact=inner.clientWidth<needed;if(compact){nav.classList.add('hidden');lang.classList.add('hidden');menu.style.setProperty('display','inline-flex','important');}else closeMenu();}
function languageDefault(){const url=new URLSearchParams(location.search).get('lang');if(url==='cn'||url==='en')return url;const stored=localStorage.getItem('iThinkAir_UiLanguage');if(stored)return stored==='en'?'en':'cn';const langs=navigator.languages;if(!langs||!langs.length)return'cn';return langs.some(x=>/^zh(?:-|$)/i.test(x))?'cn':'en';}
function setLanguage(lang){const editValues=state.editing&&$('edit-stage')?formData('edit'):null;state.lang=lang;document.documentElement.lang=lang==='cn'?'zh-CN':'en';localStorage.setItem('iThinkAir_UiLanguage',lang);for(const el of document.querySelectorAll('[data-i18n]'))el.textContent=tr(el.dataset.i18n);for(const el of document.querySelectorAll('[data-placeholder]'))el.placeholder=tr(el.dataset.placeholder);$('lang-button').textContent=lang==='cn'?'EN':'中';$('mobile-lang').textContent=lang==='cn'?'English':'中文';fillFilters();buildFields('create',formDataIfBuilt('create'));drawFormRuler('create');validate('create',false);loadHome();renderBookList();if(state.editing)renderEdit(editValues);else if(state.detail)renderDetail();fitNav();}
function formDataIfBuilt(prefix){return $(prefix+'-stage')?formData(prefix):{};}
function fillFilters(){const options=(id,items,value)=>{const el=$(id);el.innerHTML=items.map(([v,k])=>`<option value="${v}">${tr(k)}</option>`).join('');el.value=value;};options('book-stage',[['all','all'],['初中','junior'],['高中','senior']],state.filters.stage);options('book-subject',[['all','all'],['生物','biology'],['地理','geography']],state.filters.subject);options('book-range',[['all','all'],['within14','within14'],['later','later'],['passed','passed']],state.filters.range);options('book-sort',[['default','defaultSort'],['exam','examSort']],state.filters.sort);$('book-search').value=state.filters.search;}
window.airBack=function(){if(state.modal){closeModal();return'false';}if(!$('mobile-menu').classList.contains('hidden')){closeMenu();return'false';}if(state.editing){state.editing=false;renderDetail();return'false';}const prev=state.history.pop();if(!prev)return'true';setPage(prev.page,false);requestAnimationFrame(()=>window.scrollTo(0,prev.scroll));return'false';};
async function initialize(){state.lang=languageDefault();setLanguage(state.lang);try{const mode=await callAppBridge({type:'模式'});document.body.classList.toggle('dark',String(mode).trim()==='暗色');}catch(e){}$('brand').addEventListener('click',()=>{if(parent&&typeof parent.closeFullHtml==='function')parent.closeFullHtml(false);});document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));$('menu-button').addEventListener('click',()=>toggleMenu());$('menu-shield').addEventListener('click',closeMenu);$('lang-button').addEventListener('click',()=>setLanguage(state.lang==='cn'?'en':'cn'));$('mobile-lang').addEventListener('click',()=>{setLanguage(state.lang==='cn'?'en':'cn');closeMenu();});$('hero-create').addEventListener('click',()=>setPage('create'));$('goto-book').addEventListener('click',()=>openBook());$('book-create').addEventListener('click',()=>setPage('create'));$('create-form').addEventListener('submit',submitCreate);$('create-clear').addEventListener('click',clearCreate);$('modal-cancel').addEventListener('click',closeModal);$('modal-confirm').addEventListener('click',confirmDelete);$('modal-backdrop').addEventListener('click',e=>{if(e.target===$('modal-backdrop'))closeModal();});for(const [id,key] of [['book-search','search'],['book-stage','stage'],['book-subject','subject'],['book-range','range'],['book-sort','sort']])$(id).addEventListener(id==='book-search'?'input':'change',e=>{state.filters[key]=e.target.value;renderBookList();});$('stats').addEventListener('click',e=>{const b=e.target.closest('[data-stat]');if(b)openBook(b.dataset.stat);});$('recent-list').addEventListener('click',e=>{if(e.target.closest('#empty-create')){setPage('create');return;}const card=e.target.closest('[data-row]');if(card)openBook('all',Number(card.dataset.row));});$('book-list').addEventListener('click',async e=>{const action=e.target.closest('[data-action]');if(action){const row=Number(action.dataset.row);if(action.dataset.action==='delete'){openDelete(row);return;}await loadDetail(row);if(action.dataset.action==='edit')renderEdit();return;}const card=e.target.closest('.record-card');if(card)loadDetail(Number(card.dataset.row));});$('book-list').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('record-card')){e.preventDefault();loadDetail(Number(e.target.dataset.row));}});$('book-detail').addEventListener('click',async e=>{const b=e.target.closest('[data-detail-action]');if(!b)return;const a=b.dataset.detailAction;if(a==='prev')loadDetail(state.currentRow-1);if(a==='next')loadDetail(state.currentRow+1);if(a==='edit')renderEdit();if(a==='delete')openDelete(state.currentRow);if(a==='refresh'&&state.currentRow)loadDetail(state.currentRow);});document.addEventListener('click',e=>{const choice=e.target.closest('[data-choice]');if(choice){const group=choice.parentElement;const input=group.nextElementSibling;setField(group.id.startsWith('create')?'create':'edit',input.name,choice.dataset.choice);validate(group.id.startsWith('create')?'create':'edit',false);}const file=e.target.closest('[data-read-file]');if(file)readExamFile(file.dataset.readFile);});document.addEventListener('focusin',e=>{if(e.target.matches('input,textarea,select'))setTimeout(()=>e.target.scrollIntoView({block:'center',behavior:'smooth'}),250);});if(window.visualViewport)visualViewport.addEventListener('resize',()=>{const active=document.activeElement;if(active&&active.matches('input,textarea,select'))setTimeout(()=>active.scrollIntoView({block:'center',behavior:'smooth'}),120);});new ResizeObserver(fitNav).observe(document.querySelector('.nav-inner'));window.addEventListener('resize',fitNav);fitNav();}
document.addEventListener('DOMContentLoaded', () => {(async () => { await initialize(); })();});
</script>
</body>
