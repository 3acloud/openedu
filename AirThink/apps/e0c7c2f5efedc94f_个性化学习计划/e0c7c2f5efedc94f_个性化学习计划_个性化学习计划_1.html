<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>个性化学习计划</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  :root {
    --nav: #1b2444;
    --nav-text: #f7f1e6;
    --bg: #f3eee4;
    --paper: #fffdf8;
    --ink: #2a261f;
    --muted: #6f675c;
    --line: #e5d9c6;
    --amber: #b7832f;
    --amber-strong: #8d6418;
    --amber-soft: #f6e7cb;
    --danger: #c46a55;
    --danger-strong: #8d4030;
    --danger-soft: #f8e6e1;
    --shadow: 0 10px 28px rgba(60, 42, 16, 0.08);
    --shadow-lift: 0 16px 34px rgba(60, 42, 16, 0.14);
    --sage: #4f6e49;
    --sage-bg: #e5f0e2;
    --sky: #246f88;
    --sky-bg: #e1f3f8;
    --indigo: #334484;
    --indigo-bg: #e6e9f6;
    --manuscript-line: rgba(176, 142, 82, 0.22);
    --overlay: rgba(28, 24, 18, 0.46);
    --keyboard-inset: 0px;
  }
  body[data-theme="dark"] {
    --nav: #0e1428;
    --nav-text: #f6efe4;
    --bg: #14110e;
    --paper: #241f19;
    --ink: #f4ecdf;
    --muted: #b7ab9a;
    --line: #3c3329;
    --amber: #e0b15a;
    --amber-strong: #f0d7a2;
    --amber-soft: #3a2e18;
    --danger: #e08a76;
    --danger-strong: #ffd0c6;
    --danger-soft: #3a2420;
    --shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    --shadow-lift: 0 18px 40px rgba(0, 0, 0, 0.48);
    --sage: #b7d0ae;
    --sage-bg: #243024;
    --sky: #8fd0e4;
    --sky-bg: #1a3038;
    --indigo: #c3cdf5;
    --indigo-bg: #242a44;
    --manuscript-line: rgba(224, 177, 90, 0.14);
    --overlay: rgba(0, 0, 0, 0.62);
  }
  * { box-sizing: border-box; }
  input, select, textarea { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; max-width: 100%; }
  html { overflow-x: hidden; }
  body {
    font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(980px 420px at 8% -10%, rgba(224, 177, 90, 0.18), transparent 55%),
      var(--bg);
    line-height: 1.6;
    font-size: 16px;
    min-height: 100vh;
  }
  body[data-theme="light"] { color-scheme: light; }
  body[data-theme="dark"] { color-scheme: dark; }
  button, input, select, textarea { font-family: inherit; color: inherit; }
  button { cursor: pointer; }
  h1, h2, h3, p { overflow-wrap: anywhere; }
  #navShell {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1001;
    padding-top: env(safe-area-inset-top);
  }
  #topNav {
    background: var(--nav);
    color: var(--nav-text);
    box-shadow: 0 10px 28px rgba(8, 10, 24, 0.22);
  }
  #navRow {
    display: flex;
    flex-wrap: nowrap;
    align-items: center;
    gap: 8px;
    min-height: 64px;
    padding: 0 16px;
    overflow: hidden;
  }
  .nav-spacer { flex: 1 1 auto; min-width: 0; height: 1px; }
  #navBrand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
    flex: 0 1 auto;
    max-width: calc(100% - 56px);
    background: transparent;
    color: var(--nav-text);
    border: 0;
    padding: 8px 0;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.01em;
  }
  #navBrand i { color: var(--amber); font-size: 20px; flex: 0 0 auto; }
  #navAppName {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  #navTabs {
    display: flex;
    flex-wrap: nowrap;
    align-items: stretch;
    gap: 2px;
    white-space: nowrap;
    flex: 0 0 auto;
    min-width: max-content;
  }
  #navTabs button {
    background: transparent;
    color: var(--nav-text);
    border: 0;
    padding: 18px 14px 16px;
    font-size: 15px;
    white-space: nowrap;
    border-bottom: 2px solid transparent;
  }
  #navTabs button.is-active {
    color: #f3ddb0;
    border-bottom-color: var(--amber);
  }
  #langToggle {
    flex: 0 0 auto;
    background: transparent;
    color: var(--nav-text);
    border: 1px solid rgba(243, 221, 176, 0.45);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 13px;
    font-weight: 700;
  }
  #navBurger {
    flex: 0 0 auto;
    margin-left: 0;
    width: 42px;
    height: 42px;
    border-radius: 12px;
    border: 1px solid rgba(247, 241, 230, 0.2);
    background: transparent;
    color: var(--nav-text);
    font-size: 18px;
  }
  #mobileMenu {
    display: flex;
    flex-direction: column;
    background: #151c36;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
  }
  body[data-theme="dark"] #mobileMenu { background: #0b1020; }
  #mobileMenu button {
    text-align: left;
    background: transparent;
    color: var(--nav-text);
    border: 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    padding: 14px 18px;
    font-size: 16px;
  }
  #mobileMenu button.is-active { color: #f3ddb0; box-shadow: inset 3px 0 0 var(--amber); }
  #mobileLangRow {
    display: flex;
    gap: 8px;
    padding: 12px 16px 16px;
  }
  #mobileLangRow button {
    border: 1px solid rgba(243, 221, 176, 0.35);
    border-radius: 999px;
    padding: 8px 14px;
    border-bottom: 1px solid rgba(243, 221, 176, 0.35);
  }
  #mobileLangRow button.is-active { background: var(--amber); color: #1b2444; }
  .page[hidden], #mobileMenu[hidden], #langToggle[hidden], #navBurger[hidden], #navTabs[hidden],
  .overlay[hidden], [hidden] { display: none !important; }
  .wrap { max-width: 1120px; margin: 0 auto; }
  .page { padding: 28px 18px 72px; }
  .page-head {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 20px;
  }
  .page-head h1 { margin: 0; font-size: 32px; line-height: 1.25; font-weight: 700; }
  .page-head p { margin: 8px 0 0; color: var(--muted); max-width: 740px; }
  .head-action { margin-left: auto; }
  .btn {
    border: 0;
    border-radius: 12px;
    padding: 11px 16px;
    font-size: 15px;
    font-weight: 700;
    line-height: 1.3;
  }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-primary { background: var(--amber); color: #1d160c; }
  .btn-danger { background: var(--danger); color: #fffaf7; }
  .btn-ghost {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--line);
  }
  .btn-danger-ghost {
    background: var(--danger-soft);
    color: var(--danger-strong);
    border: 1px solid transparent;
  }
  .btn-small { padding: 8px 12px; font-size: 13px; border-radius: 10px; }
  .stats { display: flex; flex-wrap: wrap; gap: 14px; margin: 8px 0 26px; }
  .stat-card {
    flex: 1 1 180px;
    text-align: left;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--shadow);
    padding: 16px 16px 14px;
    min-height: 112px;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  .stat-card i { color: var(--amber); font-size: 16px; }
  .stat-label { display: block; margin-top: 8px; color: var(--muted); font-size: 14px; }
  .stat-count { display: block; margin-top: 4px; font-size: 32px; line-height: 1.1; font-weight: 700; }
  .section-title { margin: 0 0 12px; font-size: 22px; }
  .card-wall { display: flex; flex-wrap: wrap; gap: 16px; }
  .note-card {
    position: relative;
    flex: 1 1 280px;
    max-width: 100%;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--shadow);
    padding: 16px 16px 14px 20px;
    overflow: hidden;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  .note-card::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 6px;
    background: linear-gradient(180deg, var(--amber), rgba(183, 131, 47, 0.25));
  }
  @media (min-width: 980px) {
    .note-card { flex-basis: calc(33.333% - 16px); max-width: calc(33.333% - 11px); }
  }
  .note-card.is-clickable { cursor: pointer; }
  .stage-tag {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .tag-sage { background: var(--sage-bg); color: var(--sage); }
  .tag-sky { background: var(--sky-bg); color: var(--sky); }
  .tag-indigo { background: var(--indigo-bg); color: var(--indigo); }
  .tag-muted { background: var(--line); color: var(--muted); }
  .goal-title { margin: 10px 0 6px; font-size: 18px; line-height: 1.4; font-weight: 700; }
  .card-weak { margin: 0 0 10px; color: var(--ink); }
  .meta-list { list-style: none; margin: 0; padding: 0; color: var(--muted); font-size: 14px; }
  .meta-list li { margin: 4px 0; }
  .meta-list i { width: 18px; color: var(--amber-strong); }
  .card-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .empty-card, .status-line, .paper-card, .manuscript {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--shadow);
  }
  .empty-card { padding: 28px 22px; text-align: center; }
  .empty-card i { font-size: 28px; color: var(--amber); }
  .empty-card p { margin: 10px 0 16px; }
  .empty-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .status-line { padding: 16px 18px; color: var(--muted); }
  .form-error { color: var(--danger-strong); margin: 8px 0; }
  .plan-layout { display: flex; flex-wrap: wrap; gap: 18px; align-items: stretch; }
  .plan-layout > * { flex: 1 1 340px; min-width: 0; }
  .paper-card { padding: 18px 18px 20px; }
  .paper-card h2, .manuscript-head h2 { margin: 0; font-size: 20px; }
  #formPlanFields { border: 0; margin: 0; padding: 0; min-width: 0; }
  .field { margin-top: 14px; }
  .field label, .filter-field span, .search-field span {
    display: block;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 6px;
    color: var(--muted);
  }
  .req::after { content: " *"; color: var(--danger); }
  .stage-options { display: flex; flex-wrap: wrap; gap: 8px; }
  .stage-option {
    flex: 1 1 140px;
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px;
    background: var(--bg);
    cursor: pointer;
  }
  .stage-option.is-selected {
    border-color: var(--amber);
    background: var(--amber-soft);
    box-shadow: inset 0 0 0 1px var(--amber);
  }
  textarea, input[type="text"], input[type="number"], input[type="date"], input[type="search"], select {
    width: 100%;
    border: 1px solid var(--line);
    background: var(--bg);
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 16px;
    outline: none;
  }
  textarea { min-height: 92px; resize: vertical; }
  textarea:focus, input:focus, select:focus { border-color: var(--amber); }
  .hint { margin: 8px 0 0; color: var(--amber-strong); font-size: 14px; }
  .save-note {
    margin-top: 12px;
    padding: 10px 12px;
    border-radius: 12px;
    background: var(--amber-soft);
    color: var(--ink);
  }
  .form-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .manuscript { padding: 0; overflow: hidden; min-height: 420px; display: flex; flex-direction: column; }
  .manuscript-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
  }
  .manuscript-body {
    padding: 22px 18px 28px 46px;
    min-height: 360px;
    background-color: var(--paper);
    background-image:
      linear-gradient(to right, transparent 28px, rgba(196, 106, 85, 0.55) 28px, rgba(196, 106, 85, 0.55) 30px, transparent 30px),
      repeating-linear-gradient(to bottom, transparent 0, transparent 31px, var(--manuscript-line) 32px);
    background-attachment: local;
  }
  .wait-box { text-align: center; padding: 48px 12px; }
  .wait-lamp { font-size: 28px; color: var(--amber); animation: lamp 1.6s ease-in-out infinite; }
  @keyframes lamp { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 16px;
    align-items: flex-end;
  }
  .search-field { flex: 1 1 240px; }
  .filter-field { flex: 1 1 140px; }
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 2000;
    background: var(--overlay);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 18px;
  }
  #confirmOverlay { z-index: 2300; }
  #htmlOverlay { z-index: 2200; }
  .dialog {
    width: min(860px, 100%);
    max-height: calc(100vh - 56px);
    overflow: auto;
    background: #fffdf8;
    color: #2a261f;
    border-radius: 18px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
  }
  body[data-theme="dark"] .dialog { background: #241f19; color: #f4ecdf; }
  #confirmDialog { width: min(440px, 100%); background: #fffdf8; }
  body[data-theme="dark"] #confirmDialog { background: #241f19; }
  .dialog-head, .dialog-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 14px 16px;
  }
  .dialog-head { border-bottom: 1px solid var(--line); }
  .dialog-foot { border-top: 1px solid var(--line); flex-wrap: wrap; justify-content: flex-end; }
  .dialog-head h2 { margin: 0; font-size: 20px; }
  .icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
  }
  .dialog-body { padding: 16px 18px 20px; }
  .detail-dl { margin: 0; }
  .detail-dl div { margin-bottom: 12px; }
  .detail-dl dt { font-size: 12px; font-weight: 700; color: var(--muted); }
  .detail-dl dd { margin: 2px 0 0; }
  .markdown-body { line-height: 1.7; overflow-wrap: anywhere; }
  .markdown-body h1, .markdown-body h2, .markdown-body h3,
  .markdown-body h4, .markdown-body h5, .markdown-body h6 { line-height: 1.35; margin: 1.1em 0 0.45em; }
  .markdown-body h1 { font-size: 1.7em; }
  .markdown-body h2 { font-size: 1.4em; }
  .markdown-body h3 { font-size: 1.2em; }
  .markdown-body p { margin: 0.6em 0; }
  .markdown-body ul, .markdown-body ol { margin: 0.4em 0 0.4em 1.2em; padding: 0; }
  .markdown-body blockquote {
    margin: 0.8em 0;
    padding: 0.2em 0 0.2em 12px;
    border-left: 3px solid var(--amber);
    color: var(--muted);
  }
  .markdown-body code {
    font-family: Consolas, "Courier New", monospace;
    background: var(--amber-soft);
    padding: 0.1em 0.35em;
    border-radius: 6px;
    font-size: 0.92em;
  }
  .markdown-body pre {
    overflow: auto;
    padding: 12px;
    border-radius: 12px;
    background: #1b2444;
    color: #f7f1e6;
  }
  .markdown-body pre code { background: transparent; color: inherit; padding: 0; }
  .md-table-wrap { overflow-x: auto; max-width: 100%; margin: 0.8em 0; }
  .markdown-body table { border-collapse: collapse; min-width: 420px; }
  .markdown-body th, .markdown-body td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; }
  .markdown-body th { background: var(--amber-soft); }
  .markdown-body img { max-width: 100%; height: auto; border-radius: 8px; }
  .markdown-body hr { border: 0; border-top: 1px solid var(--line); margin: 1.2em 0; }
  .markdown-body a { color: var(--amber-strong); }
  .md-task { display: flex; gap: 8px; align-items: flex-start; }
  #htmlFrame { width: 100%; height: min(70vh, 720px); border: 0; background: white; }
  .toast {
    position: fixed;
    z-index: 3000;
    left: 50%;
    bottom: calc(24px + var(--keyboard-inset, 0px));
    transform: translateX(-50%);
    background: #1b2444;
    color: #f7f1e6;
    padding: 10px 14px;
    border-radius: 999px;
    box-shadow: var(--shadow-lift);
    max-width: calc(100% - 32px);
  }
  body.modal-open { overflow: hidden; }
  @media (hover: hover) {
    .stat-card:hover, .note-card.is-clickable:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lift);
    }
  }
  @media (max-width: 768px) {
    .page { padding-bottom: calc(140px + env(safe-area-inset-bottom)); }
    .dialog-body { padding-bottom: calc(120px + env(safe-area-inset-bottom)); }
    .overlay.edge-to-edge { padding: 0; align-items: stretch; }
    .overlay.edge-to-edge .dialog {
      width: 100%;
      height: 100%;
      max-height: none;
      border-radius: 0;
      margin: 0;
    }
    .overlay.edge-to-edge #htmlFrame { height: calc(100vh - 64px); }
    body.keyboard-open .page,
    body.keyboard-open .form-panel,
    body.keyboard-open .dialog-body {
      padding-bottom: calc(48px + var(--keyboard-inset) + 32px + env(safe-area-inset-bottom));
    }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
</head>
<body data-theme="light">
<div id="navShell">
  <nav id="topNav" style="position: relative; z-index: 1001;">
    <div id="navRow">
      <button type="button" id="navBrand">
        <i class="fa-solid fa-book-open" aria-hidden="true"></i>
        <span id="navAppName" data-i18n="appName">个性化学习计划</span>
      </button>
      <div class="nav-spacer"></div>
      <div id="navTabs">
        <button type="button" id="navTabHome" data-page="home" data-i18n="tabHome">首页</button>
        <button type="button" id="navTabPlan" data-page="plan" data-i18n="tabPlan">制定计划</button>
        <button type="button" id="navTabShelf" data-page="shelf" data-i18n="tabShelf">计划书架</button>
      </div>
      <button type="button" id="langToggle">EN</button>
      <button type="button" id="navBurger" hidden aria-expanded="false" aria-controls="mobileMenu" data-i18n-aria="menuLabel" aria-label="打开菜单">
        <i class="fa-solid fa-bars" aria-hidden="true"></i>
      </button>
    </div>
    <div id="mobileMenu" hidden>
      <button type="button" id="mobileTabHome" data-page="home" data-i18n="tabHome">首页</button>
      <button type="button" id="mobileTabPlan" data-page="plan" data-i18n="tabPlan">制定计划</button>
      <button type="button" id="mobileTabShelf" data-page="shelf" data-i18n="tabShelf">计划书架</button>
      <div id="mobileLangRow">
        <button type="button" id="mobileLangZh" data-i18n="langZh">中文</button>
        <button type="button" id="mobileLangEn" data-i18n="langEn">English</button>
      </div>
    </div>
  </nav>
</div>

<main>
  <section class="page" id="pageHome">
    <div class="wrap">
      <div class="page-head">
        <div>
          <h1 id="homeTitle" data-i18n="homeTitle">个性化学习计划</h1>
          <p id="homeIntro" data-i18n="homeIntro">按学段、目标、薄弱点和可用时间，生成可执行的一周或三十天计划</p>
        </div>
        <button type="button" class="btn btn-primary head-action" id="btnHomeNew" data-i18n="newPlan">+ 制定新计划</button>
      </div>
      <div class="stats" id="statRow">
        <button type="button" class="stat-card" id="statAll">
          <i class="fa-solid fa-book-open" aria-hidden="true"></i>
          <span class="stat-label" data-i18n="statAll">全部计划</span>
          <strong class="stat-count" id="statAllCount">…</strong>
        </button>
        <button type="button" class="stat-card" id="statPrimary">
          <i class="fa-solid fa-leaf" aria-hidden="true"></i>
          <span class="stat-label" data-i18n="statPrimary">小学高段</span>
          <strong class="stat-count" id="statPrimaryCount">…</strong>
        </button>
        <button type="button" class="stat-card" id="statJunior">
          <i class="fa-solid fa-cloud-sun" aria-hidden="true"></i>
          <span class="stat-label" data-i18n="statJunior">初中</span>
          <strong class="stat-count" id="statJuniorCount">…</strong>
        </button>
        <button type="button" class="stat-card" id="statSenior">
          <i class="fa-solid fa-graduation-cap" aria-hidden="true"></i>
          <span class="stat-label" data-i18n="statSenior">高中</span>
          <strong class="stat-count" id="statSeniorCount">…</strong>
        </button>

<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }

          return "";
        }



        url = 'http://' + window.location.hostname + ':3130/request';
        const response = await fetch(url, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function selectImageA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*'; // 限制只选择图片文件
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        // 可选：进一步验证文件确实是图片
        if (!file.type.startsWith('image/')) {
          reject(new Error('选择的文件不是图片'));
          return;
        }
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择（注意：cancel事件在某些浏览器中可能不支持）
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function capturePhotoA() {
  return new Promise((resolve, reject) => {
    // 检查浏览器是否支持媒体设备API
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      reject(new Error('您的浏览器不支持拍照功能'));
      return;
    }
    
    // 创建一个隐藏的视频元素用于预览
    const video = document.createElement('video');
    video.style.display = 'none';
    video.setAttribute('autoplay', '');
    video.setAttribute('playsinline', '');
    
    // 创建一个canvas元素用于捕获照片
    const canvas = document.createElement('canvas');
    canvas.style.display = 'none';
    const ctx = canvas.getContext('2d');
    
    // 创建拍照按钮和取消按钮的容器
    const container = document.createElement('div');
    container.style.cssText = `
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    `;
    
    // 创建视频预览容器
    const videoContainer = document.createElement('div');
    videoContainer.style.cssText = `
      width: 100%;
      max-width: 640px;
      max-height: 70vh;
      overflow: hidden;
      border-radius: 8px;
      margin-bottom: 20px;
    `;
    
    // 将视频放入容器中
    video.style.cssText = `
      width: 100%;
      height: auto;
      transform: scaleX(-1); /* 镜像翻转，让预览更自然 */
    `;
    
    // 创建按钮容器
    const buttonContainer = document.createElement('div');
    buttonContainer.style.cssText = `
      display: flex;
      gap: 20px;
    `;
    
    // 创建拍照按钮
    const captureBtn = document.createElement('button');
    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}



/**

 */
async function uploadToFlaskA(file)
{
  // 创建FormData对象
  const formData = new FormData();
  formData.append('file', file);
  
  try {
    // 发送到Flask服务端
    const response = await fetch('http://' + window.location.hostname + ':3130/upload', {
      method: 'POST',
      body: formData,
    });
    
    if (!response.ok) {
      throw new Error(`上传失败: ${response.statusText}`);
    }
    
    const result = await response.text();
    return result;
  }
  catch (error)
  {
  }
  return ""
}    


        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

        function setInnerHTMLWithScripts(element, html) {
             element.innerHTML = html;
             // 执行内联脚本
             const scripts = element.querySelectorAll('script');
             scripts.forEach(oldScript => {
                 const newScript = document.createElement('script');
                 newScript.text = oldScript.text;
                 oldScript.parentNode.replaceChild(newScript, oldScript);
             });
         }

        function base64DecodeUTF8(base64Str) {
            // 使用atob解码Base64得到二进制字符串
            const binaryStr = atob(base64Str);
    
            // 将二进制字符串转换为字节数组
            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) {
                bytes[i] = binaryStr.charCodeAt(i);
            }
    
            // 使用TextDecoder将字节数组解码为UTF-8字符串
            const decoder = new TextDecoder('utf-8');
            return decoder.decode(bytes);
        }

function getQueryParam(name) {
  var search = window.location && window.location.search ? window.location.search : "";
  if (search.charAt(0) === "?") search = search.substring(1);
  if (!search) return "";
  var parts = search.split("&");
  for (var i = 0; i < parts.length; i++) {
    var kv = parts[i].split("=");
    var key = "";
    try { key = decodeURIComponent(kv[0] || ""); } catch (e) { key = kv[0] || ""; }
    if (key === name) {
      try { return decodeURIComponent(kv.slice(1).join("=") || ""); } catch (e2) { return kv.slice(1).join("=") || ""; }
    }
  }
  return "";
}

function detectLanguage() {

  if (langParam === "en") return "en";
  try {
    var stored = localStorage.getItem("iThinkAir_UiLanguage");
    if (stored != null && stored !== "") return stored === "en" ? "en" : "zh";
  } catch (e) {}
  try {
    var list = navigator.languages;
    if (list == null || typeof list.length !== "number") return "zh";
    if (list.length === 0) {
      var one = navigator.language || navigator.userLanguage || "";
      if (!one) return "zh";
      return /^zh/i.test(String(one)) ? "zh" : "en";
    }
    for (var i = 0; i < list.length; i++) {
      if (/^zh/i.test(String(list[i] || ""))) return "zh";
    }
    return "en";
  } catch (err) {
    return "zh";
  }
}

function isPositiveInt(v) {
  var s = String(v == null ? "" : v).trim();
  if (!/^[1-9]\d*$/.test(s)) return false;
  var n = Number(s);
  return isFinite(n) && Math.floor(n) === n && n > 0;
}

function normalizeIntInput(raw) {
  var s = String(raw == null ? "" : raw).trim();
  if (/^[1-9]\d*$/.test(s)) return s;
  if (/^[1-9]\d*\.0+$/.test(s)) return s.replace(/\.0+$/, "");

function normalizeDateInput(raw) {
  var s = String(raw == null ? "" : raw).trim();
  var m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
  if (!m) return "";
  return m[1] + "-" + pad2(m[2]) + "-" + pad2(m[3]);
}

function examStatus(raw) {
  var s = String(raw == null ? "" : raw).trim();
  if (!s) return { kind: "empty" };
  var m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
  if (!m) return { kind: "raw", raw: s };
  var exam = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  var now = new Date();
  var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var diff = Math.round((Date.UTC(exam.getFullYear(), exam.getMonth(), exam.getDate()) - Date.UTC(today.getFullYear(), today.getMonth(), today.getDate())) / 86400000);
  var dateText = m[1] + "-" + pad2(m[2]) + "-" + pad2(m[3]);
  if (diff < 0) return { kind: "past", date: dateText, days: diff };
  return { kind: "left", date: dateText, days: diff };
}

function examLine(raw) {
  var status = examStatus(raw);
  if (status.kind === "empty") return t("examEmpty");
  if (status.kind === "raw") return status.raw;
  if (status.kind === "past") return status.date + " · " + t("examPast");
  return status.date + " · " + tf("examLeft", { n: status.days });
}

function summarizeWeak(text) {

function csvToRecords(csvText) {
  var text = stripBom(csvText);
  if (!String(text).trim()) return [];
  var table = parseCSV(text);
  var records = [];
  for (var i = 0; i < table.length; i++) {
    var cols = table[i] || [];
    records.push({
      row: i + 1,
      stage: cols[0] || "",
      goal: cols[1] || "",
      weak: cols[2] || "",
      weekday: cols[3] || "",
      weekend: cols[4] || "",
      slot: cols[5] || "",
      exam: cols[6] || ""
    });
  }
  return records;
}

function parseCount(text) {
  var m = String(text == null ? "" : text).trim().match(/-?\d+/);
  if (!m) return null;
  return parseInt(m[0], 10);
}

function countStages(records) {
  var primary = 0;
  var junior = 0;
  var senior = 0;
  for (var i = 0; i < records.length; i++) {
    if (records[i].stage === "小学高段") primary++;
    else if (records[i].stage === "初中") junior++;
    else if (records[i].stage === "高中") senior++;
  }
  return { primary: primary, junior: junior, senior: senior };
}

  try {

  } catch (err) { countErr = err; }
  if (token !== homeLoadToken) return;
  try {
    csvText = await callAppBridge({ type: "GetTableCSV", data: SOURCE, payload: CSV_FIELDS });
  } catch (err2) { csvErr = err2; }
  if (token !== homeLoadToken) return;
  if (csvErr) {
    homeRecords = [];
    homeCount = countErr ? null : parseCount(countText);
    homeState = "error";
    homeErrorText = errorText("loadFail", csvErr);
  } else if (countErr) {
    homeRecords = csvToRecords(csvText);
    homeCount = null;
    homeState = "error";
    homeErrorText = errorText("loadFail", countErr);

  for (var i = 0; i < shelfRecords.length; i++) {
    var rec = shelfRecords[i];
    if (stage && rec.stage !== stage) continue;
    var hasExam = String(rec.exam || "").trim() !== "";
    if (exam === "filled" && !hasExam) continue;
    if (exam === "empty" && hasExam) continue;
    if (q) {
      var blob = (String(rec.goal) + "\n" + String(rec.weak) + "\n" + String(rec.slot)).toLowerCase();
      if (blob.indexOf(q) === -1) continue;
    }
    out.push(rec);

}

  actions.appendChild(actionButton("edit", "btn btn-ghost btn-small", function (e) {
    e.stopPropagation();
    openEdit(rec.row);
  }));
  actions.appendChild(actionButton("delete", "btn btn-danger-ghost btn-small", function (e) {
    e.stopPropagation();
    performDelete(rec.row);
  }));
  card.appendChild(actions);
  card.addEventListener("click", function () { openEdit(rec.row); });
  card.addEventListener("keydown", function (e) {
    if (e.target !== card) return;
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      openEdit(rec.row);
    }
  });
  return card;
}

function renderManuscript() {
  var body = el("manuscriptBody");
  var copyBtn = el("btnCopyManuscript");
  body.className = "manuscript-body";
  body.innerHTML = "";
  if (manuscriptMode === "loading") {
    copyBtn.disabled = true;
    var loading = document.createElement("p");
    loading.className = "wait-box";
    loading.textContent = t("loading");
    body.appendChild(loading);
    return;
  }
  if (manuscriptMode === "wait") {
    copyBtn.disabled = true;
    body.appendChild(waitBlock(t("waitMsg")));
    return;
  }
  if (manuscriptMode === "timeout") {
    copyBtn.disabled = true;
    var timeout = document.createElement("p");
    timeout.className = "wait-box";
    timeout.textContent = t("timeoutMsg");
    body.appendChild(timeout);
    return;
  }
  if (!String(manuscriptSource || "").trim()) {
    copyBtn.disabled = true;
    var empty = document.createElement("p");
    empty.className = "wait-box";
    empty.textContent = editMode ? t("manuscriptNotReady") : t("manuscriptEmpty");
    body.appendChild(empty);
    return;
  }
  copyBtn.disabled = false;
  body.classList.add("markdown-body");
  body.innerHTML = renderMarkdown(manuscriptSource);
}

function waitBlock(message) {
  var wrap = document.createElement("div");
  wrap.className = "wait-box";
  var icon = document.createElement("div");
  icon.className = "wait-lamp";
  icon.innerHTML = '<i class="fa-solid fa-lightbulb" aria-hidden="true"></i>';
  var title = document.createElement("h3");
  title.textContent = t("appName");
  var p = document.createElement("p");
  p.textContent = message;
  wrap.appendChild(icon);
  wrap.appendChild(title);
  wrap.appendChild(p);
  return wrap;
}

async function pollManuscript(row) {
  var token = ++manuscriptPollToken;
  var started = Date.now();
  submitting = true;
  el("formPlanFields").disabled = true;
  updateSubmitState();
  manuscriptMode = "wait";
  manuscriptSource = "";
  renderManuscript();
  try { el("manuscriptCard").scrollIntoView({ behavior: "smooth", block: "nearest" }); } catch (e) {}
  while (token === manuscriptPollToken) {
    if (Date.now() - started >= POLL_TIMEOUT_MS) {
      manuscriptMode = "timeout";
      renderManuscript();
      submitting = false;
      el("formPlanFields").disabled = false;
      updateSubmitState();
      return;
    }
    try {
      var text = await withTimeout(callAppBridge({
        type: "GetCellValue",
        data: SOURCE,
        payload: "学习计划内容/" + row
      }), 15000);
      if (token !== manuscriptPollToken) return;
      if (text != null && String(text).trim() !== "") {
        manuscriptSource = String(text);
        manuscriptMode = "ready";
        renderManuscript();
        submitting = false;
        el("formPlanFields").disabled = false;
        updateSubmitState();
        return;
      }
    } catch (err) {
      if (token !== manuscriptPollToken) return;
    }
    await sleep(POLL_INTERVAL_MS);
    if (token !== manuscriptPollToken) return;
  }
}

function withTimeout(promise, ms) {
  return new Promise(function (resolve, reject) {
    var done = false;
    var timer = setTimeout(function () {
      if (done) return;
      done = true;
      reject(new Error("timeout"));
    }, ms);
    promise.then(function (value) {
      if (done) return;
      done = true;
      clearTimeout(timer);
      resolve(value);
    }, function (err) {
      if (done) return;
      done = true;
      clearTimeout(timer);
      reject(err);
    });
  });
}

    el("planError").hidden = false;

  currentRow = 1;
  editMode = false;
  updatePlanModeUI();
  pollManuscript(1);
}

async function loadEdit(row) {
  var token = ++editLoadToken;
  formActionToken++;
  stopManuscriptPoll();
  editMode = true;
  currentRow = row;
  updatePlanModeUI();
  clearFormFields();
  manuscriptSource = "";
  manuscriptMode = "loading";
  renderManuscript();
  el("formPlanFields").disabled = true;
  var values = {};
  try {
    for (var i = 0; i < DETAIL_FIELDS.length; i++) {
      if (token !== editLoadToken) return;
      var name = DETAIL_FIELDS[i];
      var value = await callAppBridge({ type: "GetCellValue", data: SOURCE, payload: name + "/" + row });
      if (token !== editLoadToken) return;
      values[name] = value == null ? "" : String(value);
    }
  } catch (err) {
    if (token !== editLoadToken) return;
    el("formPlanFields").disabled = false;
    el("planError").hidden = false;
    el("planError").textContent = errorText("loadFail", err);
    updateSubmitState();
    return;
  }
  if (token !== editLoadToken) return;
  fillForm(values);
  manuscriptSource = values["学习计划内容"] || "";
  manuscriptMode = String(manuscriptSource).trim() ? "ready" : "empty";
  renderManuscript();
  el("formPlanFields").disabled = false;
  updateSubmitState();

async function openDetail(row, source) {
  var token = ++detailLoadToken;
  detailPollToken++;
  detailRow = row;
  detailSource = source;
  detailValues = null;
  detailState = "loading";
  detailErrorText = "";
  renderDetail();
  openPopup("detailOverlay");
  var values = {};
  try {
    for (var i = 0; i < DETAIL_FIELDS.length; i++) {
      if (token !== detailLoadToken) return;
      var name = DETAIL_FIELDS[i];
      var value = await callAppBridge({ type: "GetCellValue", data: SOURCE, payload: name + "/" + row });
      if (token !== detailLoadToken) return;
      values[name] = value == null ? "" : String(value);
    }
  } catch (err) {
    if (token !== detailLoadToken) return;
    detailState = "error";
    detailErrorText = errorText("loadFail", err);
    renderDetail();
    return;
  }
  if (token !== detailLoadToken || el("detailOverlay").hidden) return;
  detailValues = values;
  if (!String(values["学习计划内容"] || "").trim()) {
    detailState = "waiting";
    renderDetail();
    pollDetailContent(row, token);
  } else {
    detailState = "ready";
    renderDetail();
  }
}

async function pollDetailContent(row, loadToken) {
  var token = ++detailPollToken;
  var started = Date.now();
  while (token === detailPollToken && loadToken === detailLoadToken) {
    if (el("detailOverlay").hidden) return;
    if (Date.now() - started >= POLL_TIMEOUT_MS) {
      if (token !== detailPollToken) return;
      detailState = "timeout";
      renderDetail();
      return;
    }
    try {
      var text = await withTimeout(callAppBridge({
        type: "GetCellValue",
        data: SOURCE,
        payload: "学习计划内容/" + row
      }), 15000);
      if (token !== detailPollToken || loadToken !== detailLoadToken) return;
      if (text != null && String(text).trim() !== "") {
        if (!detailValues) detailValues = {};
        detailValues["学习计划内容"] = String(text);
        detailState = "ready";
        renderDetail();
        return;
      }
    } catch (err) {
      if (token !== detailPollToken) return;
    }
    await sleep(POLL_INTERVAL_MS);
  }
}

function renderDetail() {
  el("btnDetailCopy").hidden = detailSource !== "shelf";
  el("btnDetailClose").hidden = detailSource !== "shelf";
  var copyBtn = el("btnDetailCopy");
  var content = detailValues ? String(detailValues["学习计划内容"] || "") : "";
  copyBtn.disabled = !content.trim();
  var body = el("detailBody");
  body.innerHTML = "";
  if (detailState === "loading") {
    var loading = document.createElement("p");
    loading.textContent = t("loading");
    body.appendChild(loading);
    return;
  }
  if (detailState === "error" && !detailValues) {
    var err = document.createElement("p");
    err.textContent = detailErrorText || t("loadFail");
    body.appendChild(err);
    return;
  }
  var dl = document.createElement("dl");
  dl.className = "detail-dl";
  appendDetail(dl, "fieldStage", detailValues ? stageLabel(detailValues["学段"]) : "");
  appendDetail(dl, "fieldGoal", detailValues && String(detailValues["学习目标"] || "").trim() ? detailValues["学习目标"] : t("goalEmpty"));
  appendDetail(dl, "fieldWeak", detailValues && String(detailValues["薄弱点"] || "").trim() ? detailValues["薄弱点"] : t("weakEmpty"));
  appendDetail(dl, "fieldWeekday", detailValues ? minutesLine("weekdayShort", detailValues["平日每天可用分钟"]) : "");
  appendDetail(dl, "fieldWeekend", detailValues ? minutesLine("weekendShort", detailValues["周末每天可用分钟"]) : "");
  var slotRaw = detailValues ? String(detailValues["高效学习时段"] || "").trim() : "";
  appendDetail(dl, "fieldSlot", slotRaw || t("slotEmpty"));
  appendDetail(dl, "fieldExam", detailValues ? examLine(detailValues["考试日期"]) : t("examEmpty"));
  body.appendChild(dl);
  var contentTitle = document.createElement("h3");
  contentTitle.textContent = t("fieldContent");
  body.appendChild(contentTitle);
  var md = document.createElement("div");
  md.className = "markdown-body";
  if (detailState === "waiting") md.appendChild(waitBlock(t("waitMsg")));
  else if (detailState === "timeout") md.textContent = t("timeoutMsg");
  else if (!content.trim()) md.textContent = t("contentEmpty");
  else md.innerHTML = renderMarkdown(content);
  body.appendChild(md);

async function performDelete(row) {
  if (confirmResolver) return;
  var ok = await askConfirm(t("deleteConfirm"));
  if (!ok) return;
  try {
    await callAppBridge({ type: "DeleteRecord", data: SOURCE, payload: Number(row).toString() });
  } catch (err) {
    showToast(errorText("deleteFail", err));
    return;
  }
  if (currentRow > 0) {
    if (Number(currentRow) === Number(row)) {
      formActionToken++;
      editLoadToken++;
      stopManuscriptPoll();
      editMode = false;
      currentRow = 0;
      clearFormFields();
      clearManuscript();
      updatePlanModeUI();
    } else if (Number(row) < Number(currentRow)) {
      currentRow = Number(currentRow) - 1;

async function copyText(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) {}
  var area = document.createElement("textarea");
  area.value = text;
  area.setAttribute("readonly", "readonly");
  area.style.position = "fixed";
  area.style.left = "-9999px";
  document.body.appendChild(area);
  area.select();
  var ok = false;
  try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
  document.body.removeChild(area);
  return ok;
}

function imageTag(alt, url) {
  var href = fileUrl(url, "download");
  return '<a class="md-img-link" href="' + escapeAttr(href) + '" target="_blank" rel="noopener"><img src="' + escapeAttr(href) + '" alt="' + escapeAttr(alt) + '"></a>';
}

function linkTag(text, url) {
  var raw = String(url || "").trim();
  var href = raw;
  if (!/^https?:\/\//i.test(raw) && !/^mailto:/i.test(raw) && raw.charAt(0) !== "#") {
    href = /\.html?$/i.test(raw) ? fileUrl(raw, "private") : fileUrl(raw, "download");
  }
  return '<a href="' + escapeAttr(href) + '" target="_blank" rel="noopener">' + escapeHtml(text) + "</a>";
}

function renderInline(src) {
  var s = String(src || "");
  var tokens = [];
  function hold(html) {
    var id = tokens.length;
    tokens.push(html);
    return "\u0000T" + id + "\u0000";
  }
  s = s.replace(/\\([\\`*_{}\[\]()#+\-.!|>~])/g, function (_, ch) { return hold(escapeHtml(ch)); });
  s = s.replace(/`([^`\n]+)`/g, function (_, code) { return hold("<code>" + escapeHtml(code) + "</code>"); });
  s = s.replace(/!\[([^\]]*)\]\(\s*<?([^)\s>]+)>?(?:\s+["'][^"']*["'])?\s*\)/g, function (_, alt, url) {
    return hold(imageTag(alt, url));
  });
  s = s.replace(/\[([^\]]+)\]\(\s*<?([^)\s>]+)>?(?:\s+["'][^"']*["'])?\s*\)/g, function (_, text, url) {
    return hold(linkTag(text, url));
  });
  s = s.replace(/<(https?:\/\/[^>\s]+)>/g, function (_, url) { return hold(linkTag(url, url)); });
  s = escapeHtml(s);
  s = s.replace(/\*\*\*([^*]+)\*\*\*/g, "<strong><em>$1</em></strong>");
  s = s.replace(/___([^_]+)___/g, "<strong><em>$1</em></strong>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/__([^_]+)__/g, "<strong>$1</strong>");
  s = s.replace(/~~([^~]+)~~/g, "<del>$1</del>");
  s = s.replace(/(^|[\s(])\*([^*\n]+)\*(?=$|[\s).,;:!?])/g, "$1<em>$2</em>");
  s = s.replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
  s = s.replace(/(^|[\s(])_([^_\n]+)_(?=$|[\s).,;:!?])/g, "$1<em>$2</em>");
  s = s.replace(/\u0000T(\d+)\u0000/g, function (_, id) { return tokens[Number(id)] || ""; });
  s = s.replace(/\n/g, "<br>");
  return s;
}

function splitTableRow(line) {
  var s = String(line || "").trim();
  if (s.charAt(0) === "|") s = s.substring(1);
  if (s.charAt(s.length - 1) === "|") s = s.substring(0, s.length - 1);
  var cells = [];
  var cur = "";
  for (var i = 0; i < s.length; i++) {
    var ch = s.charAt(i);
    if (ch === "\\" && i + 1 < s.length) { cur += s.charAt(i + 1); i++; continue; }
    if (ch === "|") { cells.push(cur.trim()); cur = ""; continue; }
    cur += ch;
  }
  cells.push(cur.trim());
  return cells;
}

function isTableSeparator(line) {
  if (line.indexOf("-") === -1) return false;
  var cells = splitTableRow(line);
  if (!cells.length) return false;
  for (var i = 0; i < cells.length; i++) {
    if (!/^:?-{3,}:?$/.test(cells[i].replace(/\s/g, ""))) return false;
  }
  return true;
}

function alignmentOf(cell) {
  var c = cell.replace(/\s/g, "");
  var left = c.charAt(0) === ":";
  var right = c.charAt(c.length - 1) === ":";
  if (left && right) return "center";
  if (right) return "right";
  return "left";
}

function readTable(lines, index) {
  var header = splitTableRow(lines[index]);
  var aligns = splitTableRow(lines[index + 1]);
  var html = '<div class="md-table-wrap"><table><thead><tr>';
  for (var h = 0; h < header.length; h++) {
    var align = alignmentOf(aligns[h] || "");
    html += '<th style="text-align:' + align + '">' + renderInline(header[h]) + "</th>";
  }
  html += "</tr></thead><tbody>";
  var i = index + 2;
  while (i < lines.length && /\|/.test(lines[i]) && String(lines[i]).trim() !== "") {
    var cells = splitTableRow(lines[i]);
    html += "<tr>";
    for (var c = 0; c < header.length; c++) {
      var alignCell = alignmentOf(aligns[c] || "");
      html += '<td style="text-align:' + alignCell + '">' + renderInline(cells[c] || "") + "</td>";
    }
    html += "</tr>";
    i++;
  }
  html += "</tbody></table></div>";
  return { html: html, next: i };
}

function unindent(blockLines) {
  var min = 999;
  for (var i = 0; i < blockLines.length; i++) {
    if (!String(blockLines[i]).trim()) continue;
    var m = /^(\s*)/.exec(blockLines[i]);
    if (m && m[1].length < min) min = m[1].length;
  }
  if (min === 999 || min === 0) return blockLines.join("\n");
  var out = [];
  for (var j = 0; j < blockLines.length; j++) {
    if (!String(blockLines[j]).trim()) out.push("");
    else out.push(blockLines[j].substring(min));
  }
  return out.join("\n");
}

function readList(lines, index) {
  var first = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/.exec(lines[index] || "");
  if (!first) return null;
  var baseIndent = first[1].length;
  var ordered = /^\d/.test(first[2]);
  var items = [];
  while (index < lines.length) {
    if (/^\s*$/.test(lines[index])) {
      var nxt = lines[index + 1] || "";
      var blankItem = /^(\s*)([-*+]|\d+[.)])\s+/.exec(nxt);
      if (blankItem && blankItem[1].length === baseIndent && ((/^\d/.test(blankItem[2])) === ordered)) {
        index++;
        continue;
      }
      break;
    }
    var m = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/.exec(lines[index]);
    if (!m || m[1].length !== baseIndent || ((/^\d/.test(m[2])) !== ordered)) break;
    var task = /^\[([ xX])\]\s+([\s\S]*)$/.exec(m[3]);
    var textLines = [task ? task[2] : m[3]];
    var childLines = [];
    index++;
    while (index < lines.length) {
      if (/^\s*$/.test(lines[index])) {
        var look = lines[index + 1] || "";
        var lead = /^(\s*)/.exec(look);
        var leadLen = lead ? lead[1].length : 0;
        var lookItem = /^(\s*)([-*+]|\d+[.)])\s+/.exec(look);
        if ((lookItem && lookItem[1].length > baseIndent) || (!lookItem && look.trim() && leadLen > baseIndent)) {
          childLines.push(lines[index]);
          index++;
          continue;
        }
        break;
      }
      var m2 = /^(\s*)([-*+]|\d+[.)])\s+/.exec(lines[index]);
      if (m2 && m2[1].length <= baseIndent) break;
      if (m2 && m2[1].length > baseIndent) {
        childLines.push(lines[index]);
        index++;
        continue;
      }
      var lead2 = /^(\s*)/.exec(lines[index]);
      if (lines[index].trim() && lead2 && lead2[1].length > baseIndent) {
        childLines.push(lines[index]);
        index++;
        continue;
      }
      if (lines[index].trim()) {
        textLines.push(lines[index].trim());
        index++;
        continue;
      }
      break;
    }
    var inner = "";
    if (task) {
      var checked = task[1].toLowerCase() === "x" ? " checked" : "";
      inner = '<label class="md-task"><input type="checkbox" disabled' + checked + "> <span>" + renderInline(textLines.join(" ")) + "</span></label>";
    } else {
      inner = "<p>" + renderInline(textLines.join(" ")) + "</p>";
    }
    if (childLines.length) inner += renderMarkdown(unindent(childLines));
    items.push("<li>" + inner + "</li>");
  }
  var tag = ordered ? "ol" : "ul";
  return { html: "<" + tag + ">" + items.join("") + "</" + tag + ">", next: index };
}

function isBlockStart(lines, index) {
  var line = lines[index] || "";
  if (/^\s*$/.test(line)) return true;
  if (/^(?:-{3,}|\*{3,}|_{3,})\s*$/.test(line)) return true;
  if (/^(#{1,6})\s+/.test(line)) return true;
  if (/^>\s?/.test(line)) return true;
  if (/^(\s*)([-*+]|\d+[.)])\s+/.test(line)) return true;
  if (/^(?: {4}|\t)\S/.test(line)) return true;
  if (/^\u0000F(\d+)\u0000$/.test(line.trim())) return true;
  if (index + 1 < lines.length && /^(?:=+|-+)\s*$/.test(lines[index + 1]) && line.trim()) return true;
  if (/\|/.test(line) && index + 1 < lines.length && isTableSeparator(lines[index + 1])) return true;
  return false;
}

function renderMarkdown(src) {
  var text = String(src || "").replace(/\r\n/g, "\n").replace(/\r/g, "\n");
  var fences = [];
  text = text.replace(/```([^\n`]*)\n([\s\S]*?)```/g, function (_, lang, code) {
    var id = fences.length;
    fences.push(code.replace(/\n$/, ""));
    return "\n\u0000F" + id + "\u0000\n";
  });
  var lines = text.split("\n");
  var html = [];
  var i = 0;
  while (i < lines.length) {
    var line = lines[i];
    var fence = /^\u0000F(\d+)\u0000$/.exec(String(line).trim());
    if (fence) {
      html.push('<pre class="md-pre"><code>' + escapeHtml(fences[Number(fence[1])] || "") + "</code></pre>");
      i++;
      continue;
    }
    if (/^\s*$/.test(line)) { i++; continue; }
    if (/^(?:-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { html.push("<hr>"); i++; continue; }
    var heading = /^(#{1,6})\s+(.+?)\s*#*\s*$/.exec(line);
    if (heading) {
      var level = heading[1].length;
      html.push("<h" + level + ">" + renderInline(heading[2]) + "</h" + level + ">");
      i++;
      continue;
    }
    if (i + 1 < lines.length && /^=+\s*$/.test(lines[i + 1]) && line.trim()) {
      html.push("<h1>" + renderInline(line.trim()) + "</h1>");
      i += 2;
      continue;
    }
    if (i + 1 < lines.length && /^-{3,}\s*$/.test(lines[i + 1]) && line.trim() && !/\|/.test(line)) {
      html.push("<h2>" + renderInline(line.trim()) + "</h2>");
      i += 2;
      continue;
    }
    if (/^>\s?/.test(line)) {
      var quoted = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) {
        quoted.push(lines[i].replace(/^>\s?/, ""));
        i++;
      }
      html.push("<blockquote>" + renderMarkdown(quoted.join("\n")) + "</blockquote>");
      continue;
    }
    if (/\|/.test(line) && i + 1 < lines.length && isTableSeparator(lines[i + 1])) {
      var table = readTable(lines, i);
      html.push(table.html);
      i = table.next;
      continue;
    }
    if (/^(\s*)([-*+]|\d+[.)])\s+/.test(line)) {
      var list = readList(lines, i);
      if (list) {
        html.push(list.html);
        i = list.next;
        continue;
      }
    }
    if (/^(?: {4}|\t)/.test(line)) {
      var codeLines = [];
      while (i < lines.length && (/^(?: {4}|\t)/.test(lines[i]) || (/^\s*$/.test(lines[i]) && /^(?: {4}|\t)/.test(lines[i + 1] || "")))) {
        codeLines.push(lines[i].replace(/^(?: {4}|\t)/, ""));
        i++;
      }
      html.push("<pre class=\"md-pre\"><code>" + escapeHtml(codeLines.join("\n").replace(/\n$/, "")) + "</code></pre>");
      continue;
    }
    var para = [];
    while (i < lines.length && String(lines[i]).trim() !== "" && !isBlockStart(lines, i)) {
      para.push(lines[i]);
      i++;
    }
    if (!para.length && i < lines.length) {
      para.push(lines[i]);
      i++;
    }
    var joined = "";
    for (var p = 0; p < para.length; p++) {
      if (p > 0) joined += /  $/.test(para[p - 1]) ? "\n" : " ";
      joined += String(para[p]).replace(/  $/, "");
    }
    html.push("<p>" + renderInline(joined) + "</p>");
  }
  return html.join("\n");
}

function bindKeyboard() {
  function updateInset() {
    var inset = 0;
    if (window.visualViewport) {
      inset = Math.max(0, window.innerHeight - window.visualViewport.height - window.visualViewport.offsetTop);
    }
    document.documentElement.style.setProperty("--keyboard-inset", inset + "px");
    document.body.classList.toggle("keyboard-open", inset > 80);
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", updateInset);
    window.visualViewport.addEventListener("scroll", updateInset);
  }
  document.addEventListener("focusin", function (e) {
    var target = e.target;
    if (!target || !target.tagName) return;
    var tag = target.tagName;
    if (tag !== "INPUT" && tag !== "TEXTAREA" && tag !== "SELECT") return;
    setTimeout(function () {
      try { target.scrollIntoView({ block: "center", behavior: "smooth" }); }
      catch (err) { target.scrollIntoView(); }
    }, 320);
  });
}

function bindEvents() {
  if (eventsBound) return;
  eventsBound = true;
  el("navBrand").addEventListener("click", function () {
    closeMobileMenu();
    if (window.parent && typeof window.parent.closeFullHtml === "function") window.parent.closeFullHtml(false);
  });
  var tabButtons = document.querySelectorAll("#navTabs button, #mobileMenu > button");
  for (var i = 0; i < tabButtons.length; i++) {
    tabButtons[i].addEventListener("click", function (e) {
      var page = e.currentTarget.getAttribute("data-page");
      if (page) showPage(page);
    });
  }
  el("langToggle").addEventListener("click", function () { setLanguage(uiLang === "en" ? "zh" : "en"); });
  el("mobileLangZh").addEventListener("click", function () { setLanguage("zh"); closeMobileMenu(); });
  el("mobileLangEn").addEventListener("click", function () { setLanguage("en"); closeMobileMenu(); });
  el("navBurger").addEventListener("click", function (e) {
    e.stopPropagation();
    toggleMobileMenu();
  });
  document.addEventListener("pointerdown", function (e) {
    var menu = el("mobileMenu");
    if (!menu || menu.hidden) return;
    var nav = el("topNav");
    if (nav && !nav.contains(e.target)) closeMobileMenu();
  });
  el("btnHomeNew").addEventListener("click", function () { openNewPlan(); });
  el("btnHomeFirst").addEventListener("click", function () { openNewPlan(); });
  el("statAll").addEventListener("click", function () { openShelfWithStage(""); });
  el("statPrimary").addEventListener("click", function () { openShelfWithStage("小学高段"); });
  el("statJunior").addEventListener("click", function () { openShelfWithStage("初中"); });
  el("statSenior").addEventListener("click", function () { openShelfWithStage("高中"); });
  el("btnViewShelf").addEventListener("click", function () { showPage("shelf"); });
  el("btnShelfNew").addEventListener("click", function () { openNewPlan(); });
  el("btnShelfEmptyNew").addEventListener("click", function () { openNewPlan(); });
  el("btnClearFilters").addEventListener("click", clearShelfFilters);
  el("shelfSearch").addEventListener("input", renderShelf);
  el("shelfStageFilter").addEventListener("change", renderShelf);
  el("shelfExamFilter").addEventListener("change", renderShelf);
  var form = el("formPlan");
  form.addEventListener("submit", function (e) { e.preventDefault(); });
  form.addEventListener("input", function () { updateStageHint(); updateSubmitState(); el("saveNote").hidden = true; });
  form.addEventListener("change", function () { updateStageHint(); updateSubmitState(); });
  el("btnSubmitPlan").addEventListener("click", function () {
    if (editMode) saveEdits();
    else submitNewPlan();
  });
  el("btnClearPlan").addEventListener("click", resetToNew);
  el("btnCancelEdit").addEventListener("click", resetToNew);
  el("btnSaveAsNew").addEventListener("click", saveAsNew);
  el("btnCopyManuscript").addEventListener("click", copyManuscript);
  el("btnDetailEdit").addEventListener("click", function () { if (detailRow) openEdit(detailRow); });
  el("btnDetailDelete").addEventListener("click", function () { if (detailRow) performDelete(detailRow); });
  el("btnDetailCopy").addEventListener("click", copyDetail);
  el("btnDetailClose").addEventListener("click", function () { closePopup("detailOverlay"); });
  el("btnDetailCloseX").addEventListener("click", function () { closePopup("detailOverlay"); });
  el("detailOverlay").addEventListener("click", function (e) { if (e.target === el("detailOverlay")) closePopup("detailOverlay"); });
  el("detailDialog").addEventListener("click", function (e) { e.stopPropagation(); });
  el("btnConfirmOk").addEventListener("click", function () { settleConfirm(true); });
  el("btnConfirmCancel").addEventListener("click", function () { settleConfirm(false); });
  el("btnHtmlClose").addEventListener("click", function () { closePopup("htmlOverlay"); });
  el("htmlOverlay").addEventListener("click", function (e) { if (e.target === el("htmlOverlay")) closePopup("htmlOverlay"); });
  el("htmlDialog").addEventListener("click", function (e) { e.stopPropagation(); });
  document.addEventListener("click", function (e) {
    var node = e.target;
    while (node && node !== document) {
      if (node.tagName === "A") {
        var inMd = false;
        var parent = node;
        while (parent) {
          if (parent.classList && parent.classList.contains("markdown-body")) { inMd = true; break; }
          parent = parent.parentNode;
        }
        if (inMd) {
          var href = node.getAttribute("href") || "";
          var isImg = node.classList && node.classList.contains("md-img-link");
          if (!isImg && /\.html?($|\?)/i.test(href)) {
            e.preventDefault();
            openHtmlViewer(href);
          }
        }
        return;
      }
      node = node.parentNode;
    }
  });
  window.addEventListener("resize", function () {
    updateNavMode();
    syncNavSpacer();
  });
  bindKeyboard();
}

async function initialize() {
  uiLang = detectLanguage();
  bindEvents();
  applyLanguage();
  updateNavMode();
  syncNavSpacer();
  renderManuscript();
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () {
      updateNavMode();
      syncNavSpacer();
    });
  }
  try {
    var mode = await callAppBridge({ type: "模式" });
    applyTheme(mode);
  } catch (err) {
    applyTheme("亮色");
  }
  await showPage("home", { record: false });
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", function () {
    (async () => {    await initialize();  })();
  });
} else {
  (async () => {    await initialize();  })();
}
</script>
