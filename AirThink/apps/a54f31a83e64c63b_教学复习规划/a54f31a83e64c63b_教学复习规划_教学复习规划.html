<script>
/* The bridge and CSV parser below are included verbatim from the request. */
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,
          "CapturePhoto": capturePhotoA,
          "FinishRecordVoice": FinishRecordVoiceA
        };

        // 检查请求类型是否在支持的映射中
        if (request['type'] in HANDLERS) {
          try {
            // 1. 根据类型选择相应的处理函数获取文件
            const file = await HANDLERS[request['type']]();
    
            // 2. 上传文件到Flask服务端
            const guidFileName = await uploadToFlaskA(file);
    
            // 3. 返回GUID文件名
            return guidFileName;
          } catch (error) {
            // 可以在这里添加错误处理逻辑，如日志记录
            console.error(`处理${request['type']}时出错:`, error);
          }
  
          // 所有失败情况返回空字符串
          return "";
        }



        url = 'http://' + window.location.hostname + ':3130/request';
        const response = await fetch(url, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'SessionID': localStorage.getItem('airthink_session_id'),
            'BaseName': encodeURIComponent("a54f31a83e64c63b_教学复习规划")
        },
        body: JSON.stringify(request)
        });
  
        if (!response.ok) {
            throw new Error(`请求失败: ${response.status}`);
        }
  
        return await response.text();
    }

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function selectImageA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*'; // 限制只选择图片文件
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        // 可选：进一步验证文件确实是图片
        if (!file.type.startsWith('image/')) {
          reject(new Error('选择的文件不是图片'));
          return;
        }
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择（注意：cancel事件在某些浏览器中可能不支持）
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function capturePhotoA() {
  return new Promise((resolve, reject) => {
    // 检查浏览器是否支持媒体设备API
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      reject(new Error('您的浏览器不支持拍照功能'));
      return;
    }
    
    // 创建一个隐藏的视频元素用于预览
    const video = document.createElement('video');
    video.style.display = 'none';
    video.setAttribute('autoplay', '');
    video.setAttribute('playsinline', '');
    
    // 创建一个canvas元素用于捕获照片
    const canvas = document.createElement('canvas');
    canvas.style.display = 'none';
    const ctx = canvas.getContext('2d');
    
    // 创建拍照按钮和取消按钮的容器
    const container = document.createElement('div');
    container.style.cssText = `
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    `;
    
    // 创建视频预览容器
    const videoContainer = document.createElement('div');
    videoContainer.style.cssText = `
      width: 100%;
      max-width: 640px;
      max-height: 70vh;
      overflow: hidden;
      border-radius: 8px;
      margin-bottom: 20px;
    `;
    
    // 将视频放入容器中
    video.style.cssText = `
      width: 100%;
      height: auto;
      transform: scaleX(-1); /* 镜像翻转，让预览更自然 */
    `;
    
    // 创建按钮容器
    const buttonContainer = document.createElement('div');
    buttonContainer.style.cssText = `
      display: flex;
      gap: 20px;
    `;
    
    // 创建拍照按钮
    const captureBtn = document.createElement('button');
    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}



/**
 * 上传文件到Flask服务端
 * @param {File} file - 要上传的文件
 * @returns {Promise<string>} - 返回GUID文件名
 */
async function uploadToFlaskA(file)
{
  // 创建FormData对象
  const formData = new FormData();
  formData.append('file', file);
  
  try {
    // 发送到Flask服务端
    const response = await fetch('http://' + window.location.hostname + ':3130/upload', {
      method: 'POST',
      body: formData,
    });
    
    if (!response.ok) {
      throw new Error(`上传失败: ${response.statusText}`);
    }
    
    const result = await response.text();
    return result;
  }
  catch (error)
  {
  }
  return ""
}    


        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

        function base64DecodeUTF8(base64Str) {
            // 使用atob解码Base64得到二进制字符串
            const binaryStr = atob(base64Str);
    
            // 将二进制字符串转换为字节数组
            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) {
                bytes[i] = binaryStr.charCodeAt(i);
            }
    
            // 使用TextDecoder将字节数组解码为UTF-8字符串
            const decoder = new TextDecoder('utf-8');
            return decoder.decode(bytes);
        }

function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function trunc(v,n){const a=[...String(v||'')];return esc(a.length>n?a.slice(0,n).join('')+'…':a.join(''));}
function typeLabel(v){return state.lang==='en'?(typeEn[v]||v):v;}
function typeClass(v){return ({'单元复习':'unit','期中复习':'mid','期末复习':'final','考前冲刺':'sprint'})[v]||'';}

function pad(n){return String(n).padStart(2,'0')}
function localDate(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function dayDiff(date){if(!/^\d{4}-\d{2}-\d{2}$/.test(date||''))return null;const [y,m,d]=date.split('-').map(Number);const test=new Date(y,m-1,d);if(test.getFullYear()!==y||test.getMonth()!==m-1||test.getDate()!==d)return null;const today=new Date();return Math.round((Date.UTC(y,m-1,d)-Date.UTC(today.getFullYear(),today.getMonth(),today.getDate()))/86400000)}
function countdown(date){const n=dayDiff(date), a=t('countdown');return n===null?a[4]:n<0?a[3]:n===0?a[2]:state.lang==='cn'?`${a[0]}${n}${a[1]}`:`${n}${a[1]}`}
function rowsFrom(csv){return parseCSV(String(csv||'')).map((cells,i)=>({row:i+1,学科:cells[0]||'',复习类型:cells[1]||'',复习范围:cells[2]||'',课标与章节关系:cells[3]||'',班级学情:cells[4]||'',考试日期:cells[5]||'',可用课时:cells[6]||''}))}
async function fetchRows(){const csv=await callAppBridge({type:'GetTableCSV',data:SOURCE,payload:FIELDS.join(',')});state.rows=rowsFrom(csv);return state.rows}

function message(s){const el=$('toast');el.textContent=s;el.hidden=false;clearTimeout(message.timer);message.timer=setTimeout(()=>el.hidden=true,4500)}

function pageTitle(i){return t('nav')[i]}
function hero(i,action){return `<div class="hero"><div><div class="eyebrow">${esc(t('app'))}</div><h1>${esc(pageTitle(i))}</h1><p>${esc([t('homeDesc'),t('composeDesc'),t('bookDesc'),t('boardDesc')][i])}</p></div>${action||''}</div>`}
function actionButton(label,go,icon){return `<button class="btn gold" type="button" data-go="${go}"><i class="fa-solid fa-${icon}"></i>${esc(label)}</button>`}
function renderNav(){ $('brandText').textContent=t('app');$('navlinks').innerHTML=pages.map((p,i)=>`<button type="button" class="${state.page===p?'active':''}" data-go="${p}">${esc(pageTitle(i))}</button>`).join('');$('mobilemenu').innerHTML=pages.map((p,i)=>`<button type="button" data-go="${p}">${esc(pageTitle(i))}</button>`).join('')+`<button type="button" id="mobileLang">${state.lang==='cn'?'English':'中文'}</button>`;$('langButton').textContent=state.lang==='cn'?'EN':'中文';requestAnimationFrame(checkNav)}
function checkNav(){const nav=$('topbar'), links=$('navlinks'), brand=$('brand'), tools=$('langButton');const needed=brand.scrollWidth+links.scrollWidth+tools.scrollWidth+90;nav.classList.toggle('compact',window.innerWidth<needed||window.innerWidth<700)}

function setLang(lang){state.lang=lang;document.documentElement.lang=lang==='cn'?'zh-CN':'en';localStorage.setItem('iThinkAir_UiLanguage',lang);renderNav();renderCurrent();if($('detailOverlay').classList.contains('open'))openDetail(state.detailRow,true);if($('editOverlay').classList.contains('open'))refreshEditLabels()}
function showPage(page,back=false){if(!pages.includes(page))return;if(page!==state.page){if(!back)state.history.push({page:state.page,y:window.scrollY});state.positions[state.page]=window.scrollY;state.page=page;closeMenu();document.querySelectorAll('.page').forEach(el=>el.classList.toggle('active',el.id===page));renderNav();renderCurrent();window.scrollTo(0,back?(state.positions[page]||0):0)}else{closeMenu();renderCurrent()}}
function stat(icon,label,value){return `<div class="stat"><i class="fa-solid fa-${icon}"></i><strong>${esc(value)}</strong><span>${esc(label)}</span></div>`}
function card(r,compact=false){const due=countdown(r.考试日期);return `<article class="card" tabindex="0" role="button" data-row="${r.row}"><div class="cardtop"><div><h3>${esc(r.学科||t('missing'))}</h3><div class="tags">${tag(r.复习类型)}</div></div><span class="small muted">${esc(due)}</span></div><p class="clamp">${esc(r.复习范围||t('missing'))}</p><div class="meta"><span><i class="fa-regular fa-calendar"></i> ${esc(r.考试日期||t('missing'))}</span><span><i class="fa-regular fa-clock"></i> ${esc(r.可用课时||'0')} ${esc(t('hours'))}</span></div>${compact?`<p class="small">${trunc(r.班级学情,36)}</p>`:`<p class="small"><b>${esc(t('fields')[3])}:</b> ${trunc(r.课标与章节关系,42)}</p><p class="small"><b>${esc(t('fields')[4])}:</b> ${trunc(r.班级学情,42)}</p><div class="actions"><button type="button" data-action="view" data-row="${r.row}">${esc(t('view'))}</button><button type="button" data-action="edit" data-row="${r.row}">${esc(t('edit'))}</button><button type="button" data-action="delete" data-row="${r.row}">${esc(t('del'))}</button></div>`}</article>`}
async function renderHome(){const el=$('home');el.innerHTML=hero(0,actionButton('+ '+t('make'),'compose','pen-to-square'))+`<div id="homeStats" class="stats"></div><div class="sectionhead"><h2>${esc(t('recent'))}</h2></div><div id="recentList" class="grid"></div>`;try{const [count,dateCsv,hoursCsv,typeCsv]=await Promise.all([callAppBridge({type:'GetRecordCount',data:SOURCE}),callAppBridge({type:'GetTableCSV',data:SOURCE,payload:'考试日期'}),callAppBridge({type:'GetTableCSV',data:SOURCE,payload:'可用课时'}),callAppBridge({type:'GetTableCSV',data:SOURCE,payload:'复习类型'})]);const upcoming=parseCSV(dateCsv).filter(a=>{const d=dayDiff(a[0]);return d!==null&&d>=0&&d<=30}).length;const hours=parseCSV(hoursCsv).reduce((sum,a)=>sum+(Number(a[0])||0),0);const sprint=parseCSV(typeCsv).filter(a=>a[0]==='考前冲刺').length;$('homeStats').innerHTML=[stat('layer-group',t('stats')[0],count),stat('calendar-check',t('stats')[1],upcoming),stat('hourglass-half',t('stats')[2],Number.isInteger(hours)?hours:hours.toFixed(2).replace(/0+$/,'').replace(/\.$/,'')),stat('fire-flame-curved',t('stats')[3],sprint)].join('');await fetchRows();$('recentList').innerHTML=state.rows.length?state.rows.slice(0,5).map(r=>card(r,true)).join(''):`<div class="empty"><i class="fa-regular fa-file-lines"></i>${esc(t('emptyRecent'))}</div>`}catch(e){error(e)}}
function fieldHTML(prefix,index,value=''){const name=FIELDS[index],label=t('fields')[index],id=`${prefix}_${index}`,wide=[3,4].includes(index),req=[0,1,2,6].includes(index),val=esc(value);let input;if(index===1)input=`<select id="${id}" name="${esc(name)}" ${req?'required':''}><option value="">${esc(t('selectType'))}</option>${TYPES.map(x=>`<option value="${x}" ${value===x?'selected':''}>${esc(typeLabel(x))}</option>`).join('')}</select>`;else if(wide)input=`<textarea id="${id}" name="${esc(name)}" placeholder="${index===4?esc(t('learningPlaceholder')):''}">${val}</textarea>`;else input=`<input id="${id}" name="${esc(name)}" type="${index===5?'date':index===6?'number':'text'}" ${index===6?'min="0.001" step="any"':''} ${req?'required':''} value="${val}" placeholder="${index===0?esc(t('subjectPlaceholder')):index===2?esc(t('scopePlaceholder')):''}">`;return `<div class="field ${wide?'wide':''}"><label for="${id}">${esc(label)}${req?' *':''}</label>${input}</div>`}
function renderCompose(){const el=$('compose');const oldForm=el.querySelector('#composeForm'),draft=oldForm?readForm(oldForm):null;const oldResult=el.querySelector('#composeResult'),keep=oldResult&&!oldResult.classList.contains('blank')?oldResult.innerHTML:'';el.innerHTML=hero(1,actionButton(t('viewBook'),'book','book'))+`<div class="compose"><div class="panel"><div class="panelheader"><h2>${esc(t('draft'))}</h2></div><form id="composeForm"><div class="formgrid">${FIELDS.map((f,i)=>fieldHTML('composeForm',i,draft?.[f]||'')).join('')}</div><div class="formactions"><button id="clearDraft" class="btn ghost" type="button">${esc(t('clear'))}</button><button id="submitPlan" class="btn" type="submit">${esc(t('generate'))}</button></div></form></div><div class="panel"><div class="panelheader"><h2>${esc(t('result'))}</h2></div><div id="composeResult" class="paper ${keep?'':'blank'}">${keep||`<div><i class="fa-regular fa-file-lines"></i><p>${esc(t('blank'))}</p></div>`}</div></div></div>`;$('submitPlan').disabled=state.busy}
function renderBook(){const el=$('book');el.innerHTML=hero(2,actionButton('+ '+t('make'),'compose','pen-to-square'))+`<div class="filters"><input id="bookSearch" class="search" type="search" placeholder="${esc(t('search'))}" value="${esc(state.search)}"><div id="bookChips" class="chips">${['',...TYPES].map(x=>`<button class="chip ${state.filter===x?'active':''}" data-filter="${esc(x)}" type="button">${esc(x?typeLabel(x):t('all'))}</button>`).join('')}</div><select id="bookSort" class="sort"><option value="original" ${state.sort==='original'?'selected':''}>${esc(t('sortOriginal'))}</option><option value="date" ${state.sort==='date'?'selected':''}>${esc(t('sortDate'))}</option></select></div><div id="bookList" class="grid"></div>`;renderBookList();fetchRows().then(()=>renderBookList()).catch(error)}
function renderBookList(){const el=$('bookList');if(!el)return;let rows=state.rows.filter(r=>(!state.filter||r.复习类型===state.filter)&&(!state.search||`${r.学科} ${r.复习范围}`.toLocaleLowerCase().includes(state.search.toLocaleLowerCase())));if(state.sort==='date')rows=[...rows].sort((a,b)=>(a.考试日期||'9999').localeCompare(b.考试日期||'9999')||a.row-b.row);el.innerHTML=rows.length?rows.map(r=>card(r)).join(''):`<div class="empty"><i class="fa-regular fa-folder-open"></i>${esc(t('noMatch'))}</div>`}
async function renderBoard(){const el=$('board');el.innerHTML=hero(3,'')+`<div id="boardStats" class="stats"></div><div class="boardgrid"><div class="panel"><h2>${esc(t('distribution'))}</h2><div id="typeGrid" class="typegrid"></div></div><div class="panel"><h2>${esc(t('investment'))}</h2><div id="hoursBars"></div></div></div><div class="sectionhead"><h2>${esc(t('timeline'))}</h2></div><div id="timeline" class="timeline"></div>`;try{const [dates,types,hours]=await Promise.all([callAppBridge({type:'GetTableCSV',data:SOURCE,payload:'考试日期'}),callAppBridge({type:'GetTableCSV',data:SOURCE,payload:'复习类型'}),callAppBridge({type:'GetTableCSV',data:SOURCE,payload:'学科,复习类型,可用课时,考试日期'})]);const days=parseCSV(dates).map(a=>dayDiff(a[0]));$('boardStats').innerHTML=[stat('calendar-day',t('summary')[0],days.filter(x=>x!==null&&x>=0).length),stat('calendar-xmark',t('summary')[1],days.filter(x=>x!==null&&x<0).length),stat('calendar-plus',t('summary')[2],days.filter(x=>x===null).length)].join('');const counts=Object.fromEntries(TYPES.map(x=>[x,0]));for(const a of parseCSV(types))if(a[0] in counts)counts[a[0]]++;const total=Object.values(counts).reduce((a,b)=>a+b,0);$('typeGrid').innerHTML=TYPES.map(x=>`<div class="typebox">${tag(x)}<strong>${counts[x]}</strong><span class="small muted">${total?Math.round(counts[x]/total*100):0}%</span></div>`).join('');const bySubject=new Map();for(const a of parseCSV(hours)){const subject=a[0]||t('missing');bySubject.set(subject,(bySubject.get(subject)||0)+(Number(a[2])||0))}const max=Math.max(0,...bySubject.values());$('hoursBars').innerHTML=bySubject.size?[...bySubject].sort((a,b)=>b[1]-a[1]).map(([s,n])=>`<div class="barrow"><span>${esc(s)}</span><div class="bartrack"><div class="barfill" style="width:${max?Math.max(1,n/max*100):0}%"></div></div><span>${esc(Number.isInteger(n)?n:n.toFixed(2))}</span></div>`).join(''):`<p class="muted">${esc(t('emptyData'))}</p>`;await fetchRows();const timeline=state.rows.filter(r=>dayDiff(r.考试日期)!==null).sort((a,b)=>a.考试日期.localeCompare(b.考试日期)||a.row-b.row);$('timeline').innerHTML=timeline.length?timeline.map(r=>`<article class="card" tabindex="0" role="button" data-row="${r.row}"><div class="cardtop"><strong>${esc(r.考试日期)}</strong><span class="small muted">${esc(countdown(r.考试日期))}</span></div><div class="tags">${tag(r.复习类型)} <strong>${esc(r.学科||t('missing'))}</strong></div><p>${esc(r.复习范围||t('missing'))}</p><div class="small muted">${esc(r.可用课时||'0')} ${esc(t('hours'))}</div></article>`).join(''):`<div class="empty"><i class="fa-regular fa-calendar"></i>${esc(t('emptyTimeline'))}</div>`}catch(e){error(e)}}
function renderCurrent(){if(state.page==='home')renderHome();if(state.page==='compose')renderCompose();if(state.page==='book')renderBook();if(state.page==='board')renderBoard()}
function readForm(form){return Object.fromEntries(FIELDS.map((f,i)=>[f,form.elements.namedItem(f)?.value.trim()||'']))}
function valid(data){return !!(data.学科&&TYPES.includes(data.复习类型)&&data.复习范围&&Number(data.可用课时)>0&&Number.isFinite(Number(data.可用课时)))}
function setBusy(b){state.busy=b;const btn=$('submitPlan');if(btn)btn.disabled=b}
function markdown(textValue){if(!textValue)return `<p class="muted">${esc(t('still'))}</p>`;if(!window.marked||!window.DOMPurify)return `<p>${esc(textValue).replace(/\n/g,'<br>')}</p>`;const raw=marked.parse(textValue,{gfm:true,breaks:true});return DOMPurify.sanitize(raw,{ADD_ATTR:['target','download']})}
function decorateMarkdown(container){for(const a of container.querySelectorAll('a')){a.target='_blank';a.rel='noopener noreferrer'}for(const img of container.querySelectorAll('img')){const original=img.getAttribute('src')||'';if(original&&!/^(?:https?:|data:|blob:|\/)/i.test(original))img.src='http://' + window.location.hostname + ':3130/download/'+encodeURIComponent(original);const a=document.createElement('a');a.href=img.src;a.target='_blank';a.rel='noopener noreferrer';a.download='';img.parentNode.insertBefore(a,img);a.appendChild(img)}}
function showResult(content){const el=$('composeResult');if(!el)return;el.classList.remove('blank');el.innerHTML=`<div class="markdown">${markdown(content)}</div>`;decorateMarkdown(el)}
async function submitNew(event){event.preventDefault();if(state.busy)return;const data=readForm($('composeForm'));if(!valid(data)){message(t('validation'));return}try{setBusy(true);const answer=await callAppBridge({type:'SubmitRecord',data:TABLE,payload:JSON.stringify(data)});if(/^\s*(error|失败|false)\b/i.test(String(answer)))throw Error(String(answer));state.row=1;message(t('submitted'));showResult(t('waiting'));await refreshData();startPolling()}catch(e){setBusy(false);error(e)}}
async function refreshData(){await fetchRows()}
function startPolling(){const token=++state.pollToken;state.polling=true;state.pollStart=Date.now();state.pollNotice=false;const tick=async()=>{if(token!==state.pollToken)return;if(Date.now()-state.pollStart>=1800000){state.polling=false;setBusy(false);showResult(t('timeout'));return}try{const value=await cell('复习计划',1);if(token!==state.pollToken)return;if(value.trim()){state.polling=false;setBusy(false);showResult(value);message(t('generated'));return}}catch(e){error(e)}if(!state.pollNotice&&Date.now()-state.pollStart>=90000){state.pollNotice=true;const el=$('composeResult');if(el)el.innerHTML=`<div class="notice">${esc(t('continueWait'))} <button id="continuePolling" class="btn ghost" type="button">${esc(t('continue'))}</button></div>`}if(token===state.pollToken)setTimeout(tick,2000)};tick()}
function clearDraft(){if(state.busy)return;$('composeForm').reset();state.row=0;$('composeResult').classList.add('blank');$('composeResult').innerHTML=`<div><i class="fa-regular fa-file-lines"></i><p>${esc(t('blank'))}</p></div>`}
function openOverlay(id){$(id).classList.add('open');document.body.classList.add('dialogopen')}
function closeOverlay(id){$(id).classList.remove('open');if(!document.querySelector('.overlay.open'))document.body.classList.remove('dialogopen')}
function closeTop(){for(const id of ['confirmOverlay','editOverlay','detailOverlay'])if($(id).classList.contains('open')){closeOverlay(id);return true}return false}
async function openDetail(row,quiet=false){state.detailRow=row;openOverlay('detailOverlay');$('detailTitle').textContent='…';$('detailBody').innerHTML=`<p class="muted">${esc(t('waiting'))}</p>`;$('detailEdit').textContent=t('edit');$('detailDelete').textContent=t('del');try{const data={};for(const f of [...FIELDS,'复习计划'])data[f]=await cell(f,row);if(state.detailRow!==row)return;$('detailTitle').textContent=`${data.学科||t('missing')} · ${typeLabel(data.复习类型)||t('missing')}`;const facts=FIELDS.map((f,i)=>`<dt>${esc(t('fields')[i])}</dt><dd>${esc(data[f]||t('missing'))}</dd>`).join('');$('detailBody').innerHTML=`<div class="detailgrid"><div class="facts"><div class="tags">${tag(data.复习类型)}</div><p class="notice">${esc(countdown(data.考试日期))}</p><h3>${esc(t('outline'))}</h3><dl>${facts}</dl></div><div class="paper detailpaper markdown">${markdown(data.复习计划)}</div></div>`;decorateMarkdown($('detailBody'))}catch(e){if(!quiet)error(e);$('detailBody').innerHTML=`<p class="muted">${esc(t('error')+String(e))}</p>`}}
async function openEdit(row){state.editRow=row;state.row=row;openOverlay('editOverlay');$('editTitle').textContent=t('editTitle');$('editFields').innerHTML=`<p>${esc(t('waiting'))}</p>`;refreshEditLabels();try{const vals=[];for(const f of FIELDS)vals.push(await cell(f,row));if(state.editRow!==row)return;$('editFields').innerHTML=FIELDS.map((_,i)=>fieldHTML('editForm',i,vals[i])).join('')}catch(e){error(e)}}
function refreshEditLabels(){ $('editTitle').textContent=t('editTitle');$('editCancel').textContent=t('cancel');$('editSave').textContent=t('save')}
async function saveEdit(event){event.preventDefault();if(state.busy)return;const data=readForm($('editForm'));if(!valid(data)){message(t('validation'));return}const row=state.editRow;state.busy=true;$('editSave').disabled=true;try{for(const f of FIELDS)await callAppBridge({type:'SetCellValue',data:SOURCE,payload:`${f}/${row}/${data[f]}`});await refreshData();closeOverlay('editOverlay');if($('detailOverlay').classList.contains('open'))await openDetail(row,true);renderCurrent();message(t('updated'))}catch(e){error(e)}finally{state.busy=false;$('editSave').disabled=false}}
function askDelete(row){state.deleteRow=row;$('confirmTitle').textContent=t('confirmTitle');$('confirmText').textContent=t('confirm');$('confirmCancel').textContent=t('cancel');$('confirmYes').textContent=t('confirmYes');openOverlay('confirmOverlay')}

function airBack(){if(closeTop())return 'false';if(state.history.length){const last=state.history.pop();showPage(last.page,true);window.scrollTo(0,last.y);return 'false'}return 'true'}window.airBack=airBack;
function listenKeyboard(){document.addEventListener('focusin',e=>{if(!e.target.matches('input,select,textarea'))return;setTimeout(()=>e.target.scrollIntoView({block:'center',behavior:'smooth'}),280)});if(window.visualViewport)visualViewport.addEventListener('resize',()=>{const input=document.activeElement;if(input?.matches?.('input,select,textarea'))setTimeout(()=>input.scrollIntoView({block:'center',behavior:'smooth'}),100)})}
function bind(){document.addEventListener('click',e=>{const go=e.target.closest('[data-go]');if(go){showPage(go.dataset.go);return}const action=e.target.closest('[data-action]');if(action){e.stopPropagation();const row=Number(action.dataset.row);if(action.dataset.action==='view')openDetail(row);if(action.dataset.action==='edit')openEdit(row);if(action.dataset.action==='delete')askDelete(row);return}const item=e.target.closest('[data-row]');if(item&&!e.target.closest('button')){openDetail(Number(item.dataset.row));return}const filter=e.target.closest('[data-filter]');if(filter){state.filter=filter.dataset.filter;document.querySelectorAll('#bookChips .chip').forEach(x=>x.classList.toggle('active',x===filter));renderBookList();return}if(e.target.id==='clearDraft')clearDraft();if(e.target.id==='continuePolling'){$('continuePolling').remove();message(t('waiting'))}if(e.target.id==='mobileLang')setLang(state.lang==='cn'?'en':'cn')});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeTop();if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-row]')){e.preventDefault();openDetail(Number(e.target.dataset.row))}});document.addEventListener('submit',e=>{if(e.target.id==='composeForm')submitNew(e);if(e.target.id==='editForm')saveEdit(e)});document.addEventListener('input',e=>{if(e.target.id==='bookSearch'){state.search=e.target.value;renderBookList()}});document.addEventListener('change',e=>{if(e.target.id==='bookSort'){state.sort=e.target.value;renderBookList()}});$('hamburger').onclick=()=>{const open=$('mobilemenu').classList.toggle('open');$('hamburger').setAttribute('aria-expanded',String(open))};$('langButton').onclick=()=>setLang(state.lang==='cn'?'en':'cn');$('brand').onclick=()=>{if(window.parent&&typeof window.parent.closeFullHtml==='function')window.parent.closeFullHtml(false)};$('detailClose').onclick=()=>closeOverlay('detailOverlay');$('detailEdit').onclick=()=>{closeOverlay('detailOverlay');openEdit(state.detailRow)};$('detailDelete').onclick=()=>askDelete(state.detailRow);$('editClose').onclick=$('editCancel').onclick=()=>closeOverlay('editOverlay');$('confirmClose').onclick=$('confirmCancel').onclick=()=>closeOverlay('confirmOverlay');$('confirmYes').onclick=deleteCurrent;for(const id of ['detailOverlay','editOverlay','confirmOverlay'])$(id).addEventListener('click',e=>{if(e.target.id===id)closeOverlay(id)});document.addEventListener('click',e=>{if(!$('topbar').contains(e.target))closeMenu()});window.addEventListener('resize',checkNav);listenKeyboard()}
async function initialize(){let lang='cn';try{const browser=navigator.languages;if(browser&&browser.length)lang=browser.some(x=>/^zh(?:-|$)/i.test(x))?'cn':'en';const url=new URL(location.href).searchParams.get('lang');if(url==='cn'||url==='en')lang=url;const saved=localStorage.getItem('iThinkAir_UiLanguage');if(saved)lang=saved==='en'?'en':'cn'}catch(e){}state.lang=lang;document.documentElement.lang=lang==='cn'?'zh-CN':'en';try{const mode=await callAppBridge({type:'模式'});document.body.classList.toggle('dark',String(mode).trim()==='暗色')}catch(e){}bind();renderNav();document.querySelectorAll('.page').forEach(el=>el.classList.toggle('active',el.id===state.page));renderCurrent()}
document.addEventListener('DOMContentLoaded',()=>{(async()=>{await initialize()})()});
</script></body></html>
