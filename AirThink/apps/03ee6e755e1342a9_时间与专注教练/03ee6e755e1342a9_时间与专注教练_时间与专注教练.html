<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>时间与专注教练</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<style>
:root{color-scheme:light;--paper:#f6f0e6;--paper2:#efe6d8;--card:#fffdf9;--ink:#1e3a5f;--text:#263b50;--muted:#647487;--amber:#e39b2b;--teal:#3e7c72;--line:#e9dfd1;--soft:#f8f3ea;--shadow:0 12px 34px rgba(30,58,95,.08);--danger:#af4f45}
body.dark{color-scheme:dark;--paper:#182536;--paper2:#202d3c;--card:#263549;--ink:#d5e7ff;--text:#e5edf6;--muted:#acbbcb;--amber:#efb451;--teal:#8ed6c7;--line:#455467;--soft:#304156;--shadow:0 12px 34px rgba(0,0,0,.19);--danger:#ee9b91}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:linear-gradient(145deg,var(--paper),var(--paper2));color:var(--text);font-family:Nunito,"PingFang SC","Microsoft YaHei",sans-serif;font-size:16px;line-height:1.6}button,input,select,textarea{font:inherit}input,select,textarea{box-sizing:border-box}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed;transform:none!important}a{color:var(--teal)}:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
[hidden]{display:none!important}
.topbar{position:relative;z-index:1001;position:fixed;top:0;left:0;right:0;background:#1e3a5f;color:#fff;border-bottom:3px solid #e39b2b;box-shadow:0 5px 22px #102b4540}.nav-inner{max-width:1220px;margin:auto;height:70px;padding:0 28px;display:flex;align-items:center;gap:24px}.brand{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:white;font-weight:900;font-size:18px;white-space:nowrap;padding:0}.brand-icon{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;border:1px solid #edb75a;color:#f0bd67;font-size:18px}.nav-links{display:flex;align-items:center;margin-left:auto;height:100%;gap:6px}.nav-link{height:100%;padding:0 18px;color:#e9eff6;background:none;border:0;border-bottom:3px solid transparent;white-space:nowrap;font-weight:800}.nav-link.active{color:#ffc46d;border-bottom-color:#e39b2b}.nav-link:hover{color:#ffc46d}.lang-btn,.menu-btn{background:#ffffff18;border:1px solid #ffffff50;color:#fff;border-radius:12px;padding:8px 12px;white-space:nowrap}.lang-btn:hover,.menu-btn:hover{background:#ffffff30}.menu-btn{display:none;margin-left:auto}.mobile-menu{display:none;position:absolute;top:100%;left:0;right:0;background:#1e3a5f;padding:10px 20px 18px;box-shadow:0 12px 24px #162b45a0}.mobile-menu.open{display:grid;gap:6px}.mobile-menu button{background:transparent;color:white;border:0;text-align:left;padding:10px 16px;border-radius:10px;font-weight:800}.mobile-menu button:hover,.mobile-menu button.active{background:#ffffff20;color:#ffc46d}
.page-shell{max-width:1220px;margin:0 auto;padding:110px 28px 82px}.page{display:none}.page.active{display:block}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:12px;font-weight:900;color:var(--teal);margin:0 0 12px}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(32px,4vw,54px);line-height:1.17;letter-spacing:-.035em;color:var(--ink);font-weight:900;margin-bottom:18px}h2{font-size:clamp(23px,2.5vw,30px);line-height:1.25;color:var(--ink);font-weight:900}h3{font-size:20px;line-height:1.3;color:var(--ink);font-weight:900}.lead{font-size:18px;color:var(--muted);max-width:730px}.hero{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(240px,.7fr);gap:32px;align-items:center;padding:54px clamp(28px,5vw,70px);border-radius:30px;background:var(--card);box-shadow:var(--shadow);border:1px solid var(--line)}.hero:before{content:"";position:absolute;width:420px;height:420px;right:-170px;top:-190px;background:radial-gradient(circle,#e39b2b35,transparent 70%);pointer-events:none}.hero-visual{min-height:240px;display:flex;align-items:center;justify-content:center}.lamp-art{position:relative;width:235px;height:235px;border-radius:50%;background:radial-gradient(circle,#fbdc9a55 0%,#f3dba750 40%,transparent 72%);display:grid;place-items:center;color:var(--amber);font-size:126px}.lamp-art:after{content:"";position:absolute;width:170px;height:2px;bottom:38px;background:var(--amber);opacity:.5}.hero-actions,.toolbar-actions,.card-actions,.timer-actions,.modal-actions{display:flex;gap:12px;flex-wrap:wrap}.btn{border-radius:14px;border:1px solid var(--ink);padding:11px 18px;font-weight:900;transition:transform .18s,box-shadow .18s,background .18s;min-height:45px}.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 7px 18px #1e3a5f25}.btn-primary{background:#1e3a5f;color:#fff;border-color:#1e3a5f}.btn-secondary{background:var(--card);color:var(--ink)}.btn-amber{background:var(--amber);border-color:var(--amber);color:#202b39}.btn-danger{border-color:var(--danger);background:transparent;color:var(--danger)}.btn-small{padding:7px 11px;min-height:36px;font-size:13px;border-radius:10px}.section-head,.page-head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:22px}.section-head{margin-top:44px}.page-head{margin-bottom:30px}.page-head p{color:var(--muted);margin-bottom:0}
.stats-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card,.stat-card,.record-card,.need-card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);transition:transform .18s,border-color .18s,box-shadow .18s}.stat-card,.card{padding:24px}.stat-card:hover,.record-card:hover,.need-card:hover{transform:translateY(-3px);border-color:var(--amber);box-shadow:0 15px 34px #e39b2b20}.stat-value{font-size:45px;font-weight:900;line-height:1;color:var(--ink);margin:14px 0 4px}.muted{color:var(--muted)}.distribution{display:grid;grid-template-columns:1fr 1fr;gap:5px 14px;font-size:14px}.distribution span{display:flex;align-items:center;gap:7px}.distribution b{margin-left:auto;color:var(--ink)}.dot{width:8px;height:8px;border-radius:50%;background:var(--amber);flex:none}.dot.teal{background:var(--teal)}.record-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.record-card{padding:22px;min-width:0}.record-card.clickable{cursor:pointer}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px}.tag{background:var(--soft);color:var(--ink);border:1px solid var(--line);font-size:12px;font-weight:900;border-radius:30px;padding:3px 10px}.tag.amber{background:#e39b2b20;color:var(--text);border-color:#e39b2b60}.record-title{font-size:19px;font-weight:900;color:var(--ink);margin:0 0 12px;overflow-wrap:anywhere}.record-meta{display:grid;gap:5px;font-size:14px;color:var(--muted)}.record-meta strong{color:var(--text);font-weight:800}.record-note{margin:13px 0 0;padding-top:12px;border-top:1px solid var(--line);font-size:14px;color:var(--muted);overflow-wrap:anywhere}.card-actions{margin-top:17px}.empty{border:1px dashed var(--line);border-radius:24px;background:var(--card);text-align:center;padding:38px 24px;color:var(--muted)}.empty i{display:block;font-size:38px;color:var(--amber);margin-bottom:15px}.empty .btn{margin-top:12px}
.needs-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:27px}.need-card{padding:18px 15px;text-align:left;min-height:153px;color:var(--text)}.need-card.selected{border:2px solid var(--amber);padding:17px 14px;background:linear-gradient(145deg,var(--card),#e39b2b16)}.need-card i{font-size:23px;color:var(--teal);margin-bottom:14px;display:block}.need-card strong{display:block;font-size:15px;color:var(--ink);line-height:1.3;margin-bottom:6px}.need-card span{display:block;font-size:12px;color:var(--muted);line-height:1.5}.form-card{padding:30px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:21px}.field{min-width:0}.field.wide{grid-column:1/-1}.field label{display:block;font-weight:900;color:var(--ink);margin-bottom:7px}.field input,.field select,.field textarea,.filter input,.filter select{width:100%;min-width:0;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);padding:12px 14px;outline:none}.field input:focus,.field select:focus,.field textarea:focus,.filter input:focus,.filter select:focus{border-color:var(--amber);box-shadow:0 0 0 3px #e39b2b20}.field textarea{min-height:100px;resize:vertical}.hint,.field-error{font-size:13px;margin:5px 0 0}.hint{color:var(--muted)}.field-error{color:var(--danger);min-height:0}.form-footer{display:flex;align-items:center;gap:17px;flex-wrap:wrap;margin-top:23px}.message{font-size:14px;font-weight:800;color:var(--teal)}.message.error{color:var(--danger)}.result-card,.timer-card{margin-top:22px;padding:26px 30px}.result-card[hidden],.timer-card[hidden],.modal[hidden]{display:none}.result-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.spinner{width:18px;height:18px;display:inline-block;border:2px solid var(--line);border-top-color:var(--amber);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:8px}@keyframes spin{to{transform:rotate(360deg)}}.markdown{line-height:1.8;overflow-wrap:anywhere}.markdown h1,.markdown h2,.markdown h3{margin-top:1.25em;margin-bottom:.5em}.markdown h1{font-size:1.8em}.markdown h2{font-size:1.45em}.markdown h3{font-size:1.2em}.markdown p,.markdown ul,.markdown ol,.markdown blockquote,.markdown pre,.markdown table{margin:.8em 0}.markdown blockquote{border-left:4px solid var(--amber);padding:.2em 1em;background:var(--soft);border-radius:0 9px 9px 0}.markdown code{background:var(--soft);border-radius:5px;padding:2px 5px}.markdown pre{overflow:auto;background:var(--soft);padding:15px;border-radius:12px}.markdown pre code{padding:0}.markdown table{border-collapse:collapse;display:block;overflow:auto}.markdown th,.markdown td{padding:7px 11px;border:1px solid var(--line)}.markdown img{max-width:100%;height:auto;border-radius:10px;cursor:pointer}.timer-layout{display:flex;align-items:center;gap:28px;flex-wrap:wrap}.timer-ring{--progress:100%;width:170px;height:170px;flex:none;border-radius:50%;background:conic-gradient(var(--amber) var(--progress),var(--line) 0);display:grid;place-items:center}.timer-inner{width:137px;height:137px;background:var(--card);border-radius:50%;display:grid;place-items:center;text-align:center;font-size:26px;font-weight:900;color:var(--ink)}.timer-inner small{display:block;font-size:11px;color:var(--muted);font-weight:800}.filter-bar{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;margin:0 0 22px}.filter{min-width:0}.filter label{display:block;font-size:13px;font-weight:900;color:var(--ink);margin:0 0 5px}.count-line{color:var(--muted);font-size:14px;margin-bottom:15px}
.modal-backdrop{position:fixed;z-index:2000;inset:0;background:#10243bb8;display:flex;align-items:center;justify-content:center;padding:24px}.modal{width:min(700px,100%);max-height:calc(100dvh - 48px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:0 28px 80px #07142366;padding:30px}.modal.large{width:min(840px,100%)}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:17px}.modal-head h2{margin:0}.icon-btn{width:38px;height:38px;display:grid;place-items:center;border:0;border-radius:50%;background:var(--soft);color:var(--ink)}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.detail-item{padding:14px;border-radius:13px;background:var(--soft);overflow-wrap:anywhere}.detail-item.wide{grid-column:1/-1}.detail-item small{display:block;color:var(--muted);font-weight:800}.detail-item strong{white-space:pre-wrap;color:var(--text)}.detail-result{margin-top:23px;border-top:1px solid var(--line);padding-top:20px}.toast{position:fixed;z-index:3000;right:20px;bottom:20px;max-width:min(420px,calc(100vw - 40px));background:#1e3a5f;color:white;border-left:4px solid var(--amber);border-radius:12px;padding:12px 18px;box-shadow:var(--shadow);display:none}.toast.show{display:block}
@media(max-width:950px){.needs-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{grid-template-columns:1fr auto}.hero-visual{min-height:180px}.lamp-art{width:170px;height:170px;font-size:90px}}@media(max-width:760px){.nav-links,.nav-lang{display:none}.menu-btn{display:block}.page-shell{padding:100px 18px 115px}.hero{grid-template-columns:1fr;padding:33px 25px}.hero-visual{display:none}.stats-grid{grid-template-columns:1fr}.record-grid{grid-template-columns:1fr}.needs-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.filter-bar{grid-template-columns:1fr 1fr}.filter:first-child{grid-column:1/-1}.form-grid{grid-template-columns:1fr}.field.wide{grid-column:auto}}@media(max-width:520px){.nav-inner{padding:0 17px}.brand{font-size:14px}.brand-icon{width:34px;height:34px}.page-head,.section-head{align-items:start;flex-direction:column}.needs-grid{grid-template-columns:1fr}.need-card{min-height:0;display:grid;grid-template-columns:30px 1fr;gap:1px 10px}.need-card i{grid-row:span 2;margin:0}.need-card strong,.need-card span{margin:0}.form-card,.result-card,.timer-card{padding:21px}.modal-backdrop:has(.modal.large){padding:0}.modal.large{height:100dvh;max-height:100dvh;border-radius:0;padding:22px 18px 35vh}.modal:not(.large){padding:22px 18px 35vh;max-height:calc(100dvh - 20px)}.detail-grid{grid-template-columns:1fr}.detail-item.wide{grid-column:auto}.page-shell{padding-bottom:160px}}
</style>
</head>
<body>
<header class="topbar" id="topbar">
  <div class="nav-inner">
    <button class="brand" id="brandButton" type="button"><span class="brand-icon"><i class="fa-solid fa-lightbulb"></i></span><span data-i18n="appName">时间与专注教练</span></button>
    <nav class="nav-links" id="desktopNav" aria-label="Pages">
      <button class="nav-link active" data-page="home" data-i18n="home" type="button">首页</button>
      <button class="nav-link" data-page="coach" data-i18n="coach" type="button">辅导台</button>
      <button class="nav-link" data-page="records" data-i18n="records" type="button">记录本</button>
    </nav>
    <button class="lang-btn nav-lang" id="languageButton" type="button">EN</button>
    <button class="menu-btn" id="menuButton" type="button" aria-label="Menu" aria-expanded="false"><i class="fa-solid fa-bars"></i></button>
  </div>
  <nav class="mobile-menu" id="mobileMenu" aria-label="Mobile pages">
    <button data-page="home" data-i18n="home" type="button">首页</button>
    <button data-page="coach" data-i18n="coach" type="button">辅导台</button>
    <button data-page="records" data-i18n="records" type="button">记录本</button>
    <button id="mobileLanguageButton" type="button">English</button>
  </nav>
</header>
<main class="page-shell">
  <section class="page active" id="page-home">
    <div class="hero">
      <div>
        <p class="eyebrow" data-i18n="eyebrow">让每段学习时间都有方向</p>
        <h1 data-i18n="appName">时间与专注教练</h1>
        <p class="lead" data-i18n="homeLead">帮你看清学习时间、排好可用时段、练一小段专注，再根据真实记录复盘分心原因</p>
        <div class="hero-actions"><button class="btn btn-primary" id="startButton" type="button"><i class="fa-solid fa-arrow-right"></i> <span data-i18n="start">开始一次辅导</span></button><button class="btn btn-secondary" id="openRecordsButton" type="button" data-i18n="openRecords">翻开记录本</button></div>
      </div>
      <div class="hero-visual" aria-hidden="true"><div class="lamp-art"><i class="fa-solid fa-lightbulb"></i></div></div>
    </div>
    <div class="section-head"><h2 data-i18n="overview">我的学习概览</h2></div>
    <div class="stats-grid">
      <article class="stat-card"><h3 data-i18n="sessionCount">辅导次数</h3><div class="stat-value" id="sessionCount">—</div><div class="muted" id="sessionCaption"></div></article>
      <article class="stat-card"><h3 data-i18n="needDistribution">需求分布</h3><div class="distribution" id="needDistribution"></div></article>
      <article class="stat-card"><h3 data-i18n="stageDistribution">学段分布</h3><div class="distribution" id="stageDistribution"></div></article>
    </div>
    <div class="section-head"><h2 data-i18n="recent">最近辅导</h2></div>
    <div class="record-grid" id="recentList"></div>
  </section>
  <section class="page" id="page-coach">
    <div class="page-head"><div><p class="eyebrow" data-i18n="eyebrow">让每段学习时间都有方向</p><h1 id="coachTitle" data-i18n="coach">辅导台</h1><p data-i18n="coachLead">先选学段和这次想解决的事，信息够了再交给教练</p></div><button class="btn btn-secondary" id="resetButton" type="button"><i class="fa-solid fa-rotate-left"></i> <span data-i18n="reset">清空重来</span></button></div>
    <div class="needs-grid" id="needsGrid"></div>
    <div class="card form-card">
      <h2 data-i18n="appName">时间与专注教练</h2>
      <form id="coachForm" novalidate>
        <div class="form-grid">
          <div class="field"><label for="coachForm_stage" data-i18n="stage">学段</label><select id="coachForm_stage" name="学段"></select><p class="field-error" id="error_stage"></p></div>
          <div class="field"><label for="coachForm_need" data-i18n="need">辅导需求</label><select id="coachForm_need" name="辅导需求"></select><p class="field-error" id="error_need"></p></div>
          <div class="field wide"><label for="coachForm_content" data-i18n="content">学习内容</label><textarea id="coachForm_content" name="学习内容" rows="3"></textarea><p class="hint" id="hint_content"></p><p class="field-error" id="error_content"></p></div>
          <div class="field"><label for="coachForm_available" data-i18n="available">可用时间</label><input id="coachForm_available" name="可用时间" type="text"><p class="hint" id="hint_available"></p><p class="field-error" id="error_available"></p></div>
          <div class="field"><label for="coachForm_minutes" data-i18n="minutes">计划专注分钟</label><input id="coachForm_minutes" name="计划专注分钟" type="number" min="1" step="1" inputmode="numeric"><p class="hint" id="hint_minutes"></p><p class="field-error" id="error_minutes"></p></div>
          <div class="field wide"><label for="coachForm_notes" data-i18n="notes">学习与分心记录</label><textarea id="coachForm_notes" name="学习与分心记录" rows="4"></textarea><p class="hint" id="hint_notes"></p><p class="field-error" id="error_notes"></p></div>
        </div>
        <div class="form-footer"><button class="btn btn-primary" id="submitButton" type="submit" disabled data-i18n="submit">交给教练</button><span class="message" id="formMessage" aria-live="polite"></span></div>
      </form>
    </div>
    <div class="card timer-card" id="timerCard" hidden>
      <h2 data-i18n="focusTimer">这一段专注</h2>
      <p class="muted" id="timerSubject"></p>
      <div class="timer-layout">
        <div class="timer-ring" id="timerRing"><div class="timer-inner"><div><span id="timerDisplay">00:00</span><small id="timerState"></small></div></div></div>
        <div><div class="timer-actions"><button class="btn btn-primary" id="timerStartButton" type="button" data-i18n="startTimer">开始计时</button><button class="btn btn-secondary" id="timerPauseButton" type="button" hidden data-i18n="pause">暂停</button><button class="btn btn-secondary" id="timerResumeButton" type="button" hidden data-i18n="resume">继续</button><button class="btn btn-secondary" id="timerEndButton" type="button" hidden data-i18n="endFocus">结束本次专注</button></div><p class="muted" id="timerHint"></p></div>
      </div>
    </div>
    <div class="card result-card" id="resultCard" hidden>
      <div class="result-head"><h2 data-i18n="coachSays">教练说</h2><span id="resultStatus"></span></div>
      <div class="markdown" id="resultContent"></div>
      <div class="toolbar-actions" id="resultActions"></div>
    </div>
  </section>
  <section class="page" id="page-records">
    <div class="page-head"><div><p class="eyebrow" data-i18n="eyebrow">让每段学习时间都有方向</p><h1 data-i18n="records">记录本</h1><p data-i18n="recordsLead">这里只放你提交过的真实记录</p></div><button class="btn btn-primary" id="newRecordButton" type="button"><i class="fa-solid fa-plus"></i> <span data-i18n="newSession">新建辅导</span></button></div>
    <div class="filter-bar">
      <div class="filter"><label for="searchInput" data-i18n="search">搜索记录</label><input id="searchInput" type="search" data-placeholder="searchPlaceholder"></div>
      <div class="filter"><label for="stageFilter" data-i18n="stage">学段</label><select id="stageFilter"></select></div>
      <div class="filter"><label for="needFilter" data-i18n="need">辅导需求</label><select id="needFilter"></select></div>
    </div>
    <p class="count-line" id="recordCountLine"></p>
    <div class="record-grid" id="recordList"></div>
  </section>
</main>
<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal large" id="detailModal" role="dialog" aria-modal="true" aria-labelledby="detailTitle" hidden>
    <div class="modal-head"><h2 id="detailTitle" data-i18n="details">辅导详情</h2><button class="icon-btn" id="detailCloseIcon" type="button" aria-label="Close"><i class="fa-solid fa-xmark"></i></button></div>

        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }

        }



        url = 'http://' + window.location.hostname + ':3130/request';
        const response = await fetch(url, {

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function selectImageA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*'; // 限制只选择图片文件
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        // 可选：进一步验证文件确实是图片
        if (!file.type.startsWith('image/')) {
          reject(new Error('选择的文件不是图片'));
          return;
        }
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择（注意：cancel事件在某些浏览器中可能不支持）
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}



/**

 */
async function uploadToFlaskA(file)
{
  // 创建FormData对象
  const formData = new FormData();
  formData.append('file', file);
  
  try {
    // 发送到Flask服务端
    const response = await fetch('http://' + window.location.hostname + ':3130/upload', {
      method: 'POST',

    });
    
    if (!response.ok) {

    }
    
    const result = await response.text();
    return result;
  }
  catch (error)
  {
  }
  return ""
}    


        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

        function setInnerHTMLWithScripts(element, html) {
             element.innerHTML = html;
             // 执行内联脚本
             const scripts = element.querySelectorAll('script');
             scripts.forEach(oldScript => {
                 const newScript = document.createElement('script');
                 newScript.text = oldScript.text;
                 oldScript.parentNode.replaceChild(newScript, oldScript);
             });
         }

        function base64DecodeUTF8(base64Str) {
            // 使用atob解码Base64得到二进制字符串
            const binaryStr = atob(base64Str);
    
            // 将二进制字符串转换为字节数组
            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) {
                bytes[i] = binaryStr.charCodeAt(i);
            }
    
            // 使用TextDecoder将字节数组解码为UTF-8字符串
            const decoder = new TextDecoder('utf-8');
            return decoder.decode(bytes);
        }

function showResult(value){$('resultCard').hidden=false;$('resultStatus').textContent='';showMarkdown($('resultContent'),value);const asksMore=/(补充|请提供|请填写|缺少|还需要|请先|告诉我|请写下|please (add|provide|tell|write)|more information)/i.test(String(value));$('resultActions').innerHTML=asksMore?'<button class="btn btn-secondary" id="againButton" type="button">'+esc(tr('again'))+'</button>':'';}
async function pollResult(row,continueOnly=false){const token=++pollToken;busy=true;pollStart=Date.now();$('resultCard').hidden=false;$('resultContent').innerHTML='<p><span class="spinner"></span>'+esc(tr('waiting'))+'</p>';$('resultActions').innerHTML='';$('resultStatus').textContent='';validate(false);while(token===pollToken&&Date.now()-pollStart<60000){try{const result=await callAppBridge({type:'GetCellValue',data:DATA_SOURCE,payload:'辅导结果/'+row});if(token!==pollToken)return;if(String(result||'').trim()){busy=false;showResult(result);validate(false);await refreshHome();return;}}catch(e){if(token!==pollToken)return;}$('resultContent').innerHTML='<p><span class="spinner"></span>'+esc(tr('waiting'))+'</p>';await new Promise(resolve=>setTimeout(resolve,2000));}if(token!==pollToken)return;busy=false;$('resultContent').textContent=tr('stillWaiting');$('resultActions').innerHTML='<button class="btn btn-secondary" id="waitMoreButton" type="button">'+esc(tr('waitMore'))+'</button>';validate(false);}
async function submitCoach(event){event.preventDefault();if(!validate(true)||busy)return;const values=getFormData();busy=true;validate(false);$('formMessage').textContent=tr('loading');try{if(currentRow>0){const row=currentRow;for(const field of FIELDS)await callAppBridge({type:'SetCellValue',data:DATA_SOURCE,payload:field+'/'+row+'/'+values[field]});$('formMessage').textContent=tr('saved');busy=false;validate(false);await refreshHome();return;}const response=await callAppBridge({type:'SubmitRecord',data:TABLE,payload:JSON.stringify(values)});if(!safeResult(response))throw new Error('SubmitRecord failed');currentRow=1;updateCoachTitle();$('formMessage').textContent='';await refreshHome();pollResult(1);}catch(e){busy=false;$('formMessage').textContent=currentRow>0?tr('saveFailed'):tr('submitFailed');$('formMessage').classList.add('error');validate(false);}}
function renderDetailFields(){const r=records.find(x=>x.row===detailRow);if(!r)return;$('detailFields').innerHTML=FIELDS.map(field=>'<div class="detail-item'+(['学习内容','学习与分心记录'].includes(field)?' wide':'')+'"><small>'+esc(tr(({学段:'stage',辅导需求:'need',学习内容:'content',可用时间:'available',计划专注分钟:'minutes',学习与分心记录:'notes'})[field]))+'</small><strong>'+esc(field==='学段'?label(r[field],'stage'):field==='辅导需求'?label(r[field],'need'):(r[field]||tr('emptyValue')))+'</strong></div>').join('');}
async function readDetailResult(){if(!detailRow)return;$('detailResult').textContent=tr('loading');try{const result=await callAppBridge({type:'GetCellValue',data:DATA_SOURCE,payload:'辅导结果/'+detailRow});if(String(result||'').trim())showMarkdown($('detailResult'),result);else $('detailResult').textContent=tr('notGenerated');}catch(e){$('detailResult').textContent=tr('errorLoad');}}
function openDetail(row){currentRow=row;detailRow=row;renderDetailFields();$('modalBackdrop').hidden=false;$('detailModal').hidden=false;$('confirmModal').hidden=true;document.body.style.overflow='hidden';readDetailResult();}
function closeModal(){if($('modalBackdrop').hidden)return false;$('modalBackdrop').hidden=true;$('detailModal').hidden=true;$('confirmModal').hidden=true;document.body.style.overflow='';confirmAction=null;return true;}
function openConfirm(title,text,cancel,yes,action){$('confirmTitle').textContent=title;$('confirmText').textContent=text;$('confirmCancelButton').textContent=cancel;$('confirmYesButton').textContent=yes;confirmAction=action;$('modalBackdrop').hidden=false;$('detailModal').hidden=true;$('confirmModal').hidden=false;document.body.style.overflow='hidden';}
async function deleteRow(row){try{const response=await callAppBridge({type:'DeleteRecord',data:DATA_SOURCE,payload:row.toString()});if(!safeResult(response))throw new Error('DeleteRecord failed');if(currentRow===row)currentRow=0;notify(tr('deleted'));await refreshHome();}catch(e){notify(tr('deleteFailed'));}}
function reviewRow(row){const source=records.find(r=>r.row===row);if(!source)return;resetCoach();const data={};for(const field of FIELDS)data[field]=source[field]||'';data['辅导需求']='专注复盘';setFormData(data);switchPage('coach');}
function updateTimerVisibility(){const d=getFormData(),n=cleanNumber(d['计划专注分钟']);const show=d['辅导需求']==='番茄钟'&&Boolean(d['学习内容'])&&n!==null&&n>0;$('timerCard').hidden=!show;if(show){$('timerSubject').textContent=d['学习内容'];if(timerMode==='idle'){timerTotal=Math.round(n*60);timerRemaining=timerTotal;}updateTimerUI();}else if(timerMode!=='idle')resetTimer();}
function timerText(seconds){const s=Math.max(0,Math.ceil(seconds));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function updateTimerUI(){$('timerDisplay').textContent=timerText(timerRemaining);$('timerRing').style.setProperty('--progress',(timerTotal?Math.max(0,timerRemaining/timerTotal*100):100)+'%');$('timerState').textContent=tr(({idle:'timerReady',running:'timerRunning',paused:'timerPaused',ended:'timerFinished'})[timerMode]);$('timerStartButton').hidden=timerMode!=='idle';$('timerPauseButton').hidden=timerMode!=='running';$('timerResumeButton').hidden=timerMode!=='paused';$('timerEndButton').hidden=timerMode!=='running'&&timerMode!=='paused';$('timerHint').textContent=timerMode==='ended'?tr('timerFollowup'):'';}
function tickTimer(){timerRemaining=Math.max(0,Math.ceil((timerEndAt-Date.now())/1000));if(timerRemaining===0){clearInterval(timerInterval);timerInterval=0;timerMode='ended';}updateTimerUI();}
function startTimer(){timerMode='running';timerEndAt=Date.now()+timerRemaining*1000;timerInterval=setInterval(tickTimer,250);updateTimerUI();}
function stopTimer(finished){if(timerMode==='running')tickTimer();clearInterval(timerInterval);timerInterval=0;timerMode=finished?'ended':'paused';updateTimerUI();}
function confirmStartTimer(){const d=getFormData();const text=tr('content')+': '+d['学习内容']+'\n'+tr('minutes')+': '+d['计划专注分钟']+' '+tr('minutesUnit');openConfirm(tr('confirmTimer'),text,tr('notNow'),tr('startNow'),startTimer);$('confirmText').style.whiteSpace='pre-wrap';}
function handleCardAction(action,row){if(action==='view')openDetail(row);if(action==='edit')loadForEdit(row);if(action==='review')reviewRow(row);if(action==='delete')openConfirm(tr('confirmDelete'),tr('cannotUndo'),tr('cancel'),tr('confirm'),()=>deleteRow(row));if(action==='first')beginNew();}
function airBack(){if(closeModal())return 'false';if(!$('mobileMenu').classList.contains('open')){if(navHistory.length){const previous=navHistory.pop();switchPage(previous.page,false);requestAnimationFrame(()=>window.scrollTo(0,previous.scroll));return 'false';}return 'true';}closeMenu();return 'false';}
window.airBack=airBack;
async function initialize(){
  const saved=localStorage.getItem('iThinkAir_UiLanguage'),urlLang=new URLSearchParams(location.search).get('lang'),langs=navigator.languages;
  const browserLang=Array.isArray(langs)?(langs.some(x=>/^zh(?:-|$)/i.test(x))?'cn':'en'):'cn';
  setLanguage(saved!==null?(saved==='en'?'en':'cn'):(urlLang==='cn'||urlLang==='en'?urlLang:browserLang));
  try{const mode=await callAppBridge({type:'模式'});document.body.classList.toggle('dark',String(mode).trim()==='暗色');}catch(e){}
  document.querySelectorAll('[data-page]').forEach(btn=>btn.addEventListener('click',()=>switchPage(btn.dataset.page)));
  $('brandButton').addEventListener('click',()=>{if(parent&&typeof parent.closeFullHtml==='function')parent.closeFullHtml(false);});
  $('menuButton').addEventListener('click',()=>{const open=$('mobileMenu').classList.toggle('open');$('menuButton').setAttribute('aria-expanded',String(open));});
  document.addEventListener('click',e=>{if(!$('topbar').contains(e.target))closeMenu();});
  $('languageButton').addEventListener('click',()=>setLanguage(language==='cn'?'en':'cn'));
  $('mobileLanguageButton').addEventListener('click',()=>{setLanguage(language==='cn'?'en':'cn');closeMenu();});
  $('startButton').addEventListener('click',beginNew);$('openRecordsButton').addEventListener('click',()=>switchPage('records'));$('newRecordButton').addEventListener('click',beginNew);$('resetButton').addEventListener('click',resetCoach);
  $('needsGrid').addEventListener('click',e=>{const b=e.target.closest('[data-need]');if(b){$('coachForm_need').value=b.dataset.need;$('coachForm_need').dispatchEvent(new Event('change'));}});
  $('coachForm_need').addEventListener('change',()=>{renderNeeds();updateHints();resetTimer();updateTimerVisibility();validate(false);});
  $('coachForm').addEventListener('input',e=>{if(e.target.id==='coachForm_content'||e.target.id==='coachForm_minutes'){if(timerMode!=='idle')resetTimer();updateTimerVisibility();}validate(false);});
  $('coachForm').addEventListener('change',()=>{updateTimerVisibility();validate(false);});
  $('coachForm').addEventListener('submit',submitCoach);
  $('resultActions').addEventListener('click',e=>{if(e.target.id==='waitMoreButton')pollResult(currentRow,true);if(e.target.id==='againButton'){currentRow=0;updateCoachTitle();$('resultCard').hidden=true;validate(false);}});
  $('timerStartButton').addEventListener('click',confirmStartTimer);$('timerPauseButton').addEventListener('click',()=>stopTimer(false));$('timerResumeButton').addEventListener('click',startTimer);$('timerEndButton').addEventListener('click',()=>stopTimer(true));
  for(const id of ['searchInput','stageFilter','needFilter'])$(id).addEventListener(id==='searchInput'?'input':'change',renderRecords);
  $('recentList').addEventListener('click',e=>{const first=e.target.closest('[data-action="first"]');if(first){beginNew();return;}const card=e.target.closest('[data-row]');if(card){switchPage('records');openDetail(Number(card.dataset.row));}});
  $('recentList').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const card=e.target.closest('[data-row]');if(card){e.preventDefault();switchPage('records');openDetail(Number(card.dataset.row));}}});
  $('recordList').addEventListener('click',e=>{const button=e.target.closest('[data-action]'),card=e.target.closest('[data-row]');if(button&&card)handleCardAction(button.dataset.action,Number(card.dataset.row));});
  $('modalBackdrop').addEventListener('click',e=>{if(e.target===$('modalBackdrop'))closeModal();});
  $('detailCloseIcon').addEventListener('click',closeModal);$('detailCloseButton').addEventListener('click',closeModal);$('detailReloadButton').addEventListener('click',readDetailResult);$('confirmCloseIcon').addEventListener('click',closeModal);$('confirmCancelButton').addEventListener('click',closeModal);$('confirmYesButton').addEventListener('click',()=>{const action=confirmAction;closeModal();if(action)action();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!closeModal())closeMenu();}});
  document.addEventListener('focusin',e=>{if(!e.target.matches('input,select,textarea'))return;const focused=e.target;setTimeout(()=>focused.scrollIntoView({block:'center',behavior:'smooth'}),300);});
  if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>{const focused=document.activeElement;if(focused&&focused.matches('input,select,textarea'))setTimeout(()=>focused.scrollIntoView({block:'center',behavior:'smooth'}),100);});
  updateCoachTitle();updateHints();updateTimerUI();validate(false);await refreshHome();
}
document.addEventListener('DOMContentLoaded',()=>{(async()=>{await initialize();})();});
</script>
</body>
</html>
