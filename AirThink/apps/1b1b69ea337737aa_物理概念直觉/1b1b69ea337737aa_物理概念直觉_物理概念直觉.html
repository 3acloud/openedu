<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16324F">
<title>物理概念直觉</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root {
  --paper: #F6F3EC;
  --ink: #1B2A3A;
  --muted: #5C6B7A;
  --navy: #16324F;
  --gold: #E8A317;
  --clay: #D4764E;
  --lake: #1F8A70;
  --indigo: #3D5A80;
  --card: #FFFFFF;
  --line: rgba(22, 50, 79, 0.12);
  --shadow: 0 10px 28px rgba(22, 50, 79, 0.08);
  --grid: rgba(22, 50, 79, 0.045);
  --glow: rgba(232, 163, 23, 0.18);
  --danger: #B42318;
  --kb: 0px;
  color-scheme: light;
}
html[data-theme="dark"] {
  --paper: #121820;
  --ink: #F4EFE4;
  --muted: #C5D0DA;
  --card: #1C2733;
  --line: rgba(244, 239, 228, 0.12);
  --shadow: 0 12px 32px rgba(0, 0, 0, 0.38);
  --grid: rgba(232, 163, 23, 0.045);
  --glow: rgba(232, 163, 23, 0.08);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
[hidden] { display: none !important; }
body {
  font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  color: var(--ink);
  background-color: var(--paper);
  background-image:
    radial-gradient(980px 420px at 8% -8%, var(--glow), transparent 62%),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: auto, 28px 28px, 28px 28px;
  background-attachment: fixed;
  line-height: 1.55;
  padding-top: calc(64px + env(safe-area-inset-top));
  min-height: 100vh;
}
body.popup-open { position: fixed; width: 100%; overflow: hidden; }
button, input, textarea, select { font-family: inherit; }
button { font-size: inherit; color: inherit; }
input, select, textarea { box-sizing: border-box; font-size: 16px; }
button { cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 2px;
}
::selection { background: rgba(232, 163, 23, 0.35); }

.nav-fixed {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 1001;
  padding-top: env(safe-area-inset-top);
  background: #16324F;
}
#topNav { background: #16324F; color: #fff; overflow: visible; }
.nav-inner {
  height: 64px;
  display: flex;
  align-items: center;
  gap: 8px;
  width: min(1120px, calc(100% - 28px));
  margin: 0 auto;
}
.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: transparent;
  border: 0;
  color: #fff;
  padding: 6px 4px;
  margin-right: auto;
  font-weight: 750;
  font-size: 16px;
}
.brand-mark {
  width: 36px; height: 36px;
  border-radius: 12px;
  display: grid; place-items: center;
  background: rgba(232, 163, 23, 0.18);
  color: #E8A317;
  box-shadow: inset 0 0 0 1px rgba(232, 163, 23, 0.45);
}
.brand:hover .brand-mark { transform: translateY(-1px); background: rgba(232, 163, 23, 0.28); }
.nav-links { display: flex; align-items: stretch; gap: 2px; flex-wrap: nowrap; }
.nav-tab {
  background: transparent;
  border: 0;
  color: rgba(255,255,255,0.78);
  height: 64px;
  padding: 0 14px;
  font-weight: 700;
  white-space: nowrap;
  position: relative;
}
.nav-tab:hover { color: #fff; }
.nav-tab[aria-current="page"] { color: #fff; box-shadow: inset 0 -3px 0 #E8A317; }
.lang-btn, .hamburger {
  border: 1px solid rgba(255,255,255,0.28);
  background: transparent;
  color: #fff;
  border-radius: 999px;
  height: 36px;
  min-width: 36px;
  padding: 0 12px;
  font-weight: 800;
}
.lang-btn:hover, .hamburger:hover, .nav-tab:hover, .brand:hover { filter: brightness(1.08); }
.hamburger { display: none; width: 42px; padding: 0; }
.mobile-menu {
  display: none;
  position: absolute;
  left: 0; right: 0; top: 100%;
  background: #16324F;
  border-top: 1px solid rgba(232, 163, 23, 0.45);
  box-shadow: 0 18px 36px rgba(8, 18, 32, 0.28);
  padding: 8px 12px 14px;
}
.mobile-menu.open { display: block; }
.mobile-tab {
  display: flex; width: 100%;
  text-align: left;
  background: transparent;
  color: #fff;
  border: 0;
  border-radius: 12px;
  padding: 13px 12px;
  font-weight: 750;
}
.mobile-tab[aria-current="page"] { background: rgba(232, 163, 23, 0.16); box-shadow: inset 3px 0 0 #E8A317; }
.mobile-lang { display: flex; gap: 8px; padding: 8px 4px 2px; }
.mobile-lang button {
  flex: 1;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.28);
  background: transparent;
  color: #fff;
  padding: 10px;
  font-weight: 750;
}
.mobile-lang button[aria-pressed="true"] { background: #E8A317; color: #16324F; border-color: #E8A317; }
@media (max-width: 760px) {
  #navLinks, #langBtn { display: none; }
  #hamburger { display: inline-flex; align-items: center; justify-content: center; }
}

.wrap { width: min(1120px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 56px; }
.hero { padding: 12px 0 8px; max-width: 760px; }
h1 { font-size: clamp(32px, 5vw, 52px); line-height: 1.12; margin: 0 0 10px; letter-spacing: -0.03em; }
.page-head h1, .form-card h2, .stage-card h3, .record-head h3 { letter-spacing: -0.02em; }
.lead { margin: 0 0 8px; font-size: 18px; font-weight: 700; }
.sub { margin: 0; color: var(--muted); max-width: 42rem; }
.page-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-end; margin-bottom: 18px; }
.page-head h1 { font-size: clamp(28px, 4vw, 40px); }
.hero h1 { position: relative; }
.hero h1::after {
  content: "";
  display: block;
  width: 72px; height: 4px;
  margin-top: 12px;
  border-radius: 99px;
  background: #E8A317;
}

.btn {
  appearance: none;
  border: 0;
  border-radius: 999px;
  padding: 12px 18px;
  font-weight: 780;
  background: transparent;
  color: var(--ink);
  transition: transform .15s ease, box-shadow .15s ease, background .15s ease, opacity .15s ease;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(0) scale(0.98); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
.btn.primary { background: #E8A317; color: #16324F; box-shadow: 0 8px 18px rgba(232, 163, 23, 0.28); }
.btn.primary:hover { background: #f0b22a; }
.btn.ghost { box-shadow: inset 0 0 0 1.5px var(--line); background: var(--card); }
.btn.danger { color: var(--danger); box-shadow: inset 0 0 0 1.5px rgba(180, 35, 24, 0.35); background: transparent; }
.btn.small { padding: 8px 12px; border-radius: 12px; font-size: 13px; font-weight: 750; }
.btn.small i { margin-right: 6px; }
.hero .btn { margin-top: 18px; }

.ribbon, .stat-card, .concept-card, .form-card, .stage-card, .toolbar {
  background: var(--card);
  border-radius: 18px;
  box-shadow: var(--shadow);
  border: 1px solid transparent;
}
.ribbon { display: flex; align-items: center; gap: 8px; padding: 16px; margin: 26px 0 18px; overflow: auto; }
.ribbon-step { display: flex; align-items: center; gap: 10px; min-width: max-content; }
.ribbon-num {
  width: 36px; height: 36px; border-radius: 50%;
  display: grid; place-items: center; color: #fff; font-weight: 800;
}
.ribbon-step.clay .ribbon-num { background: #D4764E; }
.ribbon-step.lake .ribbon-num { background: #1F8A70; }
.ribbon-step.indigo .ribbon-num { background: #3D5A80; }
.ribbon-label { font-weight: 780; }
.ribbon-line { width: 32px; height: 2px; background: rgba(232, 163, 23, 0.7); flex: 0 0 auto; }
.ribbon-flag {
  margin-left: 4px;
  border: 1px dashed #E8A317;
  color: #8A5A00;
  background: rgba(232, 163, 23, 0.14);
  border-radius: 999px;
  padding: 7px 12px;
  font-size: 13px;
  font-weight: 780;
  white-space: nowrap;
}
html[data-theme="dark"] .ribbon-flag { color: #F3D48A; }

.section-title { margin: 22px 0 12px; font-size: 22px; }
.stat-grid, .card-grid { display: grid; gap: 14px; }
.stat-grid { grid-template-columns: repeat(4, 1fr); }
.card-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.stat-card {
  text-align: left;
  padding: 16px 16px 14px;
  min-height: 112px;
  color: var(--ink);
  position: relative;
  overflow: hidden;
}
.stat-card::before {
  content: "";
  position: absolute; left: 0; top: 0; bottom: 0; width: 6px;
  background: var(--c, #16324F);
}
.stat-card.clay { --c: #D4764E; }
.stat-card.lake { --c: #1F8A70; }
.stat-card.indigo { --c: #3D5A80; }
.stat-card.total { --c: #E8A317; }
.stat-num { display: block; font-size: 34px; font-weight: 800; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.stat-kicker { display: block; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
.stat-card:hover, .concept-card:hover, .type-card:hover {
  transform: translateY(-4px);
  border-color: rgba(232, 163, 23, 0.75);
}
.stat-card:active, .concept-card:active, .type-card:active { transform: translateY(-1px) scale(0.99); }

.concept-card {
  position: relative;
  overflow: hidden;
  padding: 16px 16px 14px 20px;
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.concept-card::before {
  content: "";
  position: absolute; left: 0; top: 0; bottom: 0; width: 6px;
  background: var(--c, #16324F);
}
.concept-card.clay, .badge.clay, .lamp.clay { --c: #D4764E; }
.concept-card.lake, .badge.lake, .lamp.lake { --c: #1F8A70; }
.concept-card.indigo, .badge.indigo, .lamp.indigo { --c: #3D5A80; }
.concept-card.navy { --c: #16324F; }
.concept-hit {
  width: 100%;
  text-align: left;
  background: transparent;
  border: 0;
  color: inherit;
  padding: 0;
}
.concept-card.as-button { text-align: left; color: inherit; }
.concept-card h3, .record-head h3 { margin: 0 0 8px; font-size: 18px; line-height: 1.35; }
.badge {
  display: inline-flex;
  align-items: center;
  border-radius: 999px;
  padding: 3px 8px;
  font-size: 12px;
  font-weight: 800;
  color: var(--c, #16324F);
  background: rgba(22, 50, 79, 0.08);
}
.badge.clay { background: rgba(212, 118, 78, 0.16); }
.badge.lake { background: rgba(31, 138, 112, 0.16); }
.badge.indigo { background: rgba(61, 90, 128, 0.16); }
.formula-line, .formula-bar {
  font-family: Consolas, "Cascadia Mono", "Sarasa Mono SC", monospace;
  font-size: 13px;
  white-space: pre-wrap;
  word-break: break-word;
}
.formula-line { margin: 10px 0 0; color: var(--ink); }
.formula-line.is-empty, .formula-bar.is-empty { font-family: inherit; color: var(--muted); font-style: italic; }
.formula-bar {
  margin: 10px 0 0;
  padding: 8px 10px;
  border-radius: 12px;
  background: rgba(61, 90, 128, 0.08);
}
.concept-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.concept-hit { display: block; }

.toolbar { padding: 14px; margin-bottom: 14px; display: grid; gap: 12px; }
.search { position: relative; display: flex; align-items: center; }
.search i { position: absolute; left: 12px; color: var(--muted); }
.search input, .field input, .field textarea, textarea, input[type="text"], input[type="search"] {
  width: 100%;
  border: 1.5px solid var(--line);
  background: var(--card);
  color: var(--ink);
  border-radius: 12px;
  padding: 12px 14px;
}
.search input { padding-left: 38px; padding-right: 42px; }
html[data-theme="dark"] input, html[data-theme="dark"] textarea { background: #121820; }
input:focus, textarea:focus, select:focus { border-color: #E8A317; box-shadow: 0 0 0 4px rgba(232, 163, 23, 0.18); outline: none; }
.search-clear {
  position: absolute; right: 6px;
  width: 32px; height: 32px; border-radius: 50%;
  border: 0; background: transparent; color: var(--muted); font-size: 18px;
}
.filters, .sorts { display: flex; flex-wrap: wrap; gap: 8px; }
.chip, .sorts button {
  border-radius: 999px;
  border: 1.5px solid var(--line);
  background: transparent;
  color: var(--ink);
  padding: 8px 12px;
  font-weight: 750;
}
.chip[aria-pressed="true"], .sorts button[aria-pressed="true"] {
  background: #16324F;
  color: #fff;
  border-color: #16324F;
}
.chip.clay[aria-pressed="true"] { background: #D4764E; border-color: #D4764E; }
.chip.lake[aria-pressed="true"] { background: #1F8A70; border-color: #1F8A70; }
.chip.indigo[aria-pressed="true"] { background: #3D5A80; border-color: #3D5A80; }

.workshop-grid { display: grid; grid-template-columns: minmax(280px, 400px) minmax(0, 1fr); gap: 16px; align-items: start; }
.form-card, .stage-card { padding: 18px; }
.form-card h2 { margin: 0 0 14px; font-size: 22px; }
label { display: block; font-weight: 780; margin: 12px 0 6px; }
textarea { min-height: 120px; resize: vertical; }
.type-grid { display: grid; gap: 8px; }
.type-card {
  display: flex; align-items: center; gap: 12px;
  width: 100%; text-align: left;
  background: var(--card); color: var(--ink);
  border: 1.5px solid var(--line);
  border-radius: 14px; padding: 12px;
  transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
}
.type-card .type-icon {
  width: 36px; height: 36px; border-radius: 12px;
  display: grid; place-items: center; color: #fff; flex: 0 0 auto;
}
.type-card.clay .type-icon { background: #D4764E; }
.type-card.lake .type-icon { background: #1F8A70; }
.type-card.indigo .type-icon { background: #3D5A80; }
.type-card[aria-checked="true"] { border-color: var(--c, #E8A317); box-shadow: 0 8px 18px rgba(22, 50, 79, 0.08); }
.type-card.clay { --c: #D4764E; }
.type-card.lake { --c: #1F8A70; }
.type-card.indigo { --c: #3D5A80; }
.field-note, .hint, .wait-sub { color: var(--muted); }
.field-note { margin: 6px 0 0; font-size: 13px; }
.form-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
#workshopHint { min-height: 1.2em; color: #8A5A00; font-weight: 700; }
html[data-theme="dark"] #workshopHint { color: #F3D48A; }
.stage-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.stage-name { font-weight: 800; color: var(--muted); }
.stage-arrows { display: flex; gap: 6px; }
.stage-arrows button {
  width: 36px; height: 36px; border-radius: 10px;
  border: 1.5px solid var(--line); background: var(--card); color: var(--ink); font-weight: 800;
}
.stage-arrows button:disabled { opacity: .35; }
.stage-body { min-height: 280px; }
.stage-foot { color: var(--muted); font-size: 13px; margin: 10px 4px 0; }
.lamps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 8px 0 14px; }
.lamp { text-align: center; }
.bulb {
  width: 58px; height: 58px; margin: 0 auto 6px; border-radius: 50%;
  display: grid; place-items: center;
  border: 2px solid var(--line);
  color: var(--muted);
  background: rgba(22, 50, 79, 0.04);
  transition: .35s ease;
}
.lamp.on.clay .bulb { background: #D4764E; color: #fff; border-color: #D4764E; box-shadow: 0 0 0 6px rgba(212,118,78,.18); }
.lamp.on.lake .bulb { background: #1F8A70; color: #fff; border-color: #1F8A70; box-shadow: 0 0 0 6px rgba(31,138,112,.18); }
.lamp.on.indigo .bulb { background: #3D5A80; color: #fff; border-color: #3D5A80; box-shadow: 0 0 0 6px rgba(61,90,128,.2); }
.lamp-num { display: block; font-size: 12px; font-weight: 800; color: var(--muted); }
.lamp-label { font-weight: 780; font-size: 13px; }
.wait-kicker { margin: 0; font-weight: 800; color: #E8A317; letter-spacing: .08em; }
.wait-copy { font-size: 16px; font-weight: 700; }
.record-head { margin-bottom: 12px; }
.md-layout { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: start; }
.anchor-bar { display: flex; flex-direction: column; gap: 6px; position: sticky; top: 80px; }
.anchor-btn {
  border: 0; border-radius: 999px; padding: 6px 10px;
  font-size: 12px; font-weight: 800; color: #fff; text-align: left;
}
.anchor-btn.clay { background: #D4764E; }
.anchor-btn.lake { background: #1F8A70; }
.anchor-btn.indigo { background: #3D5A80; }
.anchor-btn.gold { background: #E8A317; color: #16324F; }
.empty { text-align: center; padding: 28px 12px 12px; }
.empty-icon {
  width: 64px; height: 64px; margin: 0 auto 8px; border-radius: 20px;
  display: grid; place-items: center;
  background: rgba(232, 163, 23, 0.16); color: #E8A317; font-size: 26px;
}
.loading-note { color: var(--muted); padding: 12px 4px; }

.overlay {
  position: fixed; inset: 0;
  background: rgba(14, 24, 36, 0.48);
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
}
html[data-theme="dark"] .overlay { background: rgba(0, 0, 0, 0.62); }
.sheet {
  background: var(--card);
  color: var(--ink);
  width: min(760px, 100%);
  max-height: calc(100dvh - 48px);
  border-radius: 20px;
  overflow: auto;
  box-shadow: 0 24px 60px rgba(14, 24, 36, 0.28);
}
.overlay.is-form .sheet { width: min(560px, 100%); }
.sheet-confirm { width: min(440px, 100%) !important; }
.sheet-body { padding: 20px 22px calc(36px + var(--kb)); }
.sheet-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.sheet-head h2, .sheet-body h2 { margin: 0 0 8px; font-size: 26px; }
.confirm-text { font-size: 16px; font-weight: 700; }
.md-flash { box-shadow: 0 0 0 3px rgba(232, 163, 23, 0.55); border-radius: 8px; }

.md-theme { color: var(--ink); overflow-x: auto; line-height: 1.7; }
.md-theme > *:first-child { margin-top: 0; }
.md-theme h1, .md-theme h2, .md-theme h3, .md-theme h4, .md-theme h5, .md-theme h6 { line-height: 1.3; margin: 1.1em 0 .4em; scroll-margin-top: 88px; }
.md-theme h1, .md-theme h2 { color: var(--navy); }
html[data-theme="dark"] .md-theme h1, html[data-theme="dark"] .md-theme h2 { color: #F4EFE4; }
.md-theme p, .md-theme ul, .md-theme ol, .md-theme blockquote, .md-theme pre, .md-theme table { margin: .7em 0; }
.md-theme a { color: #1F8A70; }
.md-theme code { font-family: Consolas, "Cascadia Mono", monospace; background: rgba(22, 50, 79, 0.08); padding: .1em .35em; border-radius: 6px; }
.md-theme pre { background: #16324F; color: #F6F3EC; padding: 12px 14px; border-radius: 12px; overflow-x: auto; }
.md-theme pre code { background: transparent; color: inherit; padding: 0; }
.md-theme blockquote { margin-left: 0; padding: 4px 12px; border-left: 4px solid #E8A317; background: rgba(232, 163, 23, 0.1); }
.md-theme table { border-collapse: collapse; width: max-content; min-width: 100%; }
.md-theme th, .md-theme td { border: 1px solid var(--line); padding: 8px 10px; vertical-align: top; }
.md-theme th { background: rgba(22, 50, 79, 0.06); }
.md-theme img { max-width: 100%; height: auto; border-radius: 12px; }
.md-theme hr { border: 0; border-top: 1px solid var(--line); }
.md-theme input[type="checkbox"] { margin-right: 6px; }
.md-image-link { display: inline-block; }

.toast {
  position: fixed; left: 50%; bottom: calc(24px + var(--kb));
  transform: translateX(-50%) translateY(12px);
  background: #16324F; color: #fff;
  padding: 12px 16px; border-radius: 14px;
  z-index: 4000; opacity: 0; pointer-events: none;
  transition: .25s ease; max-width: min(520px, calc(100% - 32px));
  box-shadow: 0 12px 30px rgba(0,0,0,.25);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 900px) {
  .stat-grid { grid-template-columns: 1fr 1fr; }
  .workshop-grid { grid-template-columns: 1fr; }
  .page-head { flex-direction: column; align-items: flex-start; }
}
@media (max-width: 760px) {
  .wrap { width: min(1120px, calc(100% - 20px)); padding-bottom: 120px; }
  .ribbon { flex-direction: column; align-items: stretch; }
  .ribbon-line { width: 2px; height: 14px; margin-left: 17px; }
  .md-layout { grid-template-columns: 1fr; }
  .anchor-bar { position: static; flex-direction: row; flex-wrap: wrap; }
  .overlay.is-markdown { padding: 0; align-items: stretch; }
  .overlay.is-markdown .sheet { width: 100%; max-width: none; height: 100%; max-height: none; border-radius: 0; }

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

}

      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

        function t(key) {
            const pack = I18N[lang] || I18N.zh;
            if (pack[key] != null) return pack[key];
            return I18N.zh[key] != null ? I18N.zh[key] : key;
        }

        function detectLanguage() {
            try {
                const params = new URLSearchParams(window.location.search);
                const qp = (params.get('lang') || '').toLowerCase();
                if (qp === 'cn') return 'zh';
                if (qp === 'en') return 'en';
            } catch (err) {}
            try {
                const stored = localStorage.getItem('iThinkAir_UiLanguage');
                if (stored != null && stored !== '') return stored === 'en' ? 'en' : 'zh';
            } catch (err) {}
            try {
                const list = navigator.languages;
                if (!list || !list.length) return 'zh';
                for (let i = 0; i < list.length; i++) {
                    const item = String(list[i] || '').toLowerCase();
                    if (item === 'zh' || item.indexOf('zh-') === 0) return 'zh';
                }
                return 'en';
            } catch (err) {
                return 'zh';
            }
        }

        function applyLanguage(next) {
            if (next) lang = next;
            document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
            document.title = t('appName');
            const nodes = document.querySelectorAll('[data-i18n]');
            for (let i = 0; i < nodes.length; i++) {
                nodes[i].textContent = t(nodes[i].getAttribute('data-i18n'));
            }
            const places = document.querySelectorAll('[data-i18n-placeholder]');
            for (let i = 0; i < places.length; i++) {
                places[i].setAttribute('placeholder', t(places[i].getAttribute('data-i18n-placeholder')));
            }
            const arias = document.querySelectorAll('[data-i18n-aria]');
            for (let i = 0; i < arias.length; i++) {
                arias[i].setAttribute('aria-label', t(arias[i].getAttribute('data-i18n-aria')));
            }
            const langBtn = document.getElementById('langBtn');
            if (langBtn) langBtn.textContent = lang === 'en' ? '中文' : 'EN';
            const zhBtn = document.getElementById('mobileLangZh');
            const enBtn = document.getElementById('mobileLangEn');
            if (zhBtn) zhBtn.setAttribute('aria-pressed', lang === 'zh' ? 'true' : 'false');
            if (enBtn) enBtn.setAttribute('aria-pressed', lang === 'en' ? 'true' : 'false');
            renderTypeCards('workshopTypeGrid', 'formWorkshop_概念类型');
            if (document.getElementById('editTypeGrid')) renderTypeCards('editTypeGrid', 'formEdit_概念类型');
            syncFormLock();
            updateLightButton();
            updateRowButtons();
            updateFormulaNote('formWorkshop');
            updateFormulaNote('formEdit');
            renderHome();
            renderLibrary();
            renderStage();
            if (detailState && detailEl && document.body.contains(detailEl)) paintDetail();
            fitNav();
        }

        function setLanguage(next) {
            lang = next === 'en' ? 'en' : 'zh';
            try { localStorage.setItem('iThinkAir_UiLanguage', lang === 'en' ? 'en' : 'cn'); } catch (err) {}
            applyLanguage(lang);
        }

        function applyMode(mode) {
            const text = mode == null ? '' : String(mode);
            const dark = text.indexOf('暗') !== -1;
            document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
            const meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', dark ? '#0E2236' : '#16324F');
        }

        function escapeHtml(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function toast(message) {
            const el = document.getElementById('toast');
            if (!el) return;
            el.textContent = message;
            el.classList.add('show');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { el.classList.remove('show'); }, 3800);
        }

        function parseCount(text) {
            if (text == null) return 0;
            const source = String(text).trim();
            if (!source) return 0;
            const direct = parseInt(source, 10);
            if (!isNaN(direct) && String(direct) === source) return direct;
            const matched = source.match(/\d+/);
            return matched ? parseInt(matched[0], 10) : (isNaN(direct) ? 0 : direct);
        }

        function safeRows(csvText) {
            if (csvText == null) return [];
            const text = String(csvText);
            if (text.trim() === '') return [];
            try { return parseCSV(text); } catch (err) { return []; }
        }

        function mapRecords(csvText) {
            const rows = safeRows(csvText);
            const list = [];
            for (let i = 0; i < rows.length; i++) {
                const cols = rows[i] || [];
                const name = cols.length > 0 && cols[0] != null ? String(cols[0]) : '';
                const type = cols.length > 1 && cols[1] != null ? String(cols[1]).trim() : '';
                const formula = cols.length > 2 && cols[2] != null ? String(cols[2]) : '';
                if (name.trim() === '' && type === '' && formula.trim() === '') continue;
                list.push({ row: i + 1, name: name.trim(), type: type, formula: formula });
            }
            return list;
        }

        function countTypes(csvText) {
            const rows = safeRows(csvText);
            const out = { lived: 0, imagine: 0, formula: 0 };
            for (let i = 0; i < rows.length; i++) {
                const value = rows[i] && rows[i][0] != null ? String(rows[i][0]).trim() : '';
                if (value === '有明确生活体验') out.lived += 1;
                else if (value === '抽象但可想象') out.imagine += 1;
                else if (value === '已背公式但不理解') out.formula += 1;
            }
            return out;
        }

        function typeClass(type) {
            if (type === '有明确生活体验') return 'clay';
            if (type === '抽象但可想象') return 'lake';
            if (type === '已背公式但不理解') return 'indigo';
            return 'navy';
        }

        function typeLabel(type) {
            if (type === '有明确生活体验') return lang === 'en' ? t('rawLived') : type;
            if (type === '抽象但可想象') return lang === 'en' ? t('rawImagine') : type;
            if (type === '已背公式但不理解') return lang === 'en' ? t('rawFormula') : type;
            return type || '';
        }

        function makeBadge(type) {
            const span = document.createElement('span');
            span.className = 'badge ' + typeClass(type);
            span.textContent = typeLabel(type) || t('fieldType');
            return span;
        }

        function getScrollY() {
            if (document.body.classList.contains('popup-open')) {
                return parseInt(document.body.dataset.scroll || '0', 10) || 0;
            }
            return window.scrollY || document.documentElement.scrollTop || 0;
        }

        function lockBody() {
            const y = window.scrollY || document.documentElement.scrollTop || 0;
            document.body.dataset.scroll = String(y);
            document.body.style.top = '-' + y + 'px';
            document.body.classList.add('popup-open');
        }

        function unlockBody() {
            const y = parseInt(document.body.dataset.scroll || '0', 10) || 0;
            document.body.classList.remove('popup-open');
            document.body.style.top = '';
            window.scrollTo(0, y);
        }

        function pushPopup(el, closer) {
            el._airCloser = closer;
            popupStack.push(el);
            el.style.zIndex = String(1400 + popupStack.length * 10);
            document.body.appendChild(el);
            if (popupStack.length === 1) lockBody();
        }

        function removePopup(el) {
            const index = popupStack.indexOf(el);
            if (index >= 0) popupStack.splice(index, 1);
            if (el && el.parentNode) el.parentNode.removeChild(el);
            if (!popupStack.length) unlockBody();
        }

        function closeTopPopup() {
            const el = popupStack[popupStack.length - 1];
            if (!el) return;
            if (typeof el._airCloser === 'function') el._airCloser();
            else removePopup(el);
        }

        function closeMobileMenu() {
            const menu = document.getElementById('mobileMenu');
            const burger = document.getElementById('hamburger');
            if (menu) menu.classList.remove('open');
            if (burger) burger.setAttribute('aria-expanded', 'false');
        }

        function fitNav() {
            const inner = document.getElementById('navInner');
            const links = document.getElementById('navLinks');
            const langBtn = document.getElementById('langBtn');
            const burger = document.getElementById('hamburger');
            const brand = document.getElementById('brandBtn');
            if (!inner || !links || !langBtn || !burger || !brand) return;
            links.style.display = 'flex';
            langBtn.style.display = 'inline-flex';
            burger.style.display = 'none';
            const need = brand.offsetWidth + links.scrollWidth + langBtn.offsetWidth + 48;
            if (need > inner.clientWidth) {
                links.style.display = 'none';
                langBtn.style.display = 'none';
                burger.style.display = 'inline-flex';
            } else {
                closeMobileMenu();
            }
        }

        function updateNavCurrent() {
            const map = [
                ['navTabHome', 'mobileTabHome', 'home'],
                ['navTabWorkshop', 'mobileTabWorkshop', 'workshop'],
                ['navTabLibrary', 'mobileTabLibrary', 'library']
            ];
            for (let i = 0; i < map.length; i++) {
                const on = map[i][2] === currentPage;
                const desktop = document.getElementById(map[i][0]);
                const mobile = document.getElementById(map[i][1]);
                if (desktop) {
                    if (on) desktop.setAttribute('aria-current', 'page');
                    else desktop.removeAttribute('aria-current');
                }
                if (mobile) {
                    if (on) mobile.setAttribute('aria-current', 'page');
                    else mobile.removeAttribute('aria-current');
                }
            }
            document.body.setAttribute('data-page', currentPage);
        }

        async function showPage(page, opts) {
            opts = opts || {};
            const push = opts.push !== false;
            const changed = page !== currentPage;
            if (push && changed) historyStack.push({ page: currentPage, scroll: getScrollY() });
            currentPage = page;
            document.getElementById('pageHome').hidden = page !== 'home';
            document.getElementById('pageWorkshop').hidden = page !== 'workshop';
            document.getElementById('pageLibrary').hidden = page !== 'library';
            updateNavCurrent();
            closeMobileMenu();
            if (opts.scroll != null) window.scrollTo(0, opts.scroll);
            else if (push && changed) window.scrollTo(0, 0);
            if (page === 'home' && opts.refresh !== false) await refreshHome();
            if (page === 'library' && opts.refresh !== false) await refreshLibrary();
            if (page === 'workshop') {
                updateLightButton();
                updateRowButtons();
            }
            if (opts.scroll != null) window.scrollTo(0, opts.scroll);
        }

        function airBack() {
            try {
                if (popupStack.length) {
                    closeTopPopup();
                    return 'false';
                }
                if (historyStack.length) {
                    const prev = historyStack.pop();
                    showPage(prev.page, { push: false, scroll: prev.scroll });
                    return 'false';
                }
                return 'true';
            } catch (err) {
                return 'true';
            }
        }
        window.airBack = airBack;

        function goNewConcept() {
            clearWorkshop();
            showPage('workshop');
        }

        async function refreshHome() {
            const token = ++homeRequest;
            homeState = 'loading';
            renderHome();
            try {
                const countText = await callAppBridge({ type: 'GetRecordCount', data: '物理概念/默认表格' });
                if (token !== homeRequest) return;
                const typeCsv = await callAppBridge({ type: 'GetTableCSV', data: '物理概念/默认表格', payload: '概念类型' });
                if (token !== homeRequest) return;
                const listCsv = await callAppBridge({ type: 'GetTableCSV', data: '物理概念/默认表格', payload: '概念名称,概念类型,已记公式' });
                if (token !== homeRequest) return;
                recordCount = parseCount(countText);
                const counts = countTypes(typeCsv);
                cache.count = recordCount;
                cache.lived = counts.lived;
                cache.imagine = counts.imagine;
                cache.formula = counts.formula;
                cache.records = mapRecords(listCsv);
                homeState = 'ready';
            } catch (err) {
                if (token !== homeRequest) return;
                homeState = 'error';
                toast(t('errGeneric'));
            }
            renderHome();
            updateRowButtons();
        }

        async function refreshLibrary() {
            const token = ++libraryRequest;
            if (libraryState !== 'ready') {
                libraryState = 'loading';
                renderLibrary();
            }
            try {
                const countText = await callAppBridge({ type: 'GetRecordCount', data: '物理概念/默认表格' });
                const listCsv = await callAppBridge({ type: 'GetTableCSV', data: '物理概念/默认表格', payload: '概念名称,概念类型,已记公式' });
                if (token !== libraryRequest) return;
                recordCount = parseCount(countText);
                cache.count = recordCount;
                cache.records = mapRecords(listCsv);
                libraryState = 'ready';
            } catch (err) {
                if (token !== libraryRequest) return;
                libraryState = 'error';
                toast(t('errGeneric'));
            }
            renderLibrary();
            updateRowButtons();
        }

        function fillEmpty(el, text, buttonLabel, action) {
            el.innerHTML = '';
            el.hidden = false;
            const icon = document.createElement('div');
            icon.className = 'empty-icon';
            icon.innerHTML = '<i class="fa-solid fa-lightbulb"></i>';
            const p = document.createElement('p');
            p.textContent = text;
            el.appendChild(icon);
            el.appendChild(p);
            if (buttonLabel) {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'btn primary';
                button.textContent = buttonLabel;
                button.setAttribute('data-action', action);
                el.appendChild(button);
            }
        }

        function renderHome() {
            const totalEl = document.getElementById('statTotal');
            const livedEl = document.getElementById('statLived');
            const imagineEl = document.getElementById('statImagine');
            const formulaEl = document.getElementById('statFormula');
            const grid = document.getElementById('recentGrid');
            const empty = document.getElementById('homeEmpty');
            if (!totalEl || !grid || !empty) return;
            if (homeState === 'ready') {
                totalEl.textContent = String(cache.count);
                livedEl.textContent = String(cache.lived);
                imagineEl.textContent = String(cache.imagine);
                formulaEl.textContent = String(cache.formula);
            } else {
                totalEl.textContent = '—';
                livedEl.textContent = '—';
                imagineEl.textContent = '—';
                formulaEl.textContent = '—';
            }
            grid.innerHTML = '';
            if (homeState === 'loading' || homeState === 'idle') {
                empty.hidden = true;
                const note = document.createElement('p');
                note.className = 'loading-note';
                note.textContent = t('loading');
                grid.appendChild(note);
                return;
            }
            if (homeState === 'error') {
                fillEmpty(empty, t('errLoad'), t('retry'), 'retry-home');
                return;
            }
            const recent = cache.records.slice(0, 4);
            if (!recent.length) {
                fillEmpty(empty, t('emptyHome'), t('btnNew'), 'new-concept');
                return;
            }
            empty.hidden = true;
            for (let i = 0; i < recent.length; i++) grid.appendChild(buildRecentCard(recent[i]));
        }

        function buildRecentCard(rec) {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'concept-card as-button ' + typeClass(rec.type);
            button.setAttribute('data-action', 'open-recent');
            button.setAttribute('data-row', String(rec.row));
            const title = document.createElement('h3');
            title.textContent = rec.name || t('unnamed');
            const formula = document.createElement('p');
            const blank = !rec.formula || String(rec.formula).trim() === '';
            formula.className = 'formula-line' + (blank ? ' is-empty' : '');
            formula.textContent = blank ? t('formulaEmptyCard') : rec.formula;
            button.appendChild(title);
            button.appendChild(makeBadge(rec.type));
            button.appendChild(formula);
            return button;
        }

        function visibleRecords() {
            const query = libraryQuery.trim().toLowerCase();
            const list = [];
            for (let i = 0; i < cache.records.length; i++) {
                const rec = cache.records[i];
                if (libraryFilter !== 'all' && rec.type !== libraryFilter) continue;
                if (query && String(rec.name).toLowerCase().indexOf(query) === -1) continue;

        function updateLightButton() {
            const label = document.getElementById('btnLightLabel');
            const button = document.getElementById('btnLight');
            const hint = document.getElementById('workshopHint');

            if (submitLocked) {
                button.disabled = true;
                label.textContent = t('stageWaitShort');
                if (hint) hint.textContent = '';

            }
            label.textContent = t('btnLight');

            const prev = document.getElementById('btnPrev');

            stopPoll();
            currentRow = 0;
            workshopTouched = false;
            const name = document.getElementById('formWorkshop_概念名称');
            const type = document.getElementById('formWorkshop_概念类型');
            const formula = document.getElementById('formWorkshop_已记公式');
            if (name) name.value = '';
            if (type) type.value = '';
            if (formula) formula.value = '';

            renderStage();
            updateLightButton();
            updateRowButtons();
            updateFormulaNote('formWorkshop');

            const nameEl = document.getElementById('formWorkshop_概念名称');
            const typeEl = document.getElementById('formWorkshop_概念类型');
            const formulaEl = document.getElementById('formWorkshop_已记公式');

            if (typeEl) typeEl.value = type || '';

            updateFormulaNote('formWorkshop');

        async function submitNew() {
            if (submitLocked) return;
            if (currentRow > 0) {
                clearWorkshop();
                return;
            }
            workshopTouched = true;
            if (!formIsValid()) {
                updateLightButton();
                toast(validationHint() || t('errGeneric'));
                return;
            }
            const name = document.getElementById('formWorkshop_概念名称').value.trim();
            const type = document.getElementById('formWorkshop_概念类型').value;
            const formula = document.getElementById('formWorkshop_已记公式').value;
            const payload = JSON.stringify({ '概念名称': name, '概念类型': type, '已记公式': formula });
            submitLocked = true;
            syncFormLock();
            updateLightButton();
            updateRowButtons();
            try {
                await callAppBridge({ type: 'SubmitRecord', data: '物理概念', payload: payload });
                currentRow = 1;
                recordCount = Math.max(recordCount + 1, 1);
                stageState = { mode: 'waiting', name: name, type: type, formula: formula, markdown: '', phase: 1 };
                renderStage();
                updateRowButtons();
                startPoll();
                refreshHome();
                refreshLibrary();
            } catch (err) {
                submitLocked = false;
                syncFormLock();
                updateLightButton();
                updateRowButtons();
                toast(t('errGeneric'));
            }
        }

        function haltPollTimer() {
            pollToken += 1;
            if (pollTimer) {
                clearTimeout(pollTimer);
                pollTimer = 0;
            }
        }

        function stopPoll() {
            haltPollTimer();
            submitLocked = false;
            syncFormLock();
            updateLightButton();
            updateRowButtons();
        }

        function startPoll() {
            haltPollTimer();
            const token = pollToken;
            submitLocked = true;
            syncFormLock();
            updateLightButton();
            updateRowButtons();
            const started = Date.now();
            let errorShown = false;
            const tick = async () => {
                if (token !== pollToken) return;
                const elapsed = Date.now() - started;
                const phase = elapsed >= 16000 ? 3 : (elapsed >= 8000 ? 2 : 1);
                if (stageState && stageState.mode === 'waiting') {
                    stageState.phase = phase;
                    paintLamps(phase);
                }
                if (elapsed >= 60000) {
                    if (stageState) stageState.mode = 'timeout';
                    stopPoll();
                    renderStage();
                    return;
                }
                try {
                    const text = await callAppBridge({ type: 'GetCellValue', data: '物理概念/默认表格', payload: '直觉讲解/1' });
                    if (token !== pollToken) return;
                    if (text && String(text).trim() !== '') {
                        stageState.mode = 'result';
                        stageState.markdown = String(text);
                        stageState.phase = 3;
                        stopPoll();
                        renderStage();
                        return;
                    }
                } catch (err) {
                    if (!errorShown) {
                        errorShown = true;
                        toast(t('errGeneric'));
                    }
                }
                if (token !== pollToken) return;
                pollTimer = setTimeout(tick, 2000);
            };
            tick();
        }

        async function loadWorkshopRow(row) {
            const countText = await callAppBridge({ type: 'GetRecordCount', data: '物理概念/默认表格' });
            recordCount = parseCount(countText);
            if (row < 1 || row > recordCount) {
                updateRowButtons();
                return;
            }
            const name = await callAppBridge({ type: 'GetCellValue', data: '物理概念/默认表格', payload: '概念名称/' + row });
            const type = await callAppBridge({ type: 'GetCellValue', data: '物理概念/默认表格', payload: '概念类型/' + row });
            const formula = await callAppBridge({ type: 'GetCellValue', data: '物理概念/默认表格', payload: '已记公式/' + row });
            const explain = await callAppBridge({ type: 'GetCellValue', data: '物理概念/默认表格', payload: '直觉讲解/' + row });
            currentRow = row;
            const nameText = name == null ? '' : String(name);
            const typeText = type == null ? '' : String(type).trim();
            const formulaText = formula == null ? '' : String(formula);
            const mdText = explain == null ? '' : String(explain);
            fillWorkshop(nameText, typeText, formulaText);
            if (mdText.trim()) stageState = { mode: 'result', name: nameText, type: typeText, formula: formulaText, markdown: mdText, phase: 3 };
            else stageState = { mode: 'pending', name: nameText, type: typeText, formula: formulaText, markdown: '', phase: 0 };
            renderStage();
            updateLightButton();
            updateRowButtons();
        }

        async function stepRow(delta) {
            if (submitLocked) return;
            try {
                const countText = await callAppBridge({ type: 'GetRecordCount', data: '物理概念/默认表格' });
                recordCount = parseCount(countText);
                updateRowButtons();
                if (delta < 0) {
                    if (currentRow <= 1) return;
                    await loadWorkshopRow(currentRow - 1);
                    return;
                }
                if (currentRow === 0 || currentRow >= recordCount) return;
                await loadWorkshopRow(currentRow + 1);
            } catch (err) {
                toast(t('errGeneric'));
            }
        }

        async function rereadStage() {
            if (currentRow < 1) return;
            try {
                const explain = await callAppBridge({ type: 'GetCellValue', data: '物理概念/默认表格', payload: '直觉讲解/' + currentRow });
                const mdText = explain == null ? '' : String(explain);
                stageState.markdown = mdText;
                stageState.mode = mdText.trim() ? 'result' : 'pending';
                renderStage();
            } catch (err) {
                toast(t('errGeneric'));
            }
        }

        function buildLamps(phase) {
            const row = document.createElement('div');
            row.className = 'lamps';
            row.id = 'stageLamps';
            const items = [
                { cls: 'clay', key: 'step1', icon: 'fa-mug-hot' },
                { cls: 'lake', key: 'step2', icon: 'fa-flask' },
                { cls: 'indigo', key: 'step3', icon: 'fa-square-root-variable' }
            ];
            for (let i = 0; i < items.length; i++) {
                const lamp = document.createElement('div');
                lamp.className = 'lamp ' + items[i].cls + (i < phase ? ' on' : '');
                const bulb = document.createElement('div');
                bulb.className = 'bulb';
                bulb.innerHTML = '<i class="fa-solid ' + items[i].icon + '"></i>';
                const num = document.createElement('span');
                num.className = 'lamp-num';
                num.textContent = String(i + 1);
                const label = document.createElement('div');
                label.className = 'lamp-label';
                label.textContent = t(items[i].key);
                lamp.appendChild(bulb);
                lamp.appendChild(num);
                lamp.appendChild(label);
                row.appendChild(lamp);
            }
            return row;

        function paintLamps(phase) {
            const lamps = document.querySelectorAll('#stageLamps .lamp');
            for (let i = 0; i < lamps.length; i++) lamps[i].classList.toggle('on', i < phase);
        }

        function buildRecordHead(state) {
            const head = document.createElement('div');
            head.className = 'record-head';
            const title = document.createElement('h3');
            title.textContent = state.name || t('unnamed');
            const blank = !state.formula || String(state.formula).trim() === '';
            const bar = document.createElement('p');
            bar.className = 'formula-bar' + (blank ? ' is-empty' : '');
            bar.textContent = blank ? t('formulaEmptyStage') : String(state.formula);
            head.appendChild(title);
            head.appendChild(makeBadge(state.type));
            head.appendChild(bar);
            return head;
        }

        function renderStage() {
            const body = document.getElementById('stageBody');
            const stage = document.getElementById('stage');
            if (!body) return;
            const state = stageState || { mode: 'idle' };
            if (stage) stage.setAttribute('aria-busy', state.mode === 'waiting' ? 'true' : 'false');
            body.innerHTML = '';
            if (state.mode === 'waiting') {
                const wrap = document.createElement('div');
                wrap.className = 'wait-stage';
                const kicker = document.createElement('p');
                kicker.className = 'wait-kicker';
                kicker.textContent = t('appName');
                const main = document.createElement('p');
                main.className = 'wait-copy';
                main.textContent = t('stageWaiting');
                const sub = document.createElement('p');
                sub.className = 'wait-sub';
                sub.textContent = t('stageWaitShort');
                wrap.appendChild(kicker);
                wrap.appendChild(buildLamps(state.phase || 1));
                wrap.appendChild(main);
                wrap.appendChild(sub);
                body.appendChild(wrap);
                return;
            }
            if (state.mode === 'timeout') {
                const wrap = document.createElement('div');
                wrap.className = 'wait-stage';
                if (state.name) {
                    const title = document.createElement('h3');
                    title.textContent = state.name;
                    wrap.appendChild(title);
                }
                wrap.appendChild(buildLamps(0));
                const copy = document.createElement('p');
                copy.className = 'wait-copy';
                copy.textContent = t('pollTimeout');
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'btn ghost';
                button.setAttribute('data-action', 'go-library');
                button.textContent = t('btnToLibrary');
                wrap.appendChild(copy);
                wrap.appendChild(button);
                body.appendChild(wrap);
                return;
            }
            if (state.mode === 'pending') {
                const wrap = document.createElement('div');
                wrap.appendChild(buildRecordHead(state));
                const copy = document.createElement('p');
                copy.className = 'wait-copy';
                copy.textContent = t('stillGenerating');
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'btn ghost';
                button.setAttribute('data-action', 'reread-stage');
                button.textContent = t('btnReread');
                wrap.appendChild(copy);
                wrap.appendChild(button);
                body.appendChild(wrap);
                return;
            }
            if (state.mode === 'result') {
                const wrap = document.createElement('div');
                wrap.className = 'result';
                wrap.appendChild(buildRecordHead(state));
                const layout = document.createElement('div');
                layout.className = 'md-layout';
                const md = document.createElement('div');
                md.className = 'md-body md-theme';
                md.innerHTML = renderMarkdown(state.markdown);
                enhanceMarkdown(md);
                const bar = document.createElement('div');
                bar.className = 'anchor-bar';
                layout.appendChild(md);
                layout.appendChild(bar);
                wrap.appendChild(layout);
                renderAnchors(bar, md);
                body.appendChild(wrap);
                return;
            }
            const idle = document.createElement('div');
            idle.className = 'wait-stage';
            const intro = document.createElement('p');
            intro.className = 'wait-copy';
            intro.textContent = t('stageWaitIntro');
            idle.appendChild(buildLamps(0));
            idle.appendChild(intro);
            body.appendChild(idle);
        }

        function findAnchorElement(host, words) {
            const groups = ['h1,h2,h3,h4,h5,h6', 'p,li,blockquote,td,th'];
            for (let g = 0; g < groups.length; g++) {
                const nodes = host.querySelectorAll(groups[g]);
                for (let i = 0; i < nodes.length; i++) {
                    const text = nodes[i].textContent || '';
                    for (let w = 0; w < words.length; w++) {
                        if (words[w] && text.indexOf(words[w]) !== -1) return nodes[i];
                    }
                }
            }
            return null;
        }

        function renderAnchors(bar, host) {
            const specs = [
                { id: 'life', key: 'anchorLife', words: ['生活经验', 'Lived experience', 'Life experience'] },
                { id: 'exp', key: 'anchorExp', words: ['实验想象', 'Thought experiment', 'Imagined experiment'] },
                { id: 'formula', key: 'anchorFormula', words: ['公式推导', 'Formula derivation'] },
                { id: 'transfer', key: 'anchorTransfer', words: ['迁移验证', 'Transfer check', 'Transfer verification'] }
            ];
            bar.innerHTML = '';
            let any = false;
            for (let i = 0; i < specs.length; i++) {
                const el = findAnchorElement(host, specs[i].words);
                if (!el) continue;
                any = true;
                el.setAttribute('data-anchor-mark', specs[i].id);
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'anchor-btn ' + (specs[i].id === 'life' ? 'clay' : specs[i].id === 'exp' ? 'lake' : specs[i].id === 'formula' ? 'indigo' : 'gold');
                button.setAttribute('data-action', 'jump-anchor');
                button.setAttribute('data-target', specs[i].id);
                button.textContent = t(specs[i].key);
                bar.appendChild(button);
            }
            bar.hidden = !any;
        }

        function jumpAnchor(target) {
            const el = document.querySelector('[data-anchor-mark="' + target + '"]');
            if (!el) return;
            el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            el.classList.add('md-flash');
            setTimeout(() => el.classList.remove('md-flash'), 1400);
        }

        function ensureMarked() {
            if (!window.marked || window.__markedReady) return;
            try {
                if (typeof window.marked.use === 'function') window.marked.use({ gfm: true, breaks: true });
            } catch (err) {}
            window.__markedReady = true;
        }

        function renderMarkdown(src) {
            const text = src == null ? '' : String(src);
            ensureMarked();
            try {
                if (window.marked && typeof window.marked.parse === 'function') {
                    const html = window.marked.parse(text);
                    if (typeof html === 'string') return sanitizeHtml(html);
                }
            } catch (err) {}
            return sanitizeHtml(fallbackMarkdown(text));
        }

        function sanitizeHtml(html) {
            const template = document.createElement('template');
            template.innerHTML = String(html || '');
            const banned = template.content.querySelectorAll('script, object, embed, base');
            for (let i = banned.length - 1; i >= 0; i--) banned[i].remove();
            const all = template.content.querySelectorAll('*');
            for (let i = 0; i < all.length; i++) {
                const attrs = all[i].attributes;
                for (let j = attrs.length - 1; j >= 0; j--) {
                    const name = attrs[j].name.toLowerCase();
                    const value = attrs[j].value || '';
                    if (name.indexOf('on') === 0) all[i].removeAttribute(attrs[j].name);
                    else if ((name === 'href' || name === 'src') && /^\s*javascript:/i.test(value)) all[i].removeAttribute(attrs[j].name);
                }
            }
            return template.innerHTML;
        }

        function downloadHref(src) {
            const value = String(src || '').trim();
            if (!value) return '';
            if (/^data:/i.test(value) || /^blob:/i.test(value) || /^https?:\/\//i.test(value)) return value;
            return 'http://' + window.location.hostname + ':3130/download/' + encodeURIComponent(value);
        }

        function enhanceMarkdown(root) {
            const images = root.querySelectorAll('img');
            for (let i = 0; i < images.length; i++) {
                const img = images[i];
                const href = downloadHref(img.getAttribute('src') || '');
                if (!img.getAttribute('alt')) img.setAttribute('alt', t('download'));
                let link = img.closest('a');
                if (!link) {
                    link = document.createElement('a');
                    img.parentNode.insertBefore(link, img);
                    link.appendChild(img);
                }
                if (href) link.href = href;
                link.setAttribute('download', '');
                link.target = '_blank';
                link.rel = 'noopener';
                link.classList.add('md-image-link');
                link.title = t('download');
            }
            const links = root.querySelectorAll('a');
            for (let i = 0; i < links.length; i++) {
                if (!links[i].getAttribute('target')) links[i].target = '_blank';
                links[i].rel = 'noopener';
            }
            const boxes = root.querySelectorAll('input[type="checkbox"]');
            for (let i = 0; i < boxes.length; i++) boxes[i].disabled = true;
        }

        function fallbackMarkdown(src) {
            const lines = String(src || '').replace(/\r\n/g, '\n').split('\n');
            const html = [];
            let i = 0;
            let listType = '';
            const flushList = () => {
                if (!listType) return;
                html.push(listType === 'ol' ? '</ol>' : '</ul>');
                listType = '';
            };
            const inline = (raw) => {
                let text = escapeHtml(raw);
                text = text.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g, (all, alt, href) => {
                    return '<img src="' + href + '" alt="' + alt + '">';
                });
                text = text.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2">$1</a>');
                text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
                text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                text = text.replace(/~~([^~]+)~~/g, '<del>$1</del>');
                text = text.replace(/(^|[^\*])\*([^*]+)\*/g, '$1<em>$2</em>');
                return text;
            };
            while (i < lines.length) {
                const line = lines[i];
                if (/^```/.test(line)) {
                    flushList();
                    const buf = [];
                    i += 1;
                    while (i < lines.length && !/^```/.test(lines[i])) {
                        buf.push(escapeHtml(lines[i]));
                        i += 1;
                    }
                    html.push('<pre><code>' + buf.join('\n') + '</code></pre>');
                    i += 1;
                    continue;
                }
                if (/^(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) {
                    flushList();
                    html.push('<hr>');
                    i += 1;
                    continue;
                }
                const heading = /^(#{1,6})\s+(.*)$/.exec(line);
                if (heading) {
                    flushList();
                    const level = heading[1].length;
                    html.push('<h' + level + '>' + inline(heading[2]) + '</h' + level + '>');
                    i += 1;
                    continue;
                }
                if (/^>\s?/.test(line)) {
                    flushList();
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(inline(lines[i].replace(/^>\s?/, '')));
                        i += 1;
                    }
                    html.push('<blockquote><p>' + buf.join('<br>') + '</p></blockquote>');
                    continue;
                }
                const ul = /^[-*+]\s+(.*)$/.exec(line);
                const ol = /^\d+\.\s+(.*)$/.exec(line);
                if (ul || ol) {
                    const nextType = ol ? 'ol' : 'ul';
                    if (listType !== nextType) {
                        flushList();
                        listType = nextType;
                        html.push(nextType === 'ol' ? '<ol>' : '<ul>');
                    }
                    html.push('<li>' + inline((ul || ol)[1]) + '</li>');
                    i += 1;
                    continue;
                }
                if (line.trim() === '') {
                    flushList();
                    i += 1;
                    continue;
                }
                flushList();
                const buf = [inline(line)];
                i += 1;
                while (i < lines.length && lines[i].trim() !== '' && !/^(#{1,6}\s|```|>\s?|[-*+]\s|\d+\.\s)/.test(lines[i]) && !/^(-{3,}|\*{3,}|_{3,})\s*$/.test(lines[i])) {
                    buf.push(inline(lines[i]));
                    i += 1;
                }
                html.push('<p>' + buf.join('<br>') + '</p>');
            }
            flushList();
            return html.join('\n');
        }

        function bindInputCare() {
            document.addEventListener('focusin', (e) => {
                const el = e.target;
                if (!el || !el.matches || !el.matches('input, textarea, select')) return;
                const lift = () => {
                    const vv = window.visualViewport;
                    let keyboard = 0;
                    if (vv) keyboard = Math.max(0, window.innerHeight - vv.height);
                    const extra = keyboard > 80 ? keyboard + 48 : 0;
                    document.documentElement.style.setProperty('--kb', extra + 'px');
                    const scroller = el.closest('.sheet-body');
                    if (scroller) scroller.style.paddingBottom = 'calc(120px + var(--kb))';
                    setTimeout(() => {
                        try { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (err) {}
                    }, 280);
                };
                lift();
                if (window.visualViewport) {
                    const once = () => {
                        lift();
                        window.visualViewport.removeEventListener('resize', once);
                    };
                    window.visualViewport.addEventListener('resize', once);
                }
            });
            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', () => {
                    const keyboard = Math.max(0, window.innerHeight - window.visualViewport.height);
                    if (keyboard < 80) document.documentElement.style.setProperty('--kb', '0px');
                });
            }
        }

            if (action === 'retry-home') return refreshHome();
            if (action === 'retry-library') return refreshLibrary();
            if (action === 'jump-anchor') return jumpAnchor(el.getAttribute('data-target'));
        }

        function bindUI() {
            if (uiBound) return;
            uiBound = true;
            document.addEventListener('click', onDocumentClick);
            document.addEventListener('keydown', onKeyDown);
            const form = document.getElementById('formWorkshop');
            form.addEventListener('submit', (e) => { e.preventDefault(); submitNew(); });
            document.getElementById('formWorkshop_概念名称').addEventListener('input', () => { workshopTouched = true; updateLightButton(); });
            document.getElementById('formWorkshop_已记公式').addEventListener('input', () => { workshopTouched = true; updateLightButton(); });
            const search = document.getElementById('librarySearch');
            search.addEventListener('input', () => {
                libraryQuery = search.value || '';
                renderLibrary();
            });
            window.addEventListener('resize', fitNav);
            bindInputCare();
            renderTypeCards('workshopTypeGrid', 'formWorkshop_概念类型');
            renderStage();
            updateLightButton();
            updateRowButtons();
        }

        async function initialize() {
            try {
                lang = detectLanguage();
                bindUI();
                applyLanguage(lang);
                fitNav();
                try {
                    const mode = await callAppBridge({ type: '模式' });
                    applyMode(mode);
                } catch (err) {
                    applyMode('亮色');
                }
                await showPage('home', { push: false });
            } catch (err) {
                toast(t('errGeneric'));
            }
        }

        (async () => {    await initialize();  })();

</script>
</body>
</html>
