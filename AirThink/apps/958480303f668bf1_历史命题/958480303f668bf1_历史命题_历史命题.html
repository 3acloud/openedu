<section class="page active" id="page-home"><div class="hero"><div class="eyebrow" data-i18n="heroEyebrow">以史为鉴 · 以问促思</div><h1 data-i18n="app">青史命题台</h1><p data-i18n="intro">按课程标准确定考查目标，核验史料出处，生成试题、参考答案与分层评分标准草稿，入库前须人工核对史实与出处</p><div class="actions"><button class="btn primary" id="homeNew"><i class="fa-solid fa-feather-pointed"></i><span data-i18n="start">开始新命题</span></button><button class="btn ghost" id="homeLibrary"><span data-i18n="enterLibrary">进入命题库</span><i class="fa-solid fa-arrow-right"></i></button></div></div><div class="notice"><i class="fa-solid fa-circle-info"></i> <span data-i18n="notice">请勿上传尚未启用的统考原题。生成稿标注仅供审定，不能代替教师核对。</span></div><div class="section-head"><h2 data-i18n="overview">命题概览</h2></div><div class="stats" id="stats"></div><div class="section-head"><h2 data-i18n="literacies">核心素养印鉴</h2></div><div class="stamp-panel"><div class="stamps" id="stamps"></div></div><div class="section-head"><h2 data-i18n="recent">最近命题</h2><button class="btn ghost" id="allRecent" data-i18n="viewAll">查看全部</button></div><div class="cards" id="recentCards"></div></section>

label><textarea id="questionForm-requirement" name="设问要求"></textarea></div><div class="field wide"><label for="questionForm-source" data-i18n="source">史料出处</label><textarea id="questionForm-source" name="史料出处"></textarea></div><div class="field wide"><label data-i18n="file">史料文件</label><input id="questionForm-file" name="史料文件" type="hidden"><div class="actions"><button class="btn" type="button" id="selectFile"><i class="fa-solid fa-paperclip"></i><span data-i18n="selectFile">选择史料</span></button><button class="btn" type="button" id="removeFile" data-i18n="removeFile">移除史料</button><button class="btn" type="button" id="formOpenFile" data-i18n="openFile">浏览器打开</button><button class="btn" type="button" id="formDownload" data-i18n="download">下载史料</button></div><div class="file-info" id="formFileInfo"></div></div></div><div class="form-actions"><div class="hint" id="sourceHint"></div><div class="actions"><button class="btn primary" type="button" id="generateBtn" data-i18n="generate">生成命题</button><button class="btn dark" type="button" id="saveBtn" data-i18n="save">保存修改</button><button class="btn" type="button" id="newBtn" data-i18n="newQuestion">另起一题</button></div></div></form></div><div class="panel"><div class="review-toolbar"><div><h3 data-i18n="draft">命题草稿</h3><span class="small muted" id="rowIndicator"></span></div><div class="actions"><button class="btn icon" id="prevBtn" type="button" aria-label="Previous"><i class="fa-solid fa-chevron-left"></i></button><button class="btn icon" id="nextBtn" type="button" aria-label="Next"><i class="fa-solid fa-chevron-right"></i></button></div></div><div class="review-content markdown-body" id="draftContent"></div><div class="review-footer"><p class="small muted" data-i18n="aiReminder">AI 生成，入库前请人工核对史实与出处</p><div class="actions"><button class="btn" id="copyDraft" type="button" data-i18n="copyDraft">复制草稿</button><button class="btn" id="reloadDraft" type="button" data-i18n="reloadDraft">重新读取草稿</button></div></div></div></div></section>

<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }

        url = 'http://' + window.location.hostname + ':3130/request';

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function selectImageA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*'; // 限制只选择图片文件
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        // 可选：进一步验证文件确实是图片
        if (!file.type.startsWith('image/')) {
          reject(new Error('选择的文件不是图片'));
          return;
        }
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择（注意：cancel事件在某些浏览器中可能不支持）
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function capturePhotoA() {
  return new Promise((resolve, reject) => {
    // 检查浏览器是否支持媒体设备API
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      reject(new Error('您的浏览器不支持拍照功能'));
      return;
    }
    
    // 创建一个隐藏的视频元素用于预览
    const video = document.createElement('video');
    video.style.display = 'none';
    video.setAttribute('autoplay', '');
    video.setAttribute('playsinline', '');
    
    // 创建一个canvas元素用于捕获照片
    const canvas = document.createElement('canvas');
    canvas.style.display = 'none';
    const ctx = canvas.getContext('2d');
    
    // 创建拍照按钮和取消按钮的容器
    const container = document.createElement('div');
    container.style.cssText = `
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    `;
    
    // 创建视频预览容器
    const videoContainer = document.createElement('div');
    videoContainer.style.cssText = `
      width: 100%;
      max-width: 640px;
      max-height: 70vh;
      overflow: hidden;
      border-radius: 8px;
      margin-bottom: 20px;
    `;
    
    // 将视频放入容器中
    video.style.cssText = `
      width: 100%;
      height: auto;
      transform: scaleX(-1); /* 镜像翻转，让预览更自然 */
    `;
    
    // 创建按钮容器
    const buttonContainer = document.createElement('div');
    buttonContainer.style.cssText = `
      display: flex;
      gap: 20px;
    `;
    
    // 创建拍照按钮
    const captureBtn = document.createElement('button');
    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}



/**
 * 上传文件到Flask服务端
 * @param {File} file - 要上传的文件
 * @returns {Promise<string>} - 返回GUID文件名
 */
async function uploadToFlaskA(file)
{
  // 创建FormData对象
  const formData = new FormData();
  formData.append('file', file);
  
  try {
    // 发送到Flask服务端
    const response = await fetch('http://' + window.location.hostname + ':3130/upload', {
      method: 'POST',
      body: formData,
    });
    
    if (!response.ok) {
      throw new Error(`上传失败: ${response.statusText}`);
    }

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

        function setInnerHTMLWithScripts(element, html) {
             element.innerHTML = html;
             // 执行内联脚本
             const scripts = element.querySelectorAll('script');
             scripts.forEach(oldScript => {
                 const newScript = document.createElement('script');
                 newScript.text = oldScript.text;
                 oldScript.parentNode.replaceChild(newScript, oldScript);
             });
         }

        function base64DecodeUTF8(base64Str) {
            // 使用atob解码Base64得到二进制字符串
            const binaryStr = atob(base64Str);
    
            // 将二进制字符串转换为字节数组
            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) {
                bytes[i] = binaryStr.charCodeAt(i);
            }
    
            // 使用TextDecoder将字节数组解码为UTF-8字符串
            const decoder = new TextDecoder('utf-8');
            return decoder.decode(bytes);
        }

function downloadFile(name){if(!name)return;const a=document.createElement('a');a.href=downloadUrl(name);a.download=safeName(name);a.target='_blank';document.body.appendChild(a);a.click();a.remove()}
function closeOverlay(id){$(id).classList.remove('open');if(id==='frameOverlay')$('fileFrame').src='about:blank';if(id==='detailOverlay')detailRow=0}
async function showDetail(row,refresh=false){let r=records.find(x=>x.row===row);if(!r)return;detailRow=row;$('detailOverlay').classList.add('open');$('detailBody').innerHTML='<p class="muted">'+esc(tr('loading'))+'</p>';try{const full={row};for(const field of FIELDS)full[field]=await getCell(field,row);if(detailRow!==row)return;r=full;const fields=FIELDS.map(f=>'<div class="detail-field '+(['考查内容','设问要求','史料出处','史料文件'].includes(f)?'full':'')+'"><b>'+esc(tr(({'学段':'stage','考查内容':'content','核心素养':'literacies','题型':'type','难度':'difficulty','设问要求':'requirement','史料出处':'source','史料文件':'file','分值':'score'})[f]))+'</b>'+((f==='史料文件')?fileLink(r[f])+thumbnail(r[f]):esc(f==='核心素养'?listValues(r[f]).map(localized).join(', '):localized(r[f]||'—')))+'</div>').join('');$('detailBody').innerHTML='<div class="detail-grid">'+fields+'</div><h3>'+esc(tr('draft'))+'</h3><div class="detail-markdown markdown-body" id="detailMarkdown"><p>'+esc(tr('loading'))+'</p></div><div class="actions dialog-actions">'+button('reloadDraft','reloadDetail',row)+button('edit','edit',row)+button('delete','delete',row,false,'danger')+button('openFile','open',row,!r['史料文件'])+button('download','download',row,!r['史料文件'])+button('copyDraft','copyDetail',row,true)+button('details','closeDetail',row)+'</div>';const raw=await getCell('命题草稿',row);if(detailRow!==row)return;$('detailMarkdown').innerHTML=markdown(raw);$('detailMarkdown').dataset.raw=raw;$('detailBody').querySelector('[data-action="copyDetail"]').disabled=!raw}catch(e){if(detailRow===row)$('detailBody').innerHTML='<p class="muted">'+esc(String(e))+'</p><button class="btn" data-action="reloadDetail" data-row="'+row+'">'+esc(tr('retry'))+'</button>'}}
async function deleteRow(row){if(!confirm(tr('confirmDelete')))return;try{await api({type:'DeleteRecord',data:SOURCE,payload:row.toString()});closeOverlay('detailOverlay');if(currentRow===row)clearForm();else if(currentRow>row)currentRow--;await refreshData();renderDraft()}catch(e){}}
function resetFilters(){for(const id of ['searchInput','filterStage','filterType','filterDifficulty','filterLiteracy'])$(id).value='';$('sortSelect').value='recent';renderLibrary()}
function closeMenu(){$('mobileMenu').classList.remove('open');$('menuToggle').setAttribute('aria-expanded','false')}
function checkNav(){const nav=$('siteNav');document.body.classList.remove('compact-nav');if($('brand').offsetWidth+$('navLinks').scrollWidth+$('langSwitch').offsetWidth+90>nav.clientWidth)document.body.classList.add('compact-nav');else closeMenu()}
async function navigate(next,options={}){if(page!==next){historyStack.push({page,scroll:window.scrollY});page=next;document.querySelectorAll('.page').forEach(el=>el.classList.toggle('active',el.id==='page-'+next));document.querySelectorAll('[data-page]').forEach(el=>el.classList.toggle('active',el.dataset.page===next));window.scrollTo(0,0)}closeMenu();if(options.new)clearForm();if(options.filter){resetFilters();if(options.filter==='初中'||options.filter==='高中')$('filterStage').value=options.filter;else $('filterDifficulty').value=options.filter;renderLibrary()}if(next==='workshop'&&options.row)await loadRow(options.row);try{await refreshData()}catch(e){}}
window.airBack=function(){if($('frameOverlay').classList.contains('open')){closeOverlay('frameOverlay');return 'false'}if($('detailOverlay').classList.contains('open')){closeOverlay('detailOverlay');return 'false'}if($('mobileMenu').classList.contains('open')){closeMenu();return 'false'}if(historyStack.length){const h=historyStack.pop();page=h.page;document.querySelectorAll('.page').forEach(el=>el.classList.toggle('active',el.id==='page-'+page));document.querySelectorAll('[data-page]').forEach(el=>el.classList.toggle('active',el.dataset.page===page));requestAnimationFrame(()=>window.scrollTo(0,h.scroll));refreshData().catch(()=>{});return 'false'}return 'true'};
function bind(){document.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',()=>navigate(el.dataset.page)));$('brand').onclick=()=>{try{parent.closeFullHtml(false)}catch(e){}};$('langSwitch').onclick=$('menuLang').onclick=()=>setLang(lang==='cn'?'en':'cn');$('menuToggle').onclick=()=>{const open=$('mobileMenu').classList.toggle('open');$('menuToggle').setAttribute('aria-expanded',String(open))};document.addEventListener('click',e=>{if(!$('siteNav').contains(e.target))closeMenu()});$('homeNew').onclick=()=>navigate('workshop',{new:true});$('homeLibrary').onclick=$('allRecent').onclick=$('workshopLibrary').onclick=()=>navigate('library');$('libraryNew').onclick=()=>navigate('workshop',{new:true});$('newBtn').onclick=clearForm;$('selectFile').onclick=async()=>{try{const name=await api({type:'SelectFile'});if(name){$('questionForm-file').value=name;renderFile()}}catch(e){}};$('removeFile').onclick=()=>{$('questionForm-file').value='';renderFile()};$('formOpenFile').onclick=()=>openFile($('questionForm-file').value);$('formDownload').onclick=()=>downloadFile($('questionForm-file').value);$('generateBtn').onclick=generate;$('saveBtn').onclick=save;$('prevBtn').onclick=()=>loadRow(currentRow-1);$('nextBtn').onclick=()=>loadRow(currentRow+1);$('copyDraft').onclick=()=>copyText(draftRaw);$('reloadDraft').onclick=reloadDraft;$('questionForm').addEventListener('input',()=>{renderSteps();updateButtons()});for(const id of ['searchInput','filterStage','filterType','filterDifficulty','filterLiteracy','sortSelect'])$(id).addEventListener('input',renderLibrary);$('resetFilters').onclick=resetFilters;$('closeDetail').onclick=()=>closeOverlay('detailOverlay');$('closeFrame').onclick=()=>closeOverlay('frameOverlay');for(const id of ['detailOverlay','frameOverlay'])$(id).addEventListener('click',e=>{if(e.target===$(id))closeOverlay(id)});document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const row=Number(b.dataset.row),r=records.find(x=>x.row===row);switch(b.dataset.action){case 'new':navigate('workshop',{new:true});break;case 'stat':navigate('library',{filter:b.dataset.filter});break;case 'detail':showDetail(row);break;case 'edit':closeOverlay('detailOverlay');navigate('workshop',{row});break;case 'delete':deleteRow(row);break;case 'open':if(r)openFile(r['史料文件']);break;case 'download':if(r)downloadFile(r['史料文件']);break;case 'reloadDetail':showDetail(row,true);break;case 'copyDetail':copyText($('detailMarkdown').dataset.raw);break;case 'closeDetail':closeOverlay('detailOverlay');break}});window.addEventListener('resize',checkNav);window.visualViewport?.addEventListener('resize',()=>{const active=document.activeElement;if(active&&/INPUT|TEXTAREA|SELECT/.test(active.tagName))setTimeout(()=>active.scrollIntoView({block:'center',behavior:'smooth'}),100)});document.addEventListener('focusin',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))setTimeout(()=>e.target.scrollIntoView({block:'center',behavior:'smooth'}),250)})}
async function initialize(){const stored=localStorage.getItem('iThinkAir_UiLanguage'),query=new URLSearchParams(location.search).get('lang'),languages=navigator.languages;lang=stored?(stored==='en'?'en':'cn'):query==='en'?'en':query==='cn'?'cn':!languages||!languages.length?'cn':languages.some(x=>/^zh(?:-|$)/i.test(x))?'cn':'en';bind();$('filterLiteracy').innerHTML='<option value="" data-i18n="allLiteracies">'+tr('allLiteracies')+'</option>'+LITERACIES.map(v=>'<option value="'+esc(v)+'">'+esc(localized(v))+'</option>').join('');applyLang();try{mode=await api({type:'模式'});document.body.classList.toggle('dark',mode==='暗色')}catch(e){}try{await refreshData()}catch(e){showStatus(String(e),true,refreshData)}renderDraft()}
(async () => { await initialize(); })();
</script>
</body>
