<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,
          "CapturePhoto": capturePhotoA,
          "FinishRecordVoice": FinishRecordVoiceA
        };

        // 检查请求类型是否在支持的映射中
        if (request['type'] in HANDLERS) {
          try {
            // 1. 根据类型选择相应的处理函数获取文件
            const file = await HANDLERS[request['type']]();
    
            // 2. 上传文件到Flask服务端
            const guidFileName = await uploadToFlaskA(file);
    
            // 3. 返回GUID文件名
            return guidFileName;
          } catch (error) {
            // 可以在这里添加错误处理逻辑，如日志记录
            console.error(`处理${request['type']}时出错:`, error);
          }
  
          // 所有失败情况返回空字符串
          return "";
        }



        url = 'http://' + window.location.hostname + ':3130/request';
        const response = await fetch(url, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'SessionID': localStorage.getItem('airthink_session_id'),
            'BaseName': encodeURIComponent("dafb60b779230a05_时空线索构建器")
        },
        body: JSON.stringify(request)
        });
  
        if (!response.ok) {
            throw new Error(`请求失败: ${response.status}`);
        }
  
        return await response.text();
    }

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function selectImageA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*'; // 限制只选择图片文件
    fileInput.style.display = 'none';

    fileInput.addEventListener('change', (event) => {

        if (!file.type.startsWith('image/')) {

        }
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择（注意：cancel事件在某些浏览器中可能不支持）
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function capturePhotoA() {
  return new Promise((resolve, reject) => {
    // 检查浏览器是否支持媒体设备API
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      reject(new Error('您的浏览器不支持拍照功能'));
      return;
    }
    
    // 创建一个隐藏的视频元素用于预览
    const video = document.createElement('video');
    video.style.display = 'none';
    video.setAttribute('autoplay', '');
    video.setAttribute('playsinline', '');
    
    // 创建一个canvas元素用于捕获照片
    const canvas = document.createElement('canvas');
    canvas.style.display = 'none';
    const ctx = canvas.getContext('2d');
    
    // 创建拍照按钮和取消按钮的容器
    const container = document.createElement('div');
    container.style.cssText = `
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    `;
    
    // 创建视频预览容器
    const videoContainer = document.createElement('div');
    videoContainer.style.cssText = `
      width: 100%;
      max-width: 640px;
      max-height: 70vh;
      overflow: hidden;
      border-radius: 8px;
      margin-bottom: 20px;
    `;
    
    // 将视频放入容器中
    video.style.cssText = `
      width: 100%;
      height: auto;
      transform: scaleX(-1); /* 镜像翻转，让预览更自然 */
    `;
    
    // 创建按钮容器
    const buttonContainer = document.createElement('div');
    buttonContainer.style.cssText = `
      display: flex;
      gap: 20px;
    `;
    
    // 创建拍照按钮
    const captureBtn = document.createElement('button');
    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

        function base64DecodeUTF8(base64Str) {
            // 使用atob解码Base64得到二进制字符串
            const binaryStr = atob(base64Str);
    
            // 将二进制字符串转换为字节数组
            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) {
                bytes[i] = binaryStr.charCodeAt(i);
            }
    
            // 使用TextDecoder将字节数组解码为UTF-8字符串
            const decoder = new TextDecoder('utf-8');
            return decoder.decode(bytes);
        }

on:'Direction',content:'Study content',material:'File',selectFile:'Choose file',selectImage:'Choose image',capturePhoto:'Photograph map',removeFile:'Remove file',generate:'Generate clue',save:'Save changes',guide:'Guide scroll',refresh:'Refresh guide',notebookDesc:'Review clues by level and direction. Open a card to read its guide. Editing changes only manual fields.',new:'+ New clue',search:'Search study content',detail:'Clue details',openWorkshop:'Open in workshop',close:'Close',junior:'Junior high',senior:'Senior high',timeline:'Timeline',compare:'World comparison',convert:'Calendar conversion',map:'Historical map',timelineHelp:'Place events in time, fill a blank timeline, then check',compareHelp:'Place contemporary Chinese and world events side by side',convertHelp:'Learn the rule, then practice conversions',mapHelp:'Read locations and ranges from textbook maps',timelinePlaceholder:'For example, major events from the Opium War to the Boxer Protocol',comparePlaceholder:'For example, Qin and Han China and the Mediterranean world',convertPlaceholder:'For example, convert the 61st year of Kangxi to a Gregorian year',mapPlaceholder:'For example, trace Silk Road places on a textbook map',total:'Total practices',juniorCount:'Junior high',seniorCount:'Senior high',emptyRecent:'No clues yet. Pick a direction to begin.',emptyRecords:'No practice records yet',first:'Create the first clue',noFile:'No material attached',continue:'Continue in workshop',view:'View guide',edit:'Edit',delete:'Delete',allStages:'All levels',allDirections:'All directions',waiting:'Unfolding the time and space guide…',slow:'Generation is taking longer. Refresh to check again.',generating:'The clue is still being generated. Refresh later.',noGuide:'Choose a direction to see a method, or submit a practice.',editNote:'Changing content will not rewrite the existing guide. Clear and create a new record to regenerate.',open:'Open in browser',download:'Download',required:'Enter a school level, direction, and study content',confirmDelete:'Delete this clue?',saved:'Changes saved',deleted:'Clue deleted',failed:'Operation failed: ',record:'Record {n} of {total}',noResult:'No matching clues'}};
const directionKeys=['timeline','compare','convert','map'];
const $=id=>document.getElementById(id), state={lang:'cn',page:'home',row:0,count:0,rows:[],stageValues:[],directionValues:[],guide:'',busy:false,pollToken:0,detailRow:0,history:[],menu:false};
function tr(key){return dict[state.lang][key]||key} function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))} function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.remove('show'),4000)}
function responseRows(csv){return parseCSV(String(csv||'')).filter(r=>r.some(v=>String(v).trim()!==''))} async function bridge(type,data,payload){const req={type};if(data!==undefined)req.data=data;if(payload!==undefined)req.payload=payload;return await callAppBridge(req)}
function initialLang(){const saved=localStorage.getItem('iThinkAir_UiLanguage');const url=new URLSearchParams(location.search).get('lang');if(url==='cn'||url==='en')return url;if(saved!==null&&saved!=='')return saved==='en'?'en':'cn';const langs=navigator.languages;if(!langs||!langs.length)return 'cn';return langs.some(l=>/^zh(?:-|$)/i.test(l))?'cn':'en'}
function setLanguage(lang){state.lang=lang;document.documentElement.lang=lang==='cn'?'zh-CN':'en';localStorage.setItem('iThinkAir_UiLanguage',lang);document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=tr(el.dataset.i18n));document.querySelectorAll('[data-placeholder]').forEach(el=>el.placeholder=tr(el.dataset.placeholder));$('langBtn').textContent=lang==='cn'?'EN':'中文';$('menuLang').textContent=lang==='cn'?'English':'中文';renderDirections();renderSegments();renderFilterOptions();renderStats();renderRecent();renderRecords();renderGuide();updateFile();updateFormMode();updatePlaceholder()}
function renderDirections(){$('directionCards').innerHTML=directions.map((d,i)=>`<button type="button" class="direction card" data-direction="${esc(d)}"><div class="colorbar" style="background:${colors[d]}"></div><i class="fa-solid ${icons[d]}" style="color:${colors[d]}"></i><h3>${tr(directionKeys[i])}</h3><p>${tr(directionKeys[i]+'Help')}</p></button>`).join('')}
function renderSegments(){for(const [id,vals,field] of [['stageSegments',stages,'practiceForm_stage'],['directionSegments',directions,'practiceForm_direction']]){$(id).innerHTML=vals.map(v=>`<button type="button" data-value="${esc(v)}" class="${$(field).value===v?'selected':''}">${displayValue(v)}</button>`).join('')}}
function displayValue(v){const i=directions.indexOf(v);if(i>=0)return tr(directionKeys[i]);if(v==='初中')return tr('junior');if(v==='高中')return tr('senior');return esc(v)}
function setField(id,v){$(id).value=v||'';renderSegments();updatePlaceholder();updateSubmitEnabled()}
function updatePlaceholder(){const i=directions.indexOf($('practiceForm_direction').value);$('practiceForm_content').placeholder=i>=0?tr(directionKeys[i]+'Placeholder'):''}
function updateSubmitEnabled(){$('submitBtn').disabled=state.busy||!$('practiceForm_stage').value||!$('practiceForm_direction').value||!$('practiceForm_content').value.trim()}
function updateFormMode(){$('submitBtn').textContent=tr(state.row?'save':'generate');$('editNote').textContent=state.row?tr('editNote'):'';updateSubmitEnabled();updatePager()}
function updatePager(){$('prevRow').disabled=state.row<=1||state.busy;$('nextRow').disabled=state.count===0||state.row>=state.count||state.busy}
function fileUrls(name){const encoded=encodeURIComponent(name);return {download:'http://' + window.location.hostname + ':3130/download/'+encoded,open:'http://' + window.location.hostname + ':3130/private/'+encoded}}
function fileMarkup(name){if(!name)return `<span class="hint">${tr('noFile')}</span>`;const u=fileUrls(name);let s=`<div class="filelinks"><a href="${esc(u.open)}" target="_blank" rel="noopener">${tr('open')}</a><a href="${esc(u.download)}" download>${tr('download')}</a></div>`;if(/\.(png|jpe?g|gif|webp|bmp|svg|avif)$/i.test(name))s+=`<a href="${esc(u.download)}" download><img class="filepreview" src="${esc(u.download)}" alt="${esc(name)}"></a>`;else if(/\.html?$/i.test(name))s+=`<iframe class="fileframe" src="${esc(u.open)}" title="${esc(name)}" sandbox="allow-scripts allow-forms allow-same-origin"></iframe>`;return s}
function updateFile(){$('fileName').textContent=$('practiceForm_file').value||tr('noFile');$('filePreview').innerHTML=fileMarkup($('practiceForm_file').value)}
function formatRecord(r,short){const text=r.content||'';return `<div class="recordtop"><span class="badge" style="border-left:4px solid ${colors[r.direction]||'var(--gold)'}">${displayValue(r.direction)}</span><span class="badge">${displayValue(r.stage)}</span></div><h3>${esc(text.slice(0,short))}${text.length>short?'…':''}</h3><div class="filename"><i class="fa-solid fa-paperclip"></i> ${esc(r.file||tr('noFile'))}</div>`}
function renderRecent(){const rows=state.rows.slice(0,4);$('recentList').innerHTML=rows.length?rows.map(r=>`<article class="record card" tabindex="0" data-row="${r.row}">${formatRecord(r,40)}<div class="recordactions"><button type="button" data-action="continue" data-row="${r.row}">${tr('continue')}</button></div></article>`).join(''):`<div class="empty">${tr('emptyRecent')}</div>`}
function renderStats(){const sc={'初中':0,'高中':0},dc=Object.fromEntries(directions.map(d=>[d,0]));for(const v of state.stageValues)if(sc[v]!==undefined)sc[v]++;for(const v of state.directionValues)if(dc[v]!==undefined)dc[v]++;$('stats').innerHTML=`<button class="stat card" data-stat="all"><strong>${state.count}</strong><span>${tr('total')}</span></button><button class="stat card" data-stat="初中"><strong>${sc['初中']}</strong><span>${tr('juniorCount')}</span></button><button class="stat card" data-stat="高中"><strong>${sc['高中']}</strong><span>${tr('seniorCount')}</span></button>`;$('directionStats').innerHTML=directions.map(d=>`<button class="chip" data-stat="${esc(d)}" style="border-left:4px solid ${colors[d]}">${displayValue(d)} · ${dc[d]}</button>`).join('')}
function renderFilterOptions(){const stage=$('stageFilter').value,direction=$('directionFilter').value;$('stageFilter').innerHTML=`<option value="">${tr('allStages')}</option>`+stages.map(v=>`<option value="${v}">${displayValue(v)}</option>`).join('');$('directionFilter').innerHTML=`<option value="">${tr('allDirections')}</option>`+directions.map(v=>`<option value="${v}">${displayValue(v)}</option>`).join('');$('stageFilter').value=stage;$('directionFilter').value=direction}
function renderRecords(){const q=$('searchInput').value.trim().toLocaleLowerCase(),s=$('stageFilter').value,d=$('directionFilter').value;const rows=state.rows.filter(r=>(!s||r.stage===s)&&(!d||r.direction===d)&&r.content.toLocaleLowerCase().includes(q));$('recordList').innerHTML=rows.length?rows.map(r=>`<article class="record card" tabindex="0" data-row="${r.row}">${formatRecord(r,60)}<div class="recordactions"><button type="button" data-action="view" data-row="${r.row}">${tr('view')}</button><button type="button" data-action="edit" data-row="${r.row}">${tr('edit')}</button><button type="button" class="danger" data-action="delete" data-row="${r.row}">${tr('delete')}</button></div></article>`).join(''):`<div class="empty">${state.rows.length?tr('noResult'):tr('emptyRecords')}<br><button class="btn secondary" type="button" id="firstRecord">${tr('first')}</button></div>`}
async function refreshData(){const [countCSV,rowsCSV,stagesCSV,directionsCSV]=await Promise.all([bridge('GetRecordCount',TABLE),bridge('GetTableCSV',TABLE,'学段,练习方向,学习内容,文件'),bridge('GetTableCSV',TABLE,'学段'),bridge('GetTableCSV',TABLE,'练习方向')]);const parsed=responseRows(rowsCSV);state.rows=parsed.map((a,i)=>({row:i+1,stage:a[0]||'',direction:a[1]||'',content:a[2]||'',file:a[3]||''}));state.stageValues=responseRows(stagesCSV).map(r=>r[0]);state.directionValues=responseRows(directionsCSV).map(r=>r[0]);const n=Number(String(countCSV).trim());state.count=Number.isFinite(n)?n:state.rows.length;renderStats();renderRecent();renderRecords();updatePager()}
async function refreshHome(){await refreshData()}
function showPage(page,push=true){if(push&&state.page!==page)state.history.push({page:state.page,scroll:window.scrollY});state.page=page;document.querySelectorAll('.page').forEach(el=>el.classList.toggle('active',el.id===page+'Page'));document.querySelectorAll('[data-page]').forEach(el=>el.classList.toggle('active',el.dataset.page===page));closeMenu();window.scrollTo(0,0);if(page==='home')refreshHome().catch(errorToast);if(page==='notebook')refreshData().catch(errorToast)}
function closeMenu(){state.menu=false;$('mobileMenu').classList.remove('open');$('menuBtn').setAttribute('aria-expanded','false')}
function fitNav(){const inner=document.querySelector('.navinner'),links=$('navlinks'),menu=$('menuBtn');links.style.display='flex';menu.style.display='none';const overflow=inner.scrollWidth>inner.clientWidth||window.innerWidth<640;if(overflow){links.style.display='none';menu.style.display='block'}else closeMenu()}
function clearWorkshop(){state.pollToken++;state.busy=false;state.row=0;state.guide='';$('practiceForm').reset();setField('practiceForm_stage','');setField('practiceForm_direction','');$('practiceForm_content').value='';$('practiceForm_file').value='';updateFile();renderGuide();updateFormMode()}
async function cell(field,row){return String(await bridge('GetCellValue',TABLE,field+'/'+row)??'')}
async function getRecord(row){const r={row};for(const [field,key] of [['学段','stage'],['练习方向','direction'],['学习内容','content'],['文件','file'],['时空引导','guide']])r[key]=await cell(field,row);return r}
async function loadWorkshop(row){state.pollToken++;state.busy=true;updateFormMode();try{const r=await getRecord(row);state.row=row;setField('practiceForm_stage',r.stage);setField('practiceForm_direction',r.direction);$('practiceForm_content').value=r.content;$('practiceForm_file').value=r.file;state.guide=r.guide;updateFile();renderGuide();showPage('workshop')}finally{state.busy=false;updateFormMode()}}
function markdown(text){if(!text)return '';let html=window.marked?marked.parse(text,{gfm:true,breaks:true}):`<pre>${esc(text)}</pre>`;return window.DOMPurify?DOMPurify.sanitize(html,{ADD_ATTR:['target','download']}):html}
function renderMarkdown(id,text){$(id).innerHTML=markdown(text);$(id).querySelectorAll('img').forEach(img=>{const raw=img.getAttribute('src')||'';if(raw&&!/^(https?:|data:)/i.test(raw))img.src=fileUrls(raw).download;const link=document.createElement('a');link.href=img.src;link.setAttribute('download','');img.replaceWith(link);link.appendChild(img)})}
function renderGuide(){const text=state.guide||(!state.row?(()=>{const i=directions.indexOf($('practiceForm_direction').value);return i<0?tr('noGuide'):tr(directionKeys[i]+'Help')})():tr('generating'));$('scrollMeta').textContent=state.row?tr('record').replace('{n}',state.row).replace('{total}',state.count):'';if(state.guide)renderMarkdown('guideContent',state.guide);else $('guideContent').textContent=text;$('refreshGuide').hidden=!state.row||!!state.guide||state.busy;updatePager()}
async function refreshGuide(){if(!state.row)return;state.guide=await cell('时空引导',state.row);renderGuide()}
async function pollGuide(row){const token=++state.pollToken;state.busy=true;updateFormMode();$('guideContent').textContent=tr('waiting');$('refreshGuide').hidden=true;for(let i=0;i<30&&token===state.pollToken;i++){await new Promise(resolve=>setTimeout(resolve,2000));if(token!==state.pollToken)break;try{const value=await cell('时空引导',row);if(value.trim()){state.guide=value;break}}catch(e){errorToast(e);break}}if(token===state.pollToken){state.busy=false;updateFormMode();renderGuide();if(!state.guide)$('guideContent').textContent=tr('slow')}}
async function submitPractice(e){e.preventDefault();if(state.busy)return;const payload={'学段':$('practiceForm_stage').value,'练习方向':$('practiceForm_direction').value,'学习内容':$('practiceForm_content').value.trim(),'文件':$('practiceForm_file').value};if(!payload['学段']||!payload['练习方向']||!payload['学习内容']){toast(tr('required'));return}state.busy=true;updateFormMode();try{if(state.row){const row=state.row;for(const [field,value] of Object.entries(payload))await bridge('SetCellValue',TABLE,field+'/'+row+'/'+value);toast(tr('saved'));await refreshData();state.busy=false;updateFormMode();renderGuide()}else{await bridge('SubmitRecord',SUBMIT_TABLE,JSON.stringify(payload));state.row=1;state.guide='';await refreshData();state.busy=false;updateFormMode();pollGuide(1).catch(errorToast)}}catch(e){state.busy=false;updateFormMode();errorToast(e)}}
async function openDetail(row){state.detailRow=row;$('detailOverlay').classList.add('open');document.body.style.overflow='hidden';$('detailMeta').textContent='';$('detailContent').textContent='';$('detailFile').innerHTML='';$('detailGuide').textContent=tr('waiting');try{const r=await getRecord(row);if(state.detailRow!==row)return;$('detailMeta').innerHTML=`<span class="badge">${displayValue(r.stage)}</span> <span class="badge" style="border-left:4px solid ${colors[r.direction]||'var(--gold)'}">${displayValue(r.direction)}</span>`;$('detailContent').textContent=r.content;$('detailFile').innerHTML=r.file?`<strong>${esc(r.file)}</strong>${fileMarkup(r.file)}`:tr('noFile');if(r.guide)renderMarkdown('detailGuide',r.guide);else $('detailGuide').textContent=tr('generating')}catch(e){errorToast(e)}}
function closeDetail(){$('detailOverlay').classList.remove('open');document.body.style.overflow='';state.detailRow=0}
async function deleteRecord(row){if(!confirm(tr('confirmDelete')))return;await bridge('DeleteRecord',TABLE,row.toString());if(state.row===row)clearWorkshop();else if(state.row>row)state.row--;await refreshData();toast(tr('deleted'))}
function errorToast(e){toast(tr('failed')+(e?.message||String(e)))}
function airBack(){if($('detailOverlay').classList.contains('open')){closeDetail();return 'false'}if(state.menu){closeMenu();return 'false'}const last=state.history.pop();if(last){showPage(last.page,false);requestAnimationFrame(()=>window.scrollTo(0,last.scroll));return 'false'}return 'true'}window.airBack=airBack;
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>showPage(b.dataset.page)));$('brand').addEventListener('click',()=>{if(parent&&typeof parent.closeFullHtml==='function')parent.closeFullHtml(false)});$('menuBtn').addEventListener('click',e=>{e.stopPropagation();state.menu=!state.menu;$('mobileMenu').classList.toggle('open',state.menu);$('menuBtn').setAttribute('aria-expanded',String(state.menu))});document.addEventListener('click',e=>{if(state.menu&&!$('topbar').contains(e.target))closeMenu()});$('langBtn').onclick=$('menuLang').onclick=()=>{setLanguage(state.lang==='cn'?'en':'cn');closeMenu();fitNav()};$('directionCards').addEventListener('click',e=>{const b=e.target.closest('[data-direction]');if(!b)return;clearWorkshop();setField('practiceForm_direction',b.dataset.direction);renderGuide();showPage('workshop')});for(const [id,field] of [['stageSegments','practiceForm_stage'],['directionSegments','practiceForm_direction']])$(id).addEventListener('click',e=>{const b=e.target.closest('[data-value]');if(!b)return;setField(field,b.dataset.value);renderGuide()});$('practiceForm_content').addEventListener('input',updateSubmitEnabled);$('practiceForm').addEventListener('submit',submitPractice);$('clearBtn').onclick=clearWorkshop;$('toNotebook').onclick=()=>showPage('notebook');$('newRecord').onclick=()=>{clearWorkshop();showPage('workshop')};for(const [id,type] of [['selectFile','SelectFile'],['selectImage','SelectImage'],['capturePhoto','CapturePhoto']])$(id).onclick=async()=>{try{const name=await bridge(type);if(name){$('practiceForm_file').value=name;updateFile()}}catch(e){errorToast(e)}};$('removeFile').onclick=()=>{$('practiceForm_file').value='';updateFile()};$('prevRow').onclick=()=>{if(state.row>1)loadWorkshop(state.row-1).catch(errorToast)};$('nextRow').onclick=()=>{if(state.row<state.count)loadWorkshop(state.row+1).catch(errorToast)};$('refreshGuide').onclick=()=>refreshGuide().catch(errorToast);$('stats').addEventListener('click',e=>{const b=e.target.closest('[data-stat]');if(!b)return;$('stageFilter').value=b.dataset.stat==='all'?'':b.dataset.stat;$('directionFilter').value='';showPage('notebook')});$('directionStats').addEventListener('click',e=>{const b=e.target.closest('[data-stat]');if(!b)return;$('stageFilter').value='';$('directionFilter').value=b.dataset.stat;showPage('notebook')});for(const id of ['searchInput','stageFilter','directionFilter'])$(id).addEventListener(id==='searchInput'?'input':'change',renderRecords);$('recentList').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b){e.stopPropagation();loadWorkshop(Number(b.dataset.row)).catch(errorToast);return}const card=e.target.closest('[data-row]');if(card)openDetail(Number(card.dataset.row))});$('recordList').addEventListener('click',e=>{if(e.target.id==='firstRecord'){clearWorkshop();showPage('workshop');return}const b=e.target.closest('[data-action]');if(b){e.stopPropagation();const row=Number(b.dataset.row);if(b.dataset.action==='view')openDetail(row);if(b.dataset.action==='edit')loadWorkshop(row).catch(errorToast);if(b.dataset.action==='delete')deleteRecord(row).catch(errorToast);return}const card=e.target.closest('[data-row]');if(card)openDetail(Number(card.dataset.row))});for(const id of ['recentList','recordList'])$(id).addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('article[data-row]'))openDetail(Number(e.target.dataset.row))});$('detailClose').onclick=$('detailCloseBottom').onclick=closeDetail;$('detailOverlay').addEventListener('click',e=>{if(e.target===$('detailOverlay'))closeDetail()});$('detailOpen').onclick=()=>{const row=state.detailRow;closeDetail();loadWorkshop(row).catch(errorToast)};window.addEventListener('resize',fitNav);window.addEventListener('keydown',e=>{if(e.key==='Escape')airBack()});let baseHeight=window.visualViewport?.height||window.innerHeight;window.visualViewport?.addEventListener('resize',()=>{const h=window.visualViewport.height;document.body.classList.toggle('keyboard',baseHeight-h>140);if(h>baseHeight)baseHeight=h;const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))setTimeout(()=>a.scrollIntoView({block:'center',behavior:'smooth'}),120)});document.addEventListener('focusin',e=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))setTimeout(()=>e.target.scrollIntoView({block:'center',behavior:'smooth'}),250)})}
async function initialize(){state.lang=initialLang();bind();setLanguage(state.lang);renderFilterOptions();fitNav();try{const mode=await bridge('模式');document.body.classList.toggle('dark',String(mode).trim()==='暗色')}catch(e){}try{await refreshData()}catch(e){errorToast(e)}renderGuide()}
document.addEventListener('DOMContentLoaded',()=>{(async () => { await initialize(); })();});
</script>
