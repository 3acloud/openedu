<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";

async function exportFileA(title, url) {

    }

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        function parseCSV(csvText) {

                    }

                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符

                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

function normalizeRows(csv){return parseCSV(String(csv||'').replace(/^\uFEFF/,'')).filter(row=>row.some(cell=>cell!==''));}

async function loadArchive(){loading($('archiveList'));try{const csv=await callAppBridge({type:'GetTableCSV',data:SOURCE,payload:FULL_PAYLOAD});archiveRows=records(csv);archiveLoaded=true;renderArchive();}catch(err){archiveLoaded=false;failure($('archiveList'),loadArchive);}}
function recordData(record){const obj={};for(const field of INPUT_FIELDS)obj[field]=value(record,field);return obj;}
async function editRecord(record){closeDetail();pollToken++;pollRunning=false;currentRow=record.row;fillForm(recordData(record));$('reviewContent').innerHTML='';$('reviewStatus').textContent=t('loading');$('readReviewButton').hidden=true;$('continueButton').hidden=true;switchPage('workshop');try{const full={};for(const field of INPUT_FIELDS)full[field]=await callAppBridge({type:'GetCellValue',data:SOURCE,payload:field+'/'+record.row});if(currentRow!==record.row)return;fillForm(full);await readExistingReview();}catch(err){showToast(t('operationFailed')+': '+bridgeError(err),()=>editRecord(record));$('readReviewButton').hidden=false;}}
function closeDetail(){$('detailOverlay').classList.remove('open');detailRow=0;detailRecord=null;}
async function openDetail(record){detailRow=record.row;currentRow=record.row;detailRecord=record;$('detailOverlay').classList.add('open');$('detailOverlay').dataset.count='';renderDetail();loadDetailOutput(record.row);try{const response=await callAppBridge({type:'GetRecordCount',data:SOURCE});if(detailRow!==record.row)return;const count=Number(String(response).trim());if(!Number.isSafeInteger(count)||count<0)throw Error(t('countFailed'));$('detailOverlay').dataset.count=String(count);renderDetail();}catch(err){showToast(t('countFailed')+': '+bridgeError(err),()=>openDetail(record));}}
function renderDetail(){if(!$('detailOverlay').classList.contains('open')||!detailRecord)return;const labels={'测评用途':'purpose','学段':'stage','测评类型':'type','测评范围':'scope','班额':'size','学员化名':'alias','逐题得分':'scores','课堂观察':'observation'};$('detailFields').innerHTML=INPUT_FIELDS.map(field=>'<div class="detail-item '+(['测评范围','逐题得分','课堂观察'].includes(field)?'wide':'')+'"><strong>'+h(t(labels[field]).replace(/ \*$/,''))+'</strong>'+h(labelValue(value(detailRecord,field))||t('noData'))+'</div>').join('');$('detailPreviousButton').disabled=detailRow<=1;$('detailNextButton').disabled=detailRow>=Number($('detailOverlay').dataset.count||Infinity);}
async function loadDetailOutput(row){$('detailReview').innerHTML='';$('detailReviewStatus').textContent=t('loading');$('detailRefreshButton').hidden=true;try{const output=await callAppBridge({type:'GetCellValue',data:SOURCE,payload:'测评输出/'+row});if(row!==detailRow)return;if(String(output??'').trim()){renderMarkdown($('detailReview'),output);$('detailReviewStatus').textContent='';}else{$('detailReviewStatus').textContent=t('notGenerated');$('detailRefreshButton').hidden=false;}}catch(err){$('detailReviewStatus').textContent=t('failed');$('detailRefreshButton').hidden=false;showToast(bridgeError(err),()=>loadDetailOutput(row));}}
async function moveDetail(delta){const target=detailRow+delta;if(target<1)return;try{const response=await callAppBridge({type:'GetRecordCount',data:SOURCE});const count=Number(String(response).trim());if(!Number.isSafeInteger(count))throw Error(t('countFailed'));$('detailOverlay').dataset.count=String(count);if(target>count)return;$('detailReviewStatus').textContent=t('loadDetails');const data={};for(const field of INPUT_FIELDS)data[field]=await callAppBridge({type:'GetCellValue',data:SOURCE,payload:field+'/'+target});detailRow=target;currentRow=target;detailRecord={row:target,cells:ALL_FIELDS.map(field=>data[field]||'')};renderDetail();await loadDetailOutput(target);}catch(err){showToast(t('operationFailed')+': '+bridgeError(err),()=>moveDetail(delta));}}
async function deleteRecord(record){if(!window.confirm(t('deleteConfirm')))return;try{const response=await callAppBridge({type:'DeleteRecord',data:SOURCE,payload:record.row.toString()});assertWrite(response);if(currentRow===record.row){currentRow=0;clearForm();}if(detailRow===record.row)closeDetail();showToast(t('deleted'));archiveLoaded=false;await loadArchive();if(page==='home')loadRecent();}catch(err){showToast(t('operationFailed')+': '+bridgeError(err),()=>deleteRecord(record));}}
function airBack(){if($('detailOverlay').classList.contains('open')){closeDetail();return 'false';}if($('siteNav').classList.contains('menu-open')){closeMenu();return 'false';}if(historyStack.length){const entry=historyStack.pop();switchPage(entry.page,false);requestAnimationFrame(()=>window.scrollTo(0,entry.scroll));return 'false';}return 'true';}
window.airBack=airBack;
function bindEvents(){document.querySelectorAll('[data-page]').forEach(el=>el.onclick=()=>switchPage(el.dataset.page));$('brandButton').onclick=()=>{if(window.parent&&typeof window.parent.closeFullHtml==='function')window.parent.closeFullHtml(false);};$('hamburgerButton').onclick=openMenu;document.addEventListener('pointerdown',event=>{if(!$('siteNav').contains(event.target))closeMenu();});$('languageButton').onclick=() => setLanguage(lang==='cn'?'en':'cn');$('mobileLanguageButton').onclick=()=>{setLanguage(lang==='cn'?'en':'cn');closeMenu();};$('homeDesignButton').onclick=()=>goNew('设计测评');$('homeAnalysisButton').onclick=()=>goNew('分析结果');$('viewArchiveButton').onclick=()=>switchPage('archive');$('newAssessmentButton').onclick=()=>goNew();$('assessmentForm').onsubmit=e=>{e.preventDefault();submitNew();};$('saveButton').onclick=saveExisting;$('resubmitButton').onclick=submitNew;$('clearButton').onclick=clearForm;$('readReviewButton').onclick=readExistingReview;$('continueButton').onclick=()=>pollReview(currentRow,checked('测评用途'));document.querySelectorAll('input[name="测评用途"]').forEach(el=>el.onchange=updatePurposeUI);$('assessmentForm_scores').oninput=updatePurposeUI;['archiveSearch','purposeFilter','stageFilter','typeFilter','sortFilter'].forEach(id=>$(id).addEventListener(id==='archiveSearch'?'input':'change',renderArchive));$('detailOverlay').onclick=e=>{if(e.target===$('detailOverlay'))closeDetail();};$('detailCloseTop').onclick=closeDetail;$('detailCloseButton').onclick=closeDetail;$('detailRefreshButton').onclick=()=>loadDetailOutput(detailRow);$('detailPreviousButton').onclick=()=>moveDetail(-1);$('detailNextButton').onclick=()=>moveDetail(1);$('detailEditButton').onclick=()=>{if(detailRecord)editRecord(detailRecord);};document.addEventListener('keydown',e=>{if(e.key==='Escape')airBack();});document.addEventListener('focusin',e=>{if(!e.target.matches('input,select,textarea'))return;focusedInput=e.target;setTimeout(()=>e.target.scrollIntoView({block:'center',behavior:'smooth'}),250);});if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>{if(focusedInput&&document.activeElement===focusedInput)setTimeout(()=>focusedInput.scrollIntoView({block:'center',behavior:'smooth'}),100);});window.addEventListener('resize',measureNav);}
async function initialize(){bindEvents();renderFilters();setLanguage(determineLanguage());updatePurposeUI();$('reviewStatus').textContent=t('reviewPlaceholder');measureNav();await Promise.allSettled([loadHome(),(async()=>{try{const mode=await callAppBridge({type:'模式'});document.body.classList.toggle('dark',String(mode).trim()==='暗色');}catch(e){}})()]);}
(async () => { await initialize(); })();
</script>
</body></html>
