<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**

 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

const dict={cn:{app:'物理教案设计',home:'首页',design:'设计教案',library:'教案库',heroDesc:'按课题与学情搭出可审阅的物理教案框架，实验安全等级和变式训练留给教师把关。',newLesson:'设计新教案',total:'教案总数',grades:'覆盖年级',hours:'累计课时',recent:'最近教案',allLessons:'全部教案',designDesc:'写清课题、年级、课时和薄弱点，生成后请审阅再使用。',physicsLesson:'物理教案',topic:'课题',grade:'年级',periods:'课时',needs:'学情与薄弱点',periodUnit:'课时',topicPlaceholder:'例如：牛顿第一定律',needsPlaceholder:'例如：惯性与力的概念容易混淆，分组实验分工不清',needsHint:'填写薄弱点后，变式训练会更贴学生',generate:'生成教案',another:'再写一份',export:'导出教案',toLibrary:'去教案库',lessonPaper:'教案纸',libraryDesc:'查阅、修改基本信息或删除已生成的教案。',refresh:'刷新',searchPlaceholder:'搜索课题或学情',allGrades:'全部年级',editInfo:'编辑信息',delete:'删除',prev:'上一条',next:'下一条',close:'关闭',editTitle:'修改教案信息',readOnlyPreview:'教案框架 · 只读预览',editNotice:'修改学情不会自动重写教案；若要按新学情重做，请重新生成',save:'保存修改',regenerate:'重新生成',cancel:'取消',ready:'教案已生成',pending:'生成中',noData:'还没有教案',first:'设计第一份教案',noMatch:'没有找到对应教案',clearFilter:'清除筛选',statFail:'暂时无法统计',waiting:'正在组织物理观念、实验与变式训练…',later:'生成时间较长，请稍后到教案库打开。',fail:'操作失败，请稍后重试。',validation:'请填写课题、年级，并输入 1 到 12 的整数课时。',confirmDelete:'确定删除该教案？删除后不可恢复',saved:'已保存修改',newCopy:'已另存为一份新教案',emptyPaper:'实验会标注安全等级，请教师审阅调整',notReady:'尚未生成',emptyExport:'教案尚未生成，暂不能导出'},en:{app:'Physics Lesson Design',home:'Home',design:'Design',library:'Library',heroDesc:'Build a reviewable physics lesson outline from the topic and student needs. Review experiment safety and practice before use.',newLesson:'Design a lesson',total:'Total lessons',grades:'Grades covered',hours:'Total periods',recent:'Recent lessons',allLessons:'All lessons',designDesc:'Describe the topic, grade, periods and learning gaps. Review the result before use.',physicsLesson:'Physics lesson',topic:'Topic',grade:'Grade',periods:'Periods',needs:'Student needs and gaps',periodUnit:'periods',topicPlaceholder:'For example: Newton’s first law',needsPlaceholder:'For example: Students confuse inertia with force.',needsHint:'Adding learning gaps makes practice more relevant.',generate:'Generate lesson',another:'Write another',export:'Export lesson',toLibrary:'Go to library',lessonPaper:'Lesson paper',libraryDesc:'Review, edit basic information, or delete generated lessons.',refresh:'Refresh',searchPlaceholder:'Search topic or student needs',allGrades:'All grades',editInfo:'Edit information',delete:'Delete',prev:'Previous',next:'Next',close:'Close',editTitle:'Edit lesson information',readOnlyPreview:'Lesson outline · read only',editNotice:'Changing student needs will not rewrite the lesson. Generate a new lesson to use updated needs.',save:'Save changes',regenerate:'Generate new copy',cancel:'Cancel',ready:'Lesson generated',pending:'Generating',noData:'No lessons yet',first:'Design the first lesson',noMatch:'No matching lessons',clearFilter:'Clear filters',statFail:'Unavailable',waiting:'Organizing physics concepts, experiments and practice…',later:'This is taking longer. Please open the lesson in the library later.',fail:'The operation failed. Please try again.',validation:'Enter a topic, grade, and a whole number of periods from 1 to 12.',confirmDelete:'Delete this lesson? This cannot be undone.',saved:'Changes saved',newCopy:'Saved as a new lesson',emptyPaper:'Experiments will show safety levels. Please review and adjust.',notReady:'Not generated yet',emptyExport:'The lesson is not ready to export.'}};
function t(k){return dict[state.lang][k]||k}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(msg){const e=$('toast');e.textContent=msg;e.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.style.display='none',4300)}
function applyLang(){document.documentElement.lang=state.lang==='cn'?'zh-CN':'en';document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));document.querySelectorAll('[data-placeholder]').forEach(e=>e.placeholder=t(e.dataset.placeholder));renderGrades();gradeOptions();renderPaper();renderRecent();renderLibrary();if(state.detailRow)renderDetailText();requestAnimationFrame(adaptNavigation)}
function chooseLanguage(){const stored=localStorage.getItem('iThinkAir_UiLanguage');const param=new URLSearchParams(location.search).get('lang');if(stored!==null&&stored!=='')return stored==='en'?'en':'cn';if(param==='cn'||param==='en')return param;const langs=navigator.languages;if(!langs||!langs.length)return 'cn';return langs.some(x=>/^zh(?:-|$)/i.test(x))?'cn':'en'}
function switchLang(){state.lang=state.lang==='cn'?'en':'cn';localStorage.setItem('iThinkAir_UiLanguage',state.lang);applyLang()}
function nav(page,remember=true){if(remember&&state.page!==page)state.history.push({page:state.page,scroll:window.scrollY});state.page=page;document.querySelectorAll('.page').forEach(e=>e.classList.toggle('active',e.id==='page-'+page));document.querySelectorAll('.nav-btn').forEach(e=>e.classList.toggle('active',e.dataset.page===page));closeMenu();window.scrollTo(0,0)}
function closeMenu(){$('mobileMenu').classList.remove('open');$('menuBtn').setAttribute('aria-expanded','false')}
function adaptNavigation(){const bar=$('topbar'),inner=bar.querySelector('.topbar-inner'),brand=$('brandBtn'),tabs=bar.querySelector('.tabs'),lang=$('langDesktop');bar.classList.remove('collapsed');const needed=brand.offsetWidth+tabs.scrollWidth+lang.offsetWidth+72;bar.classList.toggle('collapsed',window.innerWidth<=680||needed>inner.clientWidth);if(!bar.classList.contains('collapsed'))closeMenu()}
function topOverlay(){if($('editOverlay').classList.contains('open'))return 'edit';if($('detailOverlay').classList.contains('open'))return 'detail';return null}
function airBack(){const top=topOverlay();if(top){closeOverlay(top);return 'false'}if(state.history.length){const last=state.history.pop();nav(last.page,false);window.scrollTo(0,last.scroll);return 'false'}return 'true'}window.airBack=airBack;
function openOverlay(name){$(name+'Overlay').classList.add('open');document.body.style.overflow='hidden'}function closeOverlay(name){$(name+'Overlay').classList.remove('open');if(name==='detail'){state.detailToken++;state.detailRow=0}if(!topOverlay())document.body.style.overflow=''}
function blankPaper(){return `<ol class="outline"><li>${esc(state.lang==='cn'?'物理观念':'Physics concepts')}</li><li>${esc(state.lang==='cn'?'概念引入与辨析':'Concept introduction and distinctions')}</li><li>${esc(state.lang==='cn'?'实验和数据归纳':'Experiments and data')}</li><li>${esc(state.lang==='cn'?'模型建构':'Model building')}</li><li>${esc(state.lang==='cn'?'生活或科技应用训练':'Everyday or technology applications')}</li><li>${esc(state.lang==='cn'?'课堂小结':'Lesson summary')}</li></ol><p class="hint">${esc(t('emptyPaper'))}</p>`}
function renderMarkdown(text){if(!text?.trim())return `<p class="hint">${esc(t('notReady'))}</p>`;if(!window.marked||!window.DOMPurify)return `<pre>${esc(text)}</pre>`;const raw=marked.parse(text,{gfm:true,breaks:true});return DOMPurify.sanitize(raw,{ADD_ATTR:['target','download']})}
function linkImages(root){root.querySelectorAll('img').forEach(img=>{const src=img.getAttribute('src')||'';if(!src)return;let filename=src;if(!/^https?:|^data:/i.test(src)){img.src='http://' + window.location.hostname + ':3130/download/'+encodeURIComponent(src)}const a=document.createElement('a');a.href=img.src;a.setAttribute('download','');a.target='_blank';img.replaceWith(a);a.appendChild(img)})}
function renderPaper(){const meta=state.paperRow?`${esc($('designForm_topic').value)} · ${esc($('designForm_grade').value)} · ${esc($('designForm_periods').value)} ${esc(t('periodUnit'))}`:'—';$('paperMeta').innerHTML=meta;let html=state.paperText?renderMarkdown(state.paperText):(state.loading?`<div class="waiting"><i class="fa-solid fa-spinner fa-spin"></i>${esc(t('waiting'))}</div>`:blankPaper());$('paperContent').innerHTML=html;linkImages($('paperContent'));$('designExport').disabled=!state.paperText||state.loading}
function renderGrades(){const grades=['八年级','九年级','高一','高二','高三'];$('designGrades').innerHTML=grades.map(g=>`<button type="button" class="chip" data-grade="${esc(g)}">${esc(g)}</button>`).join('')}
function normalized(s){return String(s??'').replace(/\s+/g,'').toLocaleLowerCase()}function summary(s,n){const a=String(s||'').trim();return Array.from(a).slice(0,n).join('')+(Array.from(a).length>n?'…':'')}
function mapRows(csv){return parseCSV(String(csv||'')).filter(row=>!(row.length===1&&row[0]==='')).map((r,i)=>({row:i+1,topic:r[0]||'',grade:r[1]||'',periods:r[2]||'',needs:r[3]||'',outline:r[4]||''}))}
function gradeOptions(){const grades=[...new Set(state.rows.map(r=>r.grade).filter(Boolean))];const old=$('gradeFilter').value;$('gradeFilter').innerHTML=`<option value="">${esc(t('allGrades'))}</option>`+grades.map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join('');$('gradeFilter').value=grades.includes(old)?old:'';const counts=new Map();state.rows.forEach(r=>{if(r.grade)counts.set(r.grade,(counts.get(r.grade)||0)+1)});$('gradeDistribution').innerHTML=[...counts].map(([g,n])=>`<button class="chip" data-grade="${esc(g)}">${esc(g)} · ${n}</button>`).join('')}
function renderStats(countOK=true,rowsOK=true){$('totalValue').textContent=countOK?String(state.count):t('statFail');$('gradesValue').textContent=rowsOK?String(new Set(state.rows.map(r=>r.grade).filter(Boolean)).size):t('statFail');$('hoursValue').textContent=rowsOK?String(state.rows.reduce((s,r)=>s+(Number.isFinite(Number(r.periods))?Number(r.periods):0),0)):t('statFail')}
function card(r,recent=false){const info=`<div class="card-meta"><span class="chip">${esc(r.grade||'—')}</span><span>${esc(r.periods)} ${esc(t('periodUnit'))}</span></div><h3>${esc(r.topic||'—')}</h3><p class="excerpt">${esc(summary(r.needs,recent?40:60)||'—')}</p><span class="status ${r.outline.trim()?'':'pending'}"><i class="fa-solid fa-circle fa-2xs"></i>${esc(t(r.outline.trim()?'ready':'pending'))}</span>`;return `<article class="${recent?'recent-card':'lesson-card'}" data-row="${r.row}" tabindex="0" role="button">${info}${recent?'':`<div class="card-actions"><button class="btn small" data-action="view" data-row="${r.row}">${esc(state.lang==='cn'?'查看':'View')}</button><button class="btn small" data-action="edit" data-row="${r.row}">${esc(t('editInfo'))}</button><button class="btn small danger" data-action="delete" data-row="${r.row}">${esc(t('delete'))}</button><button class="btn small" data-action="export" data-row="${r.row}">${esc(t('export'))}</button></div>`}</article>`}
function renderRecent(){const e=$('recentList');e.innerHTML=state.rows.length?state.rows.slice(0,4).map(r=>card(r,true)).join(''):`<div class="empty"><i class="fa-solid fa-atom"></i><h3>${esc(t('noData'))}</h3><button class="btn primary" data-action="create">${esc(t('first'))}</button></div>`}
function renderLibrary(){const q=normalized($('searchInput').value),g=$('gradeFilter').value;const rows=state.rows.filter(r=>(!g||r.grade===g)&&(!q||normalized(r.topic).includes(q)||normalized(r.needs).includes(q)));$('libraryList').innerHTML=rows.length?rows.map(r=>card(r)).join(''):`<div class="empty"><i class="fa-solid fa-folder-open"></i><h3>${esc(state.rows.length?t('noMatch'):t('noData'))}</h3><button class="btn primary" data-action="${state.rows.length?'clear':'create'}">${esc(state.rows.length?t('clearFilter'):t('first'))}</button></div>`}
async function refreshData(){let countOK=true,rowsOK=true;try{const csv=await callAppBridge({type:'GetTableCSV',data:SOURCE,payload:FIELDS.join(',')});state.rows=mapRows(csv);gradeOptions();renderRecent();renderLibrary()}catch(e){rowsOK=false;toast(t('fail'))}try{const c=await callAppBridge({type:'GetRecordCount',data:SOURCE});const n=Number(c);if(!Number.isFinite(n))throw Error('count');state.count=n}catch(e){countOK=false;toast(t('fail'))}renderStats(countOK,rowsOK)}
async function getCell(field,row){return String(await callAppBridge({type:'GetCellValue',data:SOURCE,payload:`${field}/${row}`} )??'')}
async function getRecord(row){const out={row};for(const f of FIELDS)out[f]=await getCell(f,row);return out}
function readForm(prefix){return {'课题':$(prefix+'_topic').value.trim(),'年级':$(prefix+'_grade').value.trim(),'课时':Number($(prefix+'_periods').value),'学情与薄弱点':$(prefix+'_needs').value.trim()}}
function validForm(v){return !!v['课题']&&!!v['年级']&&Number.isInteger(v['课时'])&&v['课时']>=1&&v['课时']<=12}
function updateValidation(prefix){const val=readForm(prefix),valid=validForm(val);$(prefix==='designForm'?'designValidation':'editValidation').textContent=valid?'':t('validation');if(prefix==='designForm'){$('generateBtn').disabled=!valid||state.loading;$('needsHint').style.display=val['学情与薄弱点']?'none':''}else{$('saveEdit').disabled=!valid||state.loading;$('regenerateBtn').disabled=!valid||state.loading}return valid}
function setBusy(b){state.loading=b;['generateBtn','resetBtn','saveEdit','regenerateBtn','refreshBtn'].forEach(id=>$(id).disabled=b);updateValidation('designForm');updateValidation('editForm');renderPaper()}
async function submitNew(v,newCopy=false){if(!validForm(v))return;setBusy(true);try{await callAppBridge({type:'SubmitRecord',data:TABLE,payload:JSON.stringify(v)});state.currentRow=1;state.paperRow=1;state.paperText='';$('designForm_topic').value=v['课题'];$('designForm_grade').value=v['年级'];$('designForm_periods').value=v['课时'];$('designForm_needs').value=v['学情与薄弱点'];if(newCopy){closeOverlay('edit');closeOverlay('detail');nav('design');toast(t('newCopy'))}renderPaper();refreshData();await pollPaper(1)}catch(e){toast(t('fail'))}finally{setBusy(false)}}
async function pollPaper(row){const token=++state.pollToken;const deadline=Date.now()+90000;while(Date.now()<deadline&&token===state.pollToken){try{const value=await getCell('教案框架',row);if(value.trim()){state.paperText=value;renderPaper();refreshData();return}}catch(e){toast(t('fail'));return}await new Promise(resolve=>setTimeout(resolve,2000))}if(token===state.pollToken)toast(t('later'))}
async function openDetail(row){if(!row||row<1)return;state.detailRow=row;state.currentRow=row;const token=++state.detailToken;openOverlay('detail');$('detailTitle').textContent='…';$('detailInfo').innerHTML='';$('detailContent').innerHTML=`<div class="waiting"><i class="fa-solid fa-spinner fa-spin"></i>${esc(t('waiting'))}</div>`;try{const data=await getRecord(row);if(token!==state.detailToken)return;state.detailData=data;renderDetailText();const c=Number(await callAppBridge({type:'GetRecordCount',data:SOURCE}));if(token!==state.detailToken)return;state.count=Number.isFinite(c)?c:state.count;$('detailPrev').disabled=row<=1;$('detailNext').disabled=row>=state.count;if(!data['教案框架'].trim())pollDetail(row,token)}catch(e){if(token===state.detailToken)toast(t('fail'))}}
function renderDetailText(){const d=state.detailData;if(!d||!state.detailRow)return;$('detailTitle').textContent=d['课题']||'—';$('detailInfo').innerHTML=`<span>${esc(d['年级']||'—')}</span><span>${esc(d['课时'])} ${esc(t('periodUnit'))}</span><span>${esc(d['学情与薄弱点']||'—')}</span>${d['教案框架'].trim()?'':`<span>${esc(t('notReady'))}</span>`}`;$('detailContent').innerHTML=renderMarkdown(d['教案框架']);linkImages($('detailContent'))}
async function pollDetail(row,token){const deadline=Date.now()+90000;while(Date.now()<deadline&&token===state.detailToken){await new Promise(resolve=>setTimeout(resolve,2000));if(token!==state.detailToken)return;try{const value=await getCell('教案框架',row);if(value.trim()){state.detailData['教案框架']=value;renderDetailText();refreshData();return}}catch(e){toast(t('fail'));return}}if(token===state.detailToken)toast(t('later'))}
async function openEdit(row){state.editRow=row;openOverlay('edit');$('editPreview').textContent='…';try{const d=await getRecord(row);if(state.editRow!==row)return;state.editData=d;$('editForm_topic').value=d['课题'];$('editForm_grade').value=d['年级'];$('editForm_periods').value=d['课时'];$('editForm_needs').value=d['学情与薄弱点'];$('editPreview').innerHTML=renderMarkdown(d['教案框架']);linkImages($('editPreview'));updateValidation('editForm')}catch(e){toast(t('fail'))}}
async function saveEdit(){const v=readForm('editForm');if(!validForm(v)||!state.editRow)return;setBusy(true);const row=state.editRow;try{for(const f of EDIT_FIELDS)await callAppBridge({type:'SetCellValue',data:SOURCE,payload:`${f}/${row}/${v[f]}`});const fresh=await getRecord(row);state.editData=fresh;if(state.detailRow===row){state.detailData=fresh;renderDetailText()}closeOverlay('edit');await refreshData();toast(t('saved'))}catch(e){toast(t('fail'))}finally{setBusy(false)}}
async function deleteRow(row){if(!row||!confirm(t('confirmDelete')))return;const btns=document.querySelectorAll(`[data-row="${row}"] button`);btns.forEach(b=>b.disabled=true);try{await callAppBridge({type:'DeleteRecord',data:SOURCE,payload:row.toString()});if(state.currentRow===row){state.currentRow=0;state.paperRow=0;state.paperText='';renderPaper()}if(state.detailRow)closeOverlay('detail');await refreshData()}catch(e){toast(t('fail'))}finally{btns.forEach(b=>b.disabled=false)}}
async function exportRow(row){if(!row)return;try{const d=await getRecord(row);if(!d['教案框架'].trim()){toast(t('emptyExport'));return}const filename='physics-lesson-'+Math.random().toString(36).slice(2,11)+'.md';const content=`# ${d['课题']}\n\n${state.lang==='cn'?'年级':'Grade'}：${d['年级']}\n${state.lang==='cn'?'课时':'Periods'}：${d['课时']}\n${state.lang==='cn'?'学情与薄弱点':'Student needs and gaps'}：${d['学情与薄弱点']}\n\n${d['教案框架']}`;await callAppBridge({type:'WriteFile',data:filename,payload:content});window.open('http://' + window.location.hostname + ':3130/download/'+encodeURIComponent(filename),'_blank')}catch(e){toast(t('fail'))}}
function clearDraft(){state.pollToken++;state.currentRow=0;state.paperRow=0;state.paperText='';$('designForm').reset();$('designForm_periods').value='1';renderPaper();updateValidation('designForm')}
function newDesign(){clearDraft();nav('design')}
function setupEvents(){document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.page)));$('brandBtn').onclick=()=>{if(parent&&typeof parent.closeFullHtml==='function')parent.closeFullHtml(false)};$('menuBtn').onclick=()=>{const open=$('mobileMenu').classList.toggle('open');$('menuBtn').setAttribute('aria-expanded',String(open))};window.addEventListener('resize',adaptNavigation);document.addEventListener('click',e=>{if(!e.target.closest('#topbar'))closeMenu()});$('langDesktop').onclick=switchLang;$('langMobile').onclick=()=>{switchLang();closeMenu()};['heroCreate','libraryCreate'].forEach(id=>$(id).onclick=newDesign);$('allLessons').onclick=()=>{clearFilters();nav('library')};$('statTotal').onclick=()=>{clearFilters();nav('library')};$('statHours').onclick=()=>{clearFilters();nav('library')};$('statGrades').onclick=()=>$('gradeDistribution').classList.toggle('open');$('gradeDistribution').onclick=e=>{const b=e.target.closest('[data-grade]');if(b){$('gradeFilter').value=b.dataset.grade;nav('library');renderLibrary()}};$('designGrades').onclick=e=>{const b=e.target.closest('[data-grade]');if(b){$('designForm_grade').value=b.dataset.grade;updateValidation('designForm')}};$('designForm').addEventListener('input',()=>updateValidation('designForm'));$('editForm').addEventListener('input',()=>updateValidation('editForm'));$('designForm').onsubmit=e=>{e.preventDefault();if(updateValidation('designForm')&&!state.loading)submitNew(readForm('designForm'))};$('editForm').onsubmit=e=>{e.preventDefault();if(updateValidation('editForm')&&!state.loading)saveEdit()};$('resetBtn').onclick=clearDraft;$('goLibrary').onclick=()=>nav('library');$('designExport').onclick=()=>exportRow(state.paperRow);$('refreshBtn').onclick=refreshData;$('searchInput').oninput=renderLibrary;$('gradeFilter').onchange=renderLibrary;$('recentList').onclick=onCardClick;$('libraryList').onclick=onCardClick;['recentList','libraryList'].forEach(id=>$(id).addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('article[data-row]')){e.preventDefault();openDetail(Number(e.target.dataset.row))}}));$('detailClose').onclick=()=>closeOverlay('detail');$('detailCloseBottom').onclick=()=>closeOverlay('detail');$('editClose').onclick=()=>closeOverlay('edit');$('editCancel').onclick=()=>closeOverlay('edit');$('detailEdit').onclick=()=>openEdit(state.detailRow);$('detailExport').onclick=()=>exportRow(state.detailRow);$('detailDelete').onclick=()=>deleteRow(state.detailRow);$('detailPrev').onclick=()=>openDetail(state.detailRow-1);$('detailNext').onclick=()=>openDetail(state.detailRow+1);$('regenerateBtn').onclick=()=>{if(updateValidation('editForm')&&!state.loading)submitNew(readForm('editForm'),true)};['detail','edit'].forEach(n=>$(n+'Overlay').addEventListener('click',e=>{if(e.target===$(n+'Overlay'))closeOverlay(n)}));document.addEventListener('keydown',e=>{if(e.key==='Escape'){const top=topOverlay();if(top)closeOverlay(top);else closeMenu()}});document.addEventListener('focusin',e=>{if(e.target.matches('input,textarea,select'))setTimeout(()=>e.target.scrollIntoView({block:'center',behavior:'smooth'}),250)});if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>{const a=document.activeElement;if(a&&a.matches('input,textarea,select'))setTimeout(()=>a.scrollIntoView({block:'center',behavior:'smooth'}),120)})}
function clearFilters(){$('searchInput').value='';$('gradeFilter').value='';renderLibrary()}
function onCardClick(e){const action=e.target.closest('[data-action]');if(action){e.stopPropagation();const row=Number(action.dataset.row);if(action.dataset.action==='view')openDetail(row);else if(action.dataset.action==='edit')openEdit(row);else if(action.dataset.action==='delete')deleteRow(row);else if(action.dataset.action==='export')exportRow(row);else if(action.dataset.action==='create')newDesign();else if(action.dataset.action==='clear')clearFilters();return}const card=e.target.closest('[data-row]');if(card)openDetail(Number(card.dataset.row))}
async function initialize(){state.lang=chooseLanguage();try{const mode=await callAppBridge({type:'模式'});document.documentElement.dataset.mode=String(mode).trim()==='暗色'?'dark':'light'}catch(e){document.documentElement.dataset.mode=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}setupEvents();applyLang();renderPaper();updateValidation('designForm');await refreshData()}
document.addEventListener('DOMContentLoaded',async()=>{await initialize()});
</script></body></html>
