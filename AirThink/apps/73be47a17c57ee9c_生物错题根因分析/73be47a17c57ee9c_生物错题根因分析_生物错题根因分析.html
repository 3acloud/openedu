<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理

const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

        // 开始播放视频

          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });

    })
    .catch(error => {

        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

const DICT={cn:{appName:'生物错题根因分析',home:'首页',diagnose:'错题诊断',archive:'错题档案',homeTitle:'生物错题根因分析',homeDesc:'把一道生物错题放到显微镜下，按学段看清概念、结构、图表、实验、表述或计算上的根因，并只给出一项能马上练习的改进建议。单题证据不足时，报告会直接说明，不把一题说成长期弱项。',start:'开始诊断错题',allArchive:'查看全部档案',total:'错题总数',middleCount:'初中错题',highCount:'高中错题',distribution:'学段分布',recent:'最近放入显微镜的错题',diagnoseDesc:'录入一道错题。分析由后台按六维错因体系生成，页面只负责提交和展示。',toArchive:'去错题档案',formTitle:'错题分析',stage:'学段',middle:'初中',high:'高中',question:'题目',student:'学生答案',correct:'正确答案',analyze:'开始分析',clear:'清空重录',rootReport:'根因报告',viewCurrent:'查看本条档案',archiveDesc:'回看每一道错题的作答对照和根因报告。',newQuestion:'录入错题',all:'全部',search:'搜索题目关键字',detailTitle:'错题切片',close:'关闭',editThis:'编辑此题',editTitle:'编辑错题',save:'保存',cancel:'取消',emptySlice:'还没有错题切片',emptyArchive:'还没有错题档案',noMatch:'没有匹配的错题，请更换关键字。',initialReport:'提交后，这里会显示主维度、子类型、判断依据、根本原因和一项改进建议。',waiting:'正在对准这道错题，按六维错因体系写根因报告…',timeout:'报告仍在生成，请稍后到错题档案查看。',pending:'报告还在生成，请稍后重开详情。',refresh:'刷新报告',viewRoot:'查看根因',edit:'编辑',delete:'删除',confirmDelete:'确定删除这道错题吗？',saved:'保存成功',deleted:'删除成功',submitted:'已提交错题',required:'请完整填写四个字段。',error:'操作失败：',editNotice:'编辑只会更新题目信息，不会重新生成根因分析；要新的报告，请另录入一道错题。',legend:['概念','结构','图表','实验','表述','计算']},en:{appName:'Biology Error Root Cause',home:'Home',diagnose:'Diagnose',archive:'Archive',homeTitle:'Biology Error Root Cause',homeDesc:'Put one biology mistake under the microscope. Identify its cause across concepts, structures, charts, experiments, expression, or calculation, and get one practical next step. A single question is not treated as proof of a lasting weakness.',start:'Diagnose a question',allArchive:'View all records',total:'Total mistakes',middleCount:'Middle school',highCount:'High school',distribution:'Stage distribution',recent:'Recently examined',diagnoseDesc:'Enter one question. The backend generates the six-dimension analysis; this page submits and displays it.',toArchive:'Go to archive',formTitle:'Question analysis',stage:'School stage',middle:'Middle school',high:'High school',question:'Question',student:'Student answer',correct:'Correct answer',analyze:'Start analysis',clear:'Clear and retry',rootReport:'Root cause report',viewCurrent:'View this record',archiveDesc:'Review each question, answer comparison, and root cause report.',newQuestion:'Add question',all:'All',search:'Search questions',detailTitle:'Question detail',close:'Close',editThis:'Edit this question',editTitle:'Edit question',save:'Save',cancel:'Cancel',emptySlice:'No questions yet',emptyArchive:'No records yet',noMatch:'No matching questions. Try another keyword.',initialReport:'After submission, the main dimension, subtype, evidence, root cause, and one improvement will appear here.',waiting:'Examining this question and writing its six-dimension report…',timeout:'The report is still being generated. Check the archive later.',pending:'Report is still being generated. Reopen this detail later.',refresh:'Refresh report',viewRoot:'View report',edit:'Edit',delete:'Delete',confirmDelete:'Delete this question?',saved:'Saved',deleted:'Deleted',submitted:'Question submitted',required:'Complete all four fields.',error:'Operation failed: ',editNotice:'Editing updates question information only and will not regenerate the root cause report. Add a new question for a new report.',legend:['Concepts','Structures','Charts','Experiments','Expression','Calculation']}};
const $=id=>document.getElementById(id);let lang='cn',page='home',records=[],currentRow=0,detailRow=0,editRow=0,filter='all',pollToken=0,polling=false,reportReady=false,historyStack=[],pageVersion=0,keyboardInset=0;
function tr(key){return DICT[lang][key]??key}function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function preview(s,n=82){s=String(s??'').replace(/\s+/g,' ').trim();return s.length>n?s.slice(0,n)+'…':s}
function locale(){let saved=localStorage.getItem('iThinkAir_UiLanguage');if(saved!==null&&saved!=='')return saved==='en'?'en':'cn';let url=new URLSearchParams(location.search).get('lang');if(url==='cn'||url==='en')return url;let langs=navigator.languages;return !langs||!langs.length?'cn':langs.some(x=>/^zh(?:-|$)/i.test(x))?'cn':'en'}
function setLanguage(next){lang=next;document.documentElement.lang=lang==='cn'?'zh-CN':'en';localStorage.setItem('iThinkAir_UiLanguage',lang);document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=tr(el.dataset.i18n));document.querySelectorAll('[data-placeholder]').forEach(el=>el.placeholder=tr(el.dataset.placeholder));$('langDesktop').textContent=lang==='cn'?'EN':'中文';$('langMobile').textContent=lang==='cn'?'English':'中文';$('legend').replaceChildren(...tr('legend').map(t=>{let s=document.createElement('span');s.textContent=t;return s}));renderHome();renderArchive();if(!reportReady&&!polling)$('reportContent').textContent=tr('initialReport')}
function showToast(msg){let el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>el.classList.remove('show'),3500)}
function markdown(text){let raw=window.marked?marked.parse(String(text??''),{gfm:true,breaks:true}):'<pre>'+escapeHTML(text)+'</pre>';let safe=window.DOMPurify?DOMPurify.sanitize(raw):'<pre>'+escapeHTML(text)+'</pre>';let wrap=document.createElement('div');wrap.className='markdown-body';wrap.innerHTML=safe;wrap.querySelectorAll('img').forEach(img=>{let src=img.getAttribute('src')||'';if(!/^(https?:|data:)/i.test(src))src='http://' + window.location.hostname + ':3130/download/'+encodeURIComponent(src);img.src=src;let a=document.createElement('a');a.href=src;a.download='';a.target='_blank';img.replaceWith(a);a.appendChild(img)});return wrap}
function badge(stage){return '<span class="badge '+(stage==='初中'?'middle':'')+'">'+escapeHTML(stage==='初中'?tr('middle'):stage==='高中'?tr('high'):stage)+'</span>'}function compareHTML(a,b){return '<div class="student"><h3>'+tr('student')+'</h3><p>'+escapeHTML(a)+'</p></div><div class="correct"><h3>'+tr('correct')+'</h3><p>'+escapeHTML(b)+'</p></div>'}
async function getCSV(){let csv=await callAppBridge({type:'GetTableCSV',data:SOURCE,payload:FIELDS.join(',')});return parseCSV(String(csv??'')).filter(r=>r.length>=4).map((r,i)=>({row:i+1,stage:r[0],question:r[1],student:r[2],correct:r[3]}))}
async function refreshHome(){let version=++pageVersion;try{let [count,list]=await Promise.all([callAppBridge({type:'GetRecordCount',data:SOURCE}),getCSV()]);if(version!==pageVersion||page!=='home')return;records=list;let n=Number(String(count).trim());$('totalCount').textContent=Number.isFinite(n)?n:list.length;renderHome()}catch(e){showToast(tr('error')+e)}}
function renderHome(){let mid=records.filter(r=>r.stage==='初中').length,high=records.filter(r=>r.stage==='高中').length,den=mid+high;$('middleCount').textContent=mid;$('highCount').textContent=high;let dist=$('distributionBody');dist.replaceChildren();if(!den){dist.innerHTML='<p class="empty">'+tr('emptySlice')+'</p>'}else{let mp=mid/den*100,hp=high/den*100;let bar=document.createElement('div');bar.className='distribution';bar.innerHTML='<div class="mid" style="width:'+mp+'%">'+(mp>=18?mid+' · '+Math.round(mp)+'%':'')+'</div><div class="hi" style="width:'+hp+'%">'+(hp>=18?high+' · '+Math.round(hp)+'%':'')+'</div>';dist.append(bar);let labels=document.createElement('div');labels.className='distribution-labels';labels.innerHTML='<span>'+tr('middle')+': '+mid+' ('+Math.round(mp)+'%)</span><span>'+tr('high')+': '+high+' ('+Math.round(hp)+'%)</span>';dist.append(labels)}let list=$('recentList');list.replaceChildren();if(!records.length){let empty=document.createElement('div');empty.className='empty';empty.innerHTML='<p>'+tr('emptyArchive')+'</p><button class="btn primary" type="button">'+tr('start')+'</button>';empty.querySelector('button').onclick=()=>{clearDiagnosis();navigate('diagnose')};list.append(empty);return}records.slice(0,5).forEach(r=>{let b=document.createElement('button');b.className='mini-card';b.type='button';b.innerHTML=badge(r.stage)+'<strong>'+escapeHTML(preview(r.question,36))+'</strong><div class="answer-preview"><span>'+tr('student')+': '+escapeHTML(preview(r.student,38))+'</span><span>'+tr('correct')+': '+escapeHTML(preview(r.correct,38))+'</span></div>';b.onclick=async()=>{await navigate('archive');openDetail(r.row)};list.append(b)})}
async function refreshArchive(){let version=++pageVersion;try{let list=await getCSV();if(version!==pageVersion||page!=='archive')return;records=list;renderArchive()}catch(e){showToast(tr('error')+e)}}
function renderArchive(){let q=$('archiveSearch').value.trim().toLocaleLowerCase();let visible=records.filter(r=>(filter==='all'||r.stage===filter)&&r.question.toLocaleLowerCase().includes(q));document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));let list=$('archiveList');list.replaceChildren();visible.forEach(r=>{let card=document.createElement('article');card.className='record-card';card.tabIndex=0;card.innerHTML=badge(r.stage)+'<h3>'+escapeHTML(r.question)+'</h3><div class="answer-preview"><span>'+tr('student')+': '+escapeHTML(preview(r.student))+'</span><span>'+tr('correct')+': '+escapeHTML(preview(r.correct))+'</span></div><div class="record-actions"><button class="btn ghost" data-action="detail">'+tr('viewRoot')+'</button><button class="btn secondary" data-action="edit">'+tr('edit')+'</button><button class="btn danger" data-action="delete">'+tr('delete')+'</button></div>';card.onclick=()=>openDetail(r.row);card.onkeydown=e=>{if(e.key==='Enter'&&e.target===card)openDetail(r.row)};card.querySelectorAll('[data-action]').forEach(b=>b.onclick=e=>{e.stopPropagation();let a=b.dataset.action;if(a==='detail')openDetail(r.row);if(a==='edit')openEdit(r.row);if(a==='delete')deleteRecord(r.row)});list.append(card)});let empty=$('archiveEmpty');empty.replaceChildren();if(!visible.length){let box=document.createElement('div');box.className='empty';box.innerHTML='<p>'+tr(q?'noMatch':'emptyArchive')+'</p><button class="btn primary" type="button">+ '+tr('newQuestion')+'</button>';box.querySelector('button').onclick=()=>{clearDiagnosis();navigate('diagnose')};empty.append(box)}}
function closeMenu(){$('mobileMenu').classList.remove('open');$('menuButton').setAttribute('aria-expanded','false')}function navigate(to,options={}){if(page!==to){historyStack.push({page,scroll:window.scrollY,filter,query:$('archiveSearch').value});page=to;document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id==='page-'+to));document.querySelectorAll('.nav-link').forEach(b=>b.classList.toggle('active',b.dataset.page===to));window.scrollTo(0,0)}if(options.filter)filter=options.filter;closeMenu();if(to==='home')return refreshHome();if(to==='archive')return refreshArchive();return Promise.resolve()}
function topOverlay(){return [...document.querySelectorAll('.overlay.open')].at(-1)}function closeOverlay(id){$(id).classList.remove('open');if(id==='editOverlay')editRow=0}function airBack(){let open=topOverlay();if(open){closeOverlay(open.id);return 'false'}if(!historyStack.length)return 'true';let old=historyStack.pop();page=old.page;filter=old.filter;$('archiveSearch').value=old.query;document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id==='page-'+page));document.querySelectorAll('.nav-link').forEach(b=>b.classList.toggle('active',b.dataset.page===page));closeMenu();if(page==='home')refreshHome();if(page==='archive')refreshArchive();requestAnimationFrame(()=>window.scrollTo(0,old.scroll));return 'false'}window.airBack=airBack;
function formData(prefix){let form=$(prefix),checked=form.querySelector('input[name="学段"]:checked');return {'学段':checked?.value||'','题目':$(prefix+'_question').value.trim(),'学生答案':$(prefix+'_student').value.trim(),'正确答案':$(prefix+'_correct').value.trim()}}function valid(d){return FIELDS.every(k=>String(d[k]??'').trim())}function updateSubmit(){let d=formData('diagnosisForm');$('submitDiagnosis').disabled=polling||!valid(d)}function clearDiagnosis(){pollToken++;polling=false;reportReady=false;currentRow=0;$('diagnosisForm').reset();$('reportContent').replaceChildren(document.createTextNode(tr('initialReport')));$('reportContent').className='report-empty';$('diagnosisCompare').hidden=true;$('diagnosisCompare').replaceChildren();$('viewCurrent').disabled=true;updateSubmit()}
function wait(ms){return new Promise(resolve=>setTimeout(resolve,ms))}async function pollReport(token){let start=Date.now();while(token===pollToken&&Date.now()-start<60000){try{let result=String(await callAppBridge({type:'GetCellValue',data:SOURCE,payload:'根因分析/1'})??'');if(token!==pollToken)return;if(result.trim()){reportReady=true;$('reportContent').className='';$('reportContent').replaceChildren(markdown(result));$('viewCurrent').disabled=false;polling=false;updateSubmit();return}}catch(e){if(token===pollToken)showToast(tr('error')+e);break}await wait(2000)}if(token===pollToken){polling=false;$('reportContent').className='report-empty';$('reportContent').textContent=tr('timeout');updateSubmit()}}
async function submitDiagnosis(e){e.preventDefault();if(polling)return;let d=formData('diagnosisForm');if(!valid(d)){showToast(tr('required'));return}polling=true;updateSubmit();try{await callAppBridge({type:'SubmitRecord',data:TABLE,payload:JSON.stringify(d)});currentRow=1;reportReady=false;$('reportContent').className='waiting';$('reportContent').textContent=tr('waiting');$('diagnosisCompare').hidden=false;$('diagnosisCompare').innerHTML=compareHTML(d['学生答案'],d['正确答案']);$('viewCurrent').disabled=true;showToast(tr('submitted'));let token=++pollToken;pollReport(token)}catch(err){polling=false;updateSubmit();showToast(tr('error')+err)}}
async function cell(field,row){return String(await callAppBridge({type:'GetCellValue',data:SOURCE,payload:field+'/'+row})??'')}async function openDetail(row){detailRow=row;let overlay=$('detailOverlay');overlay.classList.add('open');$('detailBody').innerHTML='<p class="waiting">…</p>';try{let values=[];for(let field of [...FIELDS,'根因分析'])values.push(await cell(field,row));if(detailRow!==row||!overlay.classList.contains('open'))return;let [stage,question,student,correct,report]=values;let body=$('detailBody');body.innerHTML=badge(stage)+'<p class="detail-question">'+escapeHTML(question)+'</p><div class="compare">'+compareHTML(student,correct)+'</div><div class="report-block"><h3>'+tr('rootReport')+'</h3><div id="detailReport"></div></div>';renderDetailReport(report,row)}catch(e){$('detailBody').textContent=tr('error')+e}}
function renderDetailReport(report,row){let box=$('detailReport');if(report.trim()){box.replaceChildren(markdown(report));return}box.innerHTML='<p class="report-empty">'+tr('pending')+'</p><button class="btn ghost" id="refreshDetailReport">'+tr('refresh')+'</button>';$('refreshDetailReport').onclick=async()=>{try{let value=await cell('根因分析',row);if(detailRow===row&&$('detailOverlay').classList.contains('open'))renderDetailReport(value,row)}catch(e){showToast(tr('error')+e)}}}
async function openEdit(row){currentRow=row;editRow=row;$('editOverlay').classList.add('open');$('saveEdit').disabled=true;try{let vals=[];for(let field of FIELDS)vals.push(await cell(field,row));if(editRow!==row)return;let stage=vals[0];$('editForm_stageMiddle').checked=stage==='初中';$('editForm_stageHigh').checked=stage==='高中';$('editForm_question').value=vals[1];$('editForm_student').value=vals[2];$('editForm_correct').value=vals[3];let report=await cell('根因分析',row);let block=$('editExistingReport');block.replaceChildren();block.hidden=!report.trim();if(report.trim()){let h=document.createElement('h3');h.textContent=tr('rootReport');let p=document.createElement('p');p.className='notice';p.textContent=tr('editNotice');block.append(h,p,markdown(report))}$('saveEdit').disabled=false}catch(e){showToast(tr('error')+e)}}
async function saveEdit(e){e.preventDefault();let d=formData('editForm');if(!valid(d)){showToast(tr('required'));return}let row=editRow;if(!row)return;$('saveEdit').disabled=true;try{for(let field of FIELDS)await callAppBridge({type:'SetCellValue',data:SOURCE,payload:field+'/'+row+'/'+d[field]});closeOverlay('editOverlay');showToast(tr('saved'));await refreshArchive()}catch(err){showToast(tr('error')+err)}finally{$('saveEdit').disabled=false}}
async function deleteRecord(row){if(!confirm(tr('confirmDelete')))return;try{await callAppBridge({type:'DeleteRecord',data:SOURCE,payload:row.toString()});if(currentRow===row)currentRow=0;showToast(tr('deleted'));await refreshArchive()}catch(e){showToast(tr('error')+e)}}
function handleKeyboard(){let active=document.activeElement;if(!active||!active.matches('input,textarea,select'))return;setTimeout(()=>active.scrollIntoView({block:'center',behavior:'smooth'}),180)}
async function initialize(){lang=locale();try{let mode=await callAppBridge({type:'模式'});document.body.classList.toggle('dark',String(mode).trim()==='暗色')}catch(e){}setLanguage(lang);$('brand').onclick=()=>{if(window.parent&&typeof window.parent.closeFullHtml==='function')window.parent.closeFullHtml(false)};$('menuButton').onclick=()=>{let open=$('mobileMenu').classList.toggle('open');$('menuButton').setAttribute('aria-expanded',String(open))};document.addEventListener('click',e=>{if(!$('topbar').contains(e.target))closeMenu()});document.querySelectorAll('.nav-link').forEach(b=>b.onclick=()=>navigate(b.dataset.page));$('langDesktop').onclick=$('langMobile').onclick=()=>{setLanguage(lang==='cn'?'en':'cn');closeMenu()};$('homeStart').onclick=()=>{clearDiagnosis();navigate('diagnose')};$('homeArchive').onclick=()=>navigate('archive',{filter:'all'});$('statTotal').onclick=()=>navigate('archive',{filter:'all'});$('statMiddle').onclick=()=>navigate('archive',{filter:'初中'});$('statHigh').onclick=()=>navigate('archive',{filter:'高中'});$('diagnoseToArchive').onclick=()=>navigate('archive');$('archiveNew').onclick=()=>{clearDiagnosis();navigate('diagnose')};$('archiveSearch').oninput=renderArchive;document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;renderArchive()});$('diagnosisForm').addEventListener('input',updateSubmit);$('diagnosisForm').onsubmit=submitDiagnosis;$('clearDiagnosis').onclick=clearDiagnosis;$('viewCurrent').onclick=async()=>{if(currentRow>=1&&reportReady){await navigate('archive');openDetail(1)}};$('detailClose').onclick=$('detailCloseIcon').onclick=()=>closeOverlay('detailOverlay');$('detailEdit').onclick=()=>{let row=detailRow;closeOverlay('detailOverlay');openEdit(row)};$('editCloseIcon').onclick=$('cancelEdit').onclick=()=>closeOverlay('editOverlay');$('editForm').onsubmit=saveEdit;document.querySelectorAll('.overlay').forEach(o=>o.onclick=e=>{if(e.target===o)closeOverlay(o.id)});document.addEventListener('keydown',e=>{if(e.key==='Escape'){let o=topOverlay();if(o)closeOverlay(o.id);else closeMenu()}});document.addEventListener('focusin',handleKeyboard);if(window.visualViewport)window.visualViewport.addEventListener('resize',handleKeyboard);clearDiagnosis();await refreshHome()}
document.addEventListener('DOMContentLoaded',()=>{(async () => { await initialize(); })();});
</script>
