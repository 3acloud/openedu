<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**

function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

        }

const dict={cn:{brand:'生物错题根因分析',home:'首页',diagnose:'错题诊断',archive:'错题档案',eyebrow:'THE ERROR MICROSCOPE',heroTitle:'生物错题根因分析',heroDesc:'把一道生物错题放到显微镜下，按学段看清概念、结构、图表、实验、表述或计算上的根因，并只给出一项能马上练习的改进建议。单题证据不足时，报告会直接说明，不把一题说成长期弱项。',start:'开始诊断错题',allArchive:'查看全部档案',total:'错题总数',juniorCount:'初中错题',seniorCount:'高中错题',distribution:'学段分布',recent:'最近放入显微镜的错题',diagnoseDesc:'录入一道错题。分析由后台按六维错因体系生成，页面只负责提交和展示。',goArchive:'去错题档案',analysisForm:'错题分析',stage:'学段',junior:'初中',senior:'高中',question:'题目',studentAnswer:'学生答案',correctAnswer:'正确答案',analyze:'开始分析',clear:'清空重录',rootReport:'根因报告',viewCurrent:'查看本条档案',archiveDesc:'回看每一道错题的作答对照和根因报告。',add:'+ 录入错题',search:'按题目关键字搜索',all:'全部',slice:'错题切片',close:'关闭',editThis:'编辑此题',editRecord:'编辑错题',save:'保存',cancel:'取消',confirmDelete:'确认删除这道错题？',delete:'删除',noSlice:'还没有错题切片',initialReport:'提交后，这里会显示主维度、子类型、判断依据、根本原因和一项改进建议。',waiting:'正在对准这道错题，按六维错因体系写根因报告…',later:'报告还在生成，请稍后到错题档案查看。',reportPending:'报告还在生成，请稍后重开详情',refresh:'刷新报告',editWarning:'编辑只会更新题目信息，不会重新生成根因分析；要新的报告，请另录入一道错题。',noRecords:'还没有错题。录入一道题，开始查找根因。',noMatch:'没有匹配的错题，请更换关键字或筛选条件。',confirmQuestion:'确定删除这道错题吗？',dimensions:['概念','结构','图表','实验','表述','计算'],loadError:'数据加载失败，请稍后重试。',saveError:'操作失败，请重试。'},en:{brand:'Biology Error Analysis',home:'Home',diagnose:'Diagnose',archive:'Archive',eyebrow:'THE ERROR MICROSCOPE',heroTitle:'Biology Error Analysis',heroDesc:'Put one biology mistake under the microscope. Examine its cause across concepts, structures, diagrams, experiments, expression, or calculation, then get one practical exercise. A single answer is never treated as proof of a lasting weakness.',start:'Diagnose a question',allArchive:'View archive',total:'Total questions',juniorCount:'Junior high',seniorCount:'Senior high',distribution:'Stage distribution',recent:'Recent questions under the microscope',diagnoseDesc:'Enter one missed question. The backend generates a six-dimension analysis; this page submits and displays it.',goArchive:'Go to archive',analysisForm:'Question analysis',stage:'Stage',junior:'Junior high',senior:'Senior high',question:'Question',studentAnswer:'Student answer',correctAnswer:'Correct answer',analyze:'Start analysis',clear:'Clear and retry',rootReport:'Root-cause report',viewCurrent:'View this record',archiveDesc:'Review each question, its answer comparison, and its report.',add:'+ Add question',search:'Search question keywords',all:'All',slice:'Question detail',close:'Close',editThis:'Edit this question',editRecord:'Edit question',save:'Save',cancel:'Cancel',confirmDelete:'Delete this question?',delete:'Delete',noSlice:'No questions yet',initialReport:'After submission, the main dimension, subtype, evidence, root cause, and one improvement will appear here.',waiting:'Analyzing this question across six dimensions…',later:'The report is still generating. Check the archive later.',reportPending:'The report is still generating. Reopen this detail later.',refresh:'Refresh report',editWarning:'Editing only changes question information and does not regenerate the report. Enter a new question for a new report.',noRecords:'No questions yet. Add one to begin.',noMatch:'No matching questions. Try another keyword or filter.',confirmQuestion:'Delete this question?',dimensions:['Concept','Structure','Diagram','Experiment','Expression','Calculation'],loadError:'Could not load data. Please retry later.',saveError:'Operation failed. Please retry.'}};
let language='cn',currentPage='home',historyStack=[],records=[],filter='all',currentRow=0,detailRow=0,editRow=0,deleteRow=0,pollToken=0,polling=false,reportReady=false,homeRequest=0,archiveRequest=0;
const $=id=>document.getElementById(id),t=key=>dict[language][key]||key;
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function preview(value,n=90){const s=String(value??'').replace(/\s+/g,' ').trim();return s.length>n?s.slice(0,n)+'…':s;}
function badge(stage){return '<span class="badge '+(stage==='高中'?'senior':'')+'">'+escapeHtml(stage==='初中'?t('junior'):stage==='高中'?t('senior'):stage)+'</span>';}
function markdown(textValue){let raw=String(textValue??'');let html=window.marked?marked.parse(raw,{gfm:true,breaks:true}):'<p>'+escapeHtml(raw).replace(/\n/g,'<br>')+'</p>';let safe=window.DOMPurify?DOMPurify.sanitize(html):escapeHtml(raw).replace(/\n/g,'<br>');const container=document.createElement('div');container.className='markdown-body';container.innerHTML=safe;container.querySelectorAll('img').forEach(img=>{const source=img.getAttribute('src')||'';if(!source)return;const url=/^https?:\/\//i.test(source)?source:'http://' + window.location.hostname + ':3130/download/'+encodeURIComponent(source);img.src=url;const link=document.createElement('a');link.href=url;link.setAttribute('download','');link.target='_blank';link.rel='noopener';img.replaceWith(link);link.appendChild(img)});return container.outerHTML;}
function setReport(value){$('report').className=value?'markdown-body':'notice';$('report').innerHTML=value?markdown(value):escapeHtml(t('initialReport'));}
function updateLang(){document.documentElement.lang=language==='cn'?'zh-CN':'en';document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n)});document.querySelectorAll('[data-placeholder]').forEach(el=>{el.placeholder=t(el.dataset.placeholder)});$('desktopLang').textContent=language==='cn'?'EN':'中文';$('dimensions').innerHTML=t('dimensions').map(x=>'<span>'+escapeHtml(x)+'</span>').join('');document.title=t('brand');if(!reportReady&&!polling)setReport('');renderArchive();}
function setLanguage(value){language=value;localStorage.setItem('iThinkAir_UiLanguage',value);updateLang();closeMenu();if(currentPage==='home')loadHome();}
function closeMenu(){$('mobileMenu').classList.remove('open');$('menuBtn').setAttribute('aria-expanded','false');}
function syncNav(){document.querySelectorAll('[data-page]').forEach(el=>el.classList.toggle('active',el.dataset.page===currentPage));}
async function navigate(page,options={}){if(!options.back)historyStack.push({page:currentPage,scroll:window.scrollY});currentPage=page;document.querySelectorAll('.page').forEach(el=>el.classList.toggle('active',el.id===page+'Page'));syncNav();closeMenu();if(page==='diagnose'&&options.clear)clearDiagnosis();if(page==='archive'&&options.filter!==undefined)filter=options.filter;if(page==='home')await loadHome();if(page==='archive')await loadArchive();if(options.back)window.scrollTo(0,options.scroll||0);else window.scrollTo(0,0);if(options.detail)await openDetail(options.detail);}
function openOverlay(id){$(id).classList.add('open');document.body.classList.add('modal-open');}
function closeOverlay(id){$(id).classList.remove('open');if(!document.querySelector('.overlay.open'))document.body.classList.remove('modal-open');}
function topOverlay(){return ['confirmOverlay','editOverlay','detailOverlay'].find(id=>$(id).classList.contains('open'));}
function airBack(){const overlay=topOverlay();if(overlay){closeOverlay(overlay);return 'false'}if(historyStack.length){const item=historyStack.pop();navigate(item.page,{back:true,scroll:item.scroll});return 'false'}return 'true'}window.airBack=airBack;
async function getRecords(){const csv=await callAppBridge({type:'GetTableCSV',data:SOURCE,payload:FIELDS.join(',')});return parseCSV(String(csv||'')).map((cols,i)=>({row:i+1,stage:cols[0]||'',question:cols[1]||'',student:cols[2]||'',correct:cols[3]||''}));}
async function loadHome(){const token=++homeRequest;try{const [countText,rows]=await Promise.all([callAppBridge({type:'GetRecordCount',data:SOURCE}),getRecords()]);if(token!==homeRequest)return;const junior=rows.filter(r=>r.stage==='初中').length,senior=rows.filter(r=>r.stage==='高中').length,total=rows.length;$('totalNum').textContent=String(countText).trim()||String(total);$('juniorNum').textContent=junior;$('seniorNum').textContent=senior;if(total){const jp=junior/total*100,sp=senior/total*100;$('distribution').innerHTML='<div class="distbar"><span class="junior-segment" style="width:'+jp+'%">'+(jp>=20?junior+' · '+Math.round(jp)+'%':'')+'</span><span class="senior-segment" style="width:'+sp+'%">'+(sp>=20?senior+' · '+Math.round(sp)+'%':'')+'</span></div><div class="legend"><span><i class="dot" style="background:var(--amber)"></i>'+t('junior')+' '+junior+' · '+Math.round(jp)+'%</span><span><i class="dot" style="background:var(--teal)"></i>'+t('senior')+' '+senior+' · '+Math.round(sp)+'%</span></div>'}else $('distribution').innerHTML='<div class="empty">'+t('noSlice')+'</div>';$('recentList').innerHTML=rows.length?rows.slice(0,5).map(r=>'<article class="recent" data-row="'+r.row+'" tabindex="0">'+badge(r.stage)+'<h3>'+escapeHtml(preview(r.question,36))+'</h3><p class="excerpt"><b>'+t('studentAnswer')+':</b> '+escapeHtml(preview(r.student,50))+'</p><p class="excerpt correct"><b>'+t('correctAnswer')+':</b> '+escapeHtml(preview(r.correct,50))+'</p></article>').join(''):'<div class="empty">'+t('noRecords')+'<br><button class="btn primary" id="emptyStart">'+t('start')+'</button></div>';}catch(e){$('distribution').innerHTML='<div class="empty error">'+t('loadError')+'</div>';$('recentList').innerHTML='';}}
function renderArchive(){if(!$('recordList'))return;document.querySelectorAll('.filter').forEach(el=>el.classList.toggle('active',el.dataset.filter===filter));const query=$('archiveSearch').value.trim().toLocaleLowerCase();const shown=records.filter(r=>(filter==='all'||r.stage===filter)&&r.question.toLocaleLowerCase().includes(query));$('recordList').innerHTML=shown.length?shown.map(r=>'<article class="record" data-row="'+r.row+'" tabindex="0">'+badge(r.stage)+'<h3>'+escapeHtml(r.question)+'</h3><p class="excerpt"><b>'+t('studentAnswer')+':</b> '+escapeHtml(preview(r.student))+'</p><p class="excerpt correct"><b>'+t('correctAnswer')+':</b> '+escapeHtml(preview(r.correct))+'</p><div class="record-actions"><button class="btn small outline" data-action="detail">'+t('rootReport')+'</button><button class="btn small outline" data-action="edit">'+t('editRecord')+'</button><button class="btn small danger" data-action="delete">'+t('delete')+'</button></div></article>').join(''):'<div class="empty">'+t(records.length?'noMatch':'noRecords')+'<br><button class="btn primary" id="emptyAdd">'+t('add')+'</button></div>';}
async function loadArchive(){const token=++archiveRequest;try{const rows=await getRecords();if(token!==archiveRequest)return;records=rows;renderArchive();}catch(e){$('recordList').innerHTML='<div class="empty error">'+t('loadError')+'</div>';}}
function formValues(prefix){const stage=document.querySelector('input[name="学段"]:checked');const selected=prefix==='createForm'?document.querySelector('#createForm input[name="学段"]:checked'):document.querySelector('#editForm input[name="学段"]:checked');return {'学段':selected?.value||'','题目':$(prefix+'_question').value.trim(),'学生答案':$(prefix+'_student').value.trim(),'正确答案':$(prefix+'_correct').value.trim()};}
function valid(values){return FIELDS.every(field=>Boolean(values[field]));}
function updateSubmit(){ $('createForm_submit').disabled=polling||!valid(formValues('createForm'));}
function clearDiagnosis(){pollToken++;polling=false;currentRow=0;reportReady=false;$('createForm').reset();$('diagnoseCompare').classList.add('hidden');$('diagnoseStudent').textContent='';$('diagnoseCorrect').textContent='';$('currentDetail').disabled=true;setReport('');updateSubmit();}
async function pollReport(token){const start=Date.now();while(token===pollToken&&Date.now()-start<60000){await new Promise(resolve=>setTimeout(resolve,2000));if(token!==pollToken)return;try{const value=await callAppBridge({type:'GetCellValue',data:SOURCE,payload:'根因分析/1'});if(token!==pollToken)return;if(String(value||'').trim()){polling=false;reportReady=true;setReport(value);$('currentDetail').disabled=false;updateSubmit();return;}}catch(e){if(token!==pollToken)return;}}if(token===pollToken){polling=false;$('report').className='notice';$('report').textContent=t('later');updateSubmit();}}
async function submitDiagnosis(e){e.preventDefault();if(polling)return;const values=formValues('createForm');if(!valid(values))return;polling=true;updateSubmit();const token=++pollToken;$('report').className='notice';$('report').textContent=t('waiting');try{await callAppBridge({type:'SubmitRecord',data:'错题分析',payload:JSON.stringify(values)});if(token!==pollToken)return;currentRow=1;reportReady=false;$('diagnoseStudent').textContent=values['学生答案'];$('diagnoseCorrect').textContent=values['正确答案'];$('diagnoseCompare').classList.remove('hidden');await loadArchive();await pollReport(token);}catch(e){if(token!==pollToken)return;polling=false;$('report').className='notice error';$('report').textContent=t('saveError');updateSubmit();}}
async function getCell(field,row){return await callAppBridge({type:'GetCellValue',data:SOURCE,payload:field+'/'+row});}
async function openDetail(row){detailRow=row;openOverlay('detailOverlay');$('detailBody').innerHTML='<div class="notice">'+t('waiting')+'</div>';try{const values={};for(const field of [...FIELDS,'根因分析'])values[field]=await getCell(field,row);if(detailRow!==row||!$('detailOverlay').classList.contains('open'))return;renderDetail(values,row);}catch(e){$('detailBody').innerHTML='<div class="notice error">'+t('loadError')+'</div>';}}
function renderDetail(values,row){const report=String(values['根因分析']||'');$('detailBody').innerHTML=badge(values['学段'])+'<div class="detail-question">'+escapeHtml(values['题目'])+'</div><div class="compare"><div class="compare-box student"><b>'+t('studentAnswer')+'</b>'+escapeHtml(values['学生答案'])+'</div><div class="compare-box correct"><b>'+t('correctAnswer')+'</b>'+escapeHtml(values['正确答案'])+'</div></div><h3>'+t('rootReport')+'</h3><div id="detailReport">'+(report?markdown(report):'<div class="notice">'+t('reportPending')+'</div><button class="btn outline" id="refreshReport">'+t('refresh')+'</button>')+'</div>';if(!report)$('refreshReport').onclick=async()=>{const value=await getCell('根因分析',row);if(detailRow===row)renderDetail({...values,'根因分析':value},row)};}
async function openEdit(row){editRow=row;currentRow=row;openOverlay('editOverlay');$('editForm_submit').disabled=true;try{const values={};for(const field of FIELDS)values[field]=await getCell(field,row);if(editRow!==row||!$('editOverlay').classList.contains('open'))return;$('editForm_stageJunior').checked=values['学段']==='初中';$('editForm_stageSenior').checked=values['学段']==='高中';$('editForm_question').value=values['题目'];$('editForm_student').value=values['学生答案'];$('editForm_correct').value=values['正确答案'];const report=await getCell('根因分析',row);if(editRow!==row)return;$('editReport').classList.toggle('hidden',!String(report||'').trim());$('editReport').innerHTML=report?'<h3>'+t('rootReport')+'</h3>'+markdown(report)+'<p class="status">'+t('editWarning')+'</p>':'';$('editForm_submit').disabled=false;}catch(e){$('editReport').classList.remove('hidden');$('editReport').innerHTML='<p class="error">'+t('loadError')+'</p>';}}
async function saveEdit(e){e.preventDefault();const values=formValues('editForm');if(!valid(values))return;$('editForm_submit').disabled=true;try{for(const field of FIELDS)await callAppBridge({type:'SetCellValue',data:SOURCE,payload:field+'/'+editRow+'/'+values[field]});closeOverlay('editOverlay');await loadArchive();}catch(e){$('editReport').classList.remove('hidden');$('editReport').innerHTML='<p class="error">'+t('saveError')+'</p>';}finally{$('editForm_submit').disabled=false;}}
async function confirmDelete(){const row=deleteRow;$('confirmYes').disabled=true;try{await callAppBridge({type:'DeleteRecord',data:SOURCE,payload:row.toString()});if(currentRow===row)currentRow=0;closeOverlay('confirmOverlay');await loadArchive();}catch(e){alert(t('saveError'))}finally{$('confirmYes').disabled=false;}}
function attachEvents(){$('brand').onclick=()=>{if(window.parent&&typeof window.parent.closeFullHtml==='function')window.parent.closeFullHtml(false)};document.querySelectorAll('[data-page]').forEach(el=>el.onclick=()=>navigate(el.dataset.page));$('menuBtn').onclick=()=>{const open=$('mobileMenu').classList.toggle('open');$('menuBtn').setAttribute('aria-expanded',String(open))};document.addEventListener('click',e=>{if(!$('topbar').contains(e.target))closeMenu()});$('desktopLang').onclick=()=>setLanguage(language==='cn'?'en':'cn');document.querySelectorAll('[data-lang]').forEach(el=>el.onclick=()=>setLanguage(el.dataset.lang));$('heroStart').onclick=()=>navigate('diagnose',{clear:true});$('heroArchive').onclick=()=>navigate('archive',{filter:'all'});$('totalStat').onclick=()=>navigate('archive',{filter:'all'});$('juniorStat').onclick=()=>navigate('archive',{filter:'初中'});$('seniorStat').onclick=()=>navigate('archive',{filter:'高中'});$('diagnoseArchive').onclick=()=>navigate('archive');$('archiveAdd').onclick=()=>navigate('diagnose',{clear:true});$('recentList').onclick=e=>{if(e.target.id==='emptyStart')return navigate('diagnose',{clear:true});const card=e.target.closest('[data-row]');if(card)navigate('archive',{detail:Number(card.dataset.row)})};$('recentList').onkeydown=e=>{if(e.key==='Enter'&&e.target.matches('[data-row]'))navigate('archive',{detail:Number(e.target.dataset.row)})};$('archiveSearch').oninput=renderArchive;$('archiveFilters').onclick=e=>{const btn=e.target.closest('[data-filter]');if(btn){filter=btn.dataset.filter;renderArchive()}};$('recordList').onclick=e=>{if(e.target.id==='emptyAdd')return navigate('diagnose',{clear:true});const card=e.target.closest('[data-row]');if(!card)return;const row=Number(card.dataset.row);const action=e.target.closest('[data-action]')?.dataset.action;if(action==='edit'){e.stopPropagation();openEdit(row)}else if(action==='delete'){e.stopPropagation();deleteRow=row;openOverlay('confirmOverlay')}else openDetail(row)};$('recordList').onkeydown=e=>{if(e.key==='Enter'&&e.target.matches('[data-row]'))openDetail(Number(e.target.dataset.row))};$('createForm').addEventListener('input',updateSubmit);$('createForm').addEventListener('change',updateSubmit);$('createForm').onsubmit=submitDiagnosis;$('clearForm').onclick=clearDiagnosis;$('currentDetail').onclick=()=>{if(currentRow>=1&&reportReady)navigate('archive',{detail:1})};$('detailClose').onclick=$('detailX').onclick=()=>closeOverlay('detailOverlay');$('detailEdit').onclick=()=>{const row=detailRow;closeOverlay('detailOverlay');openEdit(row)};$('editX').onclick=$('editCancel').onclick=()=>closeOverlay('editOverlay');$('editForm').onsubmit=saveEdit;$('confirmNo').onclick=()=>closeOverlay('confirmOverlay');$('confirmYes').onclick=confirmDelete;document.querySelectorAll('.overlay').forEach(el=>el.addEventListener('mousedown',e=>{if(e.target===el)closeOverlay(el.id)}));document.addEventListener('keydown',e=>{if(e.key==='Escape'){const overlay=topOverlay();if(overlay)closeOverlay(overlay);else closeMenu()}});document.addEventListener('focusin',e=>{if(e.target.matches('input,textarea'))setTimeout(()=>e.target.scrollIntoView({block:'center',behavior:'smooth'}),250)});if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>{const active=document.activeElement;if(active&&active.matches('input,textarea'))setTimeout(()=>active.scrollIntoView({block:'center',behavior:'smooth'}),120)});}
async function initialize(){const saved=localStorage.getItem('iThinkAir_UiLanguage');const param=new URLSearchParams(location.search).get('lang');const browser=navigator.languages;if(saved)language=saved==='en'?'en':'cn';else if(param==='cn'||param==='en')language=param;else language=!browser||!browser.length||browser.some(x=>/^zh(?:-|$)/i.test(x))?'cn':'en';attachEvents();updateLang();try{const mode=await callAppBridge({type:'模式'});document.body.classList.toggle('dark',String(mode).trim()==='暗色')}catch(e){}await loadHome();}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',async()=>{await initialize()},{once:true});else (async()=>{await initialize()})();
</script>
