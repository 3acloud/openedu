<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,
          "CapturePhoto": capturePhotoA,
          "FinishRecordVoice": FinishRecordVoiceA
        };

        // 检查请求类型是否在支持的映射中
        if (request['type'] in HANDLERS) {
          try {
            // 1. 根据类型选择相应的处理函数获取文件
            const file = await HANDLERS[request['type']]();
    
            // 2. 上传文件到Flask服务端
            const guidFileName = await uploadToFlaskA(file);
    
            // 3. 返回GUID文件名
            return guidFileName;
          } catch (error) {
            // 可以在这里添加错误处理逻辑，如日志记录
            console.error(`处理${request['type']}时出错:`, error);
          }
  
          // 所有失败情况返回空字符串
          return "";
        }



        url = 'http://' + window.location.hostname + ':3130/request';
        const response = await fetch(url, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'SessionID': localStorage.getItem('airthink_session_id'),
            'BaseName': encodeURIComponent("ab4c76c5035b6321_家长沟通助手")
        },
        body: JSON.stringify(request)
        });
  
        if (!response.ok) {
            throw new Error(`请求失败: ${response.status}`);
        }
  
        return await response.text();
    }

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function selectImageA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*'; // 限制只选择图片文件
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        // 可选：进一步验证文件确实是图片
        if (!file.type.startsWith('image/')) {
          reject(new Error('选择的文件不是图片'));
          return;
        }
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择（注意：cancel事件在某些浏览器中可能不支持）
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function capturePhotoA() {
  return new Promise((resolve, reject) => {
    // 检查浏览器是否支持媒体设备API
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      reject(new Error('您的浏览器不支持拍照功能'));
      return;
    }
    
    // 创建一个隐藏的视频元素用于预览
    const video = document.createElement('video');
    video.style.display = 'none';
    video.setAttribute('autoplay', '');
    video.setAttribute('playsinline', '');
    
    // 创建一个canvas元素用于捕获照片
    const canvas = document.createElement('canvas');
    canvas.style.display = 'none';
    const ctx = canvas.getContext('2d');
    
    // 创建拍照按钮和取消按钮的容器
    const container = document.createElement('div');
    container.style.cssText = `
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    `;
    
    // 创建视频预览容器
    const videoContainer = document.createElement('div');
    videoContainer.style.cssText = `
      width: 100%;
      max-width: 640px;
      max-height: 70vh;
      overflow: hidden;
      border-radius: 8px;
      margin-bottom: 20px;
    `;
    
    // 将视频放入容器中
    video.style.cssText = `
      width: 100%;
      height: auto;
      transform: scaleX(-1); /* 镜像翻转，让预览更自然 */
    `;
    
    // 创建按钮容器
    const buttonContainer = document.createElement('div');
    buttonContainer.style.cssText = `
      display: flex;
      gap: 20px;
    `;
    
    // 创建拍照按钮
    const captureBtn = document.createElement('button');
    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

function renderLedger(){if(state.recordError){$('ledgerList').innerHTML=errorCard('records');$('ledgerCount').textContent='';return}const query=$('ledgerSearch').value.trim().toLowerCase();const denseOnly=$('ledgerList').dataset.dense==='1';const rows=state.records.filter(r=>(r['学员化名']+' '+r['沟通事实']).toLowerCase().includes(query)&&(!$('ledgerScene').value||r['沟通场景']===$('ledgerScene').value)&&(!$('ledgerChannel').value||r['沟通渠道']===$('ledgerChannel').value)&&(!$('ledgerStatus').value||r['发送状态']===$('ledgerStatus').value)&&(!$('ledgerStage').value||(student(r['学员化名'])||{})['学段']===$('ledgerStage').value)&&(!denseOnly||frequency(r['学员化名']).dense));$('ledgerCount').textContent=`${rows.length} ${t('count')}`;$('ledgerList').innerHTML=rows.length?rows.map(r=>recordCard(r)).join(''):empty(t('emptyRecord'),!state.records.length?`<button class="btn primary" data-action="new-record">${e(t('newCommunication'))}</button>`:'')}

async function saveStudent(){const form=$('studentForm'),values=Object.fromEntries(new FormData(form).entries()),row=state.dialogRow,old=state.students.find(s=>s.row===row);const name=values['学员化名'].trim();if(!name){form.reportValidity();return}values['学员化名']=name;if(state.students.some(s=>s['学员化名']===name&&s.row!==row)){showToast('化名已存在，请换一个。');return}if(row&&old&&old['学员化名']!==name&&!confirm('该化名可能被沟通记录引用，确认修改吗？'))return;try{if(row){for(const field of STUDENT_FIELDS)await setCell(STUDENT_SOURCE,field,row,values[field])}else{await callAppBridge({type:'SubmitRecord',data:'学员信息',payload:JSON.stringify(values)});state.dialogRow=1}closeDialog();await refreshAll()}catch(err){showToast(t('failed'))}}
async function studentDetail(row){try{const s=await fullRecord(STUDENT_SOURCE,STUDENT_FIELDS,row);const recent=recentFor(s['学员化名']).slice(0,5);let body=`<dl class="detail-grid">${STUDENT_FIELDS.map(f=>`<dt>${e(f)}</dt><dd>${e(s[f])}</dd>`).join('')}</dl><h3>${e(t('recent'))}</h3>`+ (recent.length?recent.map(r=>`<button class="btn student-pick" data-action="record-detail" data-row="${r.row}">${e(r['沟通时间'])} · ${e(r['沟通场景'])} · ${e((r['沟通事实']||'').slice(0,60))}</button>`).join(''):`<p class="muted">${e(t('emptyRecord'))}</p>`);openDialog(s['学员化名'],body,`<button class="btn" data-action="close-dialog">${e(t('close'))}</button><button class="btn" data-action="student-edit" data-row="${row}">${e(t('edit'))}</button>`,'preview')}catch(err){showToast(t('failed'))}}
async function deleteStudent(row){const s=state.students.find(x=>x.row===row);if(!s)return;const used=state.records.some(r=>r['学员化名']===s['学员化名']);if(!confirm(used?'沟通记录已引用此化名。只删除学员行，不删除沟通记录。确认删除吗？':'确认删除这位学员吗？'))return;try{await callAppBridge({type:'DeleteRecord',data:STUDENT_SOURCE,payload:row.toString()});await refreshAll()}catch(err){showToast(t('failed'))}}
function resetCompose(){state.currentRow=0;state.draft='';state.selected='';$('composeForm').reset();$('composeForm_time').value=fmtDate(new Date(),false).replace(' ','T');$('composeForm_scene').value='课后反馈';$('composeForm_status').value='待发送';$('composeForm_status').disabled=false;renderCompose()}
function pickStudent(name){if(state.selected!==name){state.currentRow=0;state.draft=''}state.selected=name;$('composeForm_student').value=name;const s=student(name);if(s)$('composeForm_channel').value=PREFERENCES.includes(s['家长沟通偏好'])&&s['家长沟通偏好']!=='不主动联系'?s['家长沟通偏好']:'私聊文字';renderCompose()}
async function composeSubmit(ev){ev.preventDefault();if(state.polling)return;const s=student($('composeForm_student').value);if(!s){showToast('请先去名册添加并选择学员。');return}if(s['家长沟通授权']!=='是'){showToast('未获家长沟通授权，不生成家长内容');return}if(['暂停记录','待删除'].includes(s['学员状态'])){showToast('请先在名册处理学员状态。');return}if(s['家长沟通偏好']==='不主动联系'){showToast('尊重家长偏好，不主动起草。');return}if($('composeForm_channel').value==='群公告'){showToast('具体学员的反馈仅限私聊，群公告不得包含任何学员个体信息。');return}const facts=$('composeForm_facts').value.trim();if(!facts){showToast('请填写沟通事实。');return}if(s['学员状态']==='已结课'&&!confirm('该学员已结课，确认仍要记录沟通吗？'))return;if(frequency(s['学员化名']).dense&&!confirm('近期沟通较密，建议合并成一条再发。点击确定表示“仍保存草稿”。'))return;const scene=$('composeForm_scene').value;const values={'学员化名':s['学员化名'],'沟通时间':$('composeForm_time').value.replace('T',' ').slice(0,16),'沟通场景':scene,'沟通渠道':$('composeForm_channel').value,'沟通事实':facts,'发送状态':scene==='阶段报告'?'已发送':$('composeForm_status').value};state.polling=true;state.draft='';renderDraft();try{await callAppBridge({type:'SubmitRecord',data:'家长沟通记录',payload:JSON.stringify(values)});state.currentRow=1;const refreshing=refreshAll();await pollDraft(1,scene);await refreshing}catch(err){state.polling=false;renderDraft();showToast(t('failed'))}}
async function pollDraft(row,scene){for(let i=0;i<20;i++){await new Promise(r=>setTimeout(r,2000));try{const value=await cell(RECORD_SOURCE,'沟通草稿',row);if(String(value).trim()){state.draft=String(value);state.polling=false;renderDraft();return}}catch(err){/* Retry the next read. */}}state.polling=false;renderDraft();$('draftContent').innerHTML=`<div class="notice warn">${e(scene==='阶段报告'?'记录已保存，稍后可在台账查看。':'草稿暂未生成，稍后可在台账查看。')}</div><button class="btn" id="pollRetry">${e(t('reread'))}</button>`}
async function rereadDraft(){if(!state.currentRow)return;try{const value=await cell(RECORD_SOURCE,'沟通草稿',state.currentRow);state.draft=String(value||'');renderDraft();if(!state.draft)showToast('草稿尚未生成，请稍后再读取。')}catch(err){showToast(t('failed'))}}
function plainDraft(value){if(!window.marked||!window.DOMPurify)return String(value);const box=document.createElement('div');box.innerHTML=DOMPurify.sanitize(marked.parse(String(value)),{USE_PROFILES:{html:true}});return box.innerText||box.textContent||String(value)}
async function copyText(value){if(!value){showToast('草稿尚未生成，请稍后重新读取。');return}try{await navigator.clipboard.writeText(plainDraft(value));showToast('已复制，请到你常用的渠道自行发送')}catch(err){showToast('复制失败，请手动选择草稿文本。')}}
async function markStatus(row,status,source='compose'){if(!row)return;if(status==='待发送'){let scene=await cell(RECORD_SOURCE,'沟通场景',row);if(scene==='阶段报告'){showToast('阶段报告不能改回待发送。');return}}try{await setCell(RECORD_SOURCE,'发送状态',row,status);await refreshAll();showToast('状态已更新；应用不会代你发送。')}catch(err){showToast(t('failed'))}}
async function recordDetail(row){try{const r=await fullRecord(RECORD_SOURCE,RECORD_FIELDS,row);const draft=await cell(RECORD_SOURCE,'沟通草稿',row);const s=student(r['学员化名']);let body=(s&&s['家长沟通授权']!=='是'?'<div class="notice block">授权已关闭，请勿再发</div>':'')+`<dl class="detail-grid">${RECORD_FIELDS.map(f=>`<dt>${e(f)}</dt><dd>${e(r[f])}</dd>`).join('')}</dl><h3>沟通草稿</h3><div class="markdown-body">${draft?markdown(draft):'<p class="muted">草稿尚未生成</p>'}</div>`;openDialog(r['学员化名']+' · '+r['沟通时间'],body,`<button class="btn" data-action="close-dialog">${e(t('close'))}</button><button class="btn" data-action="record-edit" data-row="${row}">${e(t('edit'))}</button>`,'preview');state.dialogRow=row;const count=Number(await callAppBridge({type:'GetRecordCount',data:RECORD_SOURCE}));$('dialogNav').innerHTML=`<button class="btn sm" data-action="detail-prev" ${row<=1?'disabled':''} aria-label="Previous"><i class="fa-solid fa-chevron-left"></i></button><button class="btn sm" data-action="detail-next" ${row>=count?'disabled':''} aria-label="Next"><i class="fa-solid fa-chevron-right"></i></button>`}catch(err){showToast(t('failed'))}}
async function recordForm(row){let r;try{r=await fullRecord(RECORD_SOURCE,RECORD_FIELDS,row)}catch(err){showToast(t('failed'));return}const id='recordForm';let body=`<p class="muted small">事实已更新后，旧草稿不会自动重写。</p><form id="${id}" class="form-grid">`;body+=fieldControl(id,'学员化名',r['学员化名'],[...new Set([r['学员化名'],...state.students.map(s=>s['学员化名'])])]);body+=fieldControl(id,'沟通时间',r['沟通时间']);body+=fieldControl(id,'沟通场景',r['沟通场景'],SCENES);body+=fieldControl(id,'沟通渠道',r['沟通渠道'],CHANNELS);body+=`<label class="wide"><span>沟通事实</span><textarea id="${id}_facts" name="沟通事实" required>${e(r['沟通事实'])}</textarea></label>`;body+=fieldControl(id,'发送状态',r['发送状态'],SEND_STATUSES);body+='</form>';openDialog('编辑沟通记录',body,`<button class="btn" data-action="close-dialog">${e(t('cancel'))}</button><button class="btn primary" data-action="save-record">${e(t('save'))}</button>`);state.dialogRow=row;state.editScene=r['沟通场景']}
async function saveRecord(){const form=$('recordForm');if(!form.reportValidity())return;const values=Object.fromEntries(new FormData(form).entries());if(values['沟通渠道']==='群公告'){showToast('具体学员反馈仅限私聊，不能选择群公告。');return}if(state.editScene==='阶段报告'&&values['发送状态']==='待发送'){showToast('阶段报告不能改回待发送。');return}if(!values['沟通事实'].trim()){showToast('请填写沟通事实。');return}try{for(const field of RECORD_FIELDS)await setCell(RECORD_SOURCE,field,state.dialogRow,values[field]);closeDialog();await refreshAll();showToast('事实已更新，旧草稿不会自动重写')}catch(err){showToast(t('failed'))}}
async function deleteRecord(row){if(!confirm('确认删除这条沟通记录吗？'))return;try{await callAppBridge({type:'DeleteRecord',data:RECORD_SOURCE,payload:row.toString()});await refreshAll()}catch(err){showToast(t('failed'))}}
async function copyRecord(row){try{const value=await cell(RECORD_SOURCE,'沟通草稿',row);if(!String(value).trim()){openDialog('草稿尚未生成',`<p>请稍后重新读取。</p>`,`<button class="btn" data-action="record-copy" data-row="${row}">${e(t('reread'))}</button>`);return}await copyText(String(value))}catch(err){showToast(t('failed'))}}
function handleAction(action,el){const row=Number(el.dataset.row);if(action==='retry-students')fetchStudents();else if(action==='retry-records')fetchRecords();else if(action==='student-new')studentForm();else if(action==='student-detail')studentDetail(row);else if(action==='student-edit')studentForm(row);else if(action==='student-delete')deleteStudent(row);else if(action==='go-draft'){const s=state.students.find(x=>x.row===row);if(s){nav('compose');pickStudent(s['学员化名'])}}else if(action==='pick-student')pickStudent(el.dataset.name);else if(action==='record-detail')recordDetail(row);else if(action==='record-edit')recordForm(row);else if(action==='record-delete')deleteRecord(row);else if(action==='record-copy')copyRecord(row);else if(action==='record-sent')markStatus(row,'已发送','ledger');else if(action==='detail-prev')recordDetail(state.dialogRow-1);else if(action==='detail-next')recordDetail(state.dialogRow+1);else if(action==='save-student')saveStudent();else if(action==='save-record')saveRecord();else if(action==='close-dialog')closeDialog();else if(action==='new-record'){resetCompose();nav('compose')}else if(action==='stat'){const page=el.dataset.pageTarget,filter=el.dataset.filter;$('studentStatus').value='';$('studentAuth').value='';$('ledgerStatus').value='';$('ledgerList').dataset.dense=filter==='dense'?'1':'0';if(filter==='active')$('studentStatus').value='在读';if(filter==='authorized'){$('studentStatus').value='在读';$('studentAuth').value='是'}if(filter==='pending')$('ledgerStatus').value='待发送';nav(page)}}
async function initialize(){let lang;const saved=localStorage.getItem('iThinkAir_UiLanguage');const param=new URLSearchParams(location.search).get('lang');if(saved)lang=saved==='en'?'en':'cn';else if(param==='cn'||param==='en')lang=param;else lang=!navigator.languages||!navigator.languages.length?'cn':navigator.languages.some(x=>/^zh(?:-|$)/i.test(x))?'cn':'en';try{state.mode=await callAppBridge({type:'模式'});document.body.classList.toggle('dark',String(state.mode).trim()==='暗色')}catch(err){}for(const [id,options] of [['composeForm_scene',SCENES],['composeForm_channel',CHANNELS],['composeForm_status',SEND_STATUSES]])$(id).innerHTML=options.map(o=>`<option value="${e(o)}">${e(o)}</option>`).join('');resetCompose();setLanguage(lang);await refreshAll()}
document.addEventListener('click',ev=>{const menu=ev.target.closest('[data-page]');if(menu){nav(menu.dataset.page);return}const action=ev.target.closest('[data-action]');if(action){ev.stopPropagation();handleAction(action.dataset.action,action);return}if(!$('mobileMenu').classList.contains('hidden')&&!ev.target.closest('#mobileMenu')&&!ev.target.closest('#hamburger'))closeMenu();if(ev.target===$('overlay'))closeDialog()});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){if(!$('overlay').classList.contains('hidden'))closeDialog();else closeMenu()}if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('[data-action][tabindex]')){ev.preventDefault();handleAction(ev.target.dataset.action,ev.target)}});
['studentSearch','studentStage','studentStatus','studentAuth'].forEach(id=>$(id).addEventListener('input',renderStudents));['ledgerSearch','ledgerScene','ledgerChannel','ledgerStatus','ledgerStage'].forEach(id=>$(id).addEventListener('input',()=>{$('ledgerList').dataset.dense='0';renderLedger()}));$('hamburger').addEventListener('click',()=>{const hidden=$('mobileMenu').classList.toggle('hidden');$('hamburger').setAttribute('aria-expanded',String(!hidden))});$('langBtn').addEventListener('click',toggleLanguage);$('mobileLang').addEventListener('click',toggleLanguage);$('brand').addEventListener('click',()=>{try{parent.closeFullHtml(false)}catch(err){}});$('homeAdd').addEventListener('click',()=>{nav('students');studentForm()});$('addStudent').addEventListener('click',()=>studentForm());$('homeCompose').addEventListener('click',()=>{resetCompose();nav('compose')});$('newCommunication').addEventListener('click',()=>{resetCompose();nav('compose')});$('composeForm').addEventListener('submit',composeSubmit);$('composeForm_student').addEventListener('change',ev=>pickStudent(ev.target.value));$('composeForm_channel').addEventListener('change',renderPermission);$('composeForm_scene').addEventListener('change',()=>{const report=$('composeForm_scene').value==='阶段报告';$('composeForm_status').value=report?'已发送':$('composeForm_status').value;$('composeForm_status').disabled=report;renderPermission();renderDraft()});$('copyDraft').addEventListener('click',()=>copyText(state.draft));$('rereadDraft').addEventListener('click',rereadDraft);$('clearDraft').addEventListener('click',resetCompose);document.querySelectorAll('[data-mark]').forEach(b=>b.addEventListener('click',()=>markStatus(state.currentRow,b.dataset.mark)));$('draftContent').addEventListener('click',ev=>{if(ev.target.id==='pollRetry')rereadDraft()});$('closeDialog').addEventListener('click',closeDialog);
document.addEventListener('focusin',ev=>{if(!ev.target.matches('input,textarea,select'))return;setTimeout(()=>ev.target.scrollIntoView({block:'center',behavior:'smooth'}),250)});if(window.visualViewport)visualViewport.addEventListener('resize',()=>{const active=document.activeElement;if(active&&active.matches('input,textarea,select'))setTimeout(()=>active.scrollIntoView({block:'center',behavior:'smooth'}),100)});
window.addEventListener('resize',updateNav);
document.addEventListener('DOMContentLoaded',()=>{(async () => { await initialize(); })();});
</script>
