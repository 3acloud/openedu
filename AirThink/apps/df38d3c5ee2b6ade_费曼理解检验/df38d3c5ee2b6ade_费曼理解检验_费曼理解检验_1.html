<script>
        // 统一通信接口medium

        function unescapeString(str) {
          return str.replace(/\\x[0-9A-Fa-f]{2}|\\[nrt'"\\]/g, function(match) {
            if (match.startsWith('\\x')) {
              // 处理十六进制序列（例如 \x0A）
              const hex = match.substring(2);
              const charCode = parseInt(hex, 16);
              return String.fromCharCode(charCode);
            } else {
              // 处理其他转义序列
              switch (match) {
                case '\\n': return '\n';
                case '\\r': return '\r';
                case '\\t': return '\t';
                case '\\\'': return '\'';
                case '\\"': return '"';
                case '\\\\': return '\\';
                default: return match; // 理论上不会发生，但保留以容错
              }
            }
          });
        }

        function localAppBridge(request) {
            // request是json文本如 {type:"表格", data:"数据源", payload:""} 或者 {type:"提交", data:"表", payload:"表单数据"}
            // 确保全局回调存储对象存在
            if (!window.__appBridgeCallbacks) window.__appBridgeCallbacks = {};
            
            // 注册全局响应接收函数（仅注册一次）
            if (!window.__receiveAppResponse) {
                window.__receiveAppResponse = function(eventId, response) {
                    response = unescapeString(response);
                    if (window.__appBridgeCallbacks[eventId]) {
                        const { resolve, timeoutId } = window.__appBridgeCallbacks[eventId];
                        clearTimeout(timeoutId);  // 清除超时计时器
                        resolve(response);
                        delete window.__appBridgeCallbacks[eventId];
                    }
                };
            }

            const requestStr = (typeof request === 'string') ? request : JSON.stringify(request);
            
            return new Promise((resolve, reject) => {
                // 1. Android实现（同步）
                if (window.AndroidBridge) {
                    try {
                        let response = window.AndroidBridge.processRequest(requestStr);
                        response = unescapeString(response);
                        resolve(response);
                    } catch (e) {
                        reject(`Android通信错误: ${e.message}`);
                    }
                }
                // 2. iOS实现（异步回调）
                else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) {
                    try {
          const eventId = "event_" + Date.now() + Math.random().toString(36).substr(2, 5);

          // 存储resolve并设置超时
          const timeoutId = setTimeout(() => {
            if (window.__appBridgeCallbacks[eventId]) {
              delete window.__appBridgeCallbacks[eventId];
              reject("iOS响应超时");
            }
          }, 600000);

          window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };

          const message = {
              eventId: eventId,
              request: requestStr,
          };
          window.webkit.messageHandlers.iosBridge.postMessage(JSON.stringify(message));
                    } catch (e) {
                        reject(`iOS通信错误: ${e.message}`);
                    }
                }
                // 3. Windows WebView2实现（异步回调）
                else if (window.chrome && window.chrome.webview) {
                    try {
                        const eventId = 'event_' + Date.now() + Math.random().toString(36).substr(2, 5);

                        // 存储resolve并设置超时
                        const timeoutId = setTimeout(() => {
                            if (window.__appBridgeCallbacks[eventId]) {
                                delete window.__appBridgeCallbacks[eventId];
                                reject('Windows响应超时');
                            }
                        }, 600000);
                        
                        window.__appBridgeCallbacks[eventId] = { resolve, timeoutId };
                        
                        window.chrome.webview.postMessage(JSON.stringify({
                            eventId: eventId,
                            request: requestStr
                        }));
                    } catch (e) {
                        reject(`Windows通信错误: ${e.message}`);
                    }
                }
            });
        }

    function base64StringToFile(base64String, filename, mimeType = 'application/octet-stream') {
      // 去掉可能存在的 base64 前缀（如 "data:image/png;base64,"）
      const rawBase64 = base64String.includes(',') 
        ? base64String.split(',')[1] 
        : base64String;

      // 解码 Base64 为二进制字符串
      const binaryString = atob(rawBase64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      // 创建 Blob，再转为 File
      const blob = new Blob([bytes], { type: mimeType });
      return new File([blob], filename, { type: mimeType });
    }



    async function callAppBridge(request)
    {
        if (window.AndroidBridge || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.iosBridge) || (window.chrome && window.chrome.webview))
        {
          if (request['type'] === "CapturePhoto" || request['type'] === "FinishRecordVoice")
          {
            const filename = await localAppBridge(request);
            if (filename != "")
            {
              const b64 = await localAppBridge({type:"FileToBase64", data:filename});
              const file = base64StringToFile(b64, filename);

              // 2. 上传文件到Flask服务端
              const guidFileName = await uploadToFlaskA(file);
    
              // 3. 返回GUID文件名
              return guidFileName;
            }
            return "";
          }
          if (request['type'] === "StartRecordVoice" || request['type'] === "PauseRecordVoice" || request['type'] === "ContinueRecordVoice" || request['type'] === "CancelRecordVoice")
          {
            await localAppBridge(request);
            return "";
          }
        }

        if (request['type'] === "ExportFile")
        {
          exportFileA(request['data'], 'http://' + window.location.hostname + ':3130/download/' + request['payload']);
          return "";
        }
        if (request['type'] === "StartRecordVoice")
        {
          await StartRecordVoiceA();
          return "";
        }
        if (request['type'] === "PauseRecordVoice")
        {
          await PauseRecordVoiceA();
          return "";
        }
        if (request['type'] === "ContinueRecordVoice")
        {
          await ContinueRecordVoiceA();
          return "";
        }
        if (request['type'] === "CancelRecordVoice")
        {
          await CancelRecordVoiceA();
          return "";
        }
        // 定义类型到对应处理函数的映射
        const HANDLERS = {
          "SelectFile": selectFileA,
          "SelectImage": selectImageA,
          "CapturePhoto": capturePhotoA,
          "FinishRecordVoice": FinishRecordVoiceA
        };

        // 检查请求类型是否在支持的映射中
        if (request['type'] in HANDLERS) {
          try {
            // 1. 根据类型选择相应的处理函数获取文件
            const file = await HANDLERS[request['type']]();
    
            // 2. 上传文件到Flask服务端
            const guidFileName = await uploadToFlaskA(file);
    
            // 3. 返回GUID文件名
            return guidFileName;
          } catch (error) {
            // 可以在这里添加错误处理逻辑，如日志记录
            console.error(`处理${request['type']}时出错:`, error);
          }
  
          // 所有失败情况返回空字符串
          return "";
        }



        url = 'http://' + window.location.hostname + ':3130/request';
        const response = await fetch(url, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'SessionID': localStorage.getItem('airthink_session_id'),
            'BaseName': encodeURIComponent("df38d3c5ee2b6ade_费曼理解检验")
        },
        body: JSON.stringify(request)
        });
  
        if (!response.ok) {
            throw new Error(`请求失败: ${response.status}`);
        }
  
        return await response.text();
    }

async function exportFileA(title, url) {
  try {
    // 1. 获取文件内容 (需要服务器支持跨域 CORS)
    const response = await fetch(url);
    if (!response.ok) {
      throw new Error(`下载失败: ${response.statusText}`);
    }
    const blob = await response.blob();

    // 2. 尝试使用 File System Access API (Chrome/Edge 等现代浏览器支持)
    // 这允许程序明确请求“另存为”对话框
    if ('showSaveFilePicker' in window) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: title,
          types: [{
            description: 'File',
            accept: {
              // 根据 blob 类型动态推断 MIME，或者直接使用通用流
              [blob.type || 'application/octet-stream']: [] 
            }
          }]
        });
        
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return; // 保存成功，退出函数
      } catch (err) {
        // 如果用户在弹窗中点击了“取消”，或者API报错，则进入降级方案
        if (err.name === 'AbortError') return; 
        console.warn('File System Access API 失败，尝试降级方案:', err);
      }
    }

    // 3. 降级方案：使用 <a> 标签下载
    // 是否弹出选择框取决于用户的浏览器设置 ("下载前询问每个文件的保存位置")
    const objectUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = objectUrl;
    link.download = title;
    link.style.display = 'none';
    
    document.body.appendChild(link);
    link.click();
    
    // 清理
    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(objectUrl);
    }, 100);

  } catch (error) {
    console.error('导出文件出错:', error);
    alert('导出失败: ' + error.message);
  }
}

/**
 * 全局录音状态管理
 */
const VoiceRecorderState = {
  mediaRecorder: null,
  stream: null,
  audioChunks: [],
  lamejsUrl: 'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js', // lamejs CDN地址
  audioContext: null
};

/**
 * 动态加载 lamejs 库
 */
function loadLamejs() {
  return new Promise((resolve, reject) => {
    if (window.lamejs) {
      resolve(window.lamejs);
      return;
    }
    const script = document.createElement('script');
    script.src = VoiceRecorderState.lamejsUrl;
    script.onload = () => resolve(window.lamejs);
    script.onerror = () => reject(new Error('无法加载 lamejs 库'));
    document.body.appendChild(script);
  });
}

/**
 * 开始录音
 */
async function StartRecordVoiceA() {
  // 1. 预加载 lamejs，确保结束时可用
  await loadLamejs();

  // 2. 清理旧状态
  VoiceRecorderState.audioChunks = [];
  
  // 3. 获取麦克风权限
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    VoiceRecorderState.stream = stream;
    
    // 4. 初始化 MediaRecorder
    // 即使浏览器默认录制为 WebM/Ogg，我们后续也会通过 AudioContext 转码
    const recorder = new MediaRecorder(stream);
    VoiceRecorderState.mediaRecorder = recorder;

    recorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        VoiceRecorderState.audioChunks.push(event.data);
      }
    };

    recorder.start();
    console.log("录音开始");
    
  } catch (err) {
    console.error("无法启动录音:", err);
    throw new Error("无法访问麦克风或启动录音失败");
  }
}

/**
 * 暂停录音
 */
function PauseRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'recording') {
    VoiceRecorderState.mediaRecorder.pause();
    console.log("录音暂停");
  }
}

/**
 * 继续录音
 */
function ContinueRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder && VoiceRecorderState.mediaRecorder.state === 'paused') {
    VoiceRecorderState.mediaRecorder.resume();
    console.log("录音继续");
  }
}

/**
 * 取消录音 (清理资源，不返回文件)
 */
function CancelRecordVoiceA() {
  if (VoiceRecorderState.mediaRecorder) {
    // 停止录制
    if (VoiceRecorderState.mediaRecorder.state !== 'inactive') {
      VoiceRecorderState.mediaRecorder.stop();
    }
    VoiceRecorderState.mediaRecorder = null;
  }
  
  // 关闭流（关闭麦克风图标）
  if (VoiceRecorderState.stream) {
    VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
    VoiceRecorderState.stream = null;
  }
  
  // 清空数据
  VoiceRecorderState.audioChunks = [];
  console.log("录音已取消");
}

/**
 * 完成录音并返回 MP3 文件
 * @returns {Promise<File>} 返回一个 MP3 格式的 File 对象
 */
function FinishRecordVoiceA() {
  return new Promise((resolve, reject) => {
    const recorder = VoiceRecorderState.mediaRecorder;
    
    if (!recorder) {
      reject(new Error("未找到正在进行的录音"));
      return;
    }

    // 定义停止后的处理逻辑
    recorder.onstop = async () => {
      try {
        // 1. 停止所有轨道 (关闭麦克风)
        if (VoiceRecorderState.stream) {
          VoiceRecorderState.stream.getTracks().forEach(track => track.stop());
          VoiceRecorderState.stream = null;
        }

        // 2. 将录制的块组合成一个 Blob (通常是 webm 或 ogg 格式)
        const originalBlob = new Blob(VoiceRecorderState.audioChunks, { type: recorder.mimeType });
        
        // 3. 转码为 MP3
        const mp3File = await convertBlobToMp3(originalBlob);
        
        // 4. 清理
        VoiceRecorderState.audioChunks = [];
        VoiceRecorderState.mediaRecorder = null;
        
        resolve(mp3File);
      } catch (error) {
        reject(error);
      }
    };

    // 触发停止，进入 onstop 回调
    if (recorder.state !== 'inactive') {
      recorder.stop();
    } else {
      // 如果已经停止了（以此防守），手动触发 onstop 逻辑
      recorder.onstop();
    }
  });
}

/**
 * 内部辅助函数：将任意音频 Blob 转换为 MP3 File
 */
async function convertBlobToMp3(blob) {
  // 1. 读取 Blob 为 ArrayBuffer
  const arrayBuffer = await blob.arrayBuffer();
  
  // 2. 使用 AudioContext 解码音频 (将 WebM/Ogg 解码为 PCM 数据)
  if (!VoiceRecorderState.audioContext) {
    VoiceRecorderState.audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  const audioBuffer = await VoiceRecorderState.audioContext.decodeAudioData(arrayBuffer);
  
  // 3. 准备 lamejs 编码器
  const channels = 1; // 强制转为单声道，适合语音，且减小体积
  const sampleRate = audioBuffer.sampleRate;
  const kbps = 128;
  
  const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
  
  // 4. 获取 PCM 数据并转换 (Float32 -> Int16)
  // 获取第一个声道的数据（如果是立体声，语音通常取单声道即可）
  const samples = audioBuffer.getChannelData(0);
  const sampleBlockSize = 1152; // lamejs 建议的块大小
  const mp3Data = [];
  
  // 转换 Float32 (-1.0 到 1.0) 为 Int16 (-32768 到 32767)
  const samplesInt16 = new Int16Array(samples.length);
  for (let i = 0; i < samples.length; i++) {
    // 简单的线性转换和钳位
    let s = Math.max(-1, Math.min(1, samples[i]));
    samplesInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  
  // 5. 编码循环
  for (let i = 0; i < samplesInt16.length; i += sampleBlockSize) {
    const chunk = samplesInt16.subarray(i, i + sampleBlockSize);
    const mp3buf = mp3encoder.encodeBuffer(chunk);
    if (mp3buf.length > 0) {
      mp3Data.push(mp3buf);
    }
  }
  
  // 6. 结束编码
  const mp3buf = mp3encoder.flush();
  if (mp3buf.length > 0) {
    mp3Data.push(mp3buf);
  }
  
  // 7. 生成文件
  const timestamp = new Date().getTime();
  const filename = `voice_record_${timestamp}.mp3`;
  const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
  
  // 返回 File 对象
  return new File([mp3Blob], filename, { type: 'audio/mp3', lastModified: new Date().getTime() });
}

/**
 * 选择文件函数
 * @returns {Promise<File>}
 */
function selectFileA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function selectImageA() {
  return new Promise((resolve, reject) => {
    // 创建隐藏的文件输入元素
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*'; // 限制只选择图片文件
    fileInput.style.display = 'none';
    
    // 监听文件选择
    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        // 可选：进一步验证文件确实是图片
        if (!file.type.startsWith('image/')) {
          reject(new Error('选择的文件不是图片'));
          return;
        }
        resolve(file);
      } else {
        reject(new Error('没有选择文件'));
      }
      
      // 清理DOM
      document.body.removeChild(fileInput);
    });
    
    // 监听取消选择（注意：cancel事件在某些浏览器中可能不支持）
    fileInput.addEventListener('cancel', () => {
      reject(new Error('用户取消了文件选择'));
      document.body.removeChild(fileInput);
    });
    
    // 添加到DOM并触发点击
    document.body.appendChild(fileInput);
    fileInput.click();
  });
}

function capturePhotoA() {
  return new Promise((resolve, reject) => {
    // 检查浏览器是否支持媒体设备API
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {

    canvas.style.display = 'none';
    const ctx = canvas.getContext('2d');
    
    // 创建拍照按钮和取消按钮的容器
    const container = document.createElement('div');
    container.style.cssText = `
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    `;
    
    // 创建视频预览容器
    const videoContainer = document.createElement('div');
    videoContainer.style.cssText = `
      width: 100%;
      max-width: 640px;
      max-height: 70vh;
      overflow: hidden;
      border-radius: 8px;
      margin-bottom: 20px;
    `;
    
    // 将视频放入容器中
    video.style.cssText = `
      width: 100%;
      height: auto;
      transform: scaleX(-1); /* 镜像翻转，让预览更自然 */
    `;
    
    // 创建按钮容器
    const buttonContainer = document.createElement('div');
    buttonContainer.style.cssText = `
      display: flex;
      gap: 20px;
    `;
    
    // 创建拍照按钮
    const captureBtn = document.createElement('button');
    captureBtn.textContent = '拍照';
    captureBtn.style.cssText = `
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 创建取消按钮
    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = '取消';
    cancelBtn.style.cssText = `
      padding: 12px 24px;
      background: #FF3B30;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
    `;
    
    // 组装元素
    videoContainer.appendChild(video);
    buttonContainer.appendChild(captureBtn);
    buttonContainer.appendChild(cancelBtn);
    container.appendChild(videoContainer);
    container.appendChild(buttonContainer);
    document.body.appendChild(container);
    document.body.appendChild(canvas);
    
    // 请求摄像头访问权限
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment', // 使用后置摄像头，如需前置摄像头改为'user'
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    })
    .then(stream => {
      // 将视频流连接到video元素
      video.srcObject = stream;
      
      // 等待视频元数据加载
      video.onloadedmetadata = () => {
        // 设置canvas尺寸与视频一致
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        // 开始播放视频
        video.play().catch(e => {
          reject(new Error('无法启动摄像头: ' + e.message));
          cleanup();
        });
      };
    })
    .catch(error => {
      reject(new Error('无法访问摄像头: ' + error.message));
      cleanup();
    });
    
    // 拍照功能
    captureBtn.onclick = () => {
      // 绘制当前视频帧到canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      // 将canvas转换为Blob对象（图片文件）
      canvas.toBlob(blob => {
        if (blob) {
          // 创建File对象，类似于文件上传的文件
          const file = new File([blob], `photo_${Date.now()}.jpg`, {
            type: 'image/jpeg'
          });
          
          // 清理并返回文件
          cleanup();
          resolve(file);
        } else {
          reject(new Error('拍照失败'));
          cleanup();
        }
      }, 'image/jpeg', 0.9); // 0.9是JPEG质量参数
    };
    
    // 取消功能
    cancelBtn.onclick = () => {
      reject(new Error('用户取消了拍照'));
      cleanup();
    };
    
    // 清理函数
    const cleanup = () => {
      // 停止所有视频流
      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach(track => track.stop());
      }
      
      // 移除DOM元素
      if (container.parentNode) {
        document.body.removeChild(container);
      }
      if (canvas.parentNode) {
        document.body.removeChild(canvas);
      }
    };
    
    // 监听页面离开，确保清理资源
    window.addEventListener('beforeunload', cleanup);
  });
}

        // 更健壮的CSV解析器，能处理字段内逗号和换行符
        function parseCSV(csvText) {
            const rows = [];
            let currentRow = [];
            let currentField = '';
            let inQuotes = false;
            let i = 0;

            while (i < csvText.length) {
                const char = csvText[i];
                
                if (inQuotes) {
                    if (char === '"') {
                        // 检查下一个字符是否是双引号（转义）
                        if (i + 1 < csvText.length && csvText[i + 1] === '"') {
                            currentField += '"';
                            i += 2; // 跳过两个双引号
                        } else {
                            // 结束引号
                            inQuotes = false;
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                        i++;
                    } else if (char === ',') {
                        // 字段结束
                        currentRow.push(currentField);
                        currentField = '';
                        i++;
                    } else if (char === '\r' || char === '\n') {
                        // 处理换行符
                        if (char === '\r' && i + 1 < csvText.length && csvText[i + 1] === '\n') {
                            // 处理 \r\n
                            i++;
                        }
                        
                        // 行结束
                        currentRow.push(currentField);
                        currentField = '';
                        rows.push(currentRow);
                        currentRow = [];
                        i++;
                        
                        // 跳过连续换行符
                        while (i < csvText.length && (csvText[i] === '\r' || csvText[i] === '\n')) {
                            i++;
                        }
                    } else {
                        currentField += char;
                        i++;
                    }
                }
            }

            // 处理最后一行
            if (currentField !== '' || currentRow.length > 0) {
                currentRow.push(currentField);
                rows.push(currentRow);
            }

            return rows;
        }

const copy={cn:{app:'费曼理解检验',home:'首页',check:'开始检验',archive:'检验档案',eyebrow:'深夜书房 · 讲解笔记',homeDesc:'用自己的话讲清楚，才知道自己卡在哪里。导师会按学段追问；证据不够时只问最关键的一个问题，证据够了才给出掌握情况和下一步。',startOnce:'开始一次检验',total:'累计检验',primaryCount:'小学检验',secondaryCount:'中学检验',recent:'最近讲解',newFirst:'新的检验排在最前',footerNote:'若讲解里带着明显的挫败，导师会放慢追问。',checkDesc:'先选学段，再写下你自己的讲解。提交后请停留在本页，等导师笺写完。',newCheck:'新的检验',seeArchive:'看检验档案',notebook:'我的讲解本',step1:'1 选学段',step2:'2 自己讲',step3:'3 看追问',stage:'学段',topic:'知识点',explanation:'我的讲解',characters:'字',ownWords:'请用自己的话，不要粘贴现成答案。若导师觉得像引用，会请你脱离原话再讲一次。',mentor:'导师笺',previous:'上一则导师笺',retry:'针对追问，再讲一次',edit:'编辑这条',delete:'删除这条',archiveDesc:'回看自己讲过的知识点。点卡片查看导师笺，而不是另开只读页。',newCheckPlus:'+ 新的检验',search:'搜索知识点或讲解',filter:'筛选学段',showMore:'查看更多',all:'全部学段',view:'查看',again:'再讲一次',row:'原始行号',emptyRecent:'还没有讲解，先去讲一个你正在学的知识点',emptyArchive:'没有符合的讲解',emptyFeedback:'把你的讲解交给导师。证据不够时，这里会出现一个追问；证据够了，才会看到掌握度和下一步。',noFeedback:'这条还没有反馈',waiting:'导师正在对照你的讲解找盲区...',timeout:'反馈还在生成，可稍后在检验档案打开第 1 条查看。',pending:'反馈生成中或尚未查看',submit:'请帮我检验',save:'保存修改',saved:'讲解已改，但检验反馈不会因此重算；要新的追问请用「针对追问，再讲一次」。',deleteConfirm:'删除后不能恢复。确定删除吗？',leaveConfirm:'讲解还没提交，确定离开吗？',failed:'操作失败，请稍后重试。',loadFailed:'加载失败，请稍后重试。',csvFailed:'列表解析失败，请稍后重试。',needInput:'请选择学段，并填写知识点和讲解。',deleted:'已删除。',noMarkdown:'Markdown 渲染器暂不可用。',stagePrimary:'适用步骤：自己的话、举例、说明原因、换个例子再用一次。证据不足时，导师只会留下当前最关键的一个追问。',stageSecondary:'适用步骤：自己的话、举例、说明原因、换个例子再用一次，并做批判性验证。证据不足时，导师只会留下当前最关键的一个追问。',stageUnset:'选择学段后，这里会出现讲解提示。',topicPlace:'例如「分数的意义」「光合作用」「牛顿第一定律」',p1:'像讲给同学听一样，说说它是什么，再举一个生活里的例子。',p2:'用自己的话讲清楚它是什么、为什么这样，并举一个例子。',p3:'先解释，再举例，说明原因，并试着换一个情境用一次。',p4:'除了解释、举例、原因和迁移，请想一想：这个说法在什么情况下会不成立？',r1:'用自己的话讲明白，并举一个生活例子',r2:'讲清楚是什么、为什么，再举一个例子',r3:'解释、举例、说原因，并换个情境用一次',r4:'在此之上，检查这个说法的边界和反例'},en:{app:'Feynman Understanding Check',home:'Home',check:'Start Check',archive:'Archive',eyebrow:'A late-night study notebook',homeDesc:'Explain an idea in your own words to find where you get stuck. The mentor asks for the most useful missing evidence, then shares mastery and next steps when there is enough.',startOnce:'Start a check',total:'Total checks',primaryCount:'Primary school',secondaryCount:'Secondary school',recent:'Recent explanations',newFirst:'Newest first',footerNote:'When an explanation shows frustration, the mentor slows down its questions.',checkDesc:'Choose a stage, then write your own explanation. Stay here after submitting while the mentor writes back.',newCheck:'New check',seeArchive:'View archive',notebook:'My notebook',step1:'1 Choose stage',step2:'2 Explain',step3:'3 Read question',stage:'Stage',topic:'Topic',explanation:'My explanation',characters:'characters',ownWords:'Use your own words. Avoid pasting a prepared answer. The mentor may ask you to explain it again without the original wording.',mentor:'Mentor note',previous:'Previous mentor note',retry:'Explain again',edit:'Edit this entry',delete:'Delete entry',archiveDesc:'Revisit the ideas you have explained. Open a card to read its mentor note.',newCheckPlus:'+ New check',search:'Search topic or explanation',filter:'Filter stage',showMore:'Show more',all:'All stages',view:'View',again:'Explain again',row:'Original row',emptyRecent:'No explanations yet. Start with an idea you are learning.',emptyArchive:'No matching explanations',emptyFeedback:'Give your explanation to the mentor. If evidence is thin, you will see one question. Once it is enough, you will see mastery and next steps.',noFeedback:'No feedback for this entry yet',waiting:'The mentor is checking your explanation for gaps...',timeout:'Feedback is still being generated. Open the first archive entry later.',pending:'Feedback pending or not viewed yet',submit:'Check my explanation',save:'Save changes',saved:'Explanation saved. Feedback will not be recalculated. Use “Explain again” for a new question.',deleteConfirm:'Deletion cannot be undone. Delete this entry?',leaveConfirm:'Your explanation has not been submitted. Leave this page?',failed:'Operation failed. Please try again.',loadFailed:'Unable to load. Please try again.',csvFailed:'Unable to parse the list. Please try again.',needInput:'Choose a stage and enter a topic and explanation.',deleted:'Deleted.',noMarkdown:'Markdown renderer unavailable.',stagePrimary:'Use your own words, give an example, explain why, and apply it to another example. With too little evidence, the mentor asks one key question.',stageSecondary:'Use your own words, give an example, explain why, apply it elsewhere, and test its limits. With too little evidence, the mentor asks one key question.',stageUnset:'Choose a stage to see a prompt.',topicPlace:'For example, fractions, photosynthesis, Newton’s first law',p1:'Explain it as if to a classmate, then give an everyday example.',p2:'Explain what it is and why in your own words, then give an example.',p3:'Explain, give an example, say why, and apply it in a new situation.',p4:'Explain, give examples and reasons, apply it elsewhere, then find a limit or counterexample.',r1:'Explain it clearly in your own words with an everyday example',r2:'Explain what and why, then give an example',r3:'Explain, illustrate, give reasons, and apply elsewhere',r4:'Also test its limits and counterexamples'}};
let language='cn',currentPage='home',currentRow=0,recordCount=0,records=[],visibleCount=12,mode='new',selectedStage='',busy=false,pollToken=0,loadToken=0,previousNote='',historyStack=[],currentScroll=0,archiveGroup='';
const $=id=>document.getElementById(id), t=key=>copy[language][key]||key;
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function short(s,n){s=String(s||'').trim();return [...s].slice(0,n).join('')+([...s].length>n?'…':'');}
function badgeClass(stage){return ({'小学中段':'primary','小学高段':'upper','初中':'middle','高中':'high'})[stage]||'primary';}
function stageLabel(stage){return language==='cn'?stage:({'小学中段':'Primary middle','小学高段':'Primary upper','初中':'Middle school','高中':'High school'})[stage]||stage;}
function emptyHtml(msg){return '<div class="empty"><i class="fa-regular fa-lightbulb" aria-hidden="true"></i><span>'+escapeHtml(msg)+'</span></div>';}
function message(id,msg,isError=false){const el=$(id);el.textContent=msg;el.className=isError?'error':'';}
function setLanguage(next){language=next;document.documentElement.lang=next==='cn'?'zh-CN':'en';localStorage.setItem('iThinkAir_UiLanguage',next);document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n)});$('desktopLang').textContent=next==='cn'?'EN':'中文';$('mobileLang').textContent=next==='cn'?'English':'中文';$('checkForm_topic').placeholder=t('topicPlace');$('archiveSearch').placeholder=t('search');renderStages();renderRibbons();renderTip();renderForm();renderHome();renderArchive();renderFeedback();}
function detectLanguage(){let chosen='cn';try{const langs=navigator.languages;if(Array.isArray(langs)&&langs.length)chosen=langs.some(v=>/^zh(?:-|$)/i.test(v))?'cn':'en';const urlLang=new URLSearchParams(location.search).get('lang');if(urlLang==='en'||urlLang==='cn')chosen=urlLang;const saved=localStorage.getItem('iThinkAir_UiLanguage');if(saved)chosen=saved==='en'?'en':'cn';}catch(e){}return chosen;}
function renderRibbons(){const descriptions=['r1','r2','r3','r4'];$('ribbons').innerHTML=STAGES.map((stage,i)=>'<button class="paper lift ribbon" type="button" data-stage="'+stage+'"><span class="badge '+badgeClass(stage)+'">'+escapeHtml(stageLabel(stage))+'</span><strong>'+escapeHtml(stageLabel(stage))+'</strong><span>'+escapeHtml(t(descriptions[i]))+'</span></button>').join('');}
function renderStages(){const editable=mode!=='view'&&!busy;$('stageGrid').innerHTML=STAGES.map(stage=>'<button type="button" class="stage-option '+(stage===selectedStage?'selected':'')+'" data-stage="'+stage+'" aria-pressed="'+(stage===selectedStage)+'" '+(editable?'':'disabled')+'>'+escapeHtml(stageLabel(stage))+'</button>').join('');$('checkForm_explanation').placeholder=selectedStage?t('p'+(STAGES.indexOf(selectedStage)+1)):'';}
function renderTip(){$('stageTip').textContent=t(!selectedStage?'stageUnset':STAGES.indexOf(selectedStage)<2?'stagePrimary':'stageSecondary');}
function renderForm(){renderStages();renderTip();const editable=mode!=='view'&&!busy;$('checkForm_topic').readOnly=!editable;$('checkForm_explanation').readOnly=!editable;$('primaryAction').style.display=mode==='view'?'none':'';$('primaryAction').textContent=mode==='edit'?t('save'):t('submit');$('primaryAction').disabled=busy||!selectedStage||!$('checkForm_topic').value.trim()||!$('checkForm_explanation').value.trim();$('feedbackActions').hidden=currentRow<1||mode!=='view'||busy;$('previousSummary').hidden=!previousNote;$('previousText').textContent=short(previousNote,120);$('charCount').textContent=[...$('checkForm_explanation').value].length;renderArrows();}
function renderArrows(){$('olderBtn').disabled=busy||mode==='new'||currentRow<=1;$('newerBtn').disabled=busy||mode==='new'||currentRow===0||currentRow>=recordCount;}
function setForm(stage='',topic='',explanation=''){selectedStage=STAGES.includes(stage)?stage:'';$('checkForm_topic').value=topic;$('checkForm_explanation').value=explanation;renderForm();}
function renderMarkdown(value){const body=$('feedbackBody');if(!value){body.innerHTML=emptyHtml(currentRow?t('noFeedback'):t('emptyFeedback'));return;}if(!window.marked||!window.DOMPurify){body.innerHTML='<p class="error">'+escapeHtml(t('noMarkdown'))+'</p>';return;}const renderer=new marked.Renderer();renderer.image=function(token){const src=typeof token==='string'?token:token.href;const title=typeof token==='object'?token.title:'';const alt=typeof token==='object'?token.text:'';const safeSrc=String(src||'').startsWith('http://' + window.location.hostname + ':3130/download/')?String(src):'http://' + window.location.hostname + ':3130/download/'+encodeURIComponent(String(src||''));return '<a href="'+escapeHtml(safeSrc)+'" download target="_blank" rel="noopener"><img src="'+escapeHtml(safeSrc)+'" alt="'+escapeHtml(alt)+'" title="'+escapeHtml(title||'')+'"></a>';};const html=marked.parse(value,{gfm:true,breaks:true,renderer});body.innerHTML='<article class="markdown-body">'+DOMPurify.sanitize(html)+'</article>';body.querySelectorAll('a').forEach(a=>{if(!a.hasAttribute('download')){a.target='_blank';a.rel='noopener noreferrer';}});}
let feedbackValue='';function renderFeedback(){renderMarkdown(feedbackValue);}
function validateCSV(text){let inQuotes=false,atStart=true,afterQuote=false;for(let i=0;i<text.length;i++){const ch=text[i];if(inQuotes){if(ch==='"'){if(text[i+1]==='"')i++;else{inQuotes=false;afterQuote=true;}}}else if(afterQuote){if(ch===','||ch==='\r'||ch==='\n'){afterQuote=false;atStart=true;}else throw new Error('CSV format');}else if(ch==='"'){if(!atStart)throw new Error('CSV format');inQuotes=true;atStart=false;}else if(ch===','||ch==='\r'||ch==='\n')atStart=true;else atStart=false;}if(inQuotes)throw new Error('CSV format');}
function normalizeRows(csv){if(!String(csv||'').trim())return [];validateCSV(String(csv));const rows=parseCSV(String(csv));if(rows.some(row=>row.length!==3))throw new Error('CSV column count');return rows.map((row,i)=>({row:i+1,stage:row[0],topic:row[1],explanation:row[2]}));}
async function fetchRecords(){const csv=await callAppBridge({type:'GetTableCSV',data:SOURCE,payload:FIELDS});records=normalizeRows(csv);return records;}
async function refreshCount(){const count=await callAppBridge({type:'GetRecordCount',data:SOURCE});const n=Number(count);if(!Number.isFinite(n)||n<0)throw new Error('Invalid count');recordCount=n;renderArrows();}
function recordCard(record,recent=false){const summary=recent?'<div class="meta">'+escapeHtml(record.feedbackSummary||t('pending'))+'</div>':'';const buttons=recent?'':'<div class="record-actions"><button class="btn btn-quiet" type="button" data-action="view">'+escapeHtml(t('view'))+'</button><button class="btn btn-quiet" type="button" data-action="edit">'+escapeHtml(t('edit'))+'</button><button class="btn btn-outline" type="button" data-action="retry">'+escapeHtml(t('again'))+'</button><button class="btn btn-danger" type="button" data-action="delete">'+escapeHtml(t('delete'))+'</button></div>';return '<article class="paper lift record" tabindex="0" role="button" data-row="'+record.row+'"><div class="record-title"><span class="badge '+badgeClass(record.stage)+'">'+escapeHtml(stageLabel(record.stage))+'</span><strong>'+escapeHtml(record.topic||'—')+'</strong></div><p>'+escapeHtml(short(record.explanation,recent?60:80))+'</p>'+summary+(recent?'':'<div class="meta">'+escapeHtml(t('row'))+' '+record.row+'</div>')+buttons+'</article>';}
function renderHome(){const primary=records.filter(r=>r.stage==='小学中段'||r.stage==='小学高段').length;$('primaryCount').textContent=primary;$('secondaryCount').textContent=records.filter(r=>r.stage==='初中'||r.stage==='高中').length;const recent=records.slice(0,5);$('recentList').innerHTML=recent.length?recent.map(r=>recordCard(r,true)).join(''):emptyHtml(t('emptyRecent'));}
function renderArchive(){const q=$('archiveSearch').value.toLocaleLowerCase(),stage=$('archiveFilter').value;const matches=records.filter(r=>(!stage||r.stage===stage)&&(!archiveGroup||(archiveGroup==='primary'?(r.stage==='小学中段'||r.stage==='小学高段'):(r.stage==='初中'||r.stage==='高中')))&&(!q||r.topic.toLocaleLowerCase().includes(q)||r.explanation.toLocaleLowerCase().includes(q)));$('archiveList').innerHTML=matches.length?matches.slice(0,visibleCount).map(r=>recordCard(r)).join(''):emptyHtml(t('emptyArchive'));$('archiveMoreWrap').hidden=matches.length<=visibleCount;}
function renderFilter(){const value=$('archiveFilter').value;$('archiveFilter').innerHTML='<option value="">'+escapeHtml(t('all'))+'</option>'+STAGES.map(stage=>'<option value="'+stage+'">'+escapeHtml(stageLabel(stage))+'</option>').join('');$('archiveFilter').value=value;}
async function refreshLists(){try{await Promise.all([fetchRecords(),refreshCount()]);$('totalCount').textContent=recordCount;renderHome();renderArchive();const recent=records.slice(0,5);for(const record of recent){try{const value=await callAppBridge({type:'GetCellValue',data:SOURCE,payload:'检验反馈/'+record.row});record.feedbackSummary=short(value,40)||t('pending');}catch(e){record.feedbackSummary=t('loadFailed');}}renderHome();}catch(e){$('recentList').innerHTML='<p class="error">'+escapeHtml(t(e.message==='CSV column count'?'csvFailed':'loadFailed'))+'</p>';$('archiveList').innerHTML='<p class="error">'+escapeHtml(t('loadFailed'))+'</p>';}}
function closeMenu(){$('mobileMenu').classList.remove('open');$('menuToggle').setAttribute('aria-expanded','false');}
function switchPage(page,options={}){if(page===currentPage)return true;if(currentPage==='check'&&mode==='new'&&!busy&&$('checkForm_explanation').value.trim()&&!options.force&&!confirm(t('leaveConfirm')))return false;historyStack.push({page:currentPage,scroll:window.scrollY});currentPage=page;document.querySelectorAll('.page').forEach(el=>el.classList.toggle('active',el.id==='page'+page[0].toUpperCase()+page.slice(1)));document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('active',el.dataset.page===page));closeMenu();window.scrollTo(0,0);if(page==='home'||page==='archive')refreshLists();return true;}
function newCheck(stage='',topic='',note='',keepRow=false){pollToken++;mode='new';if(!keepRow){currentRow=0;feedbackValue='';}previousNote=note;setForm(stage,topic,'');renderFeedback();message('formMessage','');switchPage('check',{force:true});}
async function loadRow(row,targetMode='view'){if(!Number.isInteger(row)||row<1)return;const token=++loadToken;pollToken++;mode='view';currentRow=row;previousNote='';feedbackValue='';renderFeedback();renderForm();switchPage('check',{force:true});message('formMessage','');try{const values=[];for(const field of ['学段','知识点','我的讲解','检验反馈']){values.push(await callAppBridge({type:'GetCellValue',data:SOURCE,payload:field+'/'+row}));if(token!==loadToken)return;}setForm(values[0],values[1],values[2]);feedbackValue=values[3]||'';mode=targetMode;renderForm();renderFeedback();await refreshCount();}catch(e){if(token===loadToken){message('formMessage',t('loadFailed'),true);$('feedbackBody').innerHTML='<p class="error">'+escapeHtml(t('loadFailed'))+'</p>';}}}
async function retryRow(row){await loadRow(row);if(currentRow!==row||mode!=='view')return;const stage=selectedStage,topic=$('checkForm_topic').value,note=feedbackValue;newCheck(stage,topic,note,true);}
function sleep(ms){return new Promise(resolve=>setTimeout(resolve,ms));}
async function pollFeedback(){const token=++pollToken;feedbackValue='';$('feedbackBody').innerHTML=emptyHtml(t('waiting'));for(let i=0;i<40;i++){if(token!==pollToken)return;try{const result=await callAppBridge({type:'GetCellValue',data:SOURCE,payload:'检验反馈/1'});if(token!==pollToken)return;if(String(result||'').trim()){feedbackValue=String(result);renderFeedback();await refreshLists();return;}}catch(e){if(token===pollToken){$('feedbackBody').innerHTML='<p class="error">'+escapeHtml(t('loadFailed'))+'</p>';return;}}if(i<39)await sleep(1000);}$('feedbackBody').innerHTML=emptyHtml(t('timeout'));}
async function submitOrSave(event){event.preventDefault();if(busy)return;const stage=selectedStage,topic=$('checkForm_topic').value.trim(),explanation=$('checkForm_explanation').value.trim();if(!stage||!topic||!explanation){message('formMessage',t('needInput'),true);return;}busy=true;renderForm();message('formMessage','');try{if(mode==='edit'){const row=currentRow;for(const [field,value] of [['学段',stage],['知识点',topic],['我的讲解',explanation]]){await callAppBridge({type:'SetCellValue',data:SOURCE,payload:field+'/'+row+'/'+value});}mode='view';message('formMessage',t('saved'));await refreshLists();}else if(mode==='new'){await callAppBridge({type:'SubmitRecord',data:TABLE,payload:JSON.stringify({'学段':stage,'知识点':topic,'我的讲解':explanation})});currentRow=1;mode='view';previousNote='';await refreshCount();busy=false;renderForm();pollFeedback();await refreshLists();return;}}catch(e){message('formMessage',t('failed'),true);}finally{busy=false;renderForm();}}
async function deleteRow(row){if(!confirm(t('deleteConfirm')))return;pollToken++;busy=true;renderForm();try{await callAppBridge({type:'DeleteRecord',data:SOURCE,payload:row.toString()});if(currentRow===row){currentRow=0;mode='new';previousNote='';feedbackValue='';setForm();renderFeedback();message('formMessage',t('deleted'));}else if(currentRow>row)currentRow--;await refreshLists();}catch(e){message('formMessage',t('failed'),true);}finally{busy=false;renderForm();}}
function handleRecordClick(event,recent){const card=event.target.closest('.record');if(!card)return;const row=Number(card.dataset.row),action=event.target.closest('[data-action]')?.dataset.action||'view';if(action==='delete')deleteRow(row);else if(action==='retry')retryRow(row);else loadRow(row,action==='edit'?'edit':'view');}
function airBack(){if($('mobileMenu').classList.contains('open')){closeMenu();return 'false';}if(historyStack.length){const last=historyStack.pop();currentPage=last.page;document.querySelectorAll('.page').forEach(el=>el.classList.toggle('active',el.id==='page'+last.page[0].toUpperCase()+last.page.slice(1)));document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('active',el.dataset.page===last.page));requestAnimationFrame(()=>window.scrollTo(0,last.scroll));return 'false';}return 'true';}window.airBack=airBack;
async function initialize(){setLanguage(detectLanguage());try{const modeText=await callAppBridge({type:'模式'});document.body.classList.toggle('dark',String(modeText).trim()==='暗色');}catch(e){}$('brand').addEventListener('click',()=>{if(parent&&typeof parent.closeFullHtml==='function')parent.closeFullHtml(false);});document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>switchPage(btn.dataset.page)));$('menuToggle').addEventListener('click',()=>{const open=$('mobileMenu').classList.toggle('open');$('menuToggle').setAttribute('aria-expanded',String(open));});document.addEventListener('click',event=>{if(!event.target.closest('.topbar'))closeMenu();});$('desktopLang').addEventListener('click',()=>{setLanguage(language==='cn'?'en':'cn');renderFilter();});$('mobileLang').addEventListener('click',()=>{setLanguage(language==='cn'?'en':'cn');renderFilter();closeMenu();});$('homeStart').addEventListener('click',()=>newCheck());$('ribbons').addEventListener('click',event=>{const ribbon=event.target.closest('[data-stage]');if(ribbon)newCheck(ribbon.dataset.stage);});document.querySelectorAll('[data-stat]').forEach(btn=>btn.addEventListener('click',()=>{archiveGroup=btn.dataset.stat==='all'?'':btn.dataset.stat;$('archiveFilter').value='';switchPage('archive');renderArchive();}));$('recentList').addEventListener('click',event=>handleRecordClick(event,true));$('recentList').addEventListener('keydown',event=>{if(event.key==='Enter'&&event.target.classList.contains('record'))handleRecordClick(event,true);});$('stageGrid').addEventListener('click',event=>{const option=event.target.closest('[data-stage]');if(!option||mode==='view'||busy)return;selectedStage=option.dataset.stage;renderForm();});$('checkForm_topic').addEventListener('input',renderForm);$('checkForm_explanation').addEventListener('input',renderForm);$('checkForm').addEventListener('submit',submitOrSave);$('newCheck').addEventListener('click',()=>newCheck());$('seeArchive').addEventListener('click',()=>switchPage('archive'));$('archiveNew').addEventListener('click',()=>newCheck());$('olderBtn').addEventListener('click',()=>{if(currentRow>1)loadRow(currentRow-1);});$('newerBtn').addEventListener('click',()=>{if(currentRow>0&&currentRow<recordCount)loadRow(currentRow+1);});$('retryBtn').addEventListener('click',()=>retryRow(currentRow));$('editBtn').addEventListener('click',()=>{if(currentRow>0){mode='edit';renderForm();}});$('deleteCurrentBtn').addEventListener('click',()=>deleteRow(currentRow));$('archiveSearch').addEventListener('input',()=>{visibleCount=12;renderArchive();});$('archiveFilter').addEventListener('change',()=>{archiveGroup='';visibleCount=12;renderArchive();});$('archiveMore').addEventListener('click',()=>{visibleCount+=12;renderArchive();});$('archiveList').addEventListener('click',event=>handleRecordClick(event,false));$('archiveList').addEventListener('keydown',event=>{if(event.key==='Enter'&&event.target.classList.contains('record'))handleRecordClick(event,false);});document.addEventListener('focusin',event=>{if(event.target.matches('input,textarea,select'))setTimeout(()=>event.target.scrollIntoView({block:'center',behavior:'smooth'}),250);});if(window.visualViewport)window.visualViewport.addEventListener('resize',()=>{const active=document.activeElement;if(active&&active.matches('input,textarea,select'))setTimeout(()=>active.scrollIntoView({block:'center',behavior:'smooth'}),100);});renderFilter();renderForm();renderFeedback();await refreshLists();}
document.addEventListener('DOMContentLoaded',()=>{(async()=>{await initialize();})();});
</script>
