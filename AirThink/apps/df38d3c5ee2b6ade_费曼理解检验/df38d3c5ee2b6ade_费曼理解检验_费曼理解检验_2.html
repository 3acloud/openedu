function setPagesVisible(page) {
  document.getElementById("pageHome").hidden = page !== "home";
  document.getElementById("pageExam").hidden = page !== "exam";
  document.getElementById("pageArchive").hidden = page !== "archive";
}

function setActiveTab(page) {
  const tabs = document.querySelectorAll(".nav-tab");
  for (let i = 0; i < tabs.length; i++) {
    const on = tabs[i].getAttribute("data-page") === page;
    if (on) tabs[i].setAttribute("aria-current", "page");
    else tabs[i].removeAttribute("aria-current");
  }
}

function rememberScroll() {
  return window.scrollY || document.documentElement.scrollTop || 0;
}

function jumpScroll(y) {
  const top = y || 0;
  window.scrollTo(0, top);
  setTimeout(function () { window.scrollTo(0, top); }, 50);
}

function closeHost() {
  try {
    if (window.parent && typeof window.parent.closeFullHtml === "function") {
      window.parent.closeFullHtml(false);
    }
  } catch (e) {}
}

function openConfirm(message) {
  return new Promise(function (resolve) {
    if (confirmOpen) { resolve(false); return; }
    confirmOpen = true;
    confirmResolver = resolve;
    document.getElementById("modalConfirmText").textContent = message;
    const modal = document.getElementById("modalConfirm");
    modal.hidden = false;
    document.body.classList.add("modal-open");
    popupStack.push("modalConfirm");
    const okBtn = document.getElementById("modalConfirmOk");
    try { if (okBtn && okBtn.focus) okBtn.focus(); } catch (err) {}
  });
}

function settleConfirm(ok) {
  const modal = document.getElementById("modalConfirm");
  if (modal) modal.hidden = true;
  document.body.classList.remove("modal-open");
  const idx = popupStack.lastIndexOf("modalConfirm");
  if (idx >= 0) popupStack.splice(idx, 1);
  confirmOpen = false;
  const r = confirmResolver;
  confirmResolver = null;
  if (r) r(!!ok);
}

function closeTopPopup() {
  const id = popupStack[popupStack.length - 1];
  if (!id) return;
  if (id === "modalConfirm") {
    settleConfirm(false);
    return;
  }
  popupStack.pop();
  const el = document.getElementById(id);
  if (el) el.hidden = true;
}

function airBack() {
  if (popupStack.length) {
    closeTopPopup();
    return "false";
  }
  if (currentPage === "exam" && mode === "new" && String(currentExplain() || "").trim()) {
    let ok = false;
    try { ok = window.confirm(t("leaveConfirm")); } catch (e) { ok = false; }
    if (!ok) return "false";
  }
  if (!navHistory.length) return "true";
  const prev = navHistory.pop();
  applyPageSync(prev.page, prev.scroll);
  return "false";
}
window.airBack = airBack;

function applyPageSync(page, scrollY) {
  viewGen++;
  pendingScroll = scrollY || 0;
  currentPage = page;
  setPagesVisible(page);
  setActiveTab(page);
  if (page === "home") loadHome();
  else if (page === "archive") loadArchive();
  else {
    refreshCount().then(function () {
      if (currentPage === "exam") paintExam(false);
    });
  }
  jumpScroll(pendingScroll);
}

async function goPage(page, opts) {
  opts = opts || {};
  if (page === currentPage) return true;
  if (!opts.skipLeave && currentPage === "exam" && page !== "exam" && mode === "new" && String(currentExplain() || "").trim()) {
    const ok = await openConfirm(t("leaveConfirm"));
    if (!ok) return false;
  }
  if (!opts.fromBack) {
    navHistory.push({ page: currentPage, scroll: rememberScroll() });
    if (navHistory.length > 50) navHistory.shift();
  }
  viewGen++;
  pendingScroll = opts.scroll != null ? opts.scroll : 0;
  currentPage = page;
  setPagesVisible(page);
  setActiveTab(page);
  if (page === "home") await loadHome();
  else if (page === "archive") await loadArchive();
  else if (!opts.deferExam) {
    const okCount = await refreshCount();
    if (!okCount && !examError) examError = t("loadError");
    paintExam(false);
  }
  jumpScroll(pendingScroll);
  return true;
}

function showPageError(msg) {
  if (currentPage === "home") {
    homeCache.error = msg;
    renderHome();
  } else if (currentPage === "archive") {
    archiveCache.error = msg;
    renderArchive();
  } else {
    examError = msg;
    paintExam(false);
  }
}

async function refreshCount() {
  try {
    const text = await bridge({ type: "GetRecordCount", data: DS });
    const n = parseInt(String(text).trim(), 10);
    recordCount = isNaN(n) ? 0 : n;
    return true;
  } catch (e) {
    recordCount = 0;
    return false;
  }
}

async function fetchTableRows() {
  const csv = await bridge({ type: "GetTableCSV", data: DS, payload: "学段,知识点,我的讲解" });
  return takeRows(csv);
}

async function loadHome() {
  const token = ++homeToken;
  const gen = viewGen;
  const y = pendingScroll;
  const loading = document.getElementById("homeLoading");
  if (!homeCache.loaded && loading) loading.hidden = false;
  let count = homeCache.count || 0;
  let rows = [];
  let failed = false;
  try {
    const countText = await bridge({ type: "GetRecordCount", data: DS });
    if (token !== homeToken) return;
    const n = parseInt(String(countText).trim(), 10);
    count = isNaN(n) ? 0 : n;
  } catch (e) {
    failed = true;
    count = 0;
  }
  try {
    rows = await fetchTableRows();
    if (token !== homeToken) return;
  } catch (e2) {
    failed = true;
    rows = [];
  }
  let primary = 0;
  let secondary = 0;
  for (let i = 0; i < rows.length; i++) {
    if (rows[i].stage === "小学中段" || rows[i].stage === "小学高段") primary++;
    else if (rows[i].stage === "初中" || rows[i].stage === "高中") secondary++;
  }
  const recent = [];
  const limit = Math.min(5, rows.length);
  for (let i = 0; i < limit; i++) {
    if (token !== homeToken) return;
    const item = {
      originalRow: rows[i].originalRow,
      stage: rows[i].stage,
      topic: rows[i].topic,
      explanation: rows[i].explanation,
      feedback: "",
      feedbackError: false
    };
    try {
      item.feedback = await bridge({
        type: "GetCellValue",
        data: DS,
        payload: "检验反馈/" + String(rows[i].originalRow)
      });
    } catch (e3) {
      item.feedbackError = true;
    }
    recent.push(item);
  }
  if (token !== homeToken) return;
  homeCache = {
    loaded: true,
    count: count,
    primary: primary,
    secondary: secondary,
    recent: recent,
    error: failed ? t("loadError") : ""
  };
  recordCount = count;
  renderHome();
  if (gen === viewGen && currentPage === "home") jumpScroll(y);
}

function renderHome() {
  const total = document.getElementById("statTotalNum");
  const primary = document.getElementById("statPrimaryNum");
  const secondary = document.getElementById("statSecondaryNum");
  if (total) total.textContent = String(homeCache.count || 0);
  if (primary) primary.textContent = String(homeCache.primary || 0);
  if (secondary) secondary.textContent = String(homeCache.secondary || 0);
  const loading = document.getElementById("homeLoading");
  const err = document.getElementById("homeError");
  const empty = document.getElementById("recentEmpty");
  const list = document.getElementById("recentList");
  if (loading) loading.hidden = !!homeCache.loaded;
  if (err) {
    err.hidden = !homeCache.error;
    err.textContent = homeCache.error || "";
  }
  if (!list || !empty) return;
  list.textContent = "";
  if (!homeCache.loaded) {
    empty.hidden = true;
    return;
  }
  if (!homeCache.recent.length) {
    empty.hidden = !!homeCache.error;
    return;
  }
  empty.hidden = true;
  for (let i = 0; i < homeCache.recent.length; i++) {
    list.appendChild(buildRecentCard(homeCache.recent[i]));
  }
}

function buildRecentCard(item) {
  const card = document.createElement("article");
  card.className = "paper lift mini-card";
  card.setAttribute("data-row", String(item.originalRow));
  card.appendChild(badgeEl(item.stage));
  const title = document.createElement("div");
  title.className = "topic-line";
  title.textContent = String(item.topic || "").trim() ? String(item.topic).trim() : t("emptyTopic");
  card.appendChild(title);
  const ex = document.createElement("p");
  ex.className = "excerpt";
  ex.textContent = excerpt(item.explanation, 60);
  card.appendChild(ex);
  const fb = document.createElement("p");
  fb.className = "fb-line";
  let fbText = t("feedbackPending");
  if (item.feedbackError) fbText = t("feedbackReadError");
  else if (String(item.feedback || "").trim()) fbText = excerpt(item.feedback, 40);
  fb.textContent = t("fbLabel") + " · " + fbText;
  card.appendChild(fb);
  return card;
}

async function loadArchive() {
  const token = ++archiveToken;
  const gen = viewGen;
  const y = pendingScroll;
  const loading = document.getElementById("archiveLoading");
  if (!archiveCache.loaded && loading) loading.hidden = false;
  try {
    const rows = await fetchTableRows();
    if (token !== archiveToken) return;
    archiveCache = { loaded: true, rows: rows, error: "" };
  } catch (e) {
    if (token !== archiveToken) return;
    archiveCache = { loaded: true, rows: [], error: t("loadError") };
  }
  renderArchive();
  if (gen === viewGen && currentPage === "archive") jumpScroll(y);
}

function archiveQuery() {
  const el = document.getElementById("formArchive_search");
  return el ? String(el.value || "").trim() : "";
}

function rowMatches(row, query, filter) {
  if (filter && filter !== "all" && row.stage !== filter) return false;
  if (!query) return true;
  const q = query.toLowerCase();
  const topic = String(row.topic || "").toLowerCase();
  const explain = String(row.explanation || "").toLowerCase();
  return topic.indexOf(q) !== -1 || explain.indexOf(q) !== -1;
}

function renderArchive() {
  const loading = document.getElementById("archiveLoading");
  const err = document.getElementById("archiveError");
  const empty = document.getElementById("archiveEmpty");
  const list = document.getElementById("archiveList");
  const filters = document.querySelectorAll("#archiveFilters .filter-btn");
  for (let i = 0; i < filters.length; i++) {
    filters[i].setAttribute("aria-pressed", filters[i].getAttribute("data-filter") === archiveFilter ? "true" : "false");
  }
  if (loading) loading.hidden = !!archiveCache.loaded;
  if (err) {
    err.hidden = !archiveCache.error;
    err.textContent = archiveCache.error || "";
  }
  if (!list || !empty) return;
  list.textContent = "";
  if (!archiveCache.loaded) {
    empty.hidden = true;
    return;
  }
  const q = archiveQuery();
  const matched = [];
  for (let i = 0; i < archiveCache.rows.length; i++) {
    if (rowMatches(archiveCache.rows[i], q, archiveFilter)) matched.push(archiveCache.rows[i]);
  }
  if (!matched.length) {
    empty.hidden = !!archiveCache.error;
    return;
  }
  empty.hidden = true;
  for (let i = 0; i < matched.length; i++) list.appendChild(buildArchiveCard(matched[i]));
}

function buildArchiveCard(item) {
  const card = document.createElement("article");
  card.className = "paper lift arch-card";
  card.setAttribute("data-row", String(item.originalRow));
  const top = document.createElement("div");
  top.className = "arch-top";
  top.appendChild(badgeEl(item.stage));
  const no = document.createElement("span");
  no.className = "row-no";
  no.textContent = t("rowN").replace("{n}", String(item.originalRow));
  top.appendChild(no);
  card.appendChild(top);
  const title = document.createElement("div");
  title.className = "topic-line";
  title.textContent = String(item.topic || "").trim() ? String(item.topic).trim() : t("emptyTopic");
  card.appendChild(title);
  const ex = document.createElement("p");
  ex.className = "excerpt";
  ex.textContent = excerpt(item.explanation, 80);
  card.appendChild(ex);
  const actions = document.createElement("div");
  actions.className = "arch-actions";
  actions.appendChild(actionBtn("view", t("actView"), "btn btn-line btn-sm"));
  actions.appendChild(actionBtn("edit", t("actEdit"), "btn btn-line btn-sm"));
  actions.appendChild(actionBtn("retell", t("actRetell"), "btn btn-line btn-sm"));
  actions.appendChild(actionBtn("delete", t("actDelete"), "btn btn-danger btn-sm"));
  card.appendChild(actions);
  return card;
}

function actionBtn(act, label, cls) {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = cls;
  btn.setAttribute("data-act", act);
  btn.textContent = label;
  return btn;
}

function stopPolling() {
  pollToken++;
  polling = false;
}

function resetExamState(stage) {
  stopPolling();
  mode = "new";
  currentRow = 0;
  stageValue = stage || "";
  topicValue = "";
  explanationValue = "";
  feedback = "";
  retellSnippet = "";
  timedOut = false;
  examError = "";
  saveTip = "";
  submitting = false;
}

async function startFresh(stage) {
  try {
    if (currentPage !== "exam") {
      const ok = await goPage("exam", { deferExam: true });
      if (!ok || currentPage !== "exam") return;
    }
    resetExamState(stage || "");
    const okCount = await refreshCount();
    if (!okCount) examError = t("loadError");
    paintExam(true);
  } catch (e) {
    examError = t("loadError");
    paintExam(false);
  }
}

async function openRow(rowNo, how) {
  const row = Number(rowNo);
  if (!row || row < 1) return;
  let stage = "";
  let topic = "";
  let explain = "";
  let fb = "";
  try {
    stage = await bridge({ type: "GetCellValue", data: DS, payload: "学段/" + row });
    topic = await bridge({ type: "GetCellValue", data: DS, payload: "知识点/" + row });
    explain = await bridge({ type: "GetCellValue", data: DS, payload: "我的讲解/" + row });
    fb = await bridge({ type: "GetCellValue", data: DS, payload: "检验反馈/" + row });
  } catch (e) {
    showPageError(t("loadError"));
    return;
  }
  if (currentPage !== "exam") {
    const ok = await goPage("exam", { deferExam: true });
    if (!ok || currentPage !== "exam") return;
  }
  stopPolling();
  currentRow = row;
  stageValue = String(stage || "").trim();
  topicValue = topic || "";
  feedback = fb || "";
  timedOut = false;
  examError = "";
  saveTip = "";
  submitting = false;
  if (how === "retell") {
    mode = "new";
    retellSnippet = excerpt(feedback, 120);
    explanationValue = "";
  } else if (how === "edit") {
    mode = "edit";
    retellSnippet = "";
    explanationValue = explain || "";
  } else {
    mode = "view";
    retellSnippet = "";
    explanationValue = explain || "";
  }
  const okCount = await refreshCount();
  if (!okCount && !examError) examError = t("loadError");
  paintExam(true);
}

function beginRetell() {
  if (currentRow < 1 || mode !== "view" || polling || submitting) return;
  retellSnippet = excerpt(feedback, 120);
  mode = "new";
  explanationValue = "";
  saveTip = "";
  examError = "";
  paintExam(true);
}

async function shiftRow(delta) {
  if (polling || submitting) return;
  if (currentRow <= 0) return;
  const target = currentRow + delta;
  if (target < 1 || target > recordCount) return;
  await openRow(target, "view");
}

async function submitNew() {
  if (submitting || polling || mode !== "new") return;
  const stage = stageValue;
  const topic = currentTopic();
  const explain = currentExplain();
  if (!stage || !String(topic).trim() || !String(explain).trim()) return;
  submitting = true;
  examError = "";
  paintExam(false);
  try {
    await bridge({
      type: "SubmitRecord",
      data: TABLE,
      payload: JSON.stringify({ "学段": stage, "知识点": topic, "我的讲解": explain })
    });
    currentRow = 1;
    mode = "view";
    retellSnippet = "";
    stageValue = stage;
    topicValue = topic;
    explanationValue = explain;
    feedback = "";
    timedOut = false;
    saveTip = "";
    submitting = false;
    await refreshCount();
    paintExam(true);
    await startPolling();
  } catch (e) {
    submitting = false;
    examError = t("submitError");
    paintExam(false);
  }
}

async function startPolling() {
  const token = ++pollToken;
  polling = true;
  timedOut = false;
  if (currentPage === "exam") paintExam(false);
  for (let n = 0; n < 40; n++) {
    if (token !== pollToken) return;
    try {
      const text = await bridge({ type: "GetCellValue", data: DS, payload: "检验反馈/1" });
      if (token !== pollToken) return;
      if (text && String(text).trim() !== "") {
        feedback = String(text);
        polling = false;
        timedOut = false;
        examError = "";
        if (currentPage === "exam" && currentRow === 1 && mode === "view") paintExam(false);
        return;
      }
    } catch (e) {
      if (token !== pollToken) return;
      examError = t("pollError");
      if (currentPage === "exam") paintExam(false);
    }
    if (n < 39) await sleep(1000);
  }
  if (token !== pollToken) return;
  polling = false;
  timedOut = true;
  if (currentPage === "exam") paintExam(false);
}

async function saveEdit() {
  if (submitting || polling || mode !== "edit" || currentRow < 1) return;
  const stage = stageValue;
  const topic = currentTopic();
  const explain = currentExplain();
  if (!stage || !String(topic).trim() || !String(explain).trim()) return;
  submitting = true;
  examError = "";
  paintExam(false);
  try {
    await bridge({ type: "SetCellValue", data: DS, payload: "学段/" + currentRow + "/" + stage });
    await bridge({ type: "SetCellValue", data: DS, payload: "知识点/" + currentRow + "/" + topic });
    await bridge({ type: "SetCellValue", data: DS, payload: "我的讲解/" + currentRow + "/" + explain });
    mode = "view";
    stageValue = stage;
    topicValue = topic;
    explanationValue = explain;
    saveTip = t("saveTip");
    examError = "";
    submitting = false;
    paintExam(true);
  } catch (e) {
    submitting = false;
    examError = t("saveError");
    paintExam(false);
  }
}

async function deleteCurrent() {
  if (currentRow < 1 || polling || submitting) return;
  const ok = await openConfirm(t("deleteConfirm"));
  if (!ok) return;
  const row = currentRow;
  submitting = true;
  paintExam(false);
  try {
    await bridge({ type: "DeleteRecord", data: DS, payload: row.toString() });
    resetExamState("");
    const okCount = await refreshCount();
    if (!okCount) examError = t("loadError");
    submitting = false;
    paintExam(true);
  } catch (e) {
    submitting = false;
    examError = t("deleteError");
    paintExam(false);
  }
}

async function deleteArchiveRow(rowNo) {
  const row = Number(rowNo);
  if (!row || row < 1) return;
  const ok = await openConfirm(t("deleteConfirm"));
  if (!ok) return;
  try {
    await bridge({ type: "DeleteRecord", data: DS, payload: row.toString() });
    if (currentRow === row) {
      resetExamState("");
      paintExam(true);
    }
    await loadArchive();
  } catch (e) {
    archiveCache.error = t("deleteError");
    renderArchive();
  }
}

function syncDraftUI() {
  const explain = document.getElementById("formExam_explain");
  const topic = document.getElementById("formExam_topic");
  const count = document.getElementById("formExam_charCount");
  if (!explain || !topic || !count) return;
  topicValue = topic.value;
  explanationValue = explain.value;
  count.textContent = String(Array.from(explain.value || "").length) + " " + t("charUnit");
  const btn = document.getElementById("btnExamPrimary");
  if (btn && mode !== "view") {
    btn.disabled = submitting || polling || !stageValue || !topic.value.trim() || !explain.value.trim();
  }
}

function selectStage(value) {
  if (mode === "view" || polling || submitting) return;
  if (STAGES.indexOf(value) === -1) return;
  stageValue = value;
  const explain = document.getElementById("formExam_explain");
  if (explain) explain.placeholder = placeholderFor(value);
  const hint = document.getElementById("examStageHint");
  if (hint) hint.textContent = hintText();
  const cards = document.querySelectorAll("#formExam .stage-card");
  for (let i = 0; i < cards.length; i++) {
    const input = cards[i].querySelector("input");
    const on = input && input.value === value;
    if (input) input.checked = !!on;
    cards[i].classList.toggle("is-selected", !!on);
  }
  syncDraftUI();
}

function paintExam(fill) {
  const explain = document.getElementById("formExam_explain");
  const topic = document.getElementById("formExam_topic");
  const form = document.getElementById("formExam");
  if (!explain || !topic || !form) return;
  explain.placeholder = placeholderFor(stageValue);
  if (fill) {
    topic.value = topicValue || "";
    explain.value = explanationValue || "";
  }
  const locked = mode === "view";
  topic.readOnly = locked;
  explain.readOnly = locked;
  form.classList.toggle("is-locked", locked);
  const cards = form.querySelectorAll(".stage-card");
  for (let i = 0; i < cards.length; i++) {
    const input = cards[i].querySelector("input");
    const on = input && input.value === stageValue;
    if (input) {
      if (fill) input.checked = !!on;
      input.disabled = locked;
    }
    cards[i].classList.toggle("is-selected", !!on);
  }
  const count = document.getElementById("formExam_charCount");
  if (count) count.textContent = String(Array.from(explain.value || "").length) + " " + t("charUnit");
  const btn = document.getElementById("btnExamPrimary");
  if (btn) {
    if (mode === "view") {
      btn.hidden = true;
    } else {
      btn.hidden = false;
      btn.textContent = mode === "edit" ? t("btnSave") : t("btnSubmit");
      btn.disabled = submitting || polling || !stageValue || !topic.value.trim() || !explain.value.trim();
    }
  }
  const hint = document.getElementById("examStageHint");
  if (hint) hint.textContent = hintText();
  const prev = document.getElementById("prevNote");
  const prevBody = document.getElementById("prevNoteBody");
  if (prev && prevBody) {
    if (mode === "new" && retellSnippet) {
      prev.hidden = false;
      prevBody.textContent = retellSnippet;
    } else {
      prev.hidden = true;
      prevBody.textContent = "";
    }
  }
  const err = document.getElementById("examError");
  if (err) {
    err.hidden = !examError;
    err.textContent = examError || "";
  }
  const tip = document.getElementById("examSaveTip");
  if (tip) {
    tip.hidden = !saveTip;
    tip.textContent = saveTip || "";
  }
  const prevBtn = document.getElementById("btnRowPrev");
  const nextBtn = document.getElementById("btnRowNext");
  if (prevBtn) {
    prevBtn.disabled = polling || submitting || currentRow <= 1;
    prevBtn.setAttribute("aria-label", t("prevAria"));
  }
  if (nextBtn) {
    nextBtn.disabled = polling || submitting || currentRow <= 0 || recordCount <= 0 || currentRow >= recordCount;
    nextBtn.setAttribute("aria-label", t("nextAria"));
  }
  const pos = document.getElementById("mentorPos");
  if (pos) pos.textContent = currentRow >= 1 ? t("rowN").replace("{n}", String(currentRow)) : "";
  const freshBtn = document.getElementById("btnNewCheck");
  if (freshBtn) freshBtn.disabled = polling || submitting;
  paintMentor();
}

function paintMentor() {
  const empty = document.getElementById("mentorEmpty");
  const wait = document.getElementById("mentorWait");
  const timeout = document.getElementById("mentorTimeout");
  const none = document.getElementById("mentorNone");
  const md = document.getElementById("mentorMarkdown");
  const actions = document.getElementById("mentorActions");
  if (!empty || !wait || !timeout || !none || !md || !actions) return;
  empty.hidden = true;
  wait.hidden = true;
  timeout.hidden = true;
  none.hidden = true;
  md.hidden = true;
  const showActions = mode === "view" && currentRow >= 1;
  actions.hidden = !showActions;
  const dis = polling || submitting;
  const retellBtn = document.getElementById("btnRetell");
  const editBtn = document.getElementById("btnEditRow");
  const delBtn = document.getElementById("btnDeleteRow");
  if (retellBtn) retellBtn.disabled = dis;
  if (editBtn) editBtn.disabled = dis;
  if (delBtn) delBtn.disabled = dis || currentRow < 1;
  if (polling && mode === "view" && currentRow === 1) {
    wait.hidden = false;
    return;
  }
  const fb = String(feedback || "").trim();
  if (fb) {
    md.hidden = false;
    md.innerHTML = renderMarkdown(feedback);
    return;
  }
  if (timedOut && currentRow === 1 && mode === "view") {
    timeout.hidden = false;
    timeout.textContent = t("timeoutMsg");
    return;
  }
  if (currentRow >= 1) {
    none.hidden = false;
    none.textContent = t("noFeedback");
    return;
  }
  empty.hidden = false;
}

function bindViewport() {
  function updateInset() {
    const vv = window.visualViewport;
    if (!vv) return;
    const inset = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    document.documentElement.style.setProperty("--kb-inset", inset + "px");
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", updateInset);
    window.visualViewport.addEventListener("scroll", updateInset);
  }
  document.addEventListener("focusin", function (e) {
    const el = e.target;
    if (!el || !el.matches || !el.matches("input, textarea, select")) return;
    setTimeout(function () {
      try { el.scrollIntoView({ block: "center", behavior: "smooth" }); } catch (err) {}
    }, 320);
  });
}

function bindEvents() {
  document.getElementById("navBrand").addEventListener("click", closeHost);
  document.getElementById("navTabs").addEventListener("click", function (e) {
    const tab = e.target.closest ? e.target.closest("[data-page]") : null;
    if (!tab) return;
    goPage(tab.getAttribute("data-page"));
  });
  document.getElementById("btnLangCn").addEventListener("click", function () { setLanguage("zh"); });
  document.getElementById("btnLangEn").addEventListener("click", function () { setLanguage("en"); });
  document.getElementById("btnStartCheck").addEventListener("click", function () { startFresh(""); });
  document.getElementById("ribbonGrid").addEventListener("click", function (e) {
    const rib = e.target.closest ? e.target.closest("[data-stage]") : null;
    if (!rib) return;
    startFresh(rib.getAttribute("data-stage"));
  });
  document.getElementById("recentList").addEventListener("click", function (e) {
    const card = e.target.closest ? e.target.closest("[data-row]") : null;
    if (!card) return;
    openRow(card.getAttribute("data-row"), "view");
  });
  document.getElementById("btnNewCheck").addEventListener("click", function () { startFresh(""); });
  document.getElementById("btnToArchive").addEventListener("click", function () { goPage("archive"); });
  document.getElementById("btnArchiveNew").addEventListener("click", function () { startFresh(""); });
  document.getElementById("formExam").addEventListener("submit", function (e) {
    e.preventDefault();
    if (mode === "edit") saveEdit();
    else submitNew();
  });
  document.getElementById("formExam").addEventListener("change", function (e) {
    if (!e.target || e.target.name !== "学段") return;
    if (mode === "view") {
      const radios = document.querySelectorAll('#formExam input[name="学段"]');
      for (let i = 0; i < radios.length; i++) radios[i].checked = radios[i].value === stageValue;
      return;
    }
    selectStage(e.target.value);
  });
  document.getElementById("formExam").addEventListener("click", function (e) {
    if (mode !== "view") return;
    const card = e.target.closest ? e.target.closest(".stage-card") : null;
    if (card) e.preventDefault();
  });
  document.getElementById("formExam_topic").addEventListener("input", syncDraftUI);
  document.getElementById("formExam_explain").addEventListener("input", syncDraftUI);
  document.getElementById("btnExamPrimary").addEventListener("click", function () {
    if (mode === "edit") saveEdit();
    else submitNew();
  });
  document.getElementById("btnRowPrev").addEventListener("click", function () { shiftRow(-1); });
  document.getElementById("btnRowNext").addEventListener("click", function () { shiftRow(1); });
  document.getElementById("btnRetell").addEventListener("click", beginRetell);
  document.getElementById("btnEditRow").addEventListener("click", function () {
    if (mode !== "view" || currentRow < 1 || polling || submitting) return;
    mode = "edit";
    retellSnippet = "";
    saveTip = "";
    paintExam(true);
  });
  document.getElementById("btnDeleteRow").addEventListener("click", function () { deleteCurrent(); });
  document.getElementById("formArchive").addEventListener("submit", function (e) { e.preventDefault(); });
  document.getElementById("formArchive_search").addEventListener("input", function () { renderArchive(); });
  document.getElementById("archiveFilters").addEventListener("click", function (e) {
    const btn = e.target.closest ? e.target.closest("[data-filter]") : null;
    if (!btn) return;
    archiveFilter = btn.getAttribute("data-filter") || "all";
    renderArchive();
  });
  document.getElementById("archiveList").addEventListener("click", function (e) {
    const btn = e.target.closest ? e.target.closest("[data-act]") : null;
    const card = e.target.closest ? e.target.closest("[data-row]") : null;
    if (!card) return;
    const row = card.getAttribute("data-row");
    if (btn) {
      e.stopPropagation();
      e.preventDefault();
      const act = btn.getAttribute("data-act");
      if (act === "view") openRow(row, "view");
      else if (act === "edit") openRow(row, "edit");
      else if (act === "retell") openRow(row, "retell");
      else if (act === "delete") deleteArchiveRow(row);
      return;
    }
    openRow(row, "view");
  });
  document.getElementById("modalConfirmOk").addEventListener("click", function () { settleConfirm(true); });
  document.getElementById("modalConfirmCancel").addEventListener("click", function () { settleConfirm(false); });
  document.getElementById("modalConfirm").addEventListener("click", function (e) {
    if (e.target && e.target.id === "modalConfirm") settleConfirm(false);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && popupStack.length) closeTopPopup();
  });
}

async function initialize() {
  lang = detectLanguage();
  applyTheme("light");
  bindEvents();
  bindViewport();
  applyI18n();
  currentPage = "home";
  setPagesVisible("home");
  setActiveTab("home");
  try {
    const modeText = await bridge({ type: "模式" });
    applyTheme(String(modeText).trim() === "暗色" ? "dark" : "light");
  } catch (e) {
    applyTheme("light");
  }
  try {
    await loadHome();
  } catch (e2) {
    homeCache.loaded = true;
    homeCache.error = t("loadError");
    renderHome();
  }
  paintExam(true);
  document.documentElement.setAttribute("data-ready", "1");
}

(async () => {    await initialize();  })();
</script>
